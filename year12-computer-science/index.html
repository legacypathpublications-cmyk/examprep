<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 12 Computer Science Exam Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: exam hall. A white answer sheet on a pale mint desk, with the question information beside the question. */
:root{
  --desk:#EEF4F1; --paper:#FFFFFF; --ink:#0B2545; --muted:#4E6275; --rule:#CFDCD6; --line:#C5DAD3;
  --accent:#0E7490; --accent-ink:#FFFFFF; --soft:#E0F2F1;
  --good:#11734B; --good-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FDF2DE; --bad:#B42318; --bad-bg:#FCE9E7;
  --ev:#C2410C; --an:#D97706;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0A1A1F; --paper:#112A33; --ink:#E6F2F0; --muted:#9DB8B6; --rule:#24424B; --line:#28464F;
  --accent:#5CC8E0; --accent-ink:#08222B; --soft:#14363F;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --ev:#FB923C; --an:#F5B248; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0A1A1F; --paper:#112A33; --ink:#E6F2F0; --muted:#9DB8B6; --rule:#24424B; --line:#28464F;
  --accent:#5CC8E0; --accent-ink:#08222B; --soft:#14363F;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --ev:#FB923C; --an:#F5B248; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--desk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#06161B}}
:root[data-theme="dark"] header.top{background:#06161B}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;letter-spacing:.2px}
.brand small{display:block;font:500 .72rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:#9ED3DD}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{color:#D6EEF1;text-decoration:none;font-weight:600;font-size:.92rem;padding:7px 12px;border-radius:6px}
nav.main a[aria-current="page"],nav.main a:hover{background:rgba(255,255,255,.12);color:#fff}
main{padding-block:28px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.9rem,4vw,2.8rem)} h2{font-size:1.5rem} h3{font-size:1.15rem}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{font:600 .95rem var(--body);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--an);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:10px}
/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;margin-bottom:28px}
.hero p{max-width:60ch;font-size:1.05rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-block:22px 34px}
.how .sheet{padding:18px}
.how b{font-family:var(--display);font-size:1.1rem;display:block;margin-bottom:4px}
.stat{padding:18px 20px}
.stat .big{font:600 2.2rem var(--mono);font-variant-numeric:tabular-nums}
.marks-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 .78rem var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
/* question list */
.topic{margin-top:26px}
.topic h2{display:flex;align-items:center;gap:10px}
.topic h2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.qcard{display:flex;flex-direction:column;gap:6px;padding:16px;text-decoration:none;color:var(--ink);border-left:5px solid var(--tc)}
.qcard:hover{border-color:var(--tc);box-shadow:0 2px 0 var(--rule)}
.qcard .stem{font-size:.95rem;min-width:0}
.qcard .meta{display:flex;justify-content:space-between;gap:8px;font:500 .78rem var(--mono);color:var(--muted)}
.state{font:600 .72rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
/* question view */
.qview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.booklet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding:20px 22px}
.booklet h3{font-size:1rem;margin-top:16px}
.booklet h3:first-of-type{margin-top:6px}
.booklet p{margin:.45em 0;font-size:.95rem;max-width:68ch}
.booklet .tbl p{margin:0;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.read{font:600 .8rem var(--mono);color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;display:inline-block}
.qpaper{padding:22px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qnum{font:700 1.4rem var(--display)}
.qstem{font-size:1.08rem;margin:10px 0 4px;font-weight:500}
.mk{font:600 1rem var(--mono);white-space:nowrap}
.answer{width:100%;min-height:260px;resize:vertical;border:1px solid var(--rule);border-radius:6px;padding:4px 12px 4px 46px;font:1rem/32px var(--body);color:var(--ink);
  background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--bad) 34px,var(--bad) 35px,transparent 35px),repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);background-attachment:local}
.counter{font:500 .8rem var(--mono);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tabs button{font:600 .9rem var(--body);padding:8px 14px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.panel{margin-top:14px}
/* results */
.score{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:10px;background:var(--soft);flex-wrap:wrap}
.score .big{font:600 2.1rem var(--mono);font-variant-numeric:tabular-nums}
.score .lvl{font:600 .85rem var(--mono);padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.crit{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.crit li .ic{font:700 1rem var(--mono);text-align:center}
.crit li.ok{border-color:var(--good);background:var(--good-bg)} .crit li.ok .ic{color:var(--good)}
.crit li.no{border-color:var(--bad);background:var(--bad-bg)} .crit li.no .ic{color:var(--bad)}
.crit li.part{border-color:var(--warn);background:var(--warn-bg)} .crit li.part .ic{color:var(--warn)}
.crit b{display:block}
.tag{font:700 .7rem var(--mono);padding:1px 6px;border-radius:4px;color:#fff;margin-left:3px;vertical-align:1px}
.tK{background:var(--k)}.tA{background:var(--a)}.tAn{background:var(--an)}.tEv{background:var(--ev)}
:root[data-theme="dark"] .tag{color:#08222B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#08222B}}
.pts{display:grid;gap:6px;margin:8px 0;padding:0;list-style:none}
.pts li{padding:8px 10px;border-radius:6px;border:1px solid var(--rule);font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.pts li.hit{border-color:var(--good);background:var(--good-bg)}
.pts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%}
.pts input{margin-top:4px;flex:none;width:18px;height:18px}
.side{font:600 .68rem var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);flex:none;width:76px;padding-top:3px}
pre.ms{white-space:pre-wrap;font:.85rem/1.5 var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
.lvls{display:grid;gap:8px}
.lvls label{display:grid;grid-template-columns:22px 92px 1fr;gap:10px;padding:10px;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-size:.9rem;background:var(--paper)}
.lvls label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.lvls b{font-family:var(--mono)}
.build{width:100%;border-collapse:collapse;font-size:.92rem}
.build td{border:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.build td:first-child{font-weight:700;width:120px} .build td:last-child{width:90px;font:600 .8rem var(--mono);text-align:center}
.tblwrap{overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.cmp div{padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.cmp b{font:600 1.6rem var(--mono);display:block}
.note{font-size:.85rem;color:var(--muted);margin-top:10px;max-width:70ch}
/* sections */
.hero1{margin-bottom:22px}.hero1 p{max-width:66ch;font-size:1.05rem}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.setcard{padding:24px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--accent)}
.setcard.style{border-top-color:var(--ev)}
.setcard h2{font-size:1.7rem}.setcard p{margin:0;max-width:56ch}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;border-bottom:1px solid var(--rule)}
.subnav a{padding:8px 12px;font-weight:600;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.subnav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.gh{display:flex;align-items:center;gap:10px;font-size:1.3rem}.gh i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cover td:first-child{width:auto;font-weight:600}.cover tr:first-child td{font:600 .75rem var(--mono);text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cover td:last-child{width:auto;text-align:left;font:500 .9rem var(--body)}.cover a{margin-right:10px;font-weight:600}
.cover tr.none td:first-child{color:var(--muted);font-weight:500}
@media (max-width:860px){.sets{grid-template-columns:1fr}}
/* exam */
.paper-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.paper-pick .sheet{padding:22px;display:flex;flex-direction:column;gap:10px}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.timer{font:600 1.3rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{font:600 .82rem var(--mono);min-width:44px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.qnav button.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.qnav button.done{border-style:solid;border-color:var(--good)}
.confirm{margin-top:12px;padding:14px;border-radius:8px;border:1.5px solid var(--warn);background:var(--warn-bg)}
.res-q{padding:18px;margin-top:14px}
.res-q summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none;flex-wrap:wrap}
.res-q summary::-webkit-details-marker{display:none}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:600px){.brand small{display:none}header.top{position:static}nav.main{margin-left:0}nav.main a{padding:6px 9px}.exambar{top:env(safe-area-inset-top,0px)}}
@media (max-width:860px){.qview,.hero{grid-template-columns:1fr}.booklet{position:static;max-height:none}.how,.paper-pick{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

.answer{min-height:0}
.part{padding:14px 0;border-top:1px solid var(--rule)} .part:first-of-type{border-top:0;padding-top:4px}
.phead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap} .pid{font:700 1.1rem var(--display)}
.ref{font:600 .74rem var(--mono);color:var(--accent);background:var(--soft);padding:2px 9px;border-radius:999px}
.phead .mk{margin-left:auto} .pq{font-size:1.02rem;margin:8px 0}
input.cell,select,textarea.mini{font:1rem var(--body);padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
input.cell{width:130px} input.cell.wide{width:220px} input.cell.num{width:90px} select{max-width:100%} textarea.mini{width:100%;resize:vertical}
.flist .frow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:start;margin:8px 0}
.build.grid td:first-child{width:auto;font-weight:500} .build.grid td:last-child{width:auto;font:500 .92rem var(--body);text-align:left}
.build.grid td.hd{font:600 .75rem var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.build.grid td.c{text-align:center} .build.grid td input.cell{width:100%;min-width:90px} .build.grid td select{width:100%}
.gaps{line-height:2.5;font-size:1.02rem} .gaps input.cell{width:120px;margin:0 4px}
.fig{max-width:100%;height:auto;margin:6px 0 10px;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:6px}
.build.grid.st td{font:500 .9rem var(--mono)}
.choose{display:flex;gap:20px;margin:6px 0 10px;font-weight:600} .ans-row{margin-top:10px}
.facts{margin:6px 0;padding-left:18px;font-size:.92rem}
h3.pr{display:flex;justify-content:space-between;gap:10px;font-size:1rem;margin-top:16px;align-items:baseline}
h3.pr .ref{margin-left:6px}
.pts li label{align-items:center}
@media (max-width:600px){.flist .frow{grid-template-columns:1fr}}
</style>
</head>

een a tebibyte and a terabyte.","id":"(a)","ref":"June 2022 V1 Q1(a)","marks":1,"msHead":"1 mark for:","official":["1 mark for:","One tebibyte is 1024 gibibytes and one terabyte is 1000 gigabytes"],"tip":"Give the number for BOTH units. One value alone does not show the difference.","method":["Tebi is a BINARY prefix, so each step up is x 1024.","Tera is a DENARY prefix, so each step up is x 1000."],"mistakes":["Saying 'a tebibyte is bigger' with no values.","Writing 1024 for the terabyte."],"markWords":["1 mark: both values given (1024 gibibytes and 1000 gigabytes)."],"modelAns":"1 tebibyte = 1024 gibibytes, 1 terabyte = 1000 gigabytes","rows":3,"g":[{"max":1,"pts":[{"t":"1 tebibyte = 1024 gibibytes and 1 terabyte = 1000 gigabytes","all":["1024","1000"]}]}]},{"q":"Convert the signed denary value −100 into an 8-bit two's complement binary integer.","id":"(b)","ref":"June 2022 V1 Q1(b)","marks":1,"msHead":"1 mark for: 1001 1100","official":["1 mark for: 1001 1100"],"tip":"A negative two's complement number must start with 1. Use the −128 check to confirm.","method":["Write +100 in 8 bits: 0110 0100.","Invert every bit: 1001 1011.","Add 1: 1001 1100.","Check: −128 + 16 + 8 + 4 = −100."],"mistakes":["Inverting but forgetting to add 1 (one's complement).","Starting from 100 written in 7 bits."],"markWords":["1 mark: 1001 1100. Working is not marked but protects you if you slip."],"modelAns":"1001 1100","kind":"calc","ans":["10011100"],"ansMarks":1,"work":[]},{"q":"Convert the denary number 251 into hexadecimal. Show your working.","id":"(c)","ref":"June 2022 V1 Q1(c)","marks":2,"msHead":"1 mark for working, e.g.","official":["1 mark for working, e.g.","Dividing by 16 // converting to binary (11111011)","1 mark for answer: FB"],"tip":"Hex digits above 9 are A=10, B=11, C=12, D=13, E=14, F=15. Write them out before you start.","method":["251 / 16 = 15 remainder 11.","15 is F and 11 is B, so the answer is FB.","Check: (15 x 16) + 11 = 251."],"mistakes":["Writing 1511 instead of converting to hex digits.","Writing BF (digits swapped)."],"markWords":["1 mark: a method step (divide by 16, or binary 1111 1011).","1 mark: FB."],"modelAns":"FB","kind":"calc","ans":["fb"],"ansMarks":1,"work":[{"t":"Working: dividing by 16 // converting to binary (1111 1011)","re":["/ ?16|÷ ?16|divid|11111011|1111 1011|15 ?r|remainder|16 ?x|16 ?\\*"]}],"unit":""},{"q":"Add the following unsigned binary integers.\n0101 0000  +  0011 1110","id":"(d)","ref":"June 2022 V1 Q1(d)","marks":1,"msHead":"1 mark for: 1000 1110","official":["1 mark for: 1000 1110"],"tip":"Convert both numbers to denary to check your answer. It takes ten seconds.","method":["Add from the right: 0+0=0, then 0+1=1, 0+1=1, 0+1=1, 0+1=1, then 1+1=10 so write 0 carry 1.","Check in denary: 80 + 62 = 142 = 1000 1110."],"mistakes":["Carry errors in the middle columns.","Dropping the carry into the next column."],"markWords":["1 mark: 1000 1110."],"modelAns":"1000 1110","kind":"calc","ans":["10001110"],"ansMarks":1,"work":[]}],"set":"past"},{"n":2,"topic":1,"sub":["u1a","u1c","u1d"],"paper":"June 2021 V1","qn":"Q1(c)","title":"Hex colours and two's complement","stem":"One of the colours used in an image has the hexadecimal colour code #FC238A.\nFC is the amount of red, 23 is the amount of green and 8A is the amount of blue in the colour.","parts":[{"q":"Convert the hexadecimal code FC into denary.","id":"(a)","ref":"June 2021 V1 Q1(c)(i)","marks":1,"msHead":"1 mark for: 252","official":["1 mark for: 252"],"tip":"This is why hex colour codes are used: one pair of digits holds one 8-bit value from 0 to 255.","method":["Place values in hex are 16 and 1.","F is 15, so 15 x 16 = 240.","C is 12, so 240 + 12 = 252."],"mistakes":["Using F = 16.","Adding 15 + 12 = 27."],"markWords":["1 mark: 252."],"modelAns":"252","kind":"calc","ans":["252"],"ansMarks":1,"work":[]},{"q":"Hexadecimal 23 in two's complement representation is 0010 0011. The denary number 10 needs to be subtracted from this value.\nSubtract the denary number 10 from the two's complement representation 0010 0011.\nGive your answer in binary. Show your working.","id":"(b)","ref":"June 2021 V1 Q1(c)(iii)","marks":3,"msHead":"1 mark per bullet point:","official":["1 mark per bullet point:","Converting −10 to two's complement binary: 1111 0110","Adding values","Final answer: 0001 1001","10 = 0000 1010, so −10 = 1111 0110","   0010 0011"," + 1111 0110"," = 0001 1001"],"tip":"Two's complement turns every subtraction into an addition. Always convert the number being subtracted.","method":["Subtracting 10 is the same as adding −10.","10 = 0000 1010. Invert: 1111 0101. Add 1: 1111 0110. That is −10.","Add 0010 0011 + 1111 0110 = 1 0001 1001. Ignore the carry out of the 8th bit.","Check: 35 − 10 = 25 = 0001 1001."],"mistakes":["Subtracting column by column and getting borrow errors.","Forgetting to add 1 when making −10.","Keeping the ninth bit."],"markWords":["1 mark: −10 as 1111 0110.","1 mark: the addition.","1 mark: 0001 1001."],"modelAns":"0001 1001","kind":"calc","ans":["00011001"],"ansMarks":1,"work":[{"t":"Converting -10 to two's complement binary: 1111 0110","re":["11110110|1111 0110"]},{"t":"Adding the values","re":["\\+|add|0010 ?0011"]}]}],"set":"past"},{"n":3,"topic":1,"sub":["u1d","u1a"],"paper":"June 2023 V2","qn":"Q4","title":"One's complement, hexadecimal and logical shifts","stem":"Data in a computer is stored in binary form.","parts":[{"q":"Give the 8-bit one's complement representation of the denary number −120.\nShow your working.","id":"(a)","ref":"June 2023 V2 Q4(b)","marks":2,"msHead":"1 mark for working; 1 mark for answer","official":["1 mark for working; 1 mark for answer","Working: +120 = 0111 1000","Answer: 1000 0111"],"tip":"One's complement = flip. Two's complement = flip then add 1. Say it to yourself before you start.","method":["Write +120 in 8 bits: 0111 1000.","One's complement means invert every bit only.","Inverted: 1000 0111."],"mistakes":["Adding 1 (that is two's complement, which would give 1000 1000).","Using 7 bits."],"markWords":["1 mark: 0111 1000 shown.","1 mark: 1000 0111."],"modelAns":"1000 0111","kind":"calc","ans":["10000111"],"ansMarks":1,"work":[{"t":"Working: +120 = 0111 1000","re":["01111000|0111 1000"]}]},{"q":"Convert the hexadecimal number A04 into denary.\nShow your working.","id":"(b)","ref":"June 2023 V2 Q4(c)","marks":2,"msHead":"1 mark for working; 1 mark for answer","official":["1 mark for working; 1 mark for answer","Working: A04 = (10 x 16²) + 4 // A04 = (10 x 256) + 4 // A04 = 1010 0000 0100","Answer: 2564"],"tip":"Write the place values 256, 16, 1 above the digits first.","method":["Place values in hex are 256, 16, 1.","A is 10, so 10 x 256 = 2560.","0 x 16 = 0, then add 4. Total 2564."],"mistakes":["Forgetting the middle digit is 0.","Using 10 x 16 instead of 10 x 256."],"markWords":["1 mark: working showing 10 x 256 (or the binary conversion).","1 mark: 2564."],"modelAns":"2564","kind":"calc","ans":["2564"],"ansMarks":1,"work":[{"t":"Working: (10 x 256) + 4 // 1010 0000 0100","re":["10 ?[x*] ?(16.{0,3}|256)|2560|101000000100|1010 0000 0100"]}]},{"q":"Show the result of a 2-place left logical shift on the binary number:\n0100 1111","id":"(c)","ref":"June 2023 V2 Q4(d)","marks":1,"msHead":"1 mark for: 0011 1100","official":["1 mark for: 0011 1100"],"tip":"A logical shift always fills with 0s and keeps the number of bits the same.","method":["Move every bit two places left.","The two left hand bits (01) fall off the end.","Two 0s are added on the right: 0011 1100."],"mistakes":["Rotating the bits instead of adding 0s.","Shifting right by mistake.","Changing the number of bits."],"markWords":["1 mark: 0011 1100."],"modelAns":"0011 1100","kind":"calc","ans":["00111100"],"ansMarks":1,"work":[]}],"set":"past"},{"n":4,"topic":1,"sub":["u1e"],"paper":"November 2023 V2","qn":"Q3(c)","title":"Binary Coded Decimal","stem":"","parts":[{"q":"Identify one practical application of BCD and justify why BCD is used in this application.","id":"(a)","ref":"November 2023 V2 Q3(c)","marks":2,"msHead":"1 mark for a correct application","official":["1 mark for a correct application","1 mark for a corresponding justification","An application that performs financial / banking calculations","... because it is difficult to represent decimal values exactly in normal binary and financial transactions use only two decimal places and must be accurate, no accumulating errors","Or electronic displays, e.g. calculators, digital clocks","... because visual displays only need to show individual digits","... because conversion between denary and BCD is easier","Or the storage of the date and time in the BIOS of a PC","... because conversion with denary is easier"],"tip":"Use the word 'digit'. BCD stores each denary digit separately.","method":["Pick one application: money, a display or a clock.","Link the reason to BCD: each denary digit is stored separately in 4 bits, so conversion is easy and decimal values stay exact."],"mistakes":["A reason that fits any number system, such as 'it is faster'.","A reason that does not match the application."],"markWords":["1 mark: application.","1 mark: justification that fits THAT application."],"modelAns":"e.g. digital clock or calculator display, because each digit is converted to and from denary easily","rows":5,"g":[{"max":1,"pts":[{"t":"A correct application, e.g. financial or banking calculations, or an electronic display such as a calculator or digital clock","re":["financ|bank|money|currenc|calculator|clock|display|watch|digital|till|price|accounting"]}]},{"max":1,"pts":[{"t":"A justification that fits the application: decimal values need to be exact with no accumulating errors, or each digit is easy to display","re":["exact|accura|precis|error|round|decimal|digit|display|convert|easy|each digit|individual"]}]}]}],"set":"past"},{"n":5,"topic":1,"sub":["u1f"],"paper":"November 2022 V1","qn":"Q1(c)","title":"Character sets","stem":"","parts":[{"q":"Give one similarity and two differences between the ASCII and Unicode character sets.","id":"(a)","ref":"November 2022 V1 Q1(c)","marks":3,"msHead":"1 mark for similarity, 2 marks for differences","official":["1 mark for similarity, 2 marks for differences","Similarity (max 1):","Both can use 8 bits","Both represent each character using a unique code","Unicode will contain all the characters that ASCII contains // ASCII is a subset of Unicode","Differences (max 2):","Unicode can go up to 32 bits per character whereas ASCII is 7 or 8 bits","Unicode can represent a wider range of characters than ASCII","Different languages are represented using Unicode, ASCII is only for one language"],"tip":"A comparison needs a 'whereas'. Say ASCII does X whereas Unicode does Y.","method":["Similarity: both give every character its own unique number code.","Difference 1: bits per character. ASCII is 7 bits (128 characters), extended ASCII is 8 bits (256 characters), Unicode is 16 or 32 bits.","Difference 2: Unicode covers many languages and symbols, ASCII is mainly English."],"mistakes":["Only describing Unicode.","Saying Unicode is 'bigger' without numbers.","Confusing ASCII (7 bit) with extended ASCII (8 bit)."],"markWords":["1 mark: a valid similarity.","1 mark and 1 mark: two valid differences. Both sides must be compared."],"modelAns":"Similarity: each character has a unique code. Differences: Unicode uses more bits (up to 32) and covers many more characters and languages","rows":6,"g":[{"max":1,"pts":[{"t":"Similarity: both give each character a unique code // both can use 8 bits // ASCII is a subset of Unicode","re":["unique|same code|both|subset|contain|8 bits|each character"]}]},{"max":2,"pts":[{"t":"Unicode can use up to 32 bits per character, ASCII uses 7 or 8 bits","re":["(32|16|7|8) ?bits|more bits|bits per|uses more"]},{"t":"Unicode can represent a wider range of characters than ASCII","re":["more characters|wider|range|language|symbol|emoji|larger|many more|bigger"]},{"t":"Another  create all components in the graphic","ans":"data required to create all components in the graphic"},{"id":"f1","label":"drawing object","type":"select","re":[],"show":"a component created using a formula","ans":"a component created using a formula"},{"id":"f2","label":"property","type":"select","re":[],"show":"defines one characteristic of a component","ans":"defines one characteristic of a component"}]},{"q":"State what is meant by the bit depth of a bitmap image and explain how changing the bit depth affects the image.","id":"(b)","ref":"November 2023 V1 Q1(b)","marks":3,"msHead":"1 mark for the definition","official":["1 mark for the definition","The number of bits used to represent each colour","1 mark for each bullet point for the explanation","Increase in bit depth means the image has a greater range of colours // Decrease in bit depth means the image has a smaller range of colours","Increase in bit depth makes the image closer to the original / more realistic // Decrease in bit depth makes the image less like the original / less realistic"],"tip":"'State and explain' needs a definition first, then two linked effects.","method":["Definition: bits per colour (per pixel).","Effect 1: more bits means more colours are possible (2 to the power of the bit depth).","Effect 2: more colours makes the image closer to the original, but the file size also grows."],"mistakes":["Saying bit depth is the number of pixels.","Only explaining file size, which is not asked."],"markWords":["1 mark: definition.","1 mark: range of colours changes.","1 mark: realism changes."],"modelAns":"Bit depth = number of bits used for each colour. More bits gives more colours and a more realistic image","rows":6,"g":[{"max":1,"pts":[{"t":"Bit depth is the number of bits used to represent each colour","re":["number of bits|bits (used|per|for|to)|bits.*colour|colour.*bits"]}]},{"max":2,"pts":[{"t":"A greater bit depth gives a greater range of colours (a smaller one gives fewer)","re":["more colours|range of colours|fewer colours|less colours|number of colours|colour range|more shades"]},{"t":"A greater bit depth makes the image closer to the original / more realistic","re":["realistic|closer|accura|quality|detail|original|better"]},{"t":"A greater bit depth increases the file size","re":["file size|larger|bigger|more (memory|storage)"]}]}]}],"set":"past"},{"n":9,"topic":1,"sub":["u1l"],"paper":"November 2022 V3","qn":"Q1","title":"Sound","stem":"A digital audio message needs to be recorded.","parts":[{"q":"Tick (✓) one box in each row to identify the effect of each action on the accuracy of the recording.","id":"(a)","ref":"November 2022 V3 Q1(a)","marks":2,"msHead":"1 mark for one or two correct ticks, 2 marks for three correct ticks","official":["1 mark for one or two correct ticks, 2 marks for three correct ticks","Sampling rate 40 kHz to 60 kHz: accuracy increases","Duration 20 to 40 minutes: accuracy does not change","Sampling resolution 24 bits to 16 bits: accuracy decreases"],"tip":"Accuracy depends on rate and resolution. Duration only changes the file size.","method":["More samples per second means a closer copy of the analogue wave.","A longer recording just has more samples in total. Each sample is no more accurate.","Fewer bits per sample means each sample is less precise."],"mistakes":["Ticking 'increases' for the longer recording.","Mixing up rate and resolution."],"markWords":["2 marks: three correct rows.","1 mark: one or two correct rows."],"modelAns":"Rate up: increases. Duration: no change. Resolution down: decreases","kind":"tick","ladder":[0,1,1,2],"tick":{"cols":["Accuracy increases","Accuracy decreases","Accuracy does not change"],"rows":[{"label":"Change the sampling rate from 40 kHz to 60 kHz.","ans":0},{"label":"Change the duration of the recording from 20 minutes to 40 minutes.","ans":2},{"label":"Change the sampling resolution from 24 bits to 16 bits.","ans":1}]}},{"q":"The audio message is recorded with a sampling rate of 50 k /* ---------------- marking engine ---------------- */

      R.items.push({ c: good ? 'ok' : 'no', t: `${esc(f.label)} ${good ? '(correct)' : '(not matched)'}`, d: good ? `Your answer: ${esc(val)}` : `${val ? 'Your answer: ' + esc(val) + '. ' : ''}Mark scheme: ${esc(f.show)}` });
    });
    if (!any) { R.items = [{ c: 'no', t: 'No answer yet', d: 'Fill in the boxes.' }]; return R; }

}

  const qs = inSet(s);
  return `<div class="tblwrap"><table class="build cover"><tr><td>Topic</td><td>Questions</td></tr>${Object.keys(D.subs).map(k => { const hit = qs.filter(q => (q.sub || []).includes(k));
    return `<tr class="${hit.length ? '' : 'none'}"><td>${esc(subName(k))}</td><td>${hit.length ? hit.map(q => `<a href="#q-${q.n}">${qLabel(q)} (${qMarks(q)})</a>`).join(' ') : `<span class="muted">${s === 'past' ? 'Not in the past paper set: see exam style questions' : 'Not covered'}</span>`}</td></tr>`; }).join('')}</table></div>`;
}
function setCard(s) {
  const qs = inSet(s), mk = qs.reduce((a, q) => a + qMarks(q), 0), subs = new Set(qs.flatMap(q => q.sub || []));
  return `<section class="sheet setcard ${s}"><div class="eyebrow">${qs.length} questions  |  ${mk} marks  |  ${subs.size} of ${Object.keys(D.subs).length} topics</div><h2>${SETS[s].name}</h2><p>${SETS[s].blurb}</p>
   <div class="marks-strip">${D.topics.map((t, i) => { const m = qs.filter(q => q.topic === i + 1).reduce((a, q) => a + qMarks(q), 0); return m ? `<span class="chip" style="border-color:#${D.cols[i]}">${D.tl[i]}: ${m} marks</span>` : ''; }).join('')}</div>
   <div class="row" style="margin-top:6px"><a class="btn" href="#${s}">Practise questions</a><a class="btn ghost" href="#${s}-papers">Sit a timed paper</a><a href="#${s}-topics">Topics covered</a></div></section>`;
}
function home() {
  const done = Q.filter(q => store.get('m' + q.n, null) != null).length;
  $('#app').innerHTML = `<section class="hero1"><div class="eyebrow">${M.year} Computer Science  |  Cambridge ${M.spec}  |  ${M.code}</div><h1>${esc(M.unit)}</h1>
    <p>Choose <b>past paper questions</b> or <b>exam style questions</b>. Type your answers in the boxes, get a computer mark with reasons from the mark scheme, then self-mark it yourself. Each section also has timed papers.</p></section>
    <div class="sets">${setCard('past')}${setCard('style')}</div>
    <div class="sheet stat" style="margin-top:16px"><div class="row" style="justify-content:space-between"><span class="eyebrow">Your progress on this device</span><span class="mk">${done}/${Q.length} questions marked</span></div><div class="bar"><i style="width:${100 * done / Q.length}%"></i></div></div>
    <h2 style="margin-top:30px">How it works</h2><div class="how">
    <div class="sheet"><b>1. Answer</b>Read the question and its paper reference, then type your answer, fill in the boxes or tick the table. It saves on this device as you go.</div>
    <div class="sheet"><b>2. Computer mark</b>Get a mark for every part with reasons, the mark scheme points you matched and what to add next.</div>
    <div class="sheet"><b>3. Self-mark</b>Use the mark scheme to tick the points you earned. Then compare it with the model answer and the exam tip.</div></div>`;
}
function section(s) {
  const qs = inSet(s);
  const list = D.topics.map((t, i) => { const g = qs.filter(q => q.topic === i + 1); return g.length ? `<section class="topic"><h3 class="gh"><i style="background:#${D.cols[i]}"></i>${D.tl[i]}: ${esc(t)} <span class="muted" style="font:500 .85rem var(--body)">(${g.reduce((a, q) => a + qMarks(q), 0)} marks)</span></h3><div class="qlist">${g.map(qCard).join('')}</div></section>` : ''; }).join('');
  $('#app').innerHTML = `<div class="eyebrow">${M.year}  |  ${M.code}</div><h1>${SETS[s].name}</h1><p class="muted" style="max-width:65ch">${SETS[s].blurb}${s === 'style' ? ' ' + esc(D.note) : ''}</p>
   <nav class="subnav" aria-label="${SETS[s].name}"><a href="#${s}" aria-current="page">Questions</a><a href="#${s}-papers">Timed papers</a><a href="#${s}-topics">Topics covered</a></nav>${list}`;
}
function topicsView(s) {
  $('#app').innerHTML = `<div class="eyebrow">${SETS[s].name}</div><h1>Topics covered</h1><p class="muted" style="max-width:65ch">Every topic in this course, and the ${SETS[s].short.toLowerCase()} questions that test it. Select a question to practise it.</p>
   <nav class="subnav"><a href="#${s}">Questions</a><a href="#${s}-papers">Timed papers</a><a href="#${s}-topics" aria-current="page">Topics covered</a></nav>${coverHTML(s)}`;
}
function qCard(q) {
  const sm = store.get('m' + q.n, null), first = q.parts[0].q.split('\n')[0];
  return `<a class="sheet qcard" style="--tc:${col(q)}" href="#q-${q.n}"><div class="meta"><span>${qLabel(q)}  |  ${esc(refLine(q))}</span><span>${qMarks(q)} marks</span></div><b>${esc(q.title)}</b><span class="stem">${esc(first.length > 120 ? first.slice(0, 120) + '…' : first)}</span>${sm != null ? `<span class="state">Marked ${sm}/${qMarks(q)}</span>` : ''}</a>`;
}
function infoHTML(q) {
  const f = D.facts[q.topic - 1] || [];
  return `<span class="read">${esc(q.set === 'past' ? 'PAST PAPER' : 'EXAM STYLE')}</span><h3>${esc(q.title)}</h3><p class="muted" style="margin:0">${esc(refLine(q))}</p>
   ${q.stem ? `<h3>Context</h3><p>${nl(q.stem)}</p>` : ''}${q.set === 'style' ? `<p class="note">${esc(D.note)}</p>` : ''}
   <h3>Useful facts: ${D.tl[q.topic - 1]}</h3><ul class="facts">${f.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
}
function questionView(n) {
  const q = Q.find(x => x.n === n); if (!q) return home();
  const id = 'q' + n, vals = store.get('a' + n, {}) || {};
  $('#app').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><a href="#${q.set}">← ${SETS[q.set].name}</a><span class="eyebrow">${SETS[q.set].short}  |  ${esc((q.sub || []).map(subName).join(', '))}</span></div>
  <div class="qview"><aside class="sheet booklet" aria-label="Question information">${infoHTML(q)}</aside>
  <section class="sheet qpaper"><div class="qhead"><span class="qnum" style="color:${col(q)}">${qLabel(q)}  ${esc(q.title)}</span><span class="mk">(${qMarks(q)})</span></div>
  <p class="muted" style="margin:2px 0 4px">Suggested time: ${Math.round(qMarks(q) * M.mins)} minutes.</p>
  <div id="${id}-parts">${q.parts.map((p, i) => partHTML(q, p, i, id)).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="${id}-mark">Mark my answer</button></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model answer</button></div>
  <div class="panel" data-p="comp"><p class="muted">Write your answer, then select <b>Mark my answer</b>.</p></div>
  <div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div>
  <div class="panel" data-p="model" hidden><p class="muted">Try the question first. Then reveal the model answer.</p><button class="btn ghost" id="${id}-reveal">Show the model answer</button><div id="${id}-model"></div></div>
  </section></div>
  <div class="row" style="justify-content:space-between;margin-top:16px">${navBtn(q, -1)}${navBtn(q, 1)}</div>`;
  wireInputs($(`#${id}-parts`), vals, () => store.set('a' + n, vals));
  const tabs = document.querySelectorAll('.tabs button'), show = k => { tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k)); document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== k); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  $(`#${id}-mark`).addEventListener('click', () => { const r = markQ(q, vals); store.set('m' + n, r.mark); document.querySelector('[data-p="comp"]').innerHTML = resultHTML(q, r); show('comp'); });
  $(`#${id}-reveal`).addEventListener('click', e => { e.target.hidden = true; $(`#${id}-model`).innerHTML = modelHTML(q); });
  wireSelf(document.querySelector('[data-p="self"]'), q, id, m => store.set('s' + n, m));
}
function navBtn(q, d) { const qs = inSet(q.set), i = qs.indexOf(q) + d; if (i < 0 || i >= qs.length) return '<span></span>'; const o = qs[i]; return `<a class="btn ghost" href="#q-${o.n}">${d < 0 ? '← ' : ''}${qLabel(o)} ${esc(o.title)}${d > 0 ? ' →' : ''}</a>`; }

/* exam */
let EXAM = null, tick = null;
const examMarks = x => x.qs.reduce((a, n) => a + qMarks(Q.find(q => q.n === n)), 0);
function examPick(s) {
  $('#app').innerHTML = `<div class="eyebrow">${SETS[s].name}</div><h1>Timed papers</h1><p class="muted" style="max-width:65ch">Questions appear one at a time, like the real exam. The timer allows ${M.mins} minutes per mark. Nothing is marked until you finish, then every answer is marked with reasons and you can self-mark each one.</p>
  <nav class="subnav"><a href="#${s}">Questions</a><a href="#${s}-papers" aria-current="page">Timed papers</a><a href="#${s}-topics">Topics covered</a></nav>
  <div class="paper-pick">${D.exams.filter(x => x.set === s).map(x => { const qs = x.qs.map(n => Q.find(q => q.n === n)), mk = examMarks(x);
    return `<div class="sheet"><div class="eyebrow">${qs.length} questions  |  ${mk} marks  |  ${Math.round(mk * M.mins)} minutes</div><h2>${esc(x.name)}</h2><p class="muted" style="margin:0">${esc(x.note)}</p><div class="marks-strip">${qs.map(q => `<span class="chip">${qLabel(q)} (${qMarks(q)})</span>`).join('')}</div><div><a class="btn" href="#paper-${x.id}">Start this paper</a></div></div>`; }).join('')}</div>`;
}
function examStart(xid) {
  const x = D.exams.find(e => e.id === xid); if (!x) return home();
  const saved = store.get('exam-' + xid, null);
  if (!EXAM || EXAM.id !== xid) EXAM = saved && !saved.finished ? saved : { id: xid, i: 0, ans: {}, end: Date.now() + Math.round(examMarks(x) * M.mins * 60000), finished: false, self: {} };
  if (saved && saved.finished && (!EXAM || EXAM.id !== xid || !EXAM.finished)) EXAM = saved;
  if (EXAM.finished) return examResults(x);
  renderExamQ(x);
}
function renderExamQ(x) {
  const q = Q.find(qq => qq.n === x.qs[EXAM.i]), id = 'ex' + q.n;
  EXAM.ans[q.n] = EXAM.ans[q.n] || {};
  $('#app').innerHTML = `<div class="exambar"><b>${esc(x.name)}</b><span class="timer" id="timer"></span><div class="qnav">${x.qs.map((n, i) => `<button class="${i === EXAM.i ? 'cur' : ''} ${answered(Q.find(z => z.n === n), EXAM.ans[n]) ? 'done' : ''}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div><span style="margin-left:auto"><button class="btn" id="finish">Finish and mark</button></span></div>
  <div id="confirm"></div>
  <div class="qview"><aside class="sheet booklet">${infoHTML(q)}</aside><section class="sheet qpaper">
  <div class="qhead"><span class="qnum" style="color:${col(q)}">Question ${EXAM.i + 1} of ${x.qs.length}</span><span class="mk">(${qMarks(q)})</span></div>
  <p class="muted" style="margin:4px 0 0">${esc(q.title)}</p>
  <div id="${id}-parts">${q.parts.map((p, i) => partHTML(q, p, i, id)).join('')}</div>
  <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn ghost" id="prev" ${EXAM.i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${EXAM.i < x.qs.length - 1 ? '' : 'disabled'}>Next →</button></div></section></div>`;
  wireInputs($(`#${id}-parts`), EXAM.ans[q.n], () => store.set('exam-' + x.id, EXAM));
  const go = i => { EXAM.i = i; store.set('exam-' + x.id, EXAM); renderExamQ(x); window.scrollTo(0, 0); };
  document.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#prev').addEventListener('click', () => go(EXAM.i - 1)); $('#next').addEventListener('click', () => go(EXAM.i + 1));
  $('#finish').addEventListener('click', () => { const blank = x.qs.filter(n => !answered(Q.find(z => z.n === n), EXAM.ans[n])).length;
    $('#confirm').innerHTML = `<div class="confirm"><b>Finish the paper and mark it?</b> ${blank ? `You have ${blank} unanswered question(s).` : 'All questions have an answer.'} You cannot change answers after marking.<div class="row" style="margin-top:10px"><button class="btn" id="yes">Yes, mark my paper</button><button class="btn ghost" id="no">Keep working</button></div></div>`;
    $('#yes').addEventListener('click', () => finish(x)); $('#no').addEventListener('click', () => $('#confirm').innerHTML = ''); });
  clearInterval(tick); const t = () => { const s = Math.max(0, Math.round((EXAM.end - Date.now()) / 1000)), el = $('#timer'); if (!el) return clearInterval(tick);
    el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left` : 'Time is up'; el.classList.toggle('low', s < 300); };
  t(); tick = setInterval(t, 1000);
}
function finish(x) { clearInterval(tick); EXAM.finished = true; store.set('exam-' + x.id, EXAM); examResults(x); window.scrollTo(0, 0); }
function examResults(x) {
  const qs = x.qs.map(n => Q.find(q => q.n === n)), max = examMarks(x), rs = qs.map(q => markQ(q, EXAM.ans[q.n] || {}));
  const comp = rs.reduce((a, r) => a + r.mark, 0), selfTot = () => qs.reduce((a, q) => a + (EXAM.self[q.n] ?? 0), 0), selfN = () => qs.filter(q => EXAM.self[q.n] != null).length;
  $('#app').innerHTML = `<div class="eyebrow">${SETS[x.set].name}  |  ${esc(x.name)}  |  Results</div><h1>Your paper is marked</h1>
  <div class="cmp" style="max-width:640px"><div><span class="eyebrow">Computer mark</span><b>${comp}/${max}</b><span class="muted">${Math.round(100 * comp / max)}%</span></div><div><span class="eyebrow">Your self-mark</span><b id="selftot">${selfTot()}/${max}</b><span class="muted" id="selfn">${selfN()} of ${qs.length} questions self-marked</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="again">Start this paper again</button><a class="btn ghost" href="#${x.set}-papers">Choose another paper</a></div>
  ${qs.map((q, i) => { const r = rs[i], id = 'r' + q.n;
    return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Question ${i + 1}: ${esc(q.title)}  <span class="muted">(${qMarks(q)} marks)</span></span><span class="mk">${r.mark}/${r.max}</span></summary>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model answer</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const q = h.startsWith('q-') ? Q.find(x => x.n === +h.slice(2)) : null;
  const ex = h.startsWith('paper-') ? D.exams.find(e => e.id === h.slice(6)) : null;
  const v = q ? q.set : ex ? ex.set : h.split('-')[0];
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (q) questionView(q.n);
  else if (ex) examStart(ex.id);
  else if (h === 'past' || h === 'style') section(h);
  else if (h === 'past-papers' || h === 'style-papers') examPick(h.split('-')[0]);
  else if (h === 'past-topics' || h === 'style-topics') topicsView(h.split('-')[0]);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();

</script>
</body>
</html>
