f competing arguments/factors.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation)."], "parts": [["Knowledge", "Primary research is new data collected first-hand for a specific purpose; observation means watching how people behave. [K]", "Level 1"], ["Main points", "Observing children at home showed how they really play, rather than what they say they do. [A] [An] LEGO found that many girls wanted to build detailed scenes and tell stories, which led to LEGO Friends. [An] The data is up to date and specific to LEGO, so competitors do not have it. [A] [An] Detailed qualitative data helps LEGO design products that meet customer needs, increasing sales. [An]", "Level 2/2"], ["Other side", "However, observation is expensive and slow: LEGO spent four years on research before launching LEGO Friends. [Ev] Only a small number of children can be observed, so the results may not represent all customers. [Ev] Children may behave differently when they know they are being watched, which could make results less reliable. [Ev]", "Level 3"]]}, "u": "u1"}, {"case": "lego", "topic": 2, "sub": ["2d"], "marks": 10, "type": "lev", "read": "D and E", "stem": "Assess whether LEGO should use quota sampling rather than random sampling for its next online survey of families.", "kw": ["quota", "random", "sample", "population", "representative", "equal chance", "bias"], "pts": [{"s": "know", "t": "Quota sampling chooses set numbers of people from different groups, such as age or region, while random sampling gives everyone an equal chance of being chosen"}, {"s": "for", "t": "Quota sampling makes sure LEGO hears from each important group, such as parents of girls and boys of different ages"}, {"s": "for", "t": "The survey covered 3,500 families in Europe and North America, so quotas can make sure both regions are represented"}, {"s": "for", "t": "Quota sampling is quicker and cheaper because LEGO does not need a full list of the population"}, {"s": "against", "t": "However, the people chosen within each quota may not be typical, which can create bias"}, {"s": "against", "t": "Random sampling avoids interviewer bias because every family has an equal chance of selection"}, {"s": "against", "t": "Random sampling needs a full list of families, which may be difficult and costly for LEGO to obtain"}, {"s": "judge", "t": "Overall, quota sampling is likely to suit LEGO because it targets clear customer groups, but it depends on how carefully the quotas are set"}], "n": 110, "set": "style", "paper": "Exam style", "qn": "LEGO", "biz": "LEGO", "ext": [{"id": "D", "t": "Market research at LEGO", "p": ["LEGO is a Danish toy business known for its plastic building bricks. Before launching LEGO Friends in 2012, LEGO spent four years researching how girls and boys play.", "Researchers observed children playing at home and talked to parents. They found that many girls wanted to build detailed scenes and tell stories with characters.", "LEGO also uses secondary data, such as toy industry reports and sales data from retailers, and runs an online platform, LEGO Ideas, where fans suggest new sets."]}, {"id": "E", "t": "Survey results", "p": ["LEGO carried out an online survey of 3,500 families in Europe and North America.", "42% said their child wanted more sets based on films and games.", "27% said price was the main reason for not buying LEGO.", "18% said they bought LEGO online more than in shops."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 7, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 8, 10, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "ms": "Indicative content\n• Quota sampling chooses set numbers of people from different groups, such as age or region, while random sampling gives everyone an equal chance of being chosen\n• Quota sampling makes sure LEGO hears from each important group, such as parents of girls and boys of different ages\n• The survey covered 3,500 families in Europe and North America, so quotas can make sure both regions are represented\n• Quota sampling is quicker and cheaper because LEGO does not need a full list of the population\n• However, the people chosen within each quota may not be typical, which can create bias\n• Random sampling avoids interviewer bias because every family has an equal chance of selection\n• Random sampling needs a full list of families, which may be difficult and costly for LEGO to obtain\n• Overall, quota sampling is likely to suit LEGO because it targets clear customer groups, but it depends on how carefully the quotas are set\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–7 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 8–10 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (8 to 10): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement."], "parts": [["Knowledge", "Quota sampling chooses set numbers of people from different groups, such as age or region, while random sampling gives everyone an equal chance of being chosen. [K]", "Level 1"], ["Main points", "Quota s and online.", "Customers can join the Nespresso club, which offers personal advice, recycling of used pods and limited edition coffees. Its advertising uses famous actors to create a premium image.", "Nespresso offers two machine systems: Original for espresso drinkers and Vertuo for customers who prefer larger cups of coffee. It also sells machines to offices and hotels."]}, {"id": "G", "t": "Competition in the coffee pod market", "p": ["Supermarkets and other brands now sell pods that work in Nespresso Original machines, often at about half the price.", "Nespresso pods sell for around $0.80 each compared with about $0.40 for many compatible pods. Nespresso says its coffee quality, design and service justify the higher price."]}], "u": "u1"}, {"case": "nespresso", "topic": 3, "sub": ["3b"], "marks": 4, "type": "pt", "read": "F and G", "stem": "Explain one benefit to Nespresso of using market mapping.", "K": [["gap", "competitor", "position", "compare", "identify", "map"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["market map"], "ms": "3(b) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a benefit, e.g.\n• Shows the position of competitors / helps identify gaps in the market (1)\nApplication\nUp to 2 marks for context, e.g.\n• Compatible pods sell at about $0.40 compared with $0.80 for Nespresso (1)\n• Nespresso has a premium image with boutiques and a club (1)\nAnalysis\n1 mark for developing the benefit, e.g.\n• Nespresso can make sure it stays clearly positioned as high price, high quality, so it can justify premium prices (1)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "One benefit, two pieces of Nespresso context, one developed consequence.", "plan": ["Identify one benefit (K1).", "Two points of Nespresso context (A2).", "Develop it (An1)."], "parts": [["Knowledge", "A market map shows where competitors are positioned. [K]", "1 mark"], ["Application", "Compatible pods cost about $0.40 compared with $0.80 for Nespresso [A], and Nespresso has a premium image built on boutiques and its club. [A]", "3 marks"], ["Analysis", "This means Nespresso can keep itself clearly positioned as high price and high quality, so it can justify charging premium prices. [An]", "4 marks"]]}, "n": 112, "set": "style", "paper": "Exam style", "qn": "Nespresso", "biz": "Nespresso", "ext": [{"id": "F", "t": "About Nespresso", "p": ["Nespresso is part of the Swiss business Nestlé. It sells coffee machines and single-serve coffee pods through its own boutiques and online.", "Customers can join the Nespresso club, which offers personal advice, recycling of used pods and limited edition coffees. Its advertising uses famous actors to create a premium image.", "Nespresso offers two machine systems: Original for espresso drinkers and Vertuo for customers who prefer larger cups of coffee. It also sells machines to offices and hotels."]}, {"id": "G", "t": "Competition in the coffee pod market", "p": ["Supermarkets and other brands now sell pods that work in Nespresso Original machines, often at about half the price.", "Nespresso pods sell for around $0.80 each compared with about $0.40 for many compatible pods. Nespresso says its coffee quality, design and service justify the higher price."]}], "u": "u1"}, {"case": "nespresso", "topic": 3, "sub": ["3c"], "marks": 6, "type": "pt", "read": "F", "stem": "Analyse two ways Nespresso segments its market.", "K": [["taste", "preference", "behaviour", "usage", "lifestyle", "espresso", "large cup"], ["business", "office", "hotel", "b2b", "consumer"], ["income", "premium", "wealth", "demographic"], ["geograph", "country", "region"]], "Kmax": 2, "Amax": 2, "Anmax": 2, "kw": ["segment"], "ms": "3(c) Knowledge 2, Application 2, Analysis 2\nKnowledge\nUp to 2 marks for identifying two methods of segmentation, e.g.\n• By customer preferences/behaviour (1)\n• By type of customer: consumers and businesses (1)\n• By income (1)\nApplication\nUp to 2 marks for context, e.g.\n• Original machines for espresso drinkers and Vertuo for larger cups (1)\n• Machines sold to offices and hotels (1)\nAnalysis\nUp to 2 marks for consequences, e.g.\n• Products can be designed for each group's needs, increasing sales (1)\n• Business customers buy in larger volumes, increasing revenue (1)", "sup": {"grid": "Point marked: Knowledge 2, Application 2, Analysis 2. No evaluation.", "top": "Two methods of segmentation, each in context and developed.", "plan": ["Identify two methods (K2).", "Link each to Nespresso (A2).", "Develop each (An2)."], "parts": [["Method 1", "Segmenting by customer preference. [K] Original machines are for espresso drinkers and Vertuo for larger cups [A], so each group gets a product that meets its needs, increasing sales. [An]", "3 marks"], ["Method 2", "Segmenting by type of customer. [K] Nespresso sells machines to offices and hotels [A], which means it earns revenue from large-volume business buyers as well as households. [An]", "6 marks"]]}, "n": 113, "set": "style", "paper": "Exam style", "qn": "Nespresso", "biz": "Nespresso", "ext": [{"id": "F", "t": "About Nespresso", "p": ["Nespresso is part of the Swiss business Nestlé. It sells coffee machines and single-serve coffee pods through its own boutiques and online.", "Customers can join the Nespresso club, which offers personal advice, recycling of used pods and limited edition coffees. Its advertising uses famous actors to create a premium image.", "Nespresso offers two machine systems: Original for espresso drinkers and Vertuo for customers who prefer larger cups of coffee. It also sells machines to offices and hotels."]}, {"id": "G", "t": "Competition in the coffee pod market", "p": ["Supermarkets and other brands now sell pods that work in Nespresso Original machines, often at about half the price.", "Nespresso pods sell for around $0.80 each compared with about $0.40 for many compatible pods. Nespresso says its coffee quality, design and service justify the higher price."]}], "u": "u1"}, {"case": "nespresso", "topic": 3, "sub": ["3e", "3d"], "marks": 8, "type": "lev", "read": "F and G", "stem": "Discuss how product differentiation may give Nespresso a competitive advantage.", "kw": ["differentiat", "competitive advantage", "usp", "unique", "stand out", "distinguish"], "pts": [{"s": "know", "t": "Product differentiation is making a product different from competitors; a competitive advantage lets a business outperform its rivals"}, {"s": "for", "t": "Nespresso differentiates through coffee quality, machine design and its club service"}, {"s": "for", "t": "This premium image means customers may pay about $0.80 a pod instead of $0.40 for compatible pods, increasing profit margins"}, {"s": "for", "t": "Club benefits such as recycling and limited edition coffees build brand loyalty and repeat purchases"}, {"s": "for", "t": "The Vertuo system uses its own pods, so customers must buy Nespresso pods"}, {"s": "against", "t": "However, compatible pods for Original machines at half the price may take market share"}, {"s": "against", "t": "Advertising with famous actors, boutiques and the club are expensive, which raises costs"}, {"s": "against", "t": "If customers cannot taste a difference, the higher price may not be seen as worth paying"}], "n": 114, "set": "style", "paper": "Exam style", "qn": "Nespresso", "biz": "Nespresso", "ext": [{"id": "F", "t": "About Nespresso", "p": ["Nespresso is part of the Swiss business Nestlé. It sells coffee machines and single-serve coffee pods through its own boutiques and online.", "Customers can join the Nespresso club, which offers personal advice, recycling of used pods and limited edition coffees. Its advertising uses famous actors to create a premium image.", "Nespresso offers two machine systems: Original for espresso drinkers and Vertuo for customers who prefer larger cups of coffee. It also sells machines to offices and hotels."]}, {"id": "G", "t": "Competition in the coffee pod market", /* ---------------- marking engine ---------------- */
const STOP = new Set('which their there these those about would could should might other being while where after before since because however therefore business businesses using during between within through'.split(' '));
const lc = s => s.toLowerCase().replace(/[’‘]/g, "'");

const digits = s => s.replace(/[,\s]/g, '');
function contextTerms(q) {

  const terms = new Map();
  (txt.match(/[£$€]?\d[\d,. ]*\d?\s?(%|bn|m\b|million|billion|trillion)?/g) || []).forEach(n => { const k = digits(n).replace(/[£$€]/g, '').replace(/(bn|m|million|billion|trillion|%)$/, '').replace(/\.$/, ''); if (k.length >= 2 && !/^0+$/.test(k)) terms.set('#' + k, n.trim()); });
  const skip = new Set('The This That These It In A An As At By For From If Its On Or So To We With He She They Our Their Extract Source Sources Section Many Most Some Since Today When While After Before Although Over Under Each Every One Two Three Four Five Riders There However Also Globally Currently'.split(' '));
  (txt.match(/\b[A-Z][a-zA-Z&’']{2,}(?:\s[A-Z][a-zA-Z&’']{2,})*/g) || []).forEach(w => { const f = w.split(' ')[0]; if (!skip.has(f)) terms.set(lc(w), w); });
  q.biz.split(/[ ,]+/).forEach(w => w.length > 2 && terms.set(lc(w), w));
  return terms;
}
function findContext(q, ans) {
  const T = contextTerms(q), a = lc(ans), ad = digits(ans).replace(/[£$€]/g, ''), hits = [];
  T.forEach((label, k) => {
    if (k.startsWith('#')) { const n = k.slice(1); if (new RegExp('(^|[^0-9.])' + n.replace('.', '\\.') + '([^0-9]|$)').test(ad)) hits.push(label); }
    else if (a.includes(k)) hits.push(label);

}
const CHAIN = /\b(because|so that|so |therefore|this means|which means|meaning|this leads?|leads? to|leading to|as a result|resulting in|results? in|which could|this could|this may|this will|this would|consequently|thus|hence|due to|causing|allowing|enabling|so it)\b/;
const BAL = /\b(however|on the other hand|although|but |whereas|nevertheless|despite|alternatively|on the contrary|yet )\b/;
const JUDGE = /\b(overall|in conclusion|to conclude|it depends|depends on|on balance|to a large extent|to some extent|to a limited extent|ultimately|most important|i think|i believe|in my opinion)\b/;
const REC = /\b(should|recommend|needs to|ought to|best option|advise|must ensure)\b/;
function analyse(ans) {

    chains: ss.filter(s => CHAIN.test(lc(s)) && s.split(/\s+/).length >= 9),
    bal: ss.filter(s => BAL.test(lc(s)) && s.split(/\s+/).length >= 7),

function sig(t) { return [...new Set(words(t).filter(w => w.length >= 5 && !STOP.has(w)).map(w => w.slice(0, 6)))]; }
function coverPts(q, ans) {

}
const kwHits = (kws, ans) => kws.filter(k => lc(ans).includes(k));

function mark(q, ans) {

  if (q.type === 'def') {
    let m = 0; q.parts.forEach((p, i) => { const h = kwHits(p, ans); if (h.length) m++;

    const correct = nums.some(n => Math.abs(n - q.ans) < 0.006);
    const fx = q.ans.toFixed(2).split('.'), intRe = fx[0] === '0' ? '0?' : fx[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',?'), decRe = fx[1] === '00' ? '(\\.0+)?' : '\\.' + fx[1] + '0*';

    let m = K + Ap + An; if (correct) m = Math.max(m, unitOk ? 4 : 3); if (correct && !unitOk) m = Math.min(m, 3);
    m = Math.min(4, m);
    R.crit.push({ c: K ? 'ok' : 'no', t: `${tag('K')} Formula ${K ? '(1 mark)' : '(0 marks)'}`, d: K ? 'You showed the formula or method.' : `Write the formula first: ${q.fhint}.` });
    R.crit.push({ c: Ap === 2 ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Correct data selected (${Ap}/2)`, d: wk.length ? `Figures used from the data: ${wk.join(', ')}.` : 'Show the figures you took from the question and the extract.' });
    R.crit.push({ c: correct ? 'ok' : 'no', t: `${tag('An')} Correct answer ${correct ? '(1 mark)' : '(0 marks)'}`, d: correct ? `Correct: ${q.ansText}.` : 'Check your working and round to two decimal places where asked.' });
    if (q.unit || q.pre) R.crit.push({ c: unitOk ? 'ok' : correct ? 'part' : 'no', t: 'Units', d: unitOk ? 'Units shown correctly.' : `Write the answer with its units: ${q.ansText}. Without units, a correct answer with no working gets 3 marks.` });
    return { mark: m, max: 4, label: `${m}/4 (point marked)`, ...R };
  }
  const ctx = findContext(q, ans), kh = kwHits(q.kw || [], ans);
  if (q.type === 'pt') {

    const K = Math.min(q.Kmax, Math.max(kg, kh.length ? 1 : 0)), Ap = Math.min(q.Amax, ctx.length), An = K ? Math.min(q.Anmax, A0.chains.length) : 0, m = K + Ap + An;
    R.crit.push({ c: K === q.Kmax ? 'ok' : K ? 'part' : 'no', t: `${tag('K')} Knowledge ${K}/${q.Kmax}`, d: K ? 'You identified relevant business knowledge.' : 'Start by stating the business idea clearly (e.g. the benefit or definition).' });
    R.crit.push({ c: Ap === q.Amax ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Application ${Ap}/${q.Amax}`, d: ctx.length ? `Context found: ${ctx.slice(0, 6).join(', ')}.` : `Use evidence about ${q.biz} from the extract (names, figures, facts).` });
    R.crit.push({ c: An === q.Anmax ? 'ok' : An ? 'part' : 'no', t: `${tag('An')} Analysis ${An}/${q.Anmax}`, d: An ? `${A0.chains.length} developed chain(s) of reasoning found (because / so / this means).` : 'Develop each point: say what it leads to, using "so", "this means" or "as a result".' });

    <div class="secbars">${SECTIONS.map(s => { const st = stats(qsOf(s)); return `<a class="secbar" href="#${s.id}"><span class="lab"><i class="dot" style="background:${s.color}"></i>${esc(secName(s))}</span><span class="bar"><i style="width:${100 * st.marked / st.n}%;background:${s.color}"></i></span><span class="num">${st.marked}/${st.n} marked${st.avg == null ? '' : ' · ' + st.avg + '%'}</span></a>`; }).join('')}</div></section>
    <h2 style="margin-top:28px">Choose a section</h2>
    <div class="bigbtns">${SECTIONS.map(s => { const qs = qsOf(s), mk = qs.reduce((a, q) => a + q.marks, 0), subs = new Set(qs.flatMap(q => q.sub || []));
      return `<a class="bigbtn" href="#${s.id}" style="--c:${s.color}"><span class="eyebrow">${esc(s.u.name)}</span><b>${esc(secName(s))}</b><span>${qs.length} questions  ·  ${mk} marks  ·  ${subs.size} of ${Object.keys(s.u.subs).length} topics</span><span class="go">Open →</span></a>`; }).join('')}</div>
    <h2 style="margin-top:28px">How it works</h2><div class="how">
    <div class="sheet"><b>1. Answer</b>Read the extract beside the question and type your answer. It saves on this device as you type. You can clear it and start again, or print the question.</div>
    <div class="sheet"><b>2. Check</b>Choose the model build-up, a self-mark using the mark scheme, or a computer mark with reasons and what to add next.</div>
    <div class="sheet"><b>3. Timed papers</b>Each section has timed papers. Answers are marked when you finish, and you can self-mark each one.</div></div>
    `;
  $('#reset').addEventListener('click', () => { $('#resetc').innerHTML = `<div class="confirm"><b>Reset everything?</b> All your answers, marks and timed papers on this device will be deleted. This cannot be undone.<div class="row" style="margin-top:10px"><button class="btn danger" id="ry">Yes, reset everything</button><button class="btn ghost" id="rn">Cancel</button></div></div>`;
    $('#ry').addEventListener('click', () => { store.clearAll(); EXAM = null; home(); window.scrollTo(0, 0); }); $('#rn').addEventListener('click', () => $('#resetc').innerHTML = ''); });
}
function secHead(s, tab) {
  return `<div class="sechead" style="--c:${s.color}"><div class="eyebrow">${esc(s.u.name)}  |  ${esc(s.u.code)}</div><h1>${esc(secName(s))}</h1><p>${SETBLURB[s.set]}${s.set === 'style' ? ' ' + esc(s.u.note) : ''}</p></div>
   <nav class="subnav"><a href="#${s.id}" ${tab === 'q' ? 'aria-current="page"' : ''}>Questions</a><a href="#${s.id}-papers" ${tab === 'p' ? 'aria-current="page"' : ''}>Timed papers</a><a href="#${s.id}-topics" ${tab === 't' ? 'aria-current="page"' : ''}>Topics covered</a></nav>`;
}
function section(s) {
  const qs = qsOf(s); let list;
  if (s.set === 'past') list = s.u.topics.map((t, i) => { const g = qs.filter(q => q.topic === i + 1); return g.length ? `<section class="topic"><h3 class="gh"><i style="background:#${s.u.cols[i]}"></i>${esc(t)}</h3><div class="qlist">${g.map(qCard).join('')}</div></section>` : ''; }).join('');
  else list = s.u.cases.map(c => `<section class="topic"><h3 class="gh"><i style="background:${s.color}"></i>Case study: ${esc(c.name)} <span class="muted" style="font:500 .85rem var(--body)">(${esc(c.where)})</span></h3><div class="qlist">${qs.filter(q => q.case === c.id).map(qCard).join('')}</div></section>`).join('');
  $('#app').innerHTML = secHead(s, 'q') + list;
}
function topicsView(s) {
  const qs = qsOf(s), u = s.u;
  $('#app').innerHTML = secHead(s, 't') + `<p class="muted" style="max-width:70ch">Every ${esc(u.name)} topic and the questions in this section that test it.</p><div class="tblwrap"><table class="build cover"><tr><td>Topic</td><td>Questions</td></tr>${Object.keys(u.subs).map(k => { const hit = qs.filter(q => (q.sub || []).includes(k));
    return `<tr class="${hit.length ? '' : 'none'}"><td>${esc(subName(u, k))}${u.subdetail ? `<div class="muted" style="font-weight:400;font-size:.82rem">${esc(u.subdetail[k].split(': ').slice(1).join(': '))}</div>` : ''}</td><td>${hit.length ? hit.map(q => `<a href="#q-${q.n}">${qLabel(q)} (${q.marks})</a>`).join(' ') : `<span class="muted">${s.set === 'past' ? 'Not in these past papers: see the exam style section' : 'Not covered'}</span>`}</td></tr>`; }).join('')}</table></div>`;
}
function qCard(q) {
  const sm = store.get('s' + q.n, null) ?? store.get('m' + q.n, null);
  return `<a class="sheet qcard" style="--tc:${col(q)}" href="#q-${q.n}"><div class="meta"><span>${qLabel(q)}  |  ${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) : 'Exam style'}</span><span>${q.marks} marks</span></div><b>${esc(q.biz)}</b><span class="stem">${esc(q.stem.length > 150 ? q.stem.slice(0, 150) + '…' : q.stem)}</span><div class="meta"><span>${cmd(q)}  |  ${esc((q.sub || []).map(k => subName(unitOf(q), k))[0] || '')}</span>${sm != null ? `<span class="state">Mark ${sm}/${q.marks}</span>` : (store.get('a' + q.n, '') || '').trim() ? '<span class="state">Answered</span>' : ''}</div></a>`;
}
function tipHTML(q) { return q.tip ? `<div class="tip"><b>Examiner tip</b>${esc(q.tip)}</div>` : ''; }
function printQ(q) {
  $('#printarea').innerHTML = `<h1>${esc(unitOf(q).name)}  |  ${qLabel(q)} ${esc(q.biz)}</h1><p class="pm">${q.set === 'past' ? esc(q.paper) + ' paper, Q' + esc(q.qn) : 'Exam style question'}  |  ${q.marks} marks  |  Suggested time: ${Math.round(q.marks * M.mins)} minutes</p>
    <div class="pext">${extractsHTML(q)}</div><div class="pq"><b>${esc(q.stem)}</b> <span>(${q.marks})</span></div><div class="plines">${'<div></div>'.repeat(Math.min(40, 8 + q.marks * 2))}</div>`;
  document.body.classList.add('printing'); window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
function questionView(n) {
  const q = Q.find(x => x.n === n); if (!q) return home();
  const s = secOf(q), id = 'q' + n;
  $('#app').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><a href="#${s.id}">← ${esc(secName(s))}</a><span class="eyebrow">${esc((q.sub || []).map(k => subName(unitOf(q), k)).join(', '))}</span></div>
  <div class="qview"><aside class="sheet booklet" aria-label="Extracts">${q.set === 'style' ? `<p class="note" style="margin-top:0">${esc(unitOf(q).note)}</p>` : ''}${extractsHTML(q)}</aside>
  <section class="sheet qpaper"><div class="qhead"><span class="qnum" style="color:${col(q)}">${qLabel(q)}  ${esc(q.biz)}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:2px 0 0">${esc(unitOf(q).name)}  |  ${q.set === 'past' ? esc(q.paper) + ' paper, Q' + esc(q.qn) : 'Exam style question'}</p>
  <p class="qstem">${esc(q.stem)}</p><p class="muted" style="margin:0 0 10px">Suggested time: ${Math.round(q.marks * M.mins)} minutes.</p>
  <label for="${id}-ans" class="eyebrow">Your answer</label><textarea class="answer" id="${id}-ans" spellcheck="true" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="counter" id="${id}-wc">0 words  ·  saved</span><div class="row"><button class="btn ghost" id="${id}-clear">Clear answer</button><button class="btn ghost" id="${id}-print">Print question</button></div></div>
  <div id="${id}-cc"></div>
  <h3 style="margin-top:18px">Check your answer</h3>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="false" data-tab="model">Model build-up</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="comp">Computer mark</button></div>
  <div class="panel" data-p="none"><p class="muted">Choose an option above. The computer mark updates as you edit your answer.</p></div>
  <div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div>
  <div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div>
  <div class="panel" data-p="comp" hidden></div>
  </section></div>
  <div class="row" style="justify-content:space-between;margin-top:16px">${navBtn(q, -1)}${navBtn(q, 1)}</div>`;
  const ta = $(`#${id}-ans`), wc = () => $(`#${id}-wc`).textContent = `${words(ta.value).length} words  ·  saved`;
  let cur = 'none';
  const markNow = () => { const r = mark(q, ta.value); if (words(ta.value).length) store.set('m' + n, r.mark); document.querySelector('[data-p="comp"]').innerHTML = (q.tip ? tipHTML(q) : '') + resultHTML(q, r); };
  const tabs = document.querySelectorAll('.tabs button'), show = k => { cur = k; tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k)); document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== k); if (k === 'comp') markNow(); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  ta.value = store.get('a' + n, ''); wc();
  let deb; ta.addEventListener('input', () => { store.set('a' + n, ta.value); wc(); if (cur === 'comp') { clearTimeout(deb); deb = setTimeout(markNow, 600); } });
  $(`#${id}-print`).addEventListener('click', () => printQ(q));
  $(`#${id}-clear`).addEventListener('click', () => { $(`#${id}-cc`).innerHTML = `<div class="confirm"><b>Clear your answer and marks for this question?</b> This cannot be undone.<div class="row" style="margin-top:10px"><button class="btn danger" id="${id}-cy">Yes, clear and start again</button><button class="btn ghost" id="${id}-cn">Cancel</button></div></div>`;
    $(`#${id}-cy`).addEventListener('click', () => { ['a', 'm', 's'].forEach(k => store.set(k + n, null)); questionView(n); });
    $(`#${id}-cn`).addEventListener('click', () => $(`#${id}-cc`).innerHTML = ''); });
  wireSelf(document.querySelector('[data-p="self"]'), q, id, m => store.set('s' + n, m));
}
function navBtn(q, d) { const qs = qsOf(secOf(q)), i = qs.indexOf(q) + d; if (i < 0 || i >= qs.length) return '<span></span>'; const o = qs[i]; return `<a class="btn ghost" href="#q-${o.n}">${d < 0 ? '← ' : ''}${qLabel(o)} ${esc(o.biz)}${d > 0 ? ' →' : ''}</a>`; }

/* exam */
let EXAM = null, tick = null;
function examPick(s) {
  $('#app').innerHTML = secHead(s, 'p') + `<p class="muted" style="max-width:65ch">Questions appear one at a time with their extracts, like the real exam. The timer allows ${M.mins} minutes per mark. Nothing is marked until you finish, then every answer is marked with reasons and you can self-mark each one.</p>
  <div class="paper-pick">${D.exams.filter(x => x.unit === s.u.id && x.set === s.set).map(x => { const qs = x.qs.map(n => Q.find(q => q.n === n)), mk = qs.reduce((a, q) => a + q.marks, 0), st = store.get('exam-' + x.id, null);
    return `<div class="sheet"><div class="eyebrow">${qs.length} questions  |  ${mk} marks  |  ${Math.round(mk * M.mins)} minutes</div><h2>${esc(x.name)}</h2><p class="muted" style="margin:0">${esc(x.note)}</p><div class="marks-strip">${qs.map(q => `<span class="chip">${qLabel(q)} (${q.marks})</span>`).join('')}</div><div><a class="btn" href="#paper-${x.id}" style="background:${s.color};border-color:${s.color}">${st ? (st.finished ? 'See results' : 'Continue this paper') : 'Start this paper'}</a></div></div>`; }).join('')}</div>`;
}
function examStart(xid) {
  const x = D.exams.find(e => e.id === xid); if (!x) return home();
  const sec = SECTIONS.find(s => s.u.id === x.unit && s.set === x.set);
  const saved = store.get('exam-' + xid, null);
  if (!EXAM || EXAM.id !== xid) EXAM = saved && !saved.finished ? saved : { id: xid, i: 0, ans: {}, end: Date.now() + Math.round(x.qs.reduce((a, n) => a + Q.find(q => q.n === n).marks, 0) * M.mins * 60000), finished: false, self: {} };
  if (EXAM.finished) return examResults(x);
  renderExamQ(x);
}
function renderExamQ(x) {
  const q = Q.find(qq => qq.n === x.qs[EXAM.i]), id = 'ex' + q.n;
  $('#app').innerHTML = `<div class="exambar"><b>${esc(x.name)}</b><span class="timer" id="timer"></span><div class="qnav">${x.qs.map((n, i) => `<button class="${i === EXAM.i ? 'cur' : ''} ${(EXAM.ans[n] || '').trim() ? 'done' : ''}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div><span style="margin-left:auto"></span><button class="btn" id="finish">Finish and mark</button></div>
  <div id="confirm"></div>
  <div class="qview"><aside class="sheet booklet">${extractsHTML(q)}</aside><section class="sheet qpaper">
  <div class="qhead"><span class="qnum" style="color:${col(q)}">Question ${EXAM.i + 1} of ${x.qs.length}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:4px 0 0">${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) + '  |  ' : 'Exam style  |  '}${esc(q.biz)}</p><p class="qstem">${esc(q.stem)}</p>
  <label for="${id}" class="eyebrow">Your answer</label><textarea class="answer" id="${id}" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="counter" id="wc"></span><div class="row"><button class="btn ghost" id="prev" ${EXAM.i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${EXAM.i < x.qs.length - 1 ? '' : 'disabled'}>Next →</button></div></div></section></div>`;
  const ta = $('#' + id), save = () => { EXAM.ans[q.n] = ta.value; store.set('exam-' + x.id, EXAM); $('#wc').textContent = `${words(ta.value).length} words`; };
  ta.value = EXAM.ans[q.n] || ''; save(); ta.addEventListener('input', save);
  const go = i => { EXAM.i = i; store.set('exam-' + x.id, EXAM); renderExamQ(x); window.scrollTo(0, 0); };
  document.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#prev').addEventListener('click', () => go(EXAM.i - 1)); $('#next').addEventListener('click', () => go(EXAM.i + 1));
  $('#finish').addEventListener('click', () => { const blank = x.qs.filter(n => !(EXAM.ans[n] || '').trim()).length;
    $('#confirm').innerHTML = `<div class="confirm"><b>Finish the paper and mark it?</b> ${blank ? `You have ${blank} unanswered question(s).` : 'All questions have an answer.'} You cannot change answers after marking.<div class="row" style="margin-top:10px"><button class="btn" id="yes">Yes, mark my paper</button><button class="btn ghost" id="no">Keep writing</button></div></div>`;
    $('#yes').addEventListener('click', () => finish(x)); $('#no').addEventListener('click', () => $('#confirm').innerHTML = ''); });
  clearInterval(tick); const t = () => { const s = Math.max(0, Math.round((EXAM.end - Date.now()) / 1000)), el = $('#timer'); if (!el) return clearInterval(tick);
    el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left` : 'Time is up'; el.classList.toggle('low', s < 300); };
  t(); tick = setInterval(t, 1000);
}
function finish(x) { clearInterval(tick); EXAM.finished = true; store.set('exam-' + x.id, EXAM); examResults(x); window.scrollTo(0, 0); }
function examResults(x) {
  const qs = x.qs.map(n => Q.find(q => q.n === n)), max = qs.reduce((a, q) => a + q.marks, 0);
  const comp = qs.reduce((a, q) => a + mark(q, EXAM.ans[q.n] || '').mark, 0), selfTot = () => qs.reduce((a, q) => a + (EXAM.self[q.n] ?? 0), 0), selfN = () => qs.filter(q => EXAM.self[q.n] != null).length;
  $('#app').innerHTML = `<div class="eyebrow">${esc(secName(SECTIONS.find(s => s.u.id === x.unit && s.set === x.set)))}  |  ${esc(x.name)}  |  Results</div><h1>Your paper is marked</h1>
  <div class="cmp" style="max-width:640px"><div><span class="eyebrow">Computer mark</span><b>${comp}/${max}</b><span class="muted">${Math.round(100 * comp / max)}%</span></div><div><span class="eyebrow">Your self-mark</span><b id="selftot">${selfTot()}/${max}</b><span class="muted" id="selfn">${selfN()} of ${qs.length} questions self-marked</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="again">Start this paper again</button><a class="btn ghost" href="#${x.unit}-${x.set}-papers">Choose another paper</a></div>
  ${qs.map((q, i) => { const r = mark(q, EXAM.ans[q.n] || ''), id = 'r' + q.n;
    return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Question ${i + 1}: ${esc(q.biz)}  <span class="muted">(${q.marks} marks)</span></span><span class="mk">${r.mark}/${r.max}  ·  ${esc(r.label)}</span></summary>
    <p class="qstem">${esc(q.stem)}</p><h3>Your answer</h3><pre class="ms" style="font-family:var(--body)">${esc(EXAM.ans[q.n] || '(no answer)')}</pre>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const q = h.startsWith('q-') ? Q.find(x => x.n === +h.slice(2)) : null;
  const ex = h.startsWith('paper-') ? D.exams.find(e => e.id === h.slice(6)) : null;
  const sec = SECTIONS.find(s => h === s.id || h === s.id + '-papers' || h === s.id + '-topics');
  const v = q ? secOf(q).id : ex ? ex.unit + '-' + ex.set : sec ? sec.id : 'home';
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (q) questionView(q.n);
  else if (ex) examStart(ex.id);
  else if (sec && h.endsWith('-papers')) examPick(sec);
  else if (sec && h.endsWith('-topics')) topicsView(sec);
  else if (sec) section(sec);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
