<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 12 Business Exam Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: exam hall. A paper-white answer sheet on a cool desk, extracts as a source booklet beside the question. */
:root{
  --desk:#EEF2F7; --paper:#FFFFFF; --ink:#14213D; --muted:#56637A; --rule:#D5DCE6; --line:#C9D6E8;
  --accent:#1F4FA8; --accent-ink:#FFFFFF; --soft:#E7EEFA;
  --good:#11734B; --good-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FDF2DE; --bad:#B42318; --bad-bg:#FCE9E7;
  --k:#2563EB; --a:#059669; --an:#D97706; --ev:#7C3AED;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E1522; --paper:#162033; --ink:#E7ECF5; --muted:#A3AFC4; --rule:#2B3850; --line:#2C3B57;
  --accent:#7FA6F0; --accent-ink:#0E1522; --soft:#1D2B45;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --k:#7AA2FF; --a:#4FD1A5; --an:#F5B248; --ev:#B89BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E1522; --paper:#162033; --ink:#E7ECF5; --muted:#A3AFC4; --rule:#2B3850; --line:#2C3B57;
  --accent:#7FA6F0; --accent-ink:#0E1522; --soft:#1D2B45;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --k:#7AA2FF; --a:#4FD1A5; --an:#F5B248; --ev:#B89BFF; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--desk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0A101B}}
:root[data-theme="dark"] header.top{background:#0A101B}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;letter-spacing:.2px}
.brand small{display:block;font:500 .72rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:#9FB3D9}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{color:#D9E2F2;text-decoration:none;font-weight:600;font-size:.92rem;padding:7px 12px;border-radius:6px}
nav.main a[aria-current="page"],nav.main a:hover{background:rgba(255,255,255,.12);color:#fff}
main{padding-block:28px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.9rem,4vw,2.8rem)} h2{font-size:1.5rem} h3{font-size:1.15rem}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{font:600 .95rem var(--body);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--an);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:10px}
/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;margin-bottom:28px}
.hero p{max-width:60ch;font-size:1.05rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-block:22px 34px}
.how .sheet{padding:18px}
.how b{font-family:var(--display);font-size:1.1rem;display:block;margin-bottom:4px}
.stat{padding:18px 20px}
.stat .big{font:600 2.2rem var(--mono);font-variant-numeric:tabular-nums}
.marks-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 .78rem var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
/* question list */
.topic{margin-top:26px}
.topic h2{display:flex;align-items:center;gap:10px}
.topic h2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.qcard{display:flex;flex-direction:column;gap:6px;padding:16px;text-decoration:none;color:var(--ink);border-left:5px solid var(--tc)}
.qcard:hover{border-color:var(--tc);box-shadow:0 2px 0 var(--rule)}
.qcard .stem{font-size:.95rem;min-width:0}
.qcard .meta{display:flex;justify-content:space-between;gap:8px;font:500 .78rem var(--mono);color:var(--muted)}
.state{font:600 .72rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
/* question view */
.qview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.booklet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding:20px 22px}
.booklet h3{font-size:1rem;margin-top:16px}
.booklet h3:first-of-type{margin-top:6px}
.booklet p{margin:.45em 0;font-size:.95rem;max-width:68ch}
.booklet .tbl p{margin:0;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.read{font:600 .8rem var(--mono);color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;display:inline-block}
.qpaper{padding:22px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qnum{font:700 1.4rem var(--display)}
.qstem{font-size:1.08rem;margin:10px 0 4px;font-weight:500}
.mk{font:600 1rem var(--mono);white-space:nowrap}
.answer{width:100%;min-height:260px;resize:vertical;border:1px solid var(--rule);border-radius:6px;padding:4px 12px 4px 46px;font:1rem/32px var(--body);color:var(--ink);
  background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--bad) 34px,var(--bad) 35px,transparent 35px),repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);background-attachment:local}
.counter{font:500 .8rem var(--mono);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tabs button{font:600 .9rem var(--body);padding:8px 14px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.panel{margin-top:14px}
/* results */
.score{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:10px;background:var(--soft);flex-wrap:wrap}
.score .big{font:600 2.1rem var(--mono);font-variant-numeric:tabular-nums}
.score .lvl{font:600 .85rem var(--mono);padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.crit{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.crit li .ic{font:700 1rem var(--mono);text-align:center}
.crit li.ok{border-color:var(--good);background:var(--good-bg)} .crit li.ok .ic{color:var(--good)}
.crit li.no{border-color:var(--bad);background:var(--bad-bg)} .crit li.no .ic{color:var(--bad)}
.crit li.part{border-color:var(--warn);background:var(--warn-bg)} .crit li.part .ic{color:var(--warn)}
.crit b{display:block}
.tag{font:700 .7rem var(--mono);padding:1px 6px;border-radius:4px;color:#fff;margin-left:3px;vertical-align:1px}
.tK{background:var(--k)}.tA{background:var(--a)}.tAn{background:var(--an)}.tEv{background:var(--ev)}
:root[data-theme="dark"] .tag{color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#0E1522}}
.pts{display:grid;gap:6px;margin:8px 0;padding:0;list-style:none}
.pts li{padding:8px 10px;border-radius:6px;border:1px solid var(--rule);font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.pts li.hit{border-color:var(--good);background:var(--good-bg)}
.pts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%}
.pts input{margin-top:4px;flex:none;width:18px;height:18px}
.side{font:600 .68rem var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);flex:none;width:76px;padding-top:3px}
pre.ms{white-space:pre-wrap;font:.85rem/1.5 var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
.lvls{display:grid;gap:8px}
.lvls label{display:grid;grid-template-columns:22px 92px 1fr;gap:10px;padding:10px;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-size:.9rem;background:var(--paper)}
.lvls label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.lvls b{font-family:var(--mono)}
.build{width:100%;border-collapse:collapse;font-size:.92rem}
.build td{border:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.build td:first-child{font-weight:700;width:120px} .build td:last-child{width:90px;font:600 .8rem var(--mono);text-align:center}
.tblwrap{overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.cmp div{padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.cmp b{font:600 1.6rem var(--mono);display:block}
.note{font-size:.85rem;color:var(--muted);margin-top:10px;max-width:70ch}
/* exam */
.paper-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.paper-pick .sheet{padding:22px;display:flex;flex-direction:column;gap:10px}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.timer{font:600 1.3rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{font:600 .82rem var(--mono);min-width:44px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.qnav button.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.qnav button.done{border-style:solid;border-color:var(--good)}
.confirm{margin-top:12px;padding:14px;border-radius:8px;border:1.5px solid var(--warn);background:var(--warn-bg)}
.res-q{padding:18px;margin-top:14px}
.res-q summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none;flex-wrap:wrap}
.res-q summary::-webkit-details-marker{display:none}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:600px){.brand small{display:none}header.top{position:static}nav.main{margin-left:0}nav.main a{padding:6px 9px}.exambar{top:env(safe-area-inset-top,0px)}}
@media (max-width:860px){.qview,.hero{grid-template-columns:1fr}.booklet{position:static;max-height:none}.how,.paper-pick{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<script>
const D = {"meta": {"year": "Year 12", "unit": "Unit 1: Marketing and People", "code": "WBS11", "mins": 1.2, "spec": "International AS"}, "topics": ["The market", "Market research", "Market positioning"], "cols": ["1E3A8A", "0F766E", "7C3AED"], "exams": [{"id": "full", "name": "Full paper", "note": "All nine booklet questions in order of marks, as in the booklet.", "qs": [1, 2, 3, 4, 5, 6, 7, 8, 9]}, {"id": "short", "name": "Short paper", "note": "One question of each mark type: 2, 4, 6, 8 and 10 marks.", "qs": [1, 3, 5, 7, 9]}], "qs": [{"n": 1, "topic": 1, "paper": "October 2023", "qn": "1(a)", "biz": "Nando's", "marks": 2, "read": "A", "stem": "Define the term 'risk'. (Extract A, line 4)", "ext": [{"id": "A", "t": "The History of Nando’s", "p": ["Nando’s is a fast-food restaurant chain started by Fernando Duarte and Robert Brozin in South Africa. It sells a range of spicy chicken and vegetarian dishes.", "Entrepreneurs Fernando and Robert took a risk and opened the first Nando’s restaurant in 1987 after enjoying spicy chicken in a Portuguese restaurant. By the end of 1989 they had opened three more restaurants. Today, there are Nando’s restaurants in most major cities around the world. All its restaurants have a trendy, fun and unique design by local designers and artists."]}], "ms": "Question Define the term ‘risk’. Mark\nAnswer\n1(a) Knowledge 2\nUp to 2 marks for defining the term ‘risk’ e.g.\n• An action or decision/something that can planned for or\nconsidered (1) which may result in a loss/where outcomes\nare unknown (1)\n(2)", "sup": {"grid": "Point marked: Knowledge 2.", "top": "Two linked parts of the definition.", "plan": ["What risk is: an action or decision that can be planned for.", "What it may lead to: a loss, or an unknown outcome."], "parts": [["Knowledge 1", "Risk is an action or decision that can be planned for or considered [K]", "1 mark"], ["Knowledge 2", "which may result in a loss, or where the outcome is unknown. [K]", "2 marks"]]}, "type": "def", "parts": [["action", "decision", "planned", "plan", "calculat", "consider", "chance", "probability", "possibility", "likelihood"], ["loss", "unknown", "fail", "negative", "uncertain", "outcome", "lose", "harm"]], "kw": ["risk"]}, {"n": 2, "topic": 3, "paper": "October 2023", "qn": "1(b)", "biz": "Nando's", "marks": 4, "read": "A to C", "stem": "Explain one possible benefit to Fernando and Robert of using market mapping when starting their business.", "ext": [{"id": "A", "t": "The History of Nando’s", "p": ["Nando’s is a fast-food restaurant chain started by Fernando Duarte and Robert Brozin in South Africa. It sells a range of spicy chicken and vegetarian dishes.", "Entrepreneurs Fernando and Robert took a risk and opened the first Nando’s restaurant in 1987 after enjoying spicy chicken in a Portuguese restaurant. By the end of 1989 they had opened three more restaurants. Today, there are Nando’s restaurants in most major cities around the world. All its restaurants have a trendy, fun and unique design by local designers and artists."]}, {"id": "B", "t": "Nando’s Indian menu (selected items)", "p": ["Dish Price (Rupees)", "Chicken burger 199", "Chicken naan 399", "Salad 299", "Vegetable burger 379", "Chicken and fries 599", "Peri vegetable platter 1999"]}, {"id": "C", "t": "Employees at Nando’s", "p": ["Employees who work at Nando’s are called Nandocas. Nando’s employees are seen as family members and it aims to treat them as an asset to the business. It states, ‘Nando’s is not just about the chicken, it’s about the people that make the chicken.’ In 2022 Nando’s was named as one of the UK’s best large companies to work for.", "In South Africa, Nando’s has a programme called Harambee that recruits young unemployed people and gives them skills to prepare them for the workplace. Nando’s uses a training programme called Buddy. A buddy is an employee who has completed all job roles in the business. Buddies supervise new employees to pass on their knowledge and skills. 10"]}], "ms": "Question Explain one possible benefit to Fernando and Robert of using Mark\nmarket mapping when starting their business.\nAnswer\n1(b) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a benefit of market mapping e.g.\n• To spot a gap in the market by analysing the competition (1)\nApplication\nUp to 2 marks for answers contextualising the benefit, e.g.\n• The market mapping may have shown how many\nrestaurants served spicy/vegetarian food (1)\n• The research may have shown a lack of restaurants that\nappealed to a younger audience (1)\nAnalysis\n1 mark for reasons/causes/consequences of using market\nmapping e.g.\n• Analysing the competition will have allowed Nando’s to\nidentify any potential gaps in the market to differentiate its\nbusiness and/or create a unique selling point (1)\n(4)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "One benefit, two points of Nando's context, one developed consequence.", "plan": ["Identify one benefit (K1).", "Two points of Nando's context (A2).", "Develop the benefit (An1)."], "parts": [["Knowledge", "Market mapping helps a business spot a gap in the market by analysing the competition. [K]", "1 mark"], ["Application", "The map may have shown how many restaurants served spicy or vegetarian food [A], and a lack of restaurants that appealed to a younger audience. [A]", "3 marks"], ["Analysis", "Analysing the competition lets Nando's identify gaps in the market, so it can differentiate its business and create a unique selling point. [An]", "4 marks"]]}, "type": "pt", "K": [["gap", "competitor", "competition", "position", "identify", "compare", "map"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["market map", "gap"]}, {"n": 3, "topic": 1, "paper": "October 2024", "qn": "2(b)", "biz": "M&S", "marks": 4, "read": "E", "stem": "In 2021, M&S's grocery revenue was £5.61bn. In 2022, the total revenue for the UK grocery market was £170bn and M&S had a market share of 3.6%. Using this information and the data in Extract E calculate, to two decimal places, the change in grocery revenue for M&S between 2021 and 2022. You are advised to show your working.", "ext": [{"id": "D", "t": "About Marks and Spencer (M&S)", "p": ["M&S is a British retailer. It has a large product portfolio and sells high quality food, clothing and homeware. Globally, it has 1,487 stores and 98 websites.", "The M&S food brand is recognised for its quality, taste and product innovation. In 2022, sales of food increased by 10% and over 1,300 new food products and meals were created and sold. The advertising campaign for its food uses the slogan ‘it’s not just any food, it’s M&S food’.", "M&S is currently a top-performing UK grocery business in terms of percentage growth in market share. The UK grocery market is extremely competitive with Tesco having the largest market share. 10"]}, {"id": "E", "t": "Selected data for M&S in 2021 and 2022", "p": ["Dec 2021 Dec 2022", "M&S market share of total UK", "3.4% 3.6%", "grocery sales (by revenue)", "Profit £403m £522m"]}], "ms": "Question Define the term ‘product portfolio.’ Mark\nAnswer\n2(a) Knowledge\nUp to 2 marks for defining the term ‘product portfolio’ e.g.\n• The range of products (1) that are sold/produced/offered by a\nbusiness\n(1).\n(2)\nQuestion In 2021, M&S’s grocery revenue was £5.61bn. Mark\nIn 2022, the total revenue for the UK grocery market was\n£170bn and M&S had a market share of 3.6%.\nUsing this information and the data in Extract E calculate, to\ntwo decimal places, the change in grocery revenue for M&S\nbetween 2021 and 2022. You are advised to show your\nworking.\nAnswer\n2(b) Knowledge 1, Application 2, Analysis 1\nQuantitative skills assessed:\nQS2: calculate, use and understand percentages and percentage\nchanges\nKnowledge\n1 mark for identifying a suitable formula e.g.\n• Revenue x market share (2022) - Revenue (2021) (1)\nApplication\nUp to 2 marks for selecting the correct data:\n• £170bn x 3.6% (1) - £5.61bn\n(1) OR\n• £6.12bn (1) - £5.61bn (1)\nAnalysis\n1 mark for calculating the change in revenue\n· = £0.51bn (1)\nNB: If no working is shown, award marks as\nfollows:\n• If the answer given is £0.51bn award 4\nmarks.\n• If the answer given is 0.51bn award 3 marks.\n(4)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. Answer £0.51bn with no working = 4 marks; 0.51bn (no £) = 3 marks.", "top": "Formula, correct data, correct answer with units.", "plan": ["Write the formula (K1).", "Select the 2022 and 2021 figures (A2).", "Calculate the change (An1)."], "parts": [["Knowledge", "Formula: market revenue x market share (2022) minus revenue (2021). [K]", "1 mark"], ["Application", "£170bn x 3.6% = £6.12bn [A] minus £5.61bn [A]", "3 marks"], ["Analysis", "Change in grocery revenue = £0.51bn [An]", "4 marks"]]}, "type": "calc", "ans": 0.51, "unit": "bn", "unitWord": "£", "fk": ["share", "x", "×", "*", "-", "minus", "revenue", "change", "difference", "subtract"], "data": ["170", "3.6", "5.61", "6.12"], "kw": []}, {"n": 4, "topic": 1, "paper": "May 2024", "qn": "1(b)", "biz": "The Coffee House", "marks": 4, "read": "B", "stem": "In 2022 there were 18 000 coffee shops in Vietnam. Using this data and Extract B, calculate, to two decimal places, the total market share held by the leading three coffee shop brands in Vietnam. You are advised to show your working.", "ext": [{"id": "A", "t": "About The Coffee House", "p": ["The Coffee House is a chain of coffee shops in Vietnam. The Coffee House opened its first shop in 2014 and within four years it had 100 shops across the country. Its shops are located on busy high streets in Vietnam’s large cities. Coffee shops have grown in popularity in Vietnam and have attracted successful international businesses such as Starbucks.", "The Coffee House is an innovative brand that has been built by offering an attractive space, excellent customer service and product quality at affordable prices. The mission of the business is to ‘deliver happiness’. It aims to provide excellent customer satisfaction as well as providing the employees with an enjoyable place to work.", "The Coffee House is recognised for its innovation by:", "• creating a unique design for each shop to provide a welcoming atmosphere that feels like home", "• regularly updating menus to adapt to changing tastes and trends", "• providing dedicated and comfortable spaces where people can work", "• being one of the first businesses in Vietnam to launch a mobile app to allow customers to order their drinks online", "• investing in its own farm in Vietnam to provide coffee beans for its shops."]}, {"id": "B", "t": "Leading coffee shop brands in Vietnam in 2022 (by number of shops)", "p": ["Highland: 573", "The Coffee House: 154", "Phuc Long: 118", "Trung Nguyen Legend: 95", "Starbucks: 82", "Passio Coffee: 80", "Cong: 54", "Katinat: 41", "PhinDeli: 16", "Cafe Amazon: 15"]}], "ms": "Question Define the term ‘customer satisfaction.’ Mark\nAnswer\n1(a) Knowledge 2\nUp to 2 marks for defining the term ‘customer satisfaction’ e.g.\n• A measure of how a business/product/service (1) meet the\nneeds /expectations of customer (1)\n(2)\nQuestion In 2022 there were 18 000 coffee shops in Vietnam. Mark\nUsing this data and Extract B, calculate, to two decimal places,\nthe total market share held by the leading three coffee shop\nbrands in Vietnam.\nAnswer\n1(b) Knowledge 1, Application 2, Analysis 1\nQuantitative skills assessed:\nQS1 Calculate, use and understand ratios, averages and fractions\nKnowledge\n1 mark for identifying any suitable formula for calculating market\nshare:\n• Sum of the leading shops / total number of shops x 100 (1)\nApplication\nUp to 2 marks for: selecting the correct data\n• 573 + 154 + 118 = 845 (1) / 18 000 x 100 (1)\nAnalysis\n1 mark for calculating the market share\n• 4.69% (1)\nNB: If no working is shown award marks as below:\nIf answer given is 4.69% award 4 marks\nIf answer given is 4.69 award 3 marks\n(4)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. Answer 4.69% with no working = 4 marks; 4.69 (no %) = 3 marks.", "top": "Formula, correct data, correct answer with units.", "plan": ["Write the market share formula (K1).", "Add the three leading brands and divide by 18,000 (A2).", "Calculate to two decimal places (An1)."], "parts": [["Knowledge", "Market share = sum of the leading shops ÷ total number of shops x 100 [K]", "1 mark"], ["Application", "573 + 154 + 118 = 845 [A]; 845 ÷ 18,000 x 100 [A]", "3 marks"], ["Analysis", "Market share = 4.69% [An]", "4 marks"]]}, "type": "calc", "ans": 4.69, "unit": "%", "unitWord": "%", "fk": ["share", "÷", "/", "x 100", "× 100", "*100", "x100", "total", "divide"], "data": ["573", "154", "118", "845", "18000", "18 000", "18,000"], "kw": []}, {"n": 5, "topic": 2, "paper": "October 2024", "qn": "2(c)", "biz": "M&S", "marks": 6, "read": "D and F", "stem": "Analyse two advantages to M&S of using face-to-face interviews to collect market research.", "ext": [{"id": "D", "t": "About Marks and Spencer (M&S)", "p": ["M&S is a British retailer. It has a large product portfolio and sells high quality food, clothing and homeware. Globally, it has 1,487 stores and 98 websites.", "The M&S food brand is recognised for its quality, taste and product innovation. In 2022, sales of food increased by 10% and over 1,300 new food products and meals were created and sold. The advertising campaign for its food uses the slogan ‘it’s not just any food, it’s M&S food’.", "M&S is currently a top-performing UK grocery business in terms of percentage growth in market share. The UK grocery market is extremely competitive with Tesco having the largest market share. 10"]}, {"id": "F", "t": "Market research at M&S", "p": ["In 2022, M&S introduced its ‘Voice of the customer’ programme to measure customer satisfaction. As part of the programme, it conducted in-depth, face-to-face interviews with over 400 customers. It gathered research data in a range of areas including website experience, delivery, service, clothing and food."]}], "ms": "Question Analyse two advantages to M&S of using face to face Mark\ninterviews to collect market research.\nAnswer\n2(c) Knowledge 2, Application 2, Analysis\nUp to 2 marks for defining face-to-face interviews, e.g.:\n• A personal meeting (1) to gather opinions from consumers\n(1)\nFor giving two advantages specific to face-to-face interviews, e.g.\n• Body language and facial expressions are more clearly\nidentified\n(1) Visual aids can be used (1)\nApplication\nUp to 2 marks for answers contextualised to M&S e.g.:\n• Non-verbal communication will help the interviewer\ncollect feedback on delivery/in store services provide\nby M&S (1)\n• M&S can show items of clothing and food to customers (1)\nAnalysis\nUp to 2 marks for reasons / causes / consequences for M&S e.g.\n• This may help gather more accurate and honest results to\nallow M&S to make adjustments to its products and services\nwhere needed\n• The responses will help M&S develop new ranges of products\nto better meet its customers’ needs and wants (1)\n(6)", "sup": {"grid": "Point marked: Knowledge 2, Application 2, Analysis 2. No evaluation.", "top": "Knowledge of face-to-face interviews, two advantages in M&S context, each developed.", "plan": ["Define or give advantages of face-to-face interviews (K2).", "Link each advantage to M&S (A2).", "Say what each leads to for M&S (An2)."], "parts": [["Knowledge", "A face-to-face interview is a personal meeting [K] to gather opinions from consumers. [K] (Advantages such as body language being clearly seen, or visual aids being used, also gain K marks.)", "2 marks"], ["Advantage 1", "Non-verbal communication helps the interviewer collect feedback on M&S's delivery and in-store services. [A] This may give more accurate and honest results, so M&S can adjust its products and services where needed. [An]", "4 marks"], ["Advantage 2", "M&S can show items of clothing and food to customers. [A] Their responses help M&S develop new product ranges that better meet customers' needs and wants. [An]", "6 marks"]]}, "type": "pt", "K": [["personal", "meeting", "face to face", "face-to-face", "in person"], ["opinion", "views", "gather", "feedback"], ["body language", "facial", "non-verbal", "non verbal", "expression"], ["visual aid", "show", "sample", "display", "demonstrat"]], "Kmax": 2, "Amax": 2, "Anmax": 2, "kw": ["interview"]}, {"n": 6, "topic": 1, "paper": "January 2023", "qn": "1(d)", "biz": "Folding smartphones", "marks": 8, "read": "C", "stem": "The folding smartphone is a niche product. Discuss the likely benefits to a business of selling a niche product, such as the folding smartphone.", "ext": [{"id": "C", "t": "The folding smartphone is likely to remain a niche product", "p": ["In 2021, 1.3 billion smartphones were sold globally. Seven million of these were folding models. This represents 0.5% of the smartphone market. It is predicted that by 2025, this share could rise to 1.8%. One of the most popular folding phones is the Samsung Galaxy Z Flip3, priced at over $1 000. 5"]}], "ms": "Question Discuss the likely benefits to a business of selling a niche product, such as the\nfolding smartphone.\nIndicative content\n1(d) Indicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A niche market is a subset of a larger market where consumers have\nspecific needs and wants\n• A business selling folding phones is likely to have less competition.\nSamsung sells the popular Galaxy Z Flip3 phone and may have a\nlarger market share of this niche segment\n• There is the possibility of charging premium prices in a niche market.\nSamsung’s selling price for the ZFlip3 of $1 000 may increase the\nprofitability of the business\n• The folding phone has a USP which helps differentiate it from other\nproducts. This may enhance Samsung’s reputation and recognition\n• However, the sales volume of folding phones is a small percentage of\nthe smartphone market. This may lead to higher unit costs and lower\nprofit margins on the folding phones\n• Niche businesses can be risky as they are more vulnerable to market\nchange. Changes in fashions and trends may result in declining sales\n• Premium prices charged for niche products are impacted by factors\nsuch as changes to the economy. If there is a downturn in the\neconomy customers may choose cheaper substitutes. This may lead\nto a decrease in demand for businesses selling folding phones\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s) but\nmay be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative information, and shows an awareness of competing\narguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 3 (6 to 8): accurate and thorough knowledge used in context throughout; logical chains of reasoning; a balanced assessment showing awareness of competing arguments. No conclusion is required.", "plan": ["Define a niche market.", "Benefits: less competition, premium price ($1,000), USP.", "However: small volume, risk of changing trends, economic downturn."], "parts": [["Knowledge", "A niche market is a subset of a larger market where consumers have specific needs and wants. [K]", "Level 1"], ["Benefits", "A business selling folding phones is likely to face less competition, so Samsung's Galaxy Z Flip3 may have a larger share of this segment. [A] [An] It can charge premium prices, such as $1,000 for the Z Flip3, increasing profitability [A] [An], and the USP differentiates it, enhancing Samsung's reputation. [An]", "Level 2/3"], ["However (balance)", "Folding phones are a small percentage of the smartphone market, which may mean higher unit costs and lower margins. [Ev] Niche markets are vulnerable to changes in fashions and trends, and in a downturn customers may choose cheaper substitutes, reducing demand. [Ev]", "Level 3"]]}, "type": "lev", "kw": ["niche", "segment", "specific needs", "smaller", "subset"], "pts": [{"t": "A niche market is a subset of a larger market where consumers have specific needs and wants", "s": "know"}, {"t": "A business selling folding phones is likely to have less competition. Samsung sells the popular Galaxy Z Flip3 phone and may have a larger market share of this niche segment", "s": "for"}, {"t": "There is the possibility of charging premium prices in a niche market. Samsung’s selling price for the ZFlip3 of $1 000 may increase the profitability of the business", "s": "for"}, {"t": "The folding phone has a USP which helps differentiate it from other products. This may enhance Samsung’s reputation and recognition", "s": "for"}, {"t": "However, the sales volume of folding phones is a small percentage of the smartphone market. This may lead to higher unit costs and lower profit margins on the folding phones", "s": "against"}, {"t": "Niche businesses can be risky as they are more vulnerable to market change. Changes in fashions and trends may result in declining sales", "s": "against"}, {"t": "Premium prices charged for niche products are impacted by factors such as changes to the economy. If there is a downturn in the economy customers may choose cheaper substitutes. This may lead to a decrease in demand for businesses selling folding phones", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]]}, {"n": 7, "topic": 3, "paper": "October 2024", "qn": "2(d)", "biz": "M&S", "marks": 8, "read": "D and E", "stem": "Discuss the importance to M&S of product differentiation for the success of its food sales.", "ext": [{"id": "D", "t": "About Marks and Spencer (M&S)", "p": ["M&S is a British retailer. It has a large product portfolio and sells high quality food, clothing and homeware. Globally, it has 1,487 stores and 98 websites.", "The M&S food brand is recognised for its quality, taste and product innovation. In 2022, sales of food increased by 10% and over 1,300 new food products and meals were created and sold. The advertising campaign for its food uses the slogan ‘it’s not just any food, it’s M&S food’.", "M&S is currently a top-performing UK grocery business in terms of percentage growth in market share. The UK grocery market is extremely competitive with Tesco having the largest market share. 10"]}, {"id": "E", "t": "Selected data for M&S in 2021 and 2022", "p": ["Dec 2021 Dec 2022", "M&S market share of total UK", "3.4% 3.6%", "grocery sales (by revenue)", "Profit £403m £522m"]}], "ms": "Discuss the importance to M&S of product differentiation for the success\nQuestion of its food sales. (8)\nIndicative content\n2(d) Indicative content guidance\nAnswers must be credited by using the level descriptors (below) in line\nwith the general marking guidance. The indicative content below\nexemplifies some of the points that candidates may make but this does\nnot imply that any of these must be included. Other relevant points must\nalso be credited.\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Product differentiation is the process of distinguishing a\nproduct or service from others, to make it more\nattractive to a target market\n• M&S has created a range of food of high quality\nand innovation to give it a USP\n• To maintain its brand image, it is important that M&S\nmakes its food stand out in the grocery market\n• The UK grocery market is competitive and has dominant\nbusinesses such as Tesco. M&S must find ways to\ncompete with its competitors to retain its existing\ncustomers\n• M&S uses its advertising slogan to help it stand out\nfrom other grocery competitors. This may give the\nperception of superior food quality and may attract new\ncustomers\n• However, there are many other factors that will\ncontribute to the success of M&S food sales. Customer\nservice may also be as important to its success\n• It is important that the 1,300 newly created food\nproducts and meals meet the expectation of customers.\nIf they fail to sufficiently differentiate from the\ncompetition they will not encourage repeat purchase\nand brand loyalty\n• Differentiating its products by using high quality\ningredients is likely to increase the production costs and\nincrease prices\n• This may lead to a decrease in demand, particularly\nwhen consumer disposable income is low\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall\nbased. Weak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or\neffect(s) but may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced, and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative\nand/or qualitative information and shows an awareness of\ncompeting arguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 3 (6 to 8): accurate and thorough knowledge used in context throughout; logical chains of reasoning; a balanced assessment showing awareness of competing arguments. No conclusion is required.", "plan": ["Define product differentiation.", "Importance: USP, brand image, competition from Tesco, slogan.", "However: customer service matters too; 1,300 new products must meet expectations; higher costs and prices."], "parts": [["Knowledge", "Product differentiation is distinguishing a product from others to make it more attractive to a target market. [K]", "Level 1"], ["Importance", "M&S has created high quality, innovative food to give it a USP [A], helping its food stand out and protect its brand image. [An] The UK grocery market is competitive with dominant businesses such as Tesco [A], so differentiation helps M&S retain customers, and its advertising slogan may suggest superior quality and attract new customers. [An]", "Level 2/3"], ["However (balance)", "Other factors such as customer service may be as important. [Ev] The 1,300 new food products must meet expectations or they will not bring repeat purchase. [A] High quality ingredients raise costs and prices, which may reduce demand when disposable income is low. [Ev]", "Level 3"]]}, "type": "lev", "kw": ["differentiat", "usp", "unique selling", "stand out", "distinguish"], "pts": [{"t": "Product differentiation is the process of distinguishing a product or service from others, to make it more attractive to a target market", "s": "know"}, {"t": "M&S has created a range of food of high quality and innovation to give it a USP", "s": "for"}, {"t": "To maintain its brand image, it is important that M&S makes its food stand out in the grocery market", "s": "for"}, {"t": "The UK grocery market is competitive and has dominant businesses such as Tesco. M&S must find ways to compete with its competitors to retain its existing customers", "s": "for"}, {"t": "M&S uses its advertising slogan to help it stand out from other grocery competitors. This may give the perception of superior food quality and may attract new customers", "s": "for"}, {"t": "However, there are many other factors that will contribute to the success of M&S food sales. Customer service may also be as important to its success", "s": "against"}, {"t": "It is important that the 1,300 newly created food products and meals meet the expectation of customers. If they fail to sufficiently differentiate from the competition they will not encourage repeat purchase and brand loyalty", "s": "against"}, {"t": "Differentiating its products by using high quality ingredients is likely to increase the production costs and increase prices", "s": "against"}, {"t": "This may lead to a decrease in demand, particularly when consumer disposable income is low", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced, and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors."]]}, {"n": 8, "topic": 2, "paper": "October 2023", "qn": "1(e)", "biz": "Nando's", "marks": 10, "read": "D", "stem": "Nando's collected market research data in China using random sampling. Assess the likely disadvantages to Nando's of using random sampling.", "ext": [{"id": "D", "t": "Market research at Nando’s", "p": ["Before opening stores in China, Nando’s conducted primary market research to understand Chinese food preferences and dining habits. Two hundred surveys were carried out with Chinese chefs, restaurant owners and managers. A random sampling survey method was used to conduct the primary market research."]}], "ms": "Question Assess the likely disadvantages to Nando’s of using random sampling.\nIndicative content\n1(e) Indicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A random sample is one of the methods researchers use\nto choose a sample from a larger population\n• This method means that there is an equal chance that\nany of the subjects in a population will be chosen\n• Random sampling relies on having a full list of the entire\npopulation of chefs and experts in the food industry. This\ndata may be difficult to collect\n• It may take a considerable amount of time to gather\ninformation from a wide range of people over a large\ngeographical area such as China. This may prove costly\nto Nando’s\n• It can be impractical/or not possible to use a completely\nrandom technique, e.g. the target group may be too large\nto assign numbers to\n• Random sampling is designed to be a representative of a\ncommunity or demographic, but there is no guarantee\nthat the data collected will be representative of restaurant\npersonnel in China\n• However, the use of random sampling is likely to remove\nbias for Nando’s\n• Modern technology makes it much easier to create a\nrandom sample\n• If the chefs and food experts are chosen at random,\neach individual in the food industry has the same\nprobability of being selected\n• This should create fair/balanced results which more\naccurately represent the larger group as a whole\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–7 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 8–10 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompe   if (r.cov) { const got = r.cov.filter(p => p.hit), miss = r.cov.filter(p => !p.hit && p.s !== 'know').slice(0, 4);
    h += `<h3 style="margin-top:18px">Mark scheme points you covered (${got.length})</h3>` + (got.length ? `<ul class="pts">${got.map(p => `<li class="hit"><span class="side">${sideName(p.s)}</span><span>${esc(p.t)}</span></li>`).join('')}</ul>` : '<p class="muted">None matched closely yet. Compare your answer with the points below.</p>');
    if (miss.length) h += `<h3 style="margin-top:14px">Points you could add</h3><ul class="pts">${miss.map(p => `<li><span class="side">${sideName(p.s)}</span><span>${esc(p.t)}</span></li>`).join('')}</ul>`; }
  h += `<p class="note">The computer looks for knowledge terms, evidence from the extracts, chains of reasoning, a counter-argument and a judgement. It cannot judge quality like an examiner, so use the self-mark tab as well and ask your teacher if the two marks differ.</p>`;
  return h;
}
const sideName = s => ({ know: 'Knowledge', for: 'Main point', against: 'Other side', judge: 'Judgement' }[s]);
function selfHTML(q, id) {
  let h = '';
  if (q.type === 'lev') {
    h += `<h3>1. Tick the mark scheme points you made</h3><ul class="pts">${q.pts.map((p, i) => `<li><label><input type="checkbox" id="${id}-p${i}"><span class="side">${sideName(p.s)}</span><span>${esc(p.t)}</span></label></li>`).join('')}</ul>`;
    h += `<h3 style="margin-top:16px">2. Choose the level that best fits your answer</h3><div class="lvls">${q.lv.map(l => `<label><input type="radio" name="${id}-lv" value="${l[0]}"><b>L${l[0]} ${l[1]}–${l[2]}</b><span>${esc(l[3])}</span></label>`).join('')}</div>`;
    h += `<div class="row" style="margin-top:12px"><label for="${id}-mk"><b>3. Your mark</b></label><input type="number" id="${id}-mk" min="0" max="${q.marks}" style="width:90px;font:600 1rem var(--mono);padding:6px" placeholder="0–${q.marks}"><span class="muted" id="${id}-hint">Pick a level first. Top of the band if you met every part of it.</span></div>`;
  } else {
    const items = q.type === 'def' ? [['K', 'Part 1: what it is'], ['K', 'Part 2: what it leads to']] : q.type === 'calc' ? [['K', 'Formula shown'], ['A', 'First correct figure selected'], ['A', 'Second correct figure selected'], ['An', 'Correct final answer with units']] :
      [...Array(q.Kmax)].map((_, i) => ['K', `Knowledge point ${i + 1}`]).concat([...Array(q.Amax)].map((_, i) => ['A', `Context about ${q.biz} ${i + 1}`]), [...Array(q.Anmax)].map((_, i) => ['An', `Developed consequence ${i + 1}`]));
    h += `<h3>Read the Pearson mark scheme, then tick each mark you earned</h3><pre class="ms">${esc(q.ms)}</pre><ul class="pts">${items.map((it, i) => `<li><label><input type="checkbox" class="selfpt" id="${id}-c${i}"><span>${tag(it[0])} ${esc(it[1])}</span></label></li>`).join('')}</ul>`;
  }
  h += `<div class="row" style="margin-top:12px"><button class="btn" data-act="selfsave">Save my self-mark</button><span id="${id}-out" class="muted"></span></div>`;
  if (q.type === 'lev') h += `<details style="margin-top:14px"><summary><b>Read the full Pearson mark scheme</b></summary><pre class="ms">${esc(q.ms)}</pre></details>`;
  return h;
}
function modelHTML(q) {
  const s = q.sup;
  return `<p><b>Mark scheme:</b> ${esc(s.grid)}</p><p><b>${q.marks <= 6 ? 'Full marks' : 'Top band'}:</b> ${esc(s.top)}</p><h3 style="margin-top:12px">Structure</h3><ol>${s.plan.map(p => `<li>${esc(p)}</li>`).join('')}</ol>
  <h3 style="margin-top:12px">Build-up, step by step</h3><div class="tblwrap"><table class="build">${s.parts.map(([l, t, v]) => `<tr><td>${esc(l)}</td><td>${esc(t).replace(/\[(K|A|An|Ev)\]/g, (m, x) => tag(x))}</td><td>${esc(v)}</td></tr>`).join('')}</table></div>
  <p class="note">Every step uses points from the Pearson mark scheme for this question.</p>`;
}
function wireSelf(root, q, id, onSave) {
  root.querySelectorAll(`input[name="${id}-lv"]`).forEach(r => r.addEventListener('change', () => { const b = bandOf(q, +r.value); const mk = root.querySelector(`#${id}-mk`); mk.min = b[1]; mk.max = b[2]; if (!mk.value || mk.value < b[1] || mk.value > b[2]) mk.value = b[1]; root.querySelector(`#${id}-hint`).textContent = `Level ${b[0]} is ${b[1]} to ${b[2]} marks.`; }));
  root.querySelector('[data-act="selfsave"]').addEventListener('click', () => {
    let m;
    if (q.type === 'lev') { const lv = root.querySelector(`input[name="${id}-lv"]:checked`); const mk = root.querySelector(`#${id}-mk`);
      if (!lv) { root.querySelector(`#${id}-out`).textContent = 'Choose a level first.'; return; }
      const b = bandOf(q, +lv.value); m = Math.max(b[1], Math.min(b[2], parseInt(mk.value || b[1], 10))); }
    else m = root.querySelectorAll('.selfpt:checked').length;
    onSave(m); root.querySelector(`#${id}-out`).textContent = `Saved: ${m}/${q.marks}.`;
  });
}

/* ---------------- views ---------------- */
function home() {
  const tot = Q.reduce((a, q) => a + q.marks, 0), types = [...new Set(Q.map(q => q.marks))].sort((a, b) => a - b);
  const done = Q.filter(q => store.get('m' + q.n, null) != null).length;
  $('#app').innerHTML = `<section class="hero"><div><div class="eyebrow">${M.year} Business  |  ${M.code}</div><h1>${esc(M.unit)}</h1>
    <p>Real past paper questions with the original extracts. Write your answer, get it marked instantly with reasons from the Pearson mark scheme, then self-mark it yourself.</p>
    <div class="row" style="margin-top:14px"><a class="btn" href="#practice">Start practising</a><a class="btn ghost" href="#exam">Sit an exam style paper</a></div></div>
    <div class="sheet stat"><div class="eyebrow">Question bank</div><div class="big">${Q.length} questions</div><div class="muted">${tot} marks from ${new Set(Q.map(q => q.paper)).size} past papers</div>
    <div class="marks-strip">${types.map(t => `<span class="chip">${Q.filter(q => q.marks === t).length} × ${t} mark</span>`).join('')}</div>
    <div class="muted" style="margin-top:10px">Marked on this device: ${done}/${Q.length}</div><div class="bar"><i style="width:${100 * done / Q.length}%"></i></div></div></section>
    <h2>How it works</h2><div class="how">
    <div class="sheet"><b>1. Answer</b>Read the named extract, then type your answer on the lined answer space. Your answer saves on this device as you type.</div>
    <div class="sheet"><b>2. Computer mark</b>Get a mark with reasons: knowledge, application, analysis and evaluation, the mark scheme points you covered and what to add next.</div>
    <div class="sheet"><b>3. Self-mark</b>Use the real Pearson mark scheme to tick the points you made and pick your level. Then compare it with the step-by-step model build-up.</div></div>
    <h2>Topics</h2>${D.topics.map((t, i) => `<div class="topic"><h3 style="display:flex;gap:10px;align-items:center"><i style="width:12px;height:12px;border-radius:3px;display:inline-block;background:#${D.cols[i]}"></i>${esc(t)}</h3><p class="muted" style="margin:.3em 0 0">${Q.filter(q => q.topic === i + 1).map(q => `Q${q.n} ${esc(q.biz)} (${q.marks})`).join('  ·  ')}</p></div>`).join('')}`;
}
function practice() {
  $('#app').innerHTML = `<div class="eyebrow">Practice questions</div><h1>Choose a question</h1><p class="muted">Untimed. Mark each answer straight away. Suggested time: about ${M.mins} minutes per mark.</p>` +
    D.topics.map((t, i) => `<section class="topic"><h2><i style="background:#${D.cols[i]}"></i>${esc(t)}</h2><div class="qlist">${Q.filter(q => q.topic === i + 1).map(q => {
      const sm = store.get('m' + q.n, null);
      return `<a class="sheet qcard" style="--tc:${col(q)}" href="#q-${q.n}"><div class="meta"><span>Q${q.n}  |  ${esc(q.paper)} Q${esc(q.qn)}</span><span>${q.marks} marks</span></div><b>${esc(q.biz)}</b><span class="stem">${esc(q.stem.length > 150 ? q.stem.slice(0, 150) + '…' : q.stem)}</span><div class="meta"><span>${cmd(q)}  |  Extract ${esc(q.read)}</span>${sm != null ? `<span class="state">Last mark ${sm}/${q.marks}</span>` : ''}</div></a>`; }).join('')}</div></section>`).join('');
}
function questionView(n) {
  const q = Q.find(x => x.n === n); if (!q) return practice();
  const id = 'q' + n;
  $('#app').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><a href="#practice">← All questions</a><span class="eyebrow">${esc(D.topics[q.topic - 1])}  |  ${esc(q.paper)} Q${esc(q.qn)}</span></div>
  <div class="qview"><aside class="sheet booklet" aria-label="Source booklet">${extractsHTML(q)}</aside>
  <section class="sheet qpaper"><div class="qhead"><span class="qnum" style="color:${col(q)}">Q${q.n}  ${esc(q.biz)}</span><span class="mk">(${q.marks})</span></div>
  <p class="qstem">${esc(q.stem)}</p><p class="muted" style="margin:0 0 10px">Suggested time: ${Math.round(q.marks * M.mins)} minutes.</p>
  <label for="${id}-ans" class="eyebrow">Your answer</label><textarea class="answer" id="${id}-ans" spellcheck="true" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="counter" id="${id}-wc">0 words</span><div class="row"><button class="btn" id="${id}-mark">Mark my answer</button></div></div>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
  <div class="panel" data-p="comp"><p class="muted">Write your answer, then select <b>Mark my answer</b>.</p></div>
  <div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div>
  <div class="panel" data-p="model" hidden><p class="muted">Try the question first. Then reveal the model.</p><button class="btn ghost" id="${id}-reveal">Show the model build-up</button><div id="${id}-model"></div></div>
  </section></div>`;
  const ta = $(`#${id}-ans`), wc = () => $(`#${id}-wc`).textContent = `${words(ta.value).length} words`;
  ta.value = store.get('a' + n, ''); wc();
  ta.addEventListener('input', () => { store.set('a' + n, ta.value); wc(); });
  const tabs = document.querySelectorAll('.tabs button'), show = k => { tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k)); document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== k); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  $(`#${id}-mark`).addEventListener('click', () => { const r = mark(q, ta.value); store.set('m' + n, r.mark); document.querySelector('[data-p="comp"]').innerHTML = resultHTML(q, r); show('comp'); });
  $(`#${id}-reveal`).addEventListener('click', e => { e.target.hidden = true; $(`#${id}-model`).innerHTML = modelHTML(q); });
  wireSelf(document.querySelector('[data-p="self"]'), q, id, m => store.set('s' + n, m));
}

/* exam */
let EXAM = null, tick = null;
function examPick() {
  $('#app').innerHTML = `<div class="eyebrow">Exam style paper</div><h1>Sit a timed paper</h1><p class="muted" style="max-width:65ch">Questions appear one at a time with their extracts, like the real paper. The timer allows ${M.mins} minutes per mark. Nothing is marked until you finish, then every answer is marked with reasons and you can self-mark each one.</p>
  <div class="paper-pick">${D.exams.map(x => { const qs = x.qs.map(n => Q.find(q => q.n === n)), mk = qs.reduce((a, q) => a + q.marks, 0);
    return `<div class="sheet"><div class="eyebrow">${qs.length} questions  |  ${mk} marks  |  ${Math.round(mk * M.mins)} minutes</div><h2>${esc(x.name)}</h2><p class="muted" style="margin:0">${esc(x.note)}</p><div class="marks-strip">${qs.map(q => `<span class="chip">Q${q.n} (${q.marks})</span>`).join('')}</div><div><a class="btn" href="#exam-${x.id}">Start the ${esc(x.name.toLowerCase())}</a></div></div>`; }).join('')}</div>`;
}
function examStart(xid) {
  const x = D.exams.find(e => e.id === xid); if (!x) return examPick();
  const saved = store.get('exam-' + xid, null);
  if (!EXAM || EXAM.id !== xid) EXAM = saved && !saved.finished ? saved : { id: xid, i: 0, ans: {}, end: Date.now() + Math.round(x.qs.reduce((a, n) => a + Q.find(q => q.n === n).marks, 0) * M.mins * 60000), finished: false, self: {} };
  if (EXAM.finished) return examResults(x);
  renderExamQ(x);
}
function renderExamQ(x) {
  const q = Q.find(qq => qq.n === x.qs[EXAM.i]), id = 'ex' + q.n;
  $('#app').innerHTML = `<div class="exambar"><b>${esc(x.name)}</b><span class="timer" id="timer"></span><div class="qnav">${x.qs.map((n, i) => `<button class="${i === EXAM.i ? 'cur' : ''} ${(EXAM.ans[n] || '').trim() ? 'done' : ''}" data-i="${i}" aria-label="Question ${n}">Q${n}</button>`).join('')}</div><span style="margin-left:auto"></span><button class="btn" id="finish">Finish and mark</button></div>
  <div id="confirm"></div>
  <div class="qview"><aside class="sheet booklet">${extractsHTML(q)}</aside><section class="sheet qpaper">
  <div class="qhead"><span class="qnum" style="color:${col(q)}">Question ${EXAM.i + 1} of ${x.qs.length}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:4px 0 0">${esc(q.paper)} Q${esc(q.qn)}  |  ${esc(q.biz)}</p><p class="qstem">${esc(q.stem)}</p>
  <label for="${id}" class="eyebrow">Your answer</label><textarea class="answer" id="${id}" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="counter" id="wc"></span><div class="row"><button class="btn ghost" id="prev" ${EXAM.i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${EXAM.i < x.qs.length - 1 ? '' : 'disabled'}>Next →</button></div></div></section></div>`;
  const ta = $('#' + id), save = () => { EXAM.ans[q.n] = ta.value; store.set('exam-' + x.id, EXAM); $('#wc').textContent = `${words(ta.value).length} words`; };
  ta.value = EXAM.ans[q.n] || ''; save(); ta.addEventListener('input', save);
  const go = i => { EXAM.i = i; store.set('exam-' + x.id, EXAM); renderExamQ(x); window.scrollTo(0, 0); };
  document.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#prev').addEventListener('click', () => go(EXAM.i - 1)); $('#next').addEventListener('click', () => go(EXAM.i + 1));
  $('#finish').addEventListener('click', () => { const blank = x.qs.filter(n => !(EXAM.ans[n] || '').trim()).length;
    $('#confirm').innerHTML = `<div class="confirm"><b>Finish the paper and mark it?</b> ${blank ? `You have ${blank} unanswered question(s).` : 'All questions have an answer.'} You cannot change answers after marking.<div class="row" style="margin-top:10px"><button class="btn" id="yes">Yes, mark my paper</button><button class="btn ghost" id="no">Keep writing</button></div></div>`;
    $('#yes').addEventListener('click', () => finish(x)); $('#no').addEventListener('click', () => $('#confirm').innerHTML = ''); });
  clearInterval(tick); const t = () => { const s = Math.max(0, Math.round((EXAM.end - Date.now()) / 1000)), el = $('#timer'); if (!el) return clearInterval(tick);
    el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left` : 'Time is up'; el.classList.toggle('low', s < 300); };
  t(); tick = setInterval(t, 1000);
}
function finish(x) { clearInterval(tick); EXAM.finished = true; EXAM.marks = {}; x.qs.forEach(n => { EXAM.marks[n] = mark(Q.find(q => q.n === n), EXAM.ans[n] || '').mark; }); store.set('exam-' + x.id, EXAM); examResults(x); window.scrollTo(0, 0); }
function examResults(x) {
  const qs = x.qs.map(n => Q.find(q => q.n === n)), max = qs.reduce((a, q) => a + q.marks, 0);
  const comp = qs.reduce((a, q) => a + mark(q, EXAM.ans[q.n] || '').mark, 0), selfTot = () => qs.reduce((a, q) => a + (EXAM.self[q.n] ?? 0), 0), selfN = () => qs.filter(q => EXAM.self[q.n] != null).length;
  $('#app').innerHTML = `<div class="eyebrow">${esc(x.name)}  |  Results</div><h1>Your paper is marked</h1>
  <div class="cmp" style="max-width:640px"><div><span class="eyebrow">Computer mark</span><b>${comp}/${max}</b><span class="muted">${Math.round(100 * comp / max)}%</span></div><div><span class="eyebrow">Your self-mark</span><b id="selftot">${selfTot()}/${max}</b><span class="muted" id="selfn">${selfN()} of ${qs.length} questions self-marked</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="again">Start this paper again</button><a class="btn ghost" href="#exam">Choose another paper</a></div>
  ${qs.map((q, i) => { const r = mark(q, EXAM.ans[q.n] || ''), id = 'r' + q.n;
    return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Q${q.n}  ${esc(q.biz)}  <span class="muted">(${q.marks} marks)</span></span><span class="mk">${r.mark}/${r.max}  ·  ${esc(r.label)}</span></summary>
    <p class="qstem">${esc(q.stem)}</p><h3>Your answer</h3><pre class="ms" style="font-family:var(--body)">${esc(EXAM.ans[q.n] || '(no answer)')}</pre>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const v = h.startsWith('q-') ? 'practice' : h.startsWith('exam') ? 'exam' : h;
  document.querySelectorAll('nav.main a').forEach(a => a.toggleAttribute('aria-current', a.dataset.v === v) || a.setAttribute('aria-current', a.dataset.v === v ? 'page' : ''));
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (h.startsWith('q-')) questionView(+h.slice(2));
  else if (h === 'practice') practice();
  else if (h === 'exam') examPick();
  else if (h.startsWith('exam-')) examStart(h.slice(5));
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
