 2022 after droughts reduced harvests, and Oatly cannot predict how prices will change in future."]}], "sup": {"grid": "Point marked: Knowledge 2, Application 2, Analysis 2.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A (context), A (analyse). Point 2: K, A (context), A (analyse).", "plan": ["Definition of the key term.", "Point 1: K, A (context), A (analyse).", "Point 2: K, A (context), A (analyse)."], "parts": [["Definition", "Competition is rivalry between businesses selling similar products to the same customers. [K]", "Key term"], ["Point 1", "Competition puts pressure on prices. [K] Supermarket own-label oat drink sells for $1.79 a litre, compared with $2.99 for Oatly. [A] Price-sensitive customers may switch, so Oatly may have to cut its price, reducing its profit margin. [An]", "(3)"], ["Point 2", "Competition forces businesses to innovate and promote their brand. [K] Oatly has launched oat-based ice cream, yoghurt and spreads and spends heavily on bold advertising. [A] This raises costs, but helps Oatly differentiate its brand and protect its market share. [An]", "(3)"]]}, "ms": "Knowledge 2, Application 2, Analysis 2\nDefinition: Competition is rivalry between businesses selling similar products to the same customers. \nPoint 1\nKnowledge: Competition puts pressure on prices. (1)\nApplication: Supermarket own-label oat drink sells for $1.79 a litre, compared with $2.99 for Oatly. (1)\nAnalysis: Price-sensitive customers may switch, so Oatly may have to cut its price, reducing its profit margin. (1)\nPoint 2\nKnowledge: Competition forces businesses to innovate and promote their brand. (1)\nApplication: Oatly has launched oat-based ice cream, yoghurt and spreads and spends heavily on bold advertising. (1)\nAnalysis: This raises costs, but helps Oatly differentiate its brand and protect its market share. (1)", "u": "u1"}, {"case": "oatly", "topic": 1, "sub": ["1d"], "marks": 8, "type": "lev", "read": "D", "stem": "Discuss the risks and uncertainty Oatly faces when entering markets in Asia.", "kw": ["risk", "uncertain", "unknown", "predict"], "n": 104, "set": "style", "paper": "Exam style", "qn": "Oatly", "biz": "Oatly", "ext": [{"id": "A", "t": "Oatly: from health food shop to supermarket shelf", "p": ["Oatly is a Swedish business that makes drinks and foods from oats. It was founded in the 1990s after scientists at Lund University developed an alternative to cow's milk for people who could not digest lactose.", "Oatly was a niche brand for more than 20 years, sold mainly in health food shops to vegans and people with allergies. In 2016 it changed its strategy. It began selling to coffee shops, so that baristas could use its Barista Edition oat drink, and then to supermarkets.", "Oatly is now sold in more than 20 countries. It has opened large factories in Sweden, the Netherlands, Singapore and the US. In 2023 its revenue was $783m, compared with $116m in 2018.", "The plant-based drinks market changes quickly. Consumers' attitudes to health, animal welfare and the environment are changing, and an increasing share of oat drinks is bought online and through grocery delivery apps."]}, {"id": "B", "t": "Figure 1: Oat drink sales in Country X ($m)", "p": ["Year | Total market | Oatly | Supermarket own-label", "2021 | 660 | 210 | 92", "2022 | 734 | 221 | 141", "2023 | 800 | 232 | 184"]}, {"id": "C", "t": "Competition heats up in plant-based drinks", "p": ["Large dairy businesses and supermarkets have launched their own oat drinks. In Country X a one-litre carton of supermarket own-label oat drink sells for $1.79, compared with $2.99 for Oatly.", "Oatly has responded by launching new products, including oat-based ice cream, yoghurt and spreads, and by spending heavily on bold, humorous advertising that makes its brand stand out."]}, {"id": "D", "t": "Oatly looks east", "p": ["Oatly plans to grow its sales in China, Japan and South Korea. It has set aside a marketing budget of $25m for the first two years.", "Many consumers in Asia have never tried oat drinks, and tastes differ from Europe. Oat prices rose by 30% in 2022 after droughts reduced harvests, and Oatly cannot predict how prices will change in future."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Risk is a situation where the possible outcomes can be estimated, while uncertainty is a situation where the outcome cannot be predicted. [K]", "Key term"], ["Point 1", "Entering a new market is risky because demand is unknown. [K] Many consumers in Asia have never tried oat drinks, and Oatly has committed a $25m marketing budget. [A] If sales are lower than planned, Oatly may not cover its marketing costs and could make a loss in these markets. [An] However, Oatly can reduce this risk with market research and by building on its experience of selling in more than 20 countries. [Ev]", "(4)"], ["Point 2", "Changes in costs create uncertainty. [K] Oat prices rose by 30% in 2022 after droughts, and Oatly cannot predict future prices. [A] Rising raw material costs reduce profit margins, making it hard to set prices in a new market. [An] However, all oat drink producers face the same rise in costs, so Oatly may not lose competitiveness. [Ev]", "(4)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "pts": [{"s": "know", "t": "Risk is a situation where the possible outcomes can be estimated, while uncertainty is a situation where the outcome cannot be predicted."}, {"s": "for", "t": "Entering a new market is risky because demand is unknown."}, {"s": "for", "t": "Many consumers in Asia have never tried oat drinks, and Oatly has committed a $25m marketing budget."}, {"s": "for", "t": "If sales are lower than planned, Oatly may not cover its marketing costs and could make a loss in these markets."}, {"s": "against", "t": "However, Oatly can reduce this risk with market research and by building on its experience of selling in more than 20 countries."}, {"s": "for", "t": "Changes in costs create uncertainty."}, {"s": "for", "t": "Oat prices rose by 30% in 2022 after droughts, and Oatly cannot predict future prices."}, {"s": "for", "t": "Rising raw material costs reduce profit margins, making it hard to set prices in a new market."}, {"s": "against", "t": "However, all oat drink producers face the same rise in costs, so Oatly may not lose competitiveness."}], "ms": "Indicative content\n• Risk is a situation where the possible outcomes can be estimated, while uncertainty is a situation where the outcome cannot be predicted.\n• Entering a new market is risky because demand is unknown.\n• Many consumers in Asia have never tried oat drinks, and Oatly has committed a $25m marketing budget.\n• If sales are lower than planned, Oatly may not cover its marketing costs and could make a loss in these markets.\n• However, Oatly can reduce this risk with market research and by building on its experience of selling in more than 20 countries.\n• Changes in costs create uncertainty.\n• Oat prices rose by 30% in 2022 after droughts, and Oatly cannot predict future prices.\n• Rising raw material costs reduce profit margins, making it hard to set prices in a new market.\n• However, all oat drink producers face the same rise in costs, so Oatly may not lose competitiveness.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "u": "u1"}, {"case": "oatly", "topic": 1, "sub": ["1a", "1c"], "marks": 10, "type": "lev", "read": "A, B and C", "stem": "Assess whether Oatly made the right decision to move from a niche market to the mass market.", "kw": ["mass market", "niche", "segment", "economies of scale", "specific needs"], "n": 105, "set": "style", "paper": "Exam style", "qn": "Oatly", "biz": "Oatly", "ext": [{"id": "A", "t": "Oatly: from health food shop to supermarket shelf", "p": ["Oatly is a Swedish business that makes drinks and foods from oats. It was founded in the 1990s after scientists at Lund University developed an alternative to cow's milk for people who could not digest lactose.", "Oatly was a niche brand for more than 20 years, sold mainly in health food shops to vegans and people with allergies. In 2016 it changed its strategy. It began selling to coffee shops, so that baristas could use its Barista Edition oat drink, and then to supermarkets.", "Oatly is now sold in more than 20 countries. It has opened large factories in Sweden, the Netherlands, Singapore and the US. In 2023 its revenue was $783m, compared with $116m in 2018.", "The plant-based drinks market changes quickly. Consumers' attitudes to health, animal welfare and the environment are changing, and an increasing share of oat drinks is bought online and through grocery delivery apps."]}, {"id": "B", "t": "Figure 1: Oat drink sales in Country X ($m)", "p": ["Year | Total market | Oatly | Supermarket own-label", "2021 | 660 | 210 | 92", "2022 | 734 | 221 | 141", "2023 | 800 | 232 | 184"]}, {"id": "C", "t": "Competition heats up in plant-based drinks", "p": ["Large dairy businesses and supermarkets have launched their own oat drinks. In Country X a one-litre carton of supermarket own-label oat drink sells for $1.79, compared with $2.99 for Oatly.", "Oatly has responded by launching new products, including oat-based ice cream, yoghurt and spreads, and by spending heavily on bold, humorous advertising that makes its brand stand out."]}, {"id": "D", "t": "Oatly looks east", "p": ["Oatly plans to grow its sales in China, Japan and South Korea. It has set aside a marketing budget of $25m for the first two years.", "Many consumers in Asia have never tried oat drinks, and tastes differ from Europe. Oat prices rose by 30% in 2022 after droughts reduced harvests, and Oatly cannot predict how prices will change in future."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "A niche market is a small part of a larger market with specific needs, while a mass market sells standard products to a large number of customers. [K]", "Key term"], ["Point 1", "Selling to the mass market increases sales volume. [K] Oatly's revenue grew from $116m in 2018 to $783m in 2023 after it moved into coffee shops and supermarkets. [A] Higher output allows economies of scale, lowering unit costs and supporting its new factories. [An] However, Oatly's market share in Country X fell from 31.82% in 2021 to 29.00% in 2023 as competition grew. [Ev]", "(4)"], ["Point 2", "A mass market attracts more competitors. [K] Supermarket own-label sales rose from $92m in 2021 to $184m in 2023 and sell at $1.79 compared with $2.99 for Oatly. [A] Oatly may have to lower its prices or spend more on promotion, which reduces its profit margin. [An] However, the total market grew from $660m to $800m, so Oatly can still grow its sales even with a smaller share. [Ev]", "(4)"], ["Conclusion", "Overall, the move was right because Oatly's revenue grew almost sevenfold, but it depends on whether Oatly can keep its premium brand image while own-label competition grows. [Ev]", "(2)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 7, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 8, 10, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "pts": [{"s": "know", "t": "A niche market is a small part of a larger market with specific needs, while a mass market sells standard products to a large number of customers."}, {"s": "for", "t": "Selling to the mass market increases sales volume."}, {"s": "for", "t": "Oatly's revenue grew from $116m in 2018 to $783m in 2023 after it moved into coffee shops and supermarkets."}, {"s": "for", "t": "Higher output allows economies of scale, lowering unit costs and supporting its new factories."}, {"s": "against", "t": "However, Oatly's market share in Country X fell from 31.82% in 2021 to 29.00% in 2023 as competition grew."}, {"s": "for", "t": "A mass market attracts more competitors."}, {"s": "for", "t": "Supermarket own-label sales rose from $92m in 2021 to $184m in 2023 and sell at $1.79 compared with $2.99 for Oatly."}, {"s": "for", "t": "Oatly may have to lower its prices or spend more on promotion, which reduces its profit margin."}, {"s": "against", "t": "However, the total market grew from $660m to $800m, so Oatly can still grow its sales even with a smaller share."}, {"s": "judge", "t": "Overall, the move was right because Oatly's revenue grew almost sevenfold, but it depends on whether Oatly can keep its premium brand image while own-label competition grows."}], "ms": "Indicative content\n• A niche market is a small part of a larger market with specific needs, while a mass market sells standard products to a large number of customers.\n• Selling to the mass market increases sales volume.\n• Oatly's revenue grew from $116m in 2018 to $783m in 2023 after it moved into coffee shops and supermarkets.\n• Higher output allows economies of scale, lowering unit costs and supporting its new factories.\n• However, Oatly's market share in Country X fell from 31.82% in 2021 to 29.00% in 2023 as competition grew.\n• A mass market attracts more competitors.\n• Supermarket own-label sales rose from $92m in 2021 to $184m in 2023 and sell at $1.79 compared with $2.99 for Oatly.\n• Oatly may have to lower its prices or spend more on promotion, which reduces its profit margin.\n• However, the total market grew from $660m to $800m, so Oatly can still grow its sales even with a smaller share.\n• Overall, the move was right because Oatly's revenue grew almost sevenfold, but it depends on whether Oatly can keep its premium brand image while own-label competition grows.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–7 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 8–10 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement.", "u": "u1"}, {"case": "lego", "topic": 2, "sub": ["2a"], "marks": 2, "type": "def", "read": "E", "stem": "Define the term 'qualitative data'.", "parts": [["opinion", "view", "feeling", "attitude", "reason", "why", "descriptive", "behaviour"], ["cannot be measured", "not easily measured", "hard to measure", "not numerical", "non-numerical", "statistically", "in-depth", "not numbers"]], "kw": ["qualitative"], "n": 106, "set": "style", "paper": "Exam style", "qn": "LEGO", "biz": "LEGO", "ext": [{"id": "E", "t": "How LEGO learned to listen", "p": ["LEGO is a Danish toy business known for its plastic building bricks. In the early 2000s around 90% of its customers were boys.", "Before launching LEGO Friends in 2012, LEGO spent four years researching how girls and boys play. Researchers observed 3,500 girls and their mothers, watching children play at home and asking parents about their buying habits.", "The research found that many girls wanted to build detailed scenes, use more colours and tell stories with characters. LEGO Friends became one of the most successful launches in the company's history."]}, {"id": "F", "t": "Figure 2: LEGO online survey of 2,400 families", "p": ["Statement | % of families", "Child wants more sets based on films and games | 42%", "Price is the main reason for not buying LEGO | 27%", "Buy LEGO online more than in shops | 18%", "Child is aged over 12 | 21%"]}, {"id": "G", "t": "Using data to stay ahead", "p": ["LEGO uses secondary data from toy industry reports and from retailers. Industry reports show that the global toy market was worth about $108bn in 2023, and that sales of toys aimed at adults are growing faster than toys for children.", "LEGO also runs an online platform, LEGO Ideas, where fans suggest and vote for new sets. Ideas that receive 10,000 votes are reviewed by LEGO designers."]}], "sup": {"grid": "Point marked: Knowledge 2.", "top": "Follow the department answer structure: Part 1: what it is (1). Part 2: what it leads to (1).", "plan": ["Part 1: what it is (1).", "Part 2: what it leads to (1)."], "parts": [["Knowledge 1", "Qualitative data is information about opinions, attitudes and reasons [K]", "(1)"], ["Knowledge 2", "that is not numerical and cannot easily be measured statistically. [K]", "(1)"]]}, "ms": "Knowledge 2\nUp to 2 marks for defining the term, e.g.\n• Qualitative data is information about opinions, attitudes and reasons (1)\n• that is not numerical and cannot easily be measured statistically. (1)", "u": "u1"}, {"case": "lego", "topic": 2, "sub": ["2a", "2b"], "marks": 4, "type": "calc", "read": "F", "stem": "Using Figure 2, calculate the number of families in the survey who said their child wanted more sets based on films and games. You are advised to show your working.", "ans": 1008, "pre": "", "unit": "", "ansText": "1,008 families", "fhint": "number = percentage ÷ 100 × total families surveyed", "fk": ["÷", "/", "x", "×", "*", "percent", "100"], "data": ["42", "2400", "2,400", "0.42"], "n": 107, "set": "style", "paper": "Exam style", "qn": "LEGO", "biz": "LEGO", "ext": [{"id": "E", "t": "How LEGO learned to listen", "p": ["LEGO is a Danish toy business known for its plastic building bricks. In the early 2000s around 90% of its customers were boys.", "Before launching LEGO Friends in 2012, LEGO spent four years researching how girls and boys play. Researchers observed 3,500 girls and their mothers, watching children play at home and asking parents about their buying habits.", "The research found that many girls wanted to build detailed scenes, use more colours and tell stories with characters. LEGO Friends became one of the most successful launches in the company's history."]}, {"id": "F", "t": "Figure 2: LEGO online survey of 2,400 families", "p": ["Statement | % of families", "Child wants more sets based on films and games | 42%", "Price is the main reason for not buying LEGO | 27%", "Buy LEGO online more than in shops | 18%", "Child is aged over 12 | 21%"]}, {"id": "G", "t": "Using data to stay ahead", "p": ["LEGO uses secondary data from toy industry reports and from retailers. Industry reports show that the global toy market was worth about $108bn in 2023, and that sales of toys aimed at adults are growing faster than toys for children.", "LEGO also runs an online platform, LEGO Ideas, where fans suggest and vote for new sets. Ideas that receive 10,000 votes are reviewed by LEGO designers."]}], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: percentage ÷ 100 × total families surveyed [A] 42 ÷ 100 × 2,400 [A]", "(2)"], ["Calculate", "0.42 × 2,400 [An] = 1,008 families [An]", "(2)"]]}, "ms": "Knowledge 1, Application 2, Analysis 1\nConstruct: Formula: percentage ÷ 100 × total families surveyed (1)\nConstruct: 42 ÷ 100 × 2,400 (1)\nCalculate: 0.42 × 2,400 (1)\nCalculate: = 1,008 families (1)\nNB: If the answer is 1,008 families with no working award 4 marks.", "u": "u1"}, {"case": "lego", "topic": 2, "sub": ["2c"], "marks": 6, "type": "pt", "read": "G", "stem": "Analyse two advantages to LEGO of using secondary market research.", "K": [["cheap", "low cost", "cheaper", "free", "inexpensive"], ["quick", "fast", "already available", "already exists", "readily"], ["trend", "large", "wide", "whole market", "competitor"]], "Kmax": 2, "Amax": 2, "Anmax": 2, "kw": ["secondary"], "n": 108, "set": "style", "paper": "Exam style", "qn": "LEGO", "biz": "LEGO", "ext": [{"id": "E", "t": "How LEGO learned to listen", "p": ["LEGO is a Danish toy business known for its plastic building bricks. In the early 2000s around 90% of its customers were boys.", "Before launching LEGO Friends in 2012, LEGO spent four years researching how girls and boys play. Researchers observed 3,500 girls and their mothers, watching children play at home and asking parents about their buying habits.", "The research found that many girls wanted to build detailed scenes, use more colours and tell stories with characters. LEGO Friends became one of the most successful launches in the company's history."]}, {"id": "F", "t": "Figure 2: LEGO online survey of 2,400 families", "p": ["Statement | % of families", "Child wants more sets based on films and games | 42%", "Price is the main reason for not buying LEGO | 27%", "Buy LEGO online more than in shops | 18%", "Child is aged over 12 | 21%"]}, {"id": "G", "t": "Using data to stay ahead", "p": ["LEGO uses secondary data from toy industry reports and from retailers. Industry reports show that the global toy market was worth about $108bn in 2023, and that sales of toys aimed at adults are growing faster than toys for children.", "LEGO also runs an online platform, LEGO Ideas, where fans suggest and vote for new sets. Ideas that receive 10,000 votes are reviewed by LEGO designers."]}], "sup": {"grid": "Point marked: Knowledge 2, Application 2, Analysis 2.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A (context), A (analyse). Point 2: K, A (context), A (analyse).", "plan": ["Definition of the key term.", "Point 1: K, A (context), A (analyse).", "Point 2: K, A (context), A (analyse)."], "parts": [["Definition", "Secondary research is the use of data that has already been collected by someone else. [K]", "Key term"], ["Point 1", "Secondary research shows trends across the whole market. [K] Industry reports show the global toy market was worth about $108bn and adult toy sales are growing fastest. [A] LEGO can spot growing segments, such as adults, and develop sets that will sell, increasing revenue. [An]", "(3)"], ["Point 2", "Secondary research is quick and cheap because the data already exists. [K] LEGO receives sales data from retailers and ideas from the LEGO Ideas platform. [A] This saves money that LEGO can spend on product development instead. [An]", "(3)"]]}, "ms": "Knowledge 2, Application 2, Analysis 2\nDefinition: Secondary research is the use of data that has already been collected by someone else. \nPoint 1\nKnowledge: Secondary research shows trends across the whole market. (1)\nApplication: Industry reports show the global toy market was worth about $108bn and adult toy sales are growing fastest. (1)\nAnalysis: LEGO can spot growing segments, such as adults, and develop sets that will sell, increasing revenue. (1)\nPoint 2\nKnowledge: Secondary research is quick and cheap because the data already exists. (1)\nApplication: LEGO receives sales data from retailers and ideas from the LEGO Ideas platform. (1)\nAnalysis: This saves money that LEGO can spend on product development instead. (1)", "u": "u1"}, {"case": "lego", "topic": 2, "sub": ["2b", "2a"], "marks": 8, "type": "lev", "read": "E", "stem": "Discuss the benefits to LEGO of using observation as a method of primary market research before launching LEGO Friends.", "kw": ["primary", "observ", "first-hand", "qualitative"], "n": 109, "set": "style", "paper": "Exam style", "qn": "LEGO", "biz": "LEGO", "ext": [{"id": "E", "t": "How LEGO learned to listen", "p": ["LEGO is a Danish toy business known for its plastic building bricks. In the early 2000s around 90% of its customers were boys.", "Before launching LEGO Friends in 2012, LEGO spent four years researching how girls and boys play. Researchers observed 3,500 girls and their mothers, watching children play at home and asking parents about their buying habits.", "The research found that many girls wanted to build detailed scenes, use more colours and tell stories with characters. LEGO Friends became one of the most successful launches in the company's history."]}, {"id": "F", "t": "Figure 2: LEGO online survey of 2,400 families", "p": ["Statement | % of families", "Child wants more sets based on films and games | 42%", "Price is the main reason for not buying LEGO | 27%", "Buy LEGO online more than in shops | 18%", "Child is aged over 12 | 21%"]}, {"id": "G", "t": "Using data to stay ahead", "p": ["LEGO uses secondary data from toy industry reports and from retailers. Industry reports show that the global toy market was worth about $108bn in 2023, and that sales of toys aimed at adults are growing faster than toys for children.", "LEGO also runs an online platform, LEGO Ideas, where fans suggest and vote for new sets. Ideas that receive 10,000 votes are reviewed by LEGO designers."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Primary research is new data collected first-hand for a specific purpose; observation means watching how people behave. [K]", "Key term"], ["Point 1", "Observation shows how customers really behave, rather than what they say. [K] Researchers observed 3,500 girls and their mothers, watching children play at home. [A] LEGO learned that girls wanted detailed scenes, more colours and characters, so it designed a product that met their needs and increased sales. [An] However, children may behave differently when they know they are being watched, making the results less reliable. [Ev]", "(4)"], ["Point 2", "Primary data is specific to the business and not available to competitors. [K] Around 90% of LEGO customers were boys, so LEGO needed new information about girls. [A] Detailed qualitative data gave LEGO an advantage in a new segment, helping LEGO Friends become one of its most successful launches. [An] However, observation is expensive and slow: LEGO spent four years on research before launching LEGO Friends. [Ev]", "(4)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "pts": [{"s": "know", "t": "Primary research is new data collected first-hand for a specific purpose; observation means watching how people behave."}, {"s": "for", "t": "Observation shows how customers really behave, rather than what they say."}, {"s": "for", "t": "Researchers observed 3,500 girls and their mothers, watching children play at home."}, {"s": "for", "t": "LEGO learned that girls wanted detailed scenes, more colours and characters, so it designed a product that met their needs and increased sales."}, {"s": "against", "t": "However, children may behave differently when they know they are being watched, making the results less reliable."}, {"s": "for", "t": "Primary data is specific to the business and not available to competitors."}, {"s": "for", "t": "Around 90% of LEGO customers were boys, so LEGO needed new information about girls."}, {"s": "for", "t": "Detailed qualitative data gave LEGO an advantage in a new segment, helping LEGO Friends become one of its most successful launches."}, {"s": "against", "t": "However, observation is expensive and slow: LEGO spent four years on research before launching LEGO Friends."}], "ms": "Indicative content\n• Primary research is new data collected first-hand for a specific purpose; observation means watching how people behave.\n• Observation shows how customers really behave, rather than what they say.\n• Researchers observed 3,500 girls and their mothers, watching children play at home.\n• LEGO learned that girls wanted detailed scenes, more colours and characters, so it designed a product that met their needs and increased sales.\n• However, children may behave differently when they know they are being watched, making the results less reliable.\n• Primary data is specific to the business and not available to competitors.\n• Around 90% of LEGO customers were boys, so LEGO needed new information about girls.\n• Detailed qualitative data gave LEGO an advantage in a new segment, helping LEGO Friends become one of its most successful launches.\n• However, observation is expensive and slow: LEGO spent four years on research before launching LEGO Friends.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "u": "u1"}, {"case": "lego", "topic": 2, "sub": ["2d"], "marks": 10, "type": "lev", "read": "F", "stem": "LEGO used an online survey of 2,400 families. Assess whether LEGO should use quota sampling rather than random sampling for its next survey.", "kw": ["quota", "random", "sample", "population", "representative", "equal chance", "bias"], "n": 110, "set": "style", "paper": "Exam style", "qn": "LEGO", "biz": "LEGO", "ext": [{"id": "E", "t": "How LEGO learned to listen", "p": ["LEGO is a Danish toy business known for its plastic building bricks. In the early 2000s around 90% of its customers were boys.", "Before launching LEGO Friends in 2012, LEGO spent four years researching how girls and boys play. Researchers observed 3,500 girls and their mothers, watching children play at home and asking parents about their buying habits.", "The research found that many girls wanted to build detailed scenes, use more colours and tell stories with characters. LEGO Friends became one of the most successful launches in the company's history."]}, {"id": "F", "t": "Figure 2: LEGO online survey of 2,400 families", "p": ["Statement | % of families", "Child wants more sets based on films and games | 42%", "Price is the main reason for not buying LEGO | 27%", "Buy LEGO online more than in shops | 18%", "Child is aged over 12 | 21%"]}, {"id": "G", "t": "Using data to stay ahead", "p": ["LEGO uses secondary data from toy industry reports and from retailers. Industry reports show that the global toy market was worth about $108bn in 2023, and that sales of toys aimed at adults are growing faster than toys for children.", "LEGO also runs an online platform, LEGO Ideas, where fans suggest and vote for new sets. Ideas that receive 10,000 votes are reviewed by LEGO designers."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Quota sampling chooses set numbers of people from different groups, such as age, while random sampling gives everyone in the population an equal chance of being chosen. [K]", "Key term"], ["Point 1", "Quota sampling makes sure each important group is included. [K] 21% of families in the survey had a child aged over 12, a growing group for LEGO. [A] Setting quotas by age makes sure LEGO hears from older children and adults, so its results reflect the segments it wants to grow. [An] However, the people chosen within each quota may not be typical, which can create bias. [Ev]", "(4)"], ["Point 2", "Quota sampling is quicker and cheaper than random sampling. [K] LEGO surveyed 2,400 families online across Europe and North America. [A] LEGO does not need a full list of every family, so it can collect results quickly and at lower cost. [An] However, random sampling avoids bias because every family has an equal chance of selection, which may give more reliable results. [Ev]", "(4)"], ["Conclusion", "Overall, quota sampling is likely to suit LEGO because it targets clear customer groups such as older children, but it depends on how carefully the quotas are set. [Ev]", "(2)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 7, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 8, 10, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "pts": [{"s": "know", "t": "Quota sampling chooses set numbers of people from different groups, such as age, while random sampling gives everyone in the population an equal chance of being chosen."}, {"s": "for", "t": "Quota sampling makes sure each important group is included."}, {"s": "for", "t": "21% of families in the survey had a child aged over 12, a growing group for LEGO."}, {"s": "for", "t": "Setting quotas by age makes sure LEGO hears from older children and adults, so its results reflect the segments it wants to grow."}, {"s": "against", "t": "However, the people chosen within each quota may not be typical, which can create bias."}, {"s": "for", "t": "Quota sampling is quicker and cheaper than random sampling."}, {"s": "for", "t": "LEGO surveyed 2,400 families online across Europe and North America."}, {"s": "for", "t": "LEGO does not need a full list of every family, so it can collect results quickly and at lower cost."}, {"s": "against", "t": "However, random sampling avoids bias because every family has an equal chance of selection, which may give more reliable results."}, {"s": "judge", "t": "Overall, quota sampling is likely to suit LEGO because it targets clear customer groups such as older children, but it depends on how carefully the quotas are set."}], "ms": "Indicative content\n• Quota sampling chooses set numbers of people from different groups, such as age, while random sampling gives everyone in the population an equal chance of being chosen.\n• Quota sampling makes sure each important group is included.\n• 21% of families in the survey had a child aged over 12, a growing group for LEGO.\n• Setting quotas by age makes sure LEGO hears from older children and adults, so its results reflect the segments it wants to grow.\n• However, the people chosen within each quota may not be typical, which can create bias.\n• Quota sampling is quicker and cheaper than random sampling.\n• LEGO surveyed 2,400 families online across Europe and North America.\n• LEGO does not need a full list of every family, so it can collect results quickly and at lower cost.\n• However, random sampling avoids bias because every family has an equal chance of selection, which may give more reliable results.\n• Overall, quota sampling is likely to suit LEGO because it targets clear customer groups such as older children, but it depends on how carefully the quotas are set.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–7 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 8–10 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement.", "u": "u1"}, {"case": "nespresso", "topic": 3, "sub": ["3f"], "marks": 2, "type": "def", "read": "J", "stem": "Define the term 'adding value'.", "parts": [["difference", "increase", "raise", "more than"], ["cost", "input", "raw material", "bought-in", "price", "worth"]], "kw": ["value"], "n": 111, "set": "style", "paper": "Exam style", "qn": "Nespresso", "biz": "Nespresso", "ext": [{"id": "H", "t": "The Nespresso experience", "p": ["Nespresso is part of the Swiss business Nestlé. It sells coffee machines and single-serve coffee pods through around 800 boutiques worldwide and online.", "Customers can join the Nespresso club, which offers personal coffee advice, free recycling of used pods and limited edition coffees. Its advertising uses famous actors to create a premium, stylish image.", "Nespresso offers two machine systems: Original, for espresso drinkers, and Vertuo, launched in 2014, for customers who prefer larger cups of coffee. It also sells machines and pods to offices, hotels and restaurants."]}, {"id": "I", "t": "Figure 3: Price of a single coffee pod, 2024", "p": ["Brand | Price per pod", "Nespresso Vertuo | $1.10", "Nespresso Original | $0.80", "Branded compatible pods | $0.55", "Supermarket own-label compatible pods | $0.40"]}, {"id": "J", "t": "Pods under pressure", "p": ["Supermarkets and other coffee brands now sell pods that work in Nespresso Original machines, often at about half the price. Vertuo machines only accept Nespresso pods.", "The coffee, aluminium and packaging in a Nespresso pod are estimated to cost about $0.15. Nespresso says its coffee quality, machine design and customer service justify the higher price."]}], "sup": {"grid": "Point marked: Knowledge 2.", "top": "Follow the department answer structure: Part 1: what it is (1). Part 2: what it leads to (1).", "plan": ["Part 1: what it is (1).", "Part 2: what it leads to (1)."], "parts": [["Knowledge 1", "Adding value means increasing the difference [K]", "(1)"], ["Knowledge 2", "between the selling price of a product and the cost of its inputs. [K]", "(1)"]]}, "ms": "Knowledge 2\nUp to 2 marks for defining the term, e.g.\n• Adding value means increasing the difference (1)\n• between the selling price of a product and the cost of its inputs. (1)", "u": "u1"}, {"case": "nespresso", "topic": 3, "sub": ["3b"], "marks": 4, "type": "pt", "read": "I", "stem": "Using Figure 3, explain one benefit to Nespresso of using market mapping.", "K": [["gap", "competitor", "position", "compare", "identify", "map"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["market map"], "n": 112, "set": "style", "paper": "Exam style", "qn": "Nespresso", "biz": "Nespresso", "ext": [{"id": "H", "t": "The Nespresso experience", "p": ["Nespresso is part of the Swiss business Nestlé. It sells coffee machines and single-serve coffee pods through around 800 boutiques worldwide and online.", "Customers can join the Nespresso club, which offers personal coffee advice, free recycling of used pods and limited edition coffees. Its advertising uses famous actors to create a premium, stylish image.", "Nespresso offers two machine systems: Original, for espresso drinkers, and Vertuo, launched in 2014, for customers who prefer larger cups of coffee. It also sells machines and pods to offices, hotels and restaurants."]}, {"id": "I", "t": "Figure 3: Price of a single coffee pod, 2024", "p": ["Brand | Price per pod", "Nespresso Vertuo | $1.10", "Nespresso Original | $0.80", "Branded compatible pods | $0.55", "Supermarket own-label compatible pods | $0.40"]}, {"id": "J", "t": "Pods under pressure"   if (A0.w < 3 && !(q.type === 'calc' && /\d/.test(ans))) return { mark: 0, max: q.marks, label: 'No answer yet', crit: [{ c: 'no', t: 'Nothing to mark', d: 'Write your answer in the answer space, then select Mark my answer.' }], tips: [] };
  if (q.type === 'def') {
    let m = 0; q.parts.forEach((p, i) => { const h = kwHits(p, ans); if (h.length) m++;
      const eg = (q.sup.parts[i] || ['', ''])[1].replace(/\s*\[(K|A|An|Ev)\]/g, '');
      R.crit.push({ c: h.length ? 'ok' : 'no', t: `${tag('K')} Part ${i + 1} of the definition ${h.length ? '(1 mark)' : '(0 marks)'}`,
        d: h.length ? `You included the idea of "${h[0]}".` : `Include this part, e.g. "${eg}"` }); });
    return { mark: m, max: 2, label: `${m}/2 (point marked)`, ...R };
  }
  if (q.type === 'calc') {
    const nums = (ans.match(/\d[\d,]*\.?\d*/g) || []).map(n => parseFloat(n.replace(/,/g, '')));
    const correct = nums.some(n => Math.abs(n - q.ans) < 0.006);
    const fx = q.ans.toFixed(2).split('.'), intRe = fx[0] === '0' ? '0?' : fx[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',?'), decRe = fx[1] === '00' ? '(\\.0+)?' : '\\.' + fx[1] + '0*';
    const eu = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const unitOk = !q.unit && !q.pre ? correct : new RegExp('(^|[^0-9.])' + (q.pre ? eu(q.pre) + '\\s*' : '') + intRe + decRe + '\\s*' + eu(q.unit), 'i').test(ans.replace(/\s+/g, ' '));
    const fk = kwHits(q.fk, ans).length > 0, wk = [...new Set(q.data.filter(d => digits(ans).includes(digits(d))))];
    let K = fk ? 1 : 0, Ap = Math.min(2, wk.length), An = correct ? 1 : 0;
    let m = K + Ap + An; if (correct) m = Math.max(m, unitOk ? 4 : 3); if (correct && !unitOk) m = Math.min(m, 3);
    m = Math.min(4, m);
    R.crit.push({ c: K ? 'ok' : 'no', t: `${tag('K')} Formula ${K ? '(1 mark)' : '(0 marks)'}`, d: K ? 'You showed the formula or method.' : `Write the formula first: ${q.fhint}.` });
    R.crit.push({ c: Ap === 2 ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Correct data selected (${Ap}/2)`, d: wk.length ? `Figures used from the data: ${wk.join(', ')}.` : 'Show the figures you took from the question and the extract.' });
    R.crit.push({ c: correct ? 'ok' : 'no', t: `${tag('An')} Correct answer ${correct ? '(1 mark)' : '(0 marks)'}`, d: correct ? `Correct: ${q.ansText}.` : 'Check your working and round to two decimal places where asked.' });
    if (q.unit || q.pre) R.crit.push({ c: unitOk ? 'ok' : correct ? 'part' : 'no', t: 'Units', d: unitOk ? 'Units shown correctly.' : `Write the answer with its units: ${q.ansText}. Without units, a correct answer with no working gets 3 marks.` });
    return { mark: m, max: 4, label: `${m}/4 (point marked)`, ...R };
  }
  const C = findContext(q, ans), kh = kwInSentence(q.kw || [], ans);
  const appNote = () => {
    let d = C.nums.length || C.names.length ? `Evidence credited: ${[...C.nums, ...C.names].slice(0, 8).join(', ')}.` : `No specific evidence from Extract ${q.read} was found in a developed sentence.`;
    if (C.hasNums && C.nums.length < C.need) d += ` Use the specific figures from the extract: at least ${C.need} key figure(s) are needed before other context is fully credited.`;
    if (C.bare.length) d += ` Figures listed without explanation are not credited (${C.bare.slice(0, 4).join(', ')}): put each figure in a sentence that explains what it shows.`;
    if (C.copied) d += ' Part of your answer copies the extract word for word, so only 1 piece of evidence is credited. Use the evidence in your own words.';
    if (C.unused.length) d += ` Key evidence you could use: ${C.unused.slice(0, 5).join(', ')}.`;
    return d; };
  const AP = C.copied ? Math.min(1, C.count) : C.count;
  if (q.type === 'pt') {
    const kg = q.K.filter(g => kwInSentence(g, ans).length).length;
    const K = Math.min(q.Kmax, Math.max(kg, kh.length ? 1 : 0)), Ap = Math.min(q.Amax, AP), An = K ? Math.min(q.Anmax, A0.chains.length) : 0, m = K + Ap + An;
    R.crit.push({ c: K === q.Kmax ? 'ok' : K ? 'part' : 'no', t: `${tag('K')} Knowledge ${K}/${q.Kmax}`, d: K ? 'You stated relevant business knowledge in a full sentence.' : 'Start with a clear point in a full sentence (e.g. the benefit, reason or definition the question asks for).' });
    R.crit.push({ c: Ap === q.Amax ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Application ${Ap}/${q.Amax}`, d: appNote() });
    R.crit.push({ c: An === q.Anmax ? 'ok' : An ? 'part' : 'no', t: `${tag('An')} Analysis ${An}/${q.Anmax}`, d: An ? `${A0.chains.length} developed chain(s) found that explain a consequence for the business.` : K ? 'Develop each point into a consequence for the business: say what it leads to (sales, costs, profit, market share) using "so", "this means" or "as a result".' : 'Analysis is only credited once a knowledge point has been made.' });
    if (q.marks >= 4) R.tips.push('No evaluation is needed for this question. Spend the time on specific evidence and development.');
    return { mark: m, max: q.marks, label: `${m}/${q.marks} (point marked)`, ...R };
  }
  // levels marked
  const cov = coverPts(q, ans), hit = cov.filter(p => p.hit), against = hit.some(p => p.s === 'against');
  const K = kh.length > 0 || hit.some(p => p.s === 'know'), Ap = AP, An = A0.chains.length;
  const balCtx = A0.bal.filter(s => CONSEQ.test(lc(s)) || C.nums.some(n => s.includes(n)) || C.names.some(n => lc(s).includes(lc(n))));
  const bal = balCtx.length > 0 && (against || balCtx.length >= 2), judge = A0.judge.length > 0, rec = A0.rec.length > 0;
  const top = q.lv.length; let lv = 1;
  const needRec = q.marks >= 20 && /recommend|solution/i.test((q.lv[q.lv.length - 1] || [])[3] || '');
  if (!K && Ap === 0) lv = 1;
  if (K && Ap >= 1 && An >= 1) lv = 2;
  const KE = keyEvidence(q), avail = KE.nums.size + KE.names.size + KE.phrases.size, T = x => Math.min(x, Math.max(1, avail));
  if (q.marks <= 8) { if (lv === 2 && Ap >= T(2) && An >= 2 && bal) lv = 3; }
  else if (q.marks <= 12) { if (lv === 2 && Ap >= T(2) && An >= 2 && A0.w >= 100) lv = 3; if (lv === 3 && Ap >= T(3) && bal && judge && A0.w >= 130) lv = 4; }
  else { if (lv === 2 && Ap >= T(3) && An >= 3 && bal && A0.w >= 170) lv = 3; if (lv === 3 && judge && (rec || !needRec) && Ap >= T(5) && An >= 4 && A0.w >= 220) lv = 4; }
  const [, lo, hi, desc] = bandOf(q, lv);
  const tgtA = T(q.marks >= 20 ? 7 : q.marks >= 10 ? 5 : 4), tgtAn = q.marks >= 20 ? 6 : 4;
  const strength = Math.min(1, 0.35 * Math.min(1, hit.length / Math.max(3, q.pts.length * 0.5)) + 0.35 * Math.min(1, Ap / tgtA) + 0.3 * Math.min(1, An / tgtAn));
  const m = A0.w < 15 ? Math.min(lo, 1) : lo + Math.round((hi - lo) * strength);
  const needA = T(q.marks >= 20 ? 5 : q.marks >= 10 ? 3 : 2);
  R.crit.push({ c: K ? 'ok' : 'no', t: `${tag('K')} Knowledge`, d: K ? `You used key terms in full sentences: ${kh.slice(0, 4).join(', ') || 'a definition from the mark scheme'}.` : 'Define the key term in the question in a full sentence at the start of your answer.' });
  R.crit.push({ c: Ap >= needA ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Application: ${Ap} piece(s) of specific evidence credited (top band needs about ${needA})`, d: appNote() });
  R.crit.push({ c: An >= (q.marks >= 20 ? 4 : 2) ? 'ok' : An ? 'part' : 'no', t: `${tag('An')} Analysis: ${An} developed chain(s)`, d: An ? 'Chains found, e.g. "' + esc(A0.chains[0].slice(0, 110)) + (A0.chains[0].length > 110 ? '…' : '') + '"' : 'Each point needs a chain that ends in a consequence for the business (sales, costs, profit, market share), using because / so / this means.' });
  R.crit.push({ c: bal ? 'ok' : A0.bal.length ? 'part' : 'no', t: `${tag('Ev')} Balance: the other side`, d: bal ? 'You gave developed counter-arguments in context.' : A0.bal.length ? 'You used "however", but the counter-argument needs context or a consequence to count as balance.' : 'Add a "However" counter-point in context for each argument. The top band needs a balanced assessment.' });
  if (q.marks >= 10) R.crit.push({ c: judge ? 'ok' : 'no', t: `${tag('Ev')} Supported judgement`, d: judge ? 'You reached a judgement with a reason.' : 'Finish with a judgement that gives a reason: "Overall… because… it depends on…". A judgement without a reason is not credited.' });
  if (needRec) R.crit.push({ c: rec ? 'ok' : 'no', t: `${tag('Ev')} Recommendation`, d: rec ? 'You proposed a solution or recommendation.' : 'Level 4 needs a conclusion that proposes a solution or recommendation ("it should…").' });
  if (q.marks <= 8) R.tips.push('This 8-mark question needs balance, but no conclusion is required.');
  if (lv < top) { const nb = bandOf(q, lv + 1); R.tips.push(`To reach Level ${nb[0]} (${nb[1]} to ${nb[2]} marks): ${nb[3]}`); }
  return { mark: m, max: q.marks, level: lv, label: `Level ${lv} (${lo} to ${hi} marks)`, desc, cov, ...R };
}

/* ---------------- rendering ---------------- */
function extractsHTML(q) {
  return `<span class="read">READ EXTRACT ${esc(q.read).toUpperCase()}</span>` + q.ext.map(e => {
    const tbl = e.p.filter(p => p.length < 45).length > e.p.length / 2;
    return `<h3>Extract ${e.id}: ${esc(e.t)}</h3><div class="${tbl ? 'tbl' : ''}">${e.p.map(p => `<p>${esc(p)}</p>`).join('')}</div>`; }).join('');
}
function resultHTML(q, r) {
  const pct = Math.round(100 * r.mark / r.max);
  let h = `<div class="score"><span class="big">${r.mark}/${r.max}</span><span class="lvl">${esc(r.label)}</span><span class="muted" style="flex:1;min-width:200px">Computer estimate, based on the Pearson mark scheme for this question.</span></div>`;
  h += `<ul class="crit">${r.crit.map(c => `<li class="${c.c}"><span class="ic">${c.c === 'ok' ? '✓' : c.c === 'part' ? '~' : '✗'}</span><div><b>${c.t}</b>${c.d}</div></li>`).join('')}</ul>`;
  if (r.desc) h += `<p class="note"><b>Why this level:</b> ${esc(r.desc)}</p>`;
  if (r.tips.length) h += r.tips.map(t => `<p class="note"><b>Next step:</b> ${esc(t)}</p>`).join('');
  if (r.cov) { const got = r.cov.filter(p => p.hit), miss = r.cov.filter(p => !p.hit && p.s !== 'know').slice(0, 4);
    h += `<h3 style="margin-top:18px">Mark scheme points you covered (${got.length})</h3>` + (got.length ? `<ul class="pts">${got.map(p => `<li class="hit"><span class="side">${sideName(p.s)}</span><span>${esc(p.t)}</span></li>`).join('')}</ul>` : '<p class="muted">None matched closely yet. Compare your answer with the points below.</p>');
    if (miss.length) h += `<h3 style="margin-top:14px">Points you could add</h3><ul class="pts">${miss.map(p => `<li><span class="side">${sideName(p.s)}</span><span>${esc(p.t)}</span></li>`).join('')}</ul>`; }
  h += `<p class="note">The computer looks for knowledge terms, evidence from the extracts, chains of reasoning, a counter-argument and a judgement. It cannot judge quality like an examiner, so use the self-mark tab as well and ask your teacher if the two marks differ.</p>`;

}
const sideName = s => ({ know: 'Knowledge', for: 'Main point', against: 'Other side', judge: 'Judgement' }[s]);
function selfHTML(q, id) {

function modelHTML(q) {

function wireSelf(root, q, id, onSave) {
  root.querySelectorAll(`input[name="${id}-lv"]`).forEach(r => r.addEventListener('change', () => { const b = bandOf(q, +r.value); const mk = root.querySelector(`#${id}-mk`); mk.min = b[1]; mk.max = b[2]; if (!mk.value || mk.value < b[1] || mk.value > b[2]) mk.value = b[1]; root.querySelector(`#${id}-hint`).textContent = `Level ${b[0]} is ${b[1]} to ${b[2]} marks.`; }));

  const qs = qsOf(s), u = s.u;
  $('#app').innerHTML = secHead(s, 't') + `<p class="muted" style="max-width:70ch">Every ${esc(u.name)} topic and the questions in this section that test it.</p><div class="tblwrap"><table class="build cover"><tr><td>Topic</td><td>Questions</td></tr>${Object.keys(u.subs).map(k => { const hit = qs.filter(q => (q.sub || []).includes(k));
    return `<tr class="${hit.length ? '' : 'none'}"><td>${esc(subName(u, k))}${u.subdetail ? `<div class="muted" style="font-weight:400;font-size:.82rem">${esc(u.subdetail[k].split(': ').slice(1).join(': '))}</div>` : ''}</td><td>${hit.length ? hit.map(q => `<a href="#q-${q.n}">${qLabel(q)} (${q.marks})</a>`).join(' ') : `<span class="muted">${s.set === 'past' ? 'Not in these past papers: see the exam style section' : 'Not covered'}</span>`}</td></tr>`; }).join('')}</table></div>`;
}
function qCard(q) {
  const sm = store.get('s' + q.n, null) ?? store.get('m' + q.n, null);
  return `<a class="sheet qcard" style="--tc:${col(q)}" href="#q-${q.n}"><div class="meta"><span>${qLabel(q)}  |  ${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) : 'Exam style'}</span><span>${q.marks} marks</span></div><b>${esc(q.biz)}</b><span class="stem">${esc(q.stem.length > 150 ? q.stem.slice(0, 150) + '…' : q.stem)}</span><div class="meta"><span>${cmd(q)}  |  ${esc((q.sub || []).map(k => subName(unitOf(q), k))[0] || '')}</span>${sm != null ? `<span class="state">Mark ${sm}/${q.marks}</span>` : (store.get('a' + q.n, '') || '').trim() ? '<span class="state">Answered</span>' : ''}</div></a>`;
}
function tipHTML(q) { return q.tip ? `<div class="tip"><b>Examiner tip</b>${esc(q.tip)}</div>` : ''; }
function printQ(q) {
  $('#printarea').innerHTML = `<h1>${esc(unitOf(q).name)}  |  ${qLabel(q)} ${esc(q.biz)}</h1><p class="pm">${q.set === 'past' ? esc(q.paper) + ' paper, Q' + esc(q.qn) : 'Exam style question'}  |  ${q.marks} marks  |  Suggested time: ${Math.round(q.marks * M.mins)} minutes</p>
    <div class="pext">${extractsHTML(q)}</div><div class="pq"><b>${esc(q.stem)}</b> <span>(${q.marks})</span></div><div class="plines">${'<div></div>'.repeat(Math.min(40, 8 + q.marks * 2))}</div>`;
  document.body.classList.add('printing'); window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
function questionView(n) {
  const q = Q.find(x => x.n === n); if (!q) return home();
  const s = secOf(q), id = 'q' + n;
  $('#app').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><a href="#${s.id}">← ${esc(secName(s))}</a><span class="eyebrow">${esc((q.sub || []).map(k => subName(unitOf(q), k)).join(', '))}</span></div>
  <div class="qview"><aside class="sheet booklet" aria-label="Extracts">${q.set === 'style' ? `<p class="note" style="margin-top:0">${esc(unitOf(q).note)}</p>` : ''}${extractsHTML(q)}</aside>
  <section class="sheet qpaper"><div class="qhead"><span class="qnum" style="color:${col(q)}">${qLabel(q)}  ${esc(q.biz)}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:2px 0 0">${esc(unitOf(q).name)}  |  ${q.set === 'past' ? esc(q.paper) + ' paper, Q' + esc(q.qn) : 'Exam style question'}</p>
  <p class="qstem">${esc(q.stem)}</p><p class="muted" style="margin:0 0 10px">Suggested time: ${Math.round(q.marks * M.mins)} minutes.</p>
  <label for="${id}-ans" class="eyebrow">Your answer</label><textarea class="answer" id="${id}-ans" spellcheck="true" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="counter" id="${id}-wc">0 words  ·  saved</span><div class="row"><button class="btn ghost" id="${id}-clear">Clear answer</button><button class="btn ghost" id="${id}-print">Print question</button></div></div>
  <div id="${id}-cc"></div>
  <h3 style="margin-top:18px">Check your answer</h3>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="false" data-tab="model">Model build-up</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="comp">Computer mark</button></div>
  <div class="panel" data-p="none"><p class="muted">Choose an option above. The computer mark updates as you edit your answer.</p></div>
  <div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div>
  <div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div>
  <div class="panel" data-p="comp" hidden></div>
  </section></div>
  <div class="row" style="justify-content:space-between;margin-top:16px">${navBtn(q, -1)}${navBtn(q, 1)}</div>`;
  const ta = $(`#${id}-ans`), wc = () => $(`#${id}-wc`).textContent = `${words(ta.value).length} words  ·  saved`;
  let cur = 'none';
  const markNow = () => { const r = mark(q, ta.value); if (words(ta.value).length) store.set('m' + n, r.mark); document.querySelector('[data-p="comp"]').innerHTML = (q.tip ? tipHTML(q) : '') + resultHTML(q, r); };
  const tabs = document.querySelectorAll('.tabs button'), show = k => { cur = k; tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k)); document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== k); if (k === 'comp') markNow(); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  ta.value = store.get('a' + n, ''); wc();
  let deb; ta.addEventListener('input', () => { store.set('a' + n, ta.value); wc(); if (cur === 'comp') { clearTimeout(deb); deb = setTimeout(markNow, 600); } });
  $(`#${id}-print`).addEventListener('click', () => printQ(q));
  $(`#${id}-clear`).addEventListener('click', () => { $(`#${id}-cc`).innerHTML = `<div class="confirm"><b>Clear your answer and marks for this question?</b> This cannot be undone.<div class="row" style="margin-top:10px"><button class="btn danger" id="${id}-cy">Yes, clear and start again</button><button class="btn ghost" id="${id}-cn">Cancel</button></div></div>`;
    $(`#${id}-cy`).addEventListener('click', () => { ['a', 'm', 's'].forEach(k => store.set(k + n, null)); questionView(n); });
    $(`#${id}-cn`).addEventListener('click', () => $(`#${id}-cc`).innerHTML = ''); });
  wireSelf(document.querySelector('[data-p="self"]'), q, id, m => store.set('s' + n, m));
}
function navBtn(q, d) { const qs = qsOf(secOf(q)), i = qs.indexOf(q) + d; if (i < 0 || i >= qs.length) return '<span></span>'; const o = qs[i]; return `<a class="btn ghost" href="#q-${o.n}">${d < 0 ? '← ' : ''}${qLabel(o)} ${esc(o.biz)}${d > 0 ? ' →' : ''}</a>`; }

/* exam */
let EXAM = null, tick = null;
function examPick(s) {
  $('#app').innerHTML = secHead(s, 'p') + `<p class="muted" style="max-width:65ch">Questions appear one at a time with their extracts, like the real exam. The timer allows ${M.mins} minutes per mark. Nothing is marked until you finish, then every answer is marked with reasons and you can self-mark each one.</p>
  <div class="paper-pick">${D.exams.filter(x => x.unit === s.u.id && x.set === s.set).map(x => { const qs = x.qs.map(n => Q.find(q => q.n === n)), mk = qs.reduce((a, q) => a + q.marks, 0), st = store.get('exam-' + x.id, null);
    return `<div class="sheet"><div class="eyebrow">${qs.length} questions  |  ${mk} marks  |  ${Math.round(mk * M.mins)} minutes</div><h2>${esc(x.name)}</h2><p class="muted" style="margin:0">${esc(x.note)}</p><div class="marks-strip">${qs.map(q => `<span class="chip">${qLabel(q)} (${q.marks})</span>`).join('')}</div><div><a class="btn" href="#paper-${x.id}" style="background:${s.color};border-color:${s.color}">${st ? (st.finished ? 'See results' : 'Continue this paper') : 'Start this paper'}</a></div></div>`; }).join('')}</div>`;
}
function examStart(xid) {
  const x = D.exams.find(e => e.id === xid); if (!x) return home();
  const sec = SECTIONS.find(s => s.u.id === x.unit && s.set === x.set);
  const saved = store.get('exam-' + xid, null);
  if (!EXAM || EXAM.id !== xid) EXAM = saved && !saved.finished ? saved : { id: xid, i: 0, ans: {}, end: Date.now() + Math.round(x.qs.reduce((a, n) => a + Q.find(q => q.n === n).marks, 0) * M.mins * 60000), finished: false, self: {} };
  if (EXAM.finished) return examResults(x);
  renderExamQ(x);
}
function renderExamQ(x) {
  const q = Q.find(qq => qq.n === x.qs[EXAM.i]), id = 'ex' + q.n;
  $('#app').innerHTML = `<div class="exambar"><b>${esc(x.name)}</b><span class="timer" id="timer"></span><div class="qnav">${x.qs.map((n, i) => `<button class="${i === EXAM.i ? 'cur' : ''} ${(EXAM.ans[n] || '').trim() ? 'done' : ''}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div><span style="margin-left:auto"></span><button class="btn" id="finish">Finish and mark</button></div>
  <div id="confirm"></div>
  <div class="qview"><aside class="sheet booklet">${extractsHTML(q)}</aside><section class="sheet qpaper">
  <div class="qhead"><span class="qnum" style="color:${col(q)}">Question ${EXAM.i + 1} of ${x.qs.length}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:4px 0 0">${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) + '  |  ' : 'Exam style  |  '}${esc(q.biz)}</p><p class="qstem">${esc(q.stem)}</p>
  <label for="${id}" class="eyebrow">Your answer</label><textarea class="answer" id="${id}" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="counter" id="wc"></span><div class="row"><button class="btn ghost" id="prev" ${EXAM.i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${EXAM.i < x.qs.length - 1 ? '' : 'disabled'}>Next →</button></div></div></section></div>`;
  const ta = $('#' + id), save = () => { EXAM.ans[q.n] = ta.value; store.set('exam-' + x.id, EXAM); $('#wc').textContent = `${words(ta.value).length} words`; };
  ta.value = EXAM.ans[q.n] || ''; save(); ta.addEventListener('input', save);
  const go = i => { EXAM.i = i; store.set('exam-' + x.id, EXAM); renderExamQ(x); window.scrollTo(0, 0); };
  document.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#prev').addEventListener('click', () => go(EXAM.i - 1)); $('#next').addEventListener('click', () => go(EXAM.i + 1));
  $('#finish').addEventListener('click', () => { const blank = x.qs.filter(n => !(EXAM.ans[n] || '').trim()).length;
    $('#confirm').innerHTML = `<div class="confirm"><b>Finish the paper and mark it?</b> ${blank ? `You have ${blank} unanswered question(s).` : 'All questions have an answer.'} You cannot change answers after marking.<div class="row" style="margin-top:10px"><button class="btn" id="yes">Yes, mark my paper</button><button class="btn ghost" id="no">Keep writing</button></div></div>`;
    $('#yes').addEventListener('click', () => finish(x)); $('#no').addEventListener('click', () => $('#confirm').innerHTML = ''); });
  clearInterval(tick); const t = () => { const s = Math.max(0, Math.round((EXAM.end - Date.now()) / 1000)), el = $('#timer'); if (!el) return clearInterval(tick);
    el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left` : 'Time is up'; el.classList.toggle('low', s < 300); };
  t(); tick = setInterval(t, 1000);
}
function finish(x) { clearInterval(tick); EXAM.finished = true; store.set('exam-' + x.id, EXAM); examResults(x); window.scrollTo(0, 0); }
function examResults(x) {
  const qs = x.qs.map(n => Q.find(q => q.n === n)), max = qs.reduce((a, q) => a + q.marks, 0);
  const comp = qs.reduce((a, q) => a + mark(q, EXAM.ans[q.n] || '').mark, 0), selfTot = () => qs.reduce((a, q) => a + (EXAM.self[q.n] ?? 0), 0), selfN = () => qs.filter(q => EXAM.self[q.n] != null).length;
  $('#app').innerHTML = `<div class="eyebrow">${esc(secName(SECTIONS.find(s => s.u.id === x.unit && s.set === x.set)))}  |  ${esc(x.name)}  |  Results</div><h1>Your paper is marked</h1>
  <div class="cmp" style="max-width:640px"><div><span class="eyebrow">Computer mark</span><b>${comp}/${max}</b><span class="muted">${Math.round(100 * comp / max)}%</span></div><div><span class="eyebrow">Your self-mark</span><b id="selftot">${selfTot()}/${max}</b><span class="muted" id="selfn">${selfN()} of ${qs.length} questions self-marked</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="again">Start this paper again</button><a class="btn ghost" href="#${x.unit}-${x.set}-papers">Choose another paper</a></div>
  ${qs.map((q, i) => { const r = mark(q, EXAM.ans[q.n] || ''), id = 'r' + q.n;
    return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Question ${i + 1}: ${esc(q.biz)}  <span class="muted">(${q.marks} marks)</span></span><span class="mk">${r.mark}/${r.max}  ·  ${esc(r.label)}</span></summary>
    <p class="qstem">${esc(q.stem)}</p><h3>Your answer</h3><pre class="ms" style="font-family:var(--body)">${esc(EXAM.ans[q.n] || '(no answer)')}</pre>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const q = h.startsWith('q-') ? Q.find(x => x.n === +h.slice(2)) : null;
  const ex = h.startsWith('paper-') ? D.exams.find(e => e.id === h.slice(6)) : null;
  const sec = SECTIONS.find(s => h === s.id || h === s.id + '-papers' || h === s.id + '-topics');
  const v = q ? secOf(q).id : ex ? ex.unit + '-' + ex.set : sec ? sec.id : 'home';
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (q) questionView(q.n);
  else if (ex) examStart(ex.id);
  else if (sec && h.endsWith('-papers')) examPick(sec);
  else if (sec && h.endsWith('-topics')) topicsView(sec);
  else if (sec) section(sec);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
