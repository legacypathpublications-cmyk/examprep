<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 12 Business Exam Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: exam hall. A paper-white answer sheet on a cool desk, extracts as a source booklet beside the question. */
:root{
  --desk:#EEF2F7; --paper:#FFFFFF; --ink:#14213D; --muted:#56637A; --rule:#D5DCE6; --line:#C9D6E8;
  --accent:#1F4FA8; --accent-ink:#FFFFFF; --soft:#E7EEFA;
  --good:#11734B; --good-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FDF2DE; --bad:#B42318; --bad-bg:#FCE9E7;
  --k:#2563EB; --a:#059669; --an:#D97706; --ev:#7C3AED;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E1522; --paper:#162033; --ink:#E7ECF5; --muted:#A3AFC4; --rule:#2B3850; --line:#2C3B57;
  --accent:#7FA6F0; --accent-ink:#0E1522; --soft:#1D2B45;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --k:#7AA2FF; --a:#4FD1A5; --an:#F5B248; --ev:#B89BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E1522; --paper:#162033; --ink:#E7ECF5; --muted:#A3AFC4; --rule:#2B3850; --line:#2C3B57;
  --accent:#7FA6F0; --accent-ink:#0E1522; --soft:#1D2B45;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --k:#7AA2FF; --a:#4FD1A5; --an:#F5B248; --ev:#B89BFF; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--desk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0A101B}}
:root[data-theme="dark"] header.top{background:#0A101B}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;letter-spacing:.2px}
.brand small{display:block;font:500 .72rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:#9FB3D9}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{color:#D9E2F2;text-decoration:none;font-weight:600;font-size:.92rem;padding:7px 12px;border-radius:6px}
nav.main a[aria-current="page"],nav.main a:hover{background:rgba(255,255,255,.12);color:#fff}
main{padding-block:28px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.9rem,4vw,2.8rem)} h2{font-size:1.5rem} h3{font-size:1.15rem}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{font:600 .95rem var(--body);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--an);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:10px}
/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;margin-bottom:28px}
.hero p{max-width:60ch;font-size:1.05rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-block:22px 34px}
.how .sheet{padding:18px}
.how b{font-family:var(--display);font-size:1.1rem;display:block;margin-bottom:4px}
.stat{padding:18px 20px}
.stat .big{font:600 2.2rem var(--mono);font-variant-numeric:tabular-nums}
.marks-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 .78rem var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
/* question list */
.topic{margin-top:26px}
.topic h2{display:flex;align-items:center;gap:10px}
.topic h2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.qcard{display:flex;flex-direction:column;gap:6px;padding:16px;text-decoration:none;color:var(--ink);border-left:5px solid var(--tc)}
.qcard:hover{border-color:var(--tc);box-shadow:0 2px 0 var(--rule)}
.qcard .stem{font-size:.95rem;min-width:0}
.qcard .meta{display:flex;justify-content:space-between;gap:8px;font:500 .78rem var(--mono);color:var(--muted)}
.state{font:600 .72rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
/* question view */
.qview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.booklet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding:20px 22px}
.booklet h3{font-size:1rem;margin-top:16px}
.booklet h3:first-of-type{margin-top:6px}
.booklet p{margin:.45em 0;font-size:.95rem;max-width:68ch}
.booklet .tbl p{margin:0;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.read{font:600 .8rem var(--mono);color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;display:inline-block}
.qpaper{padding:22px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qnum{font:700 1.4rem var(--display)}
.qstem{font-size:1.08rem;margin:10px 0 4px;font-weight:500}
.mk{font:600 1rem var(--mono);white-space:nowrap}
.answer{width:100%;min-height:260px;resize:vertical;border:1px solid var(--rule);border-radius:6px;padding:4px 12px 4px 46px;font:1rem/32px var(--body);color:var(--ink);
  background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--bad) 34px,var(--bad) 35px,transparent 35px),repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);background-attachment:local}
.counter{font:500 .8rem var(--mono);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tabs button{font:600 .9rem var(--body);padding:8px 14px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.panel{margin-top:14px}
/* results */
.score{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:10px;background:var(--soft);flex-wrap:wrap}
.score .big{font:600 2.1rem var(--mono);font-variant-numeric:tabular-nums}
.score .lvl{font:600 .85rem var(--mono);padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.crit{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.crit li .ic{font:700 1rem var(--mono);text-align:center}
.crit li.ok{border-color:var(--good);background:var(--good-bg)} .crit li.ok .ic{color:var(--good)}
.crit li.no{border-color:var(--bad);background:var(--bad-bg)} .crit li.no .ic{color:var(--bad)}
.crit li.part{border-color:var(--warn);background:var(--warn-bg)} .crit li.part .ic{color:var(--warn)}
.crit b{display:block}
.tag{font:700 .7rem var(--mono);padding:1px 6px;border-radius:4px;color:#fff;margin-left:3px;vertical-align:1px}
.tK{background:var(--k)}.tA{background:var(--a)}.tAn{background:var(--an)}.tEv{background:var(--ev)}
:root[data-theme="dark"] .tag{color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#0E1522}}
.pts{display:grid;gap:6px;margin:8px 0;padding:0;list-style:none}
.pts li{padding:8px 10px;border-radius:6px;border:1px solid var(--rule);font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.pts li.hit{border-color:var(--good);background:var(--good-bg)}
.pts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%}
.pts input{margin-top:4px;flex:none;width:18px;height:18px}
.side{font:600 .68rem var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);flex:none;width:76px;padding-top:3px}
pre.ms{white-space:pre-wrap;font:.85rem/1.5 var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
.lvls{display:grid;gap:8px}
.lvls label{display:grid;grid-template-columns:22px 92px 1fr;gap:10px;padding:10px;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-size:.9rem;background:var(--paper)}
.lvls label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.lvls b{font-family:var(--mono)}
.build{width:100%;border-collapse:collapse;font-size:.92rem}
.build td{border:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.build td:first-child{font-weight:700;width:120px} .build td:last-child{width:90px;font:600 .8rem var(--mono);text-align:center}
.tblwrap{overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.cmp div{padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.cmp b{font:600 1.6rem var(--mono);display:block}
.note{font-size:.85rem;color:var(--muted);margin-top:10px;max-width:70ch}
/* sections */
.hero1{margin-bottom:22px}.hero1 p{max-width:66ch;font-size:1.05rem}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.setcard{padding:24px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--accent)}
.setcard.style{border-top-color:var(--ev)}
.setcard h2{font-size:1.7rem}.setcard p{margin:0;max-width:56ch}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;border-bottom:1px solid var(--rule)}
.subnav a{padding:8px 12px;font-weight:600;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.subnav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.gh{display:flex;align-items:center;gap:10px;font-size:1.3rem}.gh i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cover td:first-child{width:auto;font-weight:600}.cover tr:first-child td{font:600 .75rem var(--mono);text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cover td:last-child{width:auto;text-align:left;font:500 .9rem var(--body)}.cover a{margin-right:10px;font-weight:600}
.cover tr.none td:first-child{color:var(--muted);font-weight:500}
@media (max-width:860px){.sets{grid-template-columns:1fr}}
/* exam */
.paper-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.paper-pick .sheet{padding:22px;display:flex;flex-direction:column;gap:10px}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.timer{font:600 1.3rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{font:600 .82rem var(--mono);min-width:44px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.qnav button.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.qnav button.done{border-style:solid;border-color:var(--good)}
.confirm{margin-top:12px;padding:14px;border-radius:8px;border:1.5px solid var(--warn);background:var(--warn-bg)}
.res-q{padding:18px;margin-top:14px}
.res-q summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none;flex-wrap:wrap}
.res-q summary::-webkit-details-marker{display:none}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:600px){.brand small{display:none}header.top{position:static}nav.main{margin-left:0}nav.main a{padding:6px 9px}.exambar{top:env(safe-area-inset-top,0px)}}
@media (max-width:860px){.qview,.hero{grid-template-columns:1fr}.booklet{position:static;max-height:none}.how,.paper-pick{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* units, dashboard, print */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dash{padding:20px 22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 16px}
.tiles div{padding:12px 14px;border:1px solid var(--rule);border-radius:8px}
.tiles b{display:block;font:600 1.7rem var(--mono);font-variant-numeric:tabular-nums}
.secbars{display:grid;gap:8px}
.secbar{display:grid;grid-template-columns:minmax(0,220px) 1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:6px 4px;border-radius:6px}
.secbar:hover{background:var(--soft)}
.secbar .bar{margin:0}.secbar .num{font:500 .82rem var(--mono);color:var(--muted);white-space:nowrap}
.bigbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:12px}
.bigbtn{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:12px;background:var(--c);color:#fff;text-decoration:none;min-height:150px}
.bigbtn .eyebrow{color:rgba(255,255,255,.85)}
.bigbtn b{font:700 1.6rem var(--display)}
.bigbtn .go{margin-top:auto;font-weight:700}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn:focus-visible{outline:3px solid var(--an);outline-offset:3px}
.sechead{border-left:8px solid var(--c);padding:4px 0 4px 16px}
.sechead p{max-width:68ch;margin:.4em 0 0;color:var(--muted)}
.reset{margin-top:28px;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.tip{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.92rem}
.tip b{display:block;color:var(--warn);font:600 .78rem var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
#printarea{display:none}
@media print{
  body.printing > *:not(#printarea){display:none!important}
  body.printing #printarea{display:block;color:#000;font:11pt/1.45 Arial,sans-serif}
  body.printing::before{display:none}
  #printarea h1{font-size:15pt;margin:0 0 4px} #printarea .pm{margin:0 0 10px;color:#333}
  #printarea .pq{border:1.5px solid #000;padding:8px 10px;margin-bottom:8px}
  #printarea .plines div{height:0.85cm;border-bottom:1px solid #777} @page{margin:1.5cm}
  #printarea .read{color:#000;background:none;border:1px solid #000}
  #printarea .pext h3{font-size:11pt;margin:10px 0 2px} #printarea .pext p{margin:3px 0}
}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}.bigbtns{grid-template-columns:1fr}.secbar{grid-template-columns:1fr}}
</style>
</head>

sk’. Mark\nAnswer\n1(a) Knowledge 2\nUp to 2 marks for defining the term ‘risk’ e.g.\n• An action or decision/something that can planned for or\nconsidered (1) which may result in a loss/where outcomes\nare unknown (1)\n(2)", "sup": {"grid": "Point marked: Knowledge 2.", "top": "Follow the department answer structure: Part 1: what it is (1). Part 2: what it leads to (1).", "plan": ["Part 1: what it is (1).", "Part 2: what it leads to (1)."], "parts": [["Knowledge 1", "Risk is an action or decision that can be planned for or considered [K]", "(1)"], ["Knowledge 2", "which may result in a loss, or where the outcome is unknown. [K]", "(1)"]]}, "type": "def", "parts": [["action", "decision", "planned", "plan", "calculat", "consider", "chance", "probability", "possibility", "likelihood"], ["loss", "unknown", "fail", "negative", "uncertain", "outcome", "lose", "harm"]], "kw": ["risk"], "set": "past", "sub": ["1d"], "u": "u1"}, {"n": 2, "topic": 3, "paper": "October 2023", "qn": "1(b)", "biz": "Nando's", "marks": 4, "read": "A to C", "stem": "Explain one possible benefit to Fernando and Robert of using market mapping when starting their business.", "ext": [{"id": "A", "t": "The History of Nando’s", "p": ["Nando’s is a fast-food restaurant chain started by Fernando Duarte and Robert Brozin in South Africa. It sells a range of spicy chicken and vegetarian dishes.", "Entrepreneurs Fernando and Robert took a risk and opened the first Nando’s restaurant in 1987 after enjoying spicy chicken in a Portuguese restaurant. By the end of 1989 they had opened three more restaurants. Today, there are Nando’s restaurants in most major cities around the world. All its restaurants have a trendy, fun and unique design by local designers and artists."]}, {"id": "B", "t": "Nando’s Indian menu (selected items)", "p": ["Dish Price (Rupees)", "Chicken burger 199", "Chicken naan 399", "Salad 299", "Vegetable burger 379", "Chicken and fries 599", "Peri vegetable platter 1999"]}, {"id": "C", "t": "Employees at Nando’s", "p": ["Employees who work at Nando’s are called Nandocas. Nando’s employees are seen as family members and it aims to treat them as an asset to the business. It states, ‘Nando’s is not just about the chicken, it’s about the people that make the chicken.’ In 2022 Nando’s was named as one of the UK’s best large companies to work for.", "In South Africa, Nando’s has a programme called Harambee that recruits young unemployed people and gives them skills to prepare them for the workplace. Nando’s uses a training programme called Buddy. A buddy is an employee who has completed all job roles in the business. Buddies supervise new employees to pass on their knowledge and skills. 10"]}], "ms": "Question Explain one possible benefit to Fernando and Robert of using Mark\nmarket mapping when starting their business.\nAnswer\n1(b) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a benefit of market mapping e.g.\n• To spot a gap in the market by analysing the competition (1)\nApplication\nUp to 2 marks for answers contextualising the benefit, e.g.\n• The market mapping may have shown how many\nrestaurants served spicy/vegetarian food (1)\n• The research may have shown a lack of restaurants that\nappealed to a younger audience (1)\nAnalysis\n1 mark for reasons/causes/consequences of using market\nmapping e.g.\n• Analysing the competition will have allowed Nando’s to\nidentify any potential gaps in the market to differentiate its\nbusiness and/or create a unique selling point (1)\n(4)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "Market mapping helps a business spot a gap in the market by analysing the competition. [K]", "(1)"], ["Application", "Nando's sells a range of spicy chicken and vegetarian dishes, and the market map may have shown how few rivals offered these. [A]", "(1)"], ["Application", "Its restaurants have a trendy, fun and unique design, and the map may have shown a lack of restaurants that appealed to a younger audience. [A]", "(1)"], ["Analysis", "This lets Nando's identify gaps in the market, so it can differentiate its business and create a unique selling point. [An]", "(1)"]]}, "type": "pt", "K": [["gap", "competitor", "competition", "position", "identify", "compare", "map"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["market map", "gap"], "set": "past", "sub": ["3b"], "u": "u1"}, {"n": 3, "topic": 1, "paper": "October 2024", "qn": "2(b)", "biz": "M&S", "marks": 4, "read": "E", "stem": "In 2021, M&S's grocery revenue was £5.61bn. In 2022, the total revenue for the UK grocery market was £170bn and M&S had a market share of 3.6%. Using this information and the data in Extract E calculate, to two decimal places, the change in grocery revenue for M&S between 2021 and 2022. You are advised to show your working.", "ext": [{"id": "D", "t": "About Marks and Spencer (M&S)", "p": ["M&S is a British retailer. It has a large product portfolio and sells high quality food, clothing and homeware. Globally, it has 1,487 stores and 98 websites.", "The M&S food brand is recognised for its quality, taste and product innovation. In 2022, sales of food increased by 10% and over 1,300 new food products and meals were created and sold. The advertising campaign for its food uses the slogan ‘it’s not just any food, it’s M&S food’.", "M&S is currently a top-performing UK grocery business in terms of percentage growth in market share. The UK grocery market is extremely competitive with Tesco having the largest market share. 10"]}, {"id": "E", "t": "Selected data for M&S in 2021 and 2022", "p": ["Dec 2021 Dec 2022", "M&S market share of total UK", "3.4% 3.6%", "grocery sales (by revenue)", "Profit £403m £522m"]}], "ms": "Question Define the term ‘product portfolio.’ Mark\nAnswer\n2(a) Knowledge\nUp to 2 marks for defining the term ‘product portfolio’ e.g.\n• The range of products (1) that are sold/produced/offered by a\nbusiness\n(1).\n(2)\nQuestion In 2021, M&S’s grocery revenue was £5.61bn. Mark\nIn 2022, the total revenue for the UK grocery market was\n£170bn and M&S had a market share of 3.6%.\nUsing this information and the data in Extract E calculate, to\ntwo decimal places, the change in grocery revenue for M&S\nbetween 2021 and 2022. You are advised to show your\nworking.\nAnswer\n2(b) Knowledge 1, Application 2, Analysis 1\nQuantitative skills assessed:\nQS2: calculate, use and understand percentages and percentage\nchanges\nKnowledge\n1 mark for identifying a suitable formula e.g.\n• Revenue x market share (2022) - Revenue (2021) (1)\nApplication\nUp to 2 marks for selecting the correct data:\n• £170bn x 3.6% (1) - £5.61bn\n(1) OR\n• £6.12bn (1) - £5.61bn (1)\nAnalysis\n1 mark for calculating the change in revenue\n· = £0.51bn (1)\nNB: If no working is shown, award marks as\nfollows:\n• If the answer given is £0.51bn award 4\nmarks.\n• If the answer given is 0.51bn award 3 marks.\n(4)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. Answer £0.51bn with no working = 4 marks; 0.51bn (no £) = 3 marks.", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: market revenue × market share (2022) minus revenue (2021) [A] £170bn × 3.6% minus £5.61bn [A]", "(2)"], ["Calculate", "£170bn × 3.6% = £6.12bn [An] £6.12bn minus £5.61bn = £0.51bn (include £ and bn) [An]", "(2)"]]}, "type": "calc", "ans": 0.51, "pre": "£", "unit": "bn", "ansText": "£0.51bn", "fhint": "revenue 2022 (market revenue × market share) minus revenue 2021", "fk": ["share", "x", "×", "*", "-", "minus", "revenue", "change", "difference", "subtract"], "data": ["170", "3.6", "5.61", "6.12"], "kw": [], "set": "past", "sub": ["1a"], "u": "u1"}, {"n": 4, "topic": 1, "paper": "May 2024", "qn": "1(b)", "biz": "The Coffee House", "marks": 4, "read": "B", "stem": "In 2022 there were 18 000 coffee shops in Vietnam. Using this data and Extract B, calculate, to two decimal places, the total market share held by the leading three coffee shop brands in Vietnam. You are advised to show your working.", "ext": [{"id": "A", "t": "About The Coffee House", "p": ["The Coffee House is a chain of coffee shops in Vietnam. The Coffee House opened its first shop in 2014 and within four years it had 100 shops across the country. Its shops are located on busy high streets in Vietnam’s large cities. Coffee shops have grown in popularity in Vietnam and have attracted successful international businesses such as Starbucks.", "The Coffee House is an innovative brand that has been built by offering an attractive space, excellent customer service and product quality at affordable prices. The mission of the business is to ‘deliver happiness’. It aims to provide excellent customer satisfaction as well as providing the employees with an enjoyable place to work.", "The Coffee House is recognised for its innovation by:", "• creating a unique design for each shop to provide a welcoming atmosphere that feels like home", "• regularly updating menus to adapt to changing tastes and trends", "• providing dedicated and comfortable spaces where people can work", "• being one of the first businesses in Vietnam to launch a mobile app to allow customers to order their drinks online", "• investing in its own farm in Vietnam to provide coffee beans for its shops."]}, {"id": "B", "t": "Leading coffee shop brands in Vietnam in 2022 (by number of shops)", "p": ["Highland: 573", "The Coffee House: 154", "Phuc Long: 118", "Trung Nguyen Legend: 95", "Starbucks: 82", "Passio Coffee: 80", "Cong: 54", "Katinat: 41", "PhinDeli: 16", "Cafe Amazon: 15"]}], "ms": "Question Define the term ‘customer satisfaction.’ Mark\nAnswer\n1(a) Knowledge 2\nUp to 2 marks for defining the term ‘customer satisfaction’ e.g.\n• A measure of how a business/product/service (1) meet the\nneeds /expectations of customer (1)\n(2)\nQuestion In 2022 there were 18 000 coffee shops in Vietnam. Mark\nUsing this data and Extract B, calculate, to two decimal places,\nthe total market share held by the leading three coffee shop\nbrands in Vietnam.\nAnswer\n1(b) Knowledge 1, Application 2, Analysis 1\nQuantitative skills assessed:\nQS1 Calculate, use and understand ratios, averages and fractions\nKnowledge\n1 mark for identifying any suitable formula for calculating market\nshare:\n• Sum of the leading shops / total number of shops x 100 (1)\nApplication\nUp to 2 marks for: selecting the correct data\n• 573 + 154 + 118 = 845 (1) / 18 000 x 100 (1)\nAnalysis\n1 mark for calculating the market share\n• 4.69% (1)\nNB: If no working is shown award marks as below:\nIf answer given is 4.69% award 4 marks\nIf answer given is 4.69 award 3 marks\n(4)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. Answer 4.69% with no working = 4 marks; 4.69 (no %) = 3 marks.", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: sum of the three leading shops ÷ total number of shops × 100 [A] (573 + 154 + 118) ÷ 18,000 × 100 [A]", "(2)"], ["Calculate", "573 + 154 + 118 = 845 [An] 845 ÷ 18,000 × 100 = 4.69% (include %) [An]", "(2)"]]}, "type": "calc", "ans": 4.69, "pre": "", "unit": "%", "ansText": "4.69%", "fhint": "market share = leading shops ÷ total shops × 100", "fk": ["share", "÷", "/", "x 100", "× 100", "*100", "x100", "total", "divide"], "data": ["573", "154", "118", "845", "18000", "18 000", "18,000"], "kw": [], "set": "past", "sub": ["1a"], "u": "u1"}, {"n": 5, "topic": 2, "paper": "October 2024", "qn": "2(c)", "biz": "M&S", "marks": 6, "read": "D and F", "stem": "Analyse two advantages to M&S of using face-to-face interviews to collect market research.", "ext": [{"id": "D", "t": "About Marks and Spencer (M&S)", "p": ["M&S is a British retailer. It has a large product portfolio and sells high quality food, clothing and homeware. Globally, it has 1,487 stores and 98 websites.", "The M&S food brand is recognised for its quality, taste and product innovation. In 2022, sales of food increased by 10% and over 1,300 new food products and meals were created and sold. The advertising campaign for its food uses the slogan ‘it’s not just any food, it’s M&S food’.", "M&S is currently a top-performing UK grocery business in terms of percentage growth in market share. The UK grocery market is extremely competitive with Tesco having the largest market share. 10"]}, {"id": "F", "t": "Market research at M&S", "p": ["In 2022, M&S introduced its ‘Voice of the customer’ programme to measure customer satisfaction. As part of the programme, it conducted in-depth, face-to-face interviews with over 400 customers. It gathered research data in a range of areas including website experience, delivery, service, clothing and food."]}], "ms": "Question Analyse two advantages to M&S of using face to face Mark\ninterviews to collect market research.\nAnswer\n2(c) Knowledge 2, Application 2, Analysis\nUp to 2 marks for defining face-to-face interviews, e.g.:\n• A personal meeting (1) to gather opinions from consumers\n(1)\nFor giving two advantages specific to face-to-face interviews, e.g.\n• Body language and facial expressions are more clearly\nidentified\n(1) Visual aids can be used (1)\nApplication\nUp to 2 marks for answers contextualised to M&S e.g.:\n• Non-verbal communication will help the interviewer\ncollect feedback on delivery/in store services provide\nby M&S (1)\n• M&S can show items of clothing and food to customers (1)\nAnalysis\nUp to 2 marks for reasons / causes / consequences for M&S e.g.\n• This may help gather more accurate and honest results to\nallow M&S to make adjustments to its products and services\nwhere needed\n• The responses will help M&S develop new ranges of products\nto better meet its customers’ needs and wants (1)\n(6)", "sup": {"grid": "Point marked: Knowledge 2, Application 2, Analysis 2. No evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A (context), A (analyse). Point 2: K, A (context), A (analyse).", "plan": ["Definition of the key term.", "Point 1: K, A (context), A (analyse).", "Point 2: K, A (context), A (analyse)."], "parts": [["Definition", "A face-to-face interview is a personal meeting to gather opinions from consumers. [K]", "Key term"], ["Point 1", "Body language and non-verbal communication can be clearly seen. [K] M&S interviewed over 400 customers face-to-face about its delivery, service and website experience. [A] Results may be more accurate and honest, so M&S can adjust its products and services where needed. [An]", "(3)"], ["Point 2", "Visual aids can be used during the interview. [K] M&S can show items of clothing and food to customers, including some of the 1,300 new food products created in 2022. [A] Their responses help M&S develop new product ranges that better meet customers' needs and wants. [An]", "(3)"]]}, "type": "pt", "K": [["personal", "meeting", "face to face", "face-to-face", "in person"], ["opinion", "views", "gather", "feedback"], ["body language", "facial", "non-verbal", "non verbal", "expression"], ["visual aid", "show", "sample", "display", "demonstrat"]], "Kmax": 2, "Amax": 2, "Anmax": 2, "kw": ["interview"], "set": "past", "sub": ["2b"], "u": "u1"}, {"n": 6, "topic": 1, "paper": "January 2023", "qn": "1(d)", "biz": "Folding smartphones", "marks": 8, "read": "C", "stem": "The folding smartphone is a niche product. Discuss the likely benefits to a business of selling a niche product, such as the folding smartphone.", "ext": [{"id": "C", "t": "The folding smartphone is likely to remain a niche product", "p": ["In 2021, 1.3 billion smartphones were sold globally. Seven million of these were folding models. This represents 0.5% of the smartphone market. It is predicted that by 2025, this share could rise to 1.8%. One of the most popular folding phones is the Samsung Galaxy Z Flip3, priced at over $1 000. 5"]}], "ms": "Question Discuss the likely benefits to a business of selling a niche product, such as the\nfolding smartphone.\nIndicative content\n1(d) Indicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A niche market is a subset of a larger market where consumers have\nspecific needs and wants\n• A business selling folding phones is likely to have less competition.\nSamsung sells the popular Galaxy Z Flip3 phone and may have a\nlarger market share of this niche segment\n• There is the possibility of charging premium prices in a niche market.\nSamsung’s selling price for the ZFlip3 of $1 000 may increase the\nprofitability of the business\n• The folding phone has a USP which helps differentiate it from other\nproducts. This may enhance Samsung’s reputation and recognition\n• However, the sales volume of folding phones is a small percentage of\nthe smartphone market. This may lead to higher unit costs and lower\nprofit margins on the folding phones\n• Niche businesses can be risky as they are more vulnerable to market\nchange. Changes in fashions and trends may result in declining sales\n• Premium prices charged for niche products are impacted by factors\nsuch as changes to the economy. If there is a downturn in the\neconomy customers may choose cheaper substitutes. This may lead\nto a decrease in demand for businesses selling folding phones\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s) but\nmay be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative information, and shows an awareness of competing\narguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "A niche market is a subset of a larger market where consumers have specific needs and wants. [K]", "Key term"], ["Point 1", "A business selling a niche product is likely to face less competition. [K] Samsung's Galaxy Z Flip3 is one of few folding phones. [A] Samsung may have a larger share of this segment and its USP differentiates it, enhancing its reputation. [An] However, folding phones are a small percentage of the smartphone market, which may mean higher unit costs and lower margins. [Ev]", "(4)"], ["Point 2", "A niche business can charge premium prices. [K] The Galaxy Z Flip3 sells for $1,000. [A] Higher prices increase profitability for the business. [An] However, niche markets are vulnerable to changes in fashions and trends, and in a downturn customers may choose cheaper substitutes, reducing demand. [Ev]", "(4)"]]}, "type": "lev", "kw": ["niche", "segment", "specific needs", "smaller", "subset"], "pts": [{"t": "A niche market is a subset of a larger market where consumers have specific needs and wants", "s": "know"}, {"t": "A business selling folding phones is likely to have less competition. Samsung sells the popular Galaxy Z Flip3 phone and may have a larger market share of this niche segment", "s": "for"}, {"t": "There is the possibility of charging premium prices in a niche market. Samsung’s selling price for the ZFlip3 of $1 000 may increase the profitability of the business", "s": "for"}, {"t": "The folding phone has a USP which helps differentiate it from other products. This may enhance Samsung’s reputation and recognition", "s": "for"}, {"t": "However, the sales volume of folding phones is a small percentage of the smartphone market. This may lead to higher unit costs and lower profit margins on the folding phones", "s": "against"}, {"t": "Niche businesses can be risky as they are more vulnerable to market change. Changes in fashions and trends may result in declining sales", "s": "against"}, {"t": "Premium prices charged for niche products are impacted by factors such as changes to the economy. If there is a downturn in the economy customers may choose cheaper substitutes. This may lead to a decrease in demand for businesses selling folding phones", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "set": "past", "sub": ["1a"], "u": "u1"}, {"n": 7, "topic": 3, "paper": "October 2024", "qn": "2(d)", "biz": "M&S", "marks": 8, "read": "D and E", "stem": "Discuss the importance to M&S of product differentiation for the success of its food sales.", "ext": [{"id": "D", "t": "About Marks and Spencer (M&S)", "p": ["M&S is a British retailer. It has a large product portfolio and sells high quality food, clothing and homeware. Globally, it has 1,487 stores and 98 websites.", "The M&S food brand is recognised for its quality, taste and product innovation. In 2022, sales of food increased by 10% and over 1,300 new food products and meals were created and sold. The advertising campaign for its food uses the slogan ‘it’s not just any food, it’s M&S food’.", "M&S is currently a top-performing UK grocery business in terms of percentage growth in market share. The UK grocery market is extremely competitive with Tesco having the largest market share. 10"]}, {"id": "E", "t": "Selected data for M&S in 2021 and 2022", "p": ["Dec 2021 Dec 2022", "M&S market share of total UK", "3.4% 3.6%", "grocery sales (by revenue)", "Profit £403m £522m"]}], "ms": "Discuss the importance to M&S of product differentiation for the success\nQuestion of its food sales. (8)\nIndicative content\n2(d) Indicative content guidance\nAnswers must be credited by using the level descriptors (below) in line\nwith the general marking guidance. The indicative content below\nexemplifies some of the points that candidates may make but this does\nnot imply that any of these must be included. Other relevant points must\nalso be credited.\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Product differentiation is the process of distinguishing a\nproduct or service from others, to make it more\nattractive to a target market\n• M&S has created a range of food of high quality\nand innovation to give it a USP\n• To maintain its brand image, it is important that M&S\nmakes its food stand out in the grocery market\n• The UK grocery market is competitive and has dominant\nbusinesses such as Tesco. M&S must find ways to\ncompete with its competitors to retain its existing\ncustomers\n• M&S uses its advertising slogan to help it stand out\nfrom other grocery competitors. This may give the\nperception of superior food quality and may attract new\ncustomers\n• However, there are many other factors that will\ncontribute to the success of M&S food sales. Customer\nservice may also be as important to its success\n• It is important that the 1,300 newly created food\nproducts and meals meet the expectation of customers.\nIf they fail to sufficiently differentiate from the\ncompetition they will not encourage repeat purchase\nand brand loyalty\n• Differentiating its products by using high quality\ningredients is likely to increase the production costs and\nincrease prices\n• This may lead to a decrease in demand, particularly\nwhen consumer disposable income is low\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall\nbased. Weak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or\neffect(s) but may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced, and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative\nand/or qualitative information and shows an awareness of\ncompeting arguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Product differentiation is distinguishing a product from others to make it more attractive to a target market. [K]", "Key term"], ["Point 1", "Differentiation gives a business a unique selling point. [K] M&S has created high quality, innovative food. [A] This helps its food stand out and protects its brand image. [An] However, other factors such as customer service may be as important, and the 1,300 new food products must meet expectations or they will not bring repeat purchases. [Ev]", "(4)"], ["Point 2", "Differentiation helps a business compete. [K] The UK grocery market is competitive with dominant businesses such as Tesco, and M&S advertising suggests superior quality. [A] This helps M&S retain customers and attract new ones. [An] However, high quality ingredients raise costs and prices, which may reduce demand when disposable income is low. [Ev]", "(4)"]]}, "type": "lev", "kw": ["differentiat", "usp", "unique selling", "stand out", "distinguish"], "pts": [{"t": "Product differentiation is the process of distinguishing a product or service from others, to make it more attractive to a target market", "s": "know"}, {"t": "M&S has created a range of food of high quality and innovation to give it a USP", "s": "for"}, {"t": "To maintain its brand image, it is important that M&S makes its food stand out in the grocery market", "s": "for"}, {"t": "The UK grocery market is competitive and has dominant businesses such as Tesco. M&S must find ways to compete with its competitors to retain its existing customers", "s": "for"}, {"t": "M&S uses its advertising slogan to help it stand out from other grocery competitors. This may give the perception of superior food quality and may attract new customers", "s": "for"}, {"t": "However, there are many other factors that will contribute to the success of M&S food sales. Customer service may also be as important to its success", "s": "against"}, {"t": "It is important that the 1,300 newly created food products and meals meet the expectation of customers. If they fail to sufficiently differentiate from the competition they will not encourage repeat purchase and brand loyalty", "s": "against"}, {"t": "Differentiating its products by using high quality ingredients is likely to increase the production costs and increase prices", "s": "against"}, {"t": "This may lead to a decrease in demand, particularly when consumer disposable income is low", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced, and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors."]], "set": "past", "sub": ["3e"], "u": "u1"}, {"n": 8, "topic": 2, "paper": "October 2023", "qn": "1(e)", "biz": "Nando's", "marks": 10, "read": "D", "stem": "Nando's collected market research data in China using random sampling. Assess the likely disadvantages to Nando's of using random sampling.", "ext": [{"id": "D", "t": "Market research at Nando’s", "p": ["Before opening stores in China, Nando’s conducted primary market research to understand Chinese food preferences and dining habits. Two hundred surveys were carried out with Chinese chefs, restaurant owners and managers. A random sampling survey method was used to conduct the primary market research."]}], "ms": "Question Assess the likely disadvantages to Nando’s of using random sampling.\nIndicative content\n1(e) Indicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A random sample is one of the methods researchers use\nto choose a sample from a larger population\n• This method means that there is an equal chance that\nany of the subjects in a population will be chosen\n• Random sampling relies on having a full list of the entire\npopulation of chefs and experts in the food industry. This\ndata may be difficult to collect\n• It may take a considerable amount of time to gather\ninformation from a wide range of people over a large\ngeographical area such as China. This may prove costly\nto Nando’s\n• It can be impractical/or not possible to use a completely\nrandom technique, e.g. the target group may be too large\nto assign numbers to\n• Random sampling is designed to be a representative of a\ncommunity or demographic, but there is no guarantee\nthat the data collected will be representative of restaurant\npersonnel in China\n• However, the use of random sampling is likely to remove\nbias for Nando’s\n• Modern technology makes it much easier to create a\nrandom sample\n• If the chefs and food experts are chosen at random,\neach individual in the food industry has the same\nprobability of being selected\n• This should create fair/balanced results which more\naccurately represent the larger group as a whole\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–7 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 8–10 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Random sampling gives every subject in a population an equal chance of being chosen. [K]", "Key term"], ["Point 1", "Random sampling relies on a full list of the population. [K] Nando's would need a full list of all Chinese chefs, restaurant owners and managers. [A] This may be difficult to collect, and there is no guarantee the data will represent restaurant personnel in China. [An] However, modern technology makes random sampling easier to carry out. [Ev]", "(4)"], ["Point 2", "Random sampling can be time consuming and costly. [K] Nando's carried out two hundred surveys with people spread across a large country such as China. [A] This takes time and may be costly to Nando's, and a completely random technique may be impractical if the group is too large to number. [An] However, random sampling is likely to remove bias: each person in the food industry has the same chance of selection, giving fairer results. [Ev]", "(4)"], ["Conclusion", "Overall, the main disadvantages for Nando's are the time and cost of sampling across China, but these may be worth it if the results are fair and unbiased enough to rely on. [Ev]", "(2)"]]}, "type": "lev", "kw": ["random sampl", "equal chance", "population", "sample", "bias", "representative"], "pts": [{"t": "A random sample is one of the methods researchers use to choose a sample from a larger population", "s": "know"}, {"t": "This method means that there is an equal chance that any of the subjects in a population will be chosen", "s": "for"}, {"t": "Random sampling relies on having a full list of the entire population of chefs and experts in the food industry. This data may be difficult to collect", "s": "for"}, {"t": "It may take a considerable amount of time to gather information from a wide range of people over a large geographical area such as China. This may prove costly to Nando’s", "s": "for"}, {"t": "It can be impractical/or not possible to use a completely random technique, e.g. the target group may be too large to assign numbers to", "s": "for"}, {"t": "Random sampling is designed to be a representative of a community or demographic, but there is no guarantee that the data collected will be representative of restaurant personnel in China", "s": "for"}, {"t": "However, the use of random sampling is likely to remove bias for Nando’s", "s": "against"}, {"t": "Modern technology makes it much easier to create a random sample", "s": "against"}, {"t": "If the chefs and food experts are chosen at random, each individual in the food industry has the same probability of being selected", "s": "against"}, {"t": "This should create fair/balanced results which more accurately represent the larger group as a whole", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 7, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 8, 10, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "set": "past", "sub": ["2d"], "u": "u1"}, {"n": 9, "topic": 1, "paper": "October 2023", "qn": "2(e)", "biz": "Pukka", "marks": 10, "read": "E and F", "stem": "Assess the challenges that a business, such as Pukka, may have faced when moving from a niche to a mass marketing strategy.", "ext": [{"id": "E", "t": "Niche brands are increasing their mass market appeal", "p": ["In the last 10 years there has been an increase in the number of health and well-being brands moving from a niche to a mass market. Many health products are benefitting from increased revenue, due to growing consumer desires to live healthier lives. These brands are no longer viewed as exclusive products and are now purchased by more customers each year. One of these brands is Pukka, which sells premium priced speciality tea. The global speciality tea market is predicted to grow by $50bn between 2021 and 2026."]}, {"id": "F", "t": "About Pukka", "p": ["Pukka sells a range of speciality teas including herbal, organic and fruit teas. Entrepreneurs Sebastian Pole and Tim Westwell launched Pukka in 2001. Sebastian had been interested in plants and conservation for many years. He was determined to follow his dream to start a business selling a healthy product. Sebastian saw an advertisement of Tim’s which offered to help start up an ethical business. They agreed to meet to discuss their ideas and Pukka was formed shortly afterwards.", "From the first moment Tim and Sebastian met, they were the perfect match. Although they had completely different personal skills, they shared a common marketing objective, to create a business that would benefit the health of people. Tim had 10 years’ experience as a business management consultant. They spent many hours in Tim’s house planning their future strategy. They worked evenings and weekends to turn their ideas into a successful business."]}], "ms": "Question Assess the challenges that a business, such as Pukka, may have faced\nwhen moving from a niche to a mass marketing strategy.\nIndicative content\n2(e) Indicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A niche marketing strategy appeals to a smaller segment of a\nlarger market where consumers have specific needs and wants.\nMass marketing aims to target the highest number of potential\ncustomers\n• One challenge is the change in promotional costs. It is likely the\npromotional strategy would have changed from lower cost/below\nthe line advertising to more expensive/above the line advertising.\nThis may affect the cash flow for Pukka\n• Changing to a mass marketing strategy would require changes to\nthe distribution networks. In order to reach a global audience, it is\nlikely that Pukka extended its distribution globally involving more\nretailers and wholesalers\n• Pukka is likely to have faced more competition. This may have\nled Pukka to reduce the price of its tea to compete with\nestablished businesses\n• However, the volume sold by Pukka is likely to be much higher.\nThis may lead to lower unit costs/economies of scale and\nincreased profitability\n• Mass marketing may create less of a risk to Pukka. It may be less\nvulnerable to the economic change of individual economies\n• The speciality tea market is set to grow by $50bn by 2027\nproviding Pukka with an opportunity to increase its revenue and\nprofits\n• There are both risks and rewards for businesses using a mass\nmarket strategy, and success depends on effectively managing\nthe change to benefit from economies of scale\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented but may be assertions or incomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–7 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 8–10 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information, and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "A niche strategy targets a smaller segment with specific needs; mass marketing targets the highest number of potential customers. [K]", "Key term"], ["Point 1", "Promotion costs are likely to rise. [K] Pukka would move from low cost below the line promotion to expensive above the line advertising. [A] This may affect Pukka's cash flow. [An] However, the volume sold is likely to be much higher, giving lower unit costs, economies of scale and higher profit. [Ev]", "(4)"], ["Point 2", "There will be more competition and wider distribution is needed. [K] Reaching a global audience needs more retailers and wholesalers, and competition may force Pukka to reduce the price of its tea. [A] Lower prices reduce profit margins. [An] However, the global speciality tea market is predicted to grow by $50bn between 2021 and 2026, and in the last 10 years many health brands have moved from niche to mass market successfully. [Ev]", "(4)"], ["Conclusion", "Overall, there are both risks and rewards; success depends on how well Pukka manages the change so that it benefits from economies of scale. [Ev]", "(2)"]]}, "type": "lev", "kw": ["niche", "mass market", "mass marketing", "segment", "economies of scale"], "pts": [{"t": "A niche marketing strategy appeals to a smaller segment of a larger market where consumers have specific needs and wants. Mass marketing aims to target the highest number of potential customers", "s": "know"}, {"t": "One challenge is the change in promotional costs. It is likely the promotional strategy would have changed from lower cost/below the line advertising to more expensive/above the line advertising. This may affect the cash flow for Pukka", "s": "for"}, {"t": "Changing to a mass marketing strategy would require changes to the distribution networks. In order to reach a global audience, it is likely that Pukka extended its distribution globally involving more retailers and wholesalers", "s": "for"}, {"t": "Pukka is likely to have faced more competition. This may have led Pukka to reduce the price of its tea to compete with established businesses", "s": "for"}, {"t": "However, the volume sold by Pukka is likely to be much higher. This may lead to lower unit costs/economies of scale and increased profitability", "s": "against"}, {"t": "Mass marketing may create less of a risk to Pukka. It may be less vulnerable to the economic change of individual economies", "s": "against"}, {"t": "The speciality tea market is set to grow by $50bn by 2027 providing Pukka with an opportunity to increase its revenue and profits", "s": "against"}, {"t": "There are both risks and rewards for businesses using a mass market strategy, and success depends on effectively managing the change to benefit from economies of scale", "s": "judge"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 7, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 8, 10, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "set": "past", "sub": ["1a", "1c"], "u": "u1"}, {"case": "oatly", "topic": 1, "sub": ["1b"], "marks": 2, "type": "def", "read": "A", "stem": "Define the term 'dynamic market'. (Extract A, line 13)", "parts": [["changing", "change", "changes", "evolv", "develop"], ["taste", "technolog", "competit", "consumer", "customer", "trend", "fashion", "attitude"]], "kw": ["dynamic"], "n": 101, "set": "style", "paper": "Exam style", "qn": "Oatly", "biz": "Oatly", "ext": [{"id": "A", "t": "Oatly: from health food shop to supermarket shelf", "p": ["Oatly is a Swedish business that makes drinks and foods from oats. It was founded in the 1990s after scientists at Lund University developed an alternative to cow's milk for people who could not digest lactose.", "Oatly was a niche brand for more than 20 years, sold mainly in health food shops to vegans and people with allergies. In 2016 it changed its strategy. It began selling to coffee shops, so that baristas could use its Barista Edition oat drink, and then to supermarkets.", "Oatly is now sold in more than 20 countries. It has opened large factories in Sweden, the Netherlands, Singapore and the US. In 2023 its revenue was $783m, compared with $116m in 2018.", "The plant-based drinks market changes quickly. Consumers' attitudes to health, animal welfare and the environment are changing, and an increasing share of oat drinks is bought online and through grocery delivery apps."]}, {"id": "B", "t": "Figure 1: Oat drink sales in Country X ($m)", "p": ["Year | Total market | Oatly | Supermarket own-label", "2021 | 660 | 210 | 92", "2022 | 734 | 221 | 141", "2023 | 800 | 232 | 184"]}, {"id": "C", "t": "Competition heats up in plant-based drinks", "p": ["Large dairy businesses and supermarkets have launched their own oat drinks. In Country X a one-litre carton of supermarket own-label oat drink sells for $1.79, compared with $2.99 for Oatly.", "Oatly has responded by launching new products, including oat-based ice cream, yoghurt and spreads, and by spending heavily on bold, humorous advertising that makes its brand stand out."]}, {"id": "D", "t": "Oatly looks east", "p": ["Oatly plans to grow its sales in China, Japan and South Korea. It has set aside a marketing budget of $25m for the first two years.", "Many consumers in Asia have never tried oat drinks, and tastes differ from Europe. Oat prices rose by 30% in 2022 after droughts reduced harvests, and Oatly cannot predict how prices will change in future."]}], "sup": {"grid": "Point marked: Knowledge 2.", "top": "Follow the department answer structure: Part 1: what it is (1). Part 2: what it leads to (1).", "plan": ["Part 1: what it is (1).", "Part 2: what it leads to (1)."], "parts": [["Knowledge 1", "A dynamic market is one that is constantly changing [K]", "(1)"], ["Knowledge 2", "because of changes in consumer tastes, technology or competition. [K]", "(1)"]]}, "ms": "Knowledge 2\nUp to 2 marks for defining the term, e.g.\n• A dynamic market is one that is constantly changing (1)\n• because of changes in consumer tastes, technology or competition. (1)", "u": "u1"}, {"case": "oatly", "topic": 1, "sub": ["1a"], "marks": 4, "type": "calc", "read": "B", "stem": "Using the data in Figure 1, calculate to two decimal places Oatly's market share of the oat drink market in Country X in 2023. You are advised to show your working.", "ans": 29.0, "pre": "", "unit": "%", "ansText": "29.00%", "fhint": "market share = Oatly sales ÷ total market sales × 100", "fk": ["share", "÷", "/", "x 100", "× 100", "*100", "x100", "divide"], "data": ["232", "800"], "n": 102, "set": "style", "paper": "Exam style", "qn": "Oatly", "biz": "Oatly", "ext": [{"id": "A", "t": "Oatly: from health food shop to supermarket shelf", "p": ["Oatly is a Swedish business that makes drinks and foods from oats. It was founded in the 1990s after scientists at Lund University developed an alternative to cow's milk for people who could not digest lactose.", "Oatly was a niche brand for more than 20 years, sold mainly in health food shops to vegans and people with allergies. In 2016 it changed its strategy. It began selling to coffee shops, so that baristas could use its Barista Edition oat drink, and then to supermarkets.", "Oatly is now sold in more than 20 countries. It has opened large factories in Sweden, the Netherlands, Singapore and the US. In 2023 its revenue was $783m, compared with $116m in 2018.", "The plant-based drinks market changes quickly. Consumers' attitudes to health, animal welfare and the environment are changing, and an increasing share of oat drinks is bought online and through grocery delivery apps."]}, {"id": "B", "t": "Figure 1: Oat drink sales in Country X ($m)", "p": ["Year | Total market | Oatly | Supermarket own-label", "2021 | 660 | 210 | 92", "2022 | 734 | 221 | 141", "2023 | 800 | 232 | 184"]}, {"id": "C", "t": "Competition heats up in plant-based drinks", "p": ["Large dairy businesses and super
