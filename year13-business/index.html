ation, and shows an awareness of competing\narguments/factors.", "type": "lev", "kw": ["product life cycle", "life cycle", "decline", "extension", "new market"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Extending the product life cycle means preventing the decline stage from being reached, so the product continues to sell successfully. [K]", "Key term"], ["Point 1", "Entering a new market where the product is not yet known lets the product life cycle start again. [K] Launching the product in different countries can boost sales when the home market has become saturated. [A] Extra sales revenue from new customers increases the return on the initial investment in the product. [An] However, the product will be in the introductory stage in the new market, so it will need promotion if it is to grow. [Ev]", "(4)"], ["Point 2", "The business does not need to go through the costly and lengthy development stage. [K] The internet has made reaching all parts of the world easier, so an existing product can be sold in an overseas market. [A] This saves time and money compared with creating new products. [An] However, changes may be needed to meet the new market's rules, regulations and culture, and products with very short life cycles may not be worth the effort. [Ev]", "(4)"]]}, "pts": [{"t": "Extending the product life cycle means preventing the decline stage from being reached and so continuing to sell the product successfully", "s": "know"}, {"t": "One way this can happen is by entering a new market where the product is not yet known", "s": "for"}, {"t": "This enables the product life cycle to start again", "s": "for"}, {"t": "The business is already familiar with the product and will be able to use existing production facilities and supply chains thus saving time and money in creating new ones", "s": "for"}, {"t": "The business does not need to go through the development stage which can be costly and/or lengthy, all the initial work has been done", "s": "for"}, {"t": "By finding new customers in new markets the extra sales revenue will increase the return on the initial investment in the product", "s": "for"}, {"t": "However, a new market will need promotion as the product will be in the introductory stage if it is to grow", "s": "against"}, {"t": "Some changes may need to be made to the product to comply with the new market’s rules and regulations", "s": "against"}, {"t": "Cultural adaptations may be needed and not all products will transfer easily between markets", "s": "against"}, {"t": "Some products such as fashion items or rapidly changing technologies have very short life cycles and may not be worth the effort", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]]}, {"n": 207, "u": "u4", "set": "past", "topic": 2, "sub": ["m3"], "marks": 12, "biz": "Senegal", "paper": "January 2023", "qn": "1(d)", "stem": "Assess the importance of political stability in a country when choosing a production location.", "read": "C", "ext": [{"id": "C", "t": "Senegal attracts investors", "p": ["The largest wind farm in West Africa is in Senegal, 70 km northeast of Dakar. Stretching across 41 hectares, the Taiba N’Diaye wind power project has attracted over $400m of Foreign Direct Investment (FDI). When operating at full capacity, it will provide two million people with electricity and supply nearly a sixth of Senegal’s power needs. It is not the only large energy project that looks set to transform Senegal’s economy. Reserves of more than 1 billion barrels of oil and 40,000 billion cubic feet of gas have been found just offshore. Another major find by British oil company BP and US operator Kosmos Energy has led to the development of the $4.8bn Greater Tortue Ahmeyim (GTA) project, which has 15 trillion cubic feet of recoverable gas reserves.", "As a result of the oil and gas discoveries investor interest has increased, encouraged by the appealing nature of the broader Senegalese market. In a relatively unstable region, with recent coups in Guinea and Mali and turbulence in Côte d’Ivoire, Senegal stands out for its political stability."]}], "ms": "Question Assess the importance of political stability when choosing a production\nlocation. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Political stability is important because it means that the business is\nless likely to be disturbed by political events beyond its control\n• Economic policy is less likely to suddenly change\n• Political instability can be very disruptive to business activity such as\ncivil unrest\n• The ‘gilets jaunes’ in France have caused delays and problems for\nsome businesses\n• In extreme form, political instability such as armed insurrection or\neven war can be a catastrophic problem\n• Political stability means that corruption is likely to be lower which\nreduces the costs and problems for a business\n• Politically stable countries such as Senegal may be more attractive to\ninvestors than its close neighbours such as Guinea and Mali that have\nhad coups and terrorist attacks\n• However, other factors may be more important such as the cost and\navailability of labour, - JLR’s decision to increase production in Slovakia\nand Europe\n• Access to raw materials - Senegal may be a stable country but its\nreserves of gas and oil are the main reasons for its recent increase in\nFDI\n• Infrastructure may be an important factor – such as Nissan’s need for a\ndeep water port at Sunderland\n• These may outweigh or override political stability as a deciding factor\n• Being able to manufacture from within a trade bloc such as the EU\nmay be more important\n• Much depends on the nature of the business and its needs\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["political stability", "stable", "instability", "corruption", "government"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Political stability means a country is unlikely to face sudden changes of government, unrest or policy that disrupt business. [K]", "Key term"], ["Point 1", "A stable country means the business is less likely to be disturbed by political events beyond its control, and economic policy is less likely to change suddenly. [K] Politically stable Senegal has attracted over $400m of FDI for its wind farm, more than neighbours such as Guinea and Mali, which have had coups and terrorist attacks. [A] This reduces the risk to the investment, so production is less likely to be interrupted. [An] However, other factors may be more important, such as the cost and availability of labour. [Ev]", "(4)"], ["Point 2", "Political stability usually means lower corruption. [K] Political instability such as civil unrest can be very disruptive to business activity. [A] Lower corruption reduces the costs and problems a business faces. [An] However, access to raw materials may matter more: reserves of more than 1 billion barrels of oil and the $4.8bn GTA gas project are the main reason for the increase in FDI. [Ev]", "(4)"], ["Conclusion", "Overall, political stability is important, but infrastructure, access to resources and being inside a trade bloc may outweigh it; much depends on the nature of the business and its needs. [Ev]", "(2)"]]}, "pts": [{"t": "Political stability is important because it means that the business is less likely to be disturbed by political events beyond its control", "s": "know"}, {"t": "Economic policy is less likely to suddenly change", "s": "for"}, {"t": "Political instability can be very disruptive to business activity such as civil unrest", "s": "for"}, {"t": "The ‘gilets jaunes’ in France have caused delays and problems for some businesses", "s": "for"}, {"t": "In extreme form, political instability such as armed insurrection or even war can be a catastrophic problem", "s": "for"}, {"t": "Political stability means that corruption is likely to be lower which reduces the costs and problems for a business", "s": "for"}, {"t": "Politically stable countries such as Senegal may be more attractive to investors than its close neighbours such as Guinea and Mali that have had coups and terrorist attacks", "s": "for"}, {"t": "However, other factors may be more important such as the cost and availability of labour, - JLR’s decision to increase production in Slovakia and Europe", "s": "against"}, {"t": "Access to raw materials - Senegal may be a stable country but its reserves of gas and oil are the main reasons for its recent increase in FDI", "s": "against"}, {"t": "Infrastructure may be an important factor – such as Nissan’s need for a deep water port at Sunderland", "s": "against"}, {"t": "These may outweigh or override political stability as a deciding factor", "s": "against"}, {"t": "Being able to manufacture from within a trade bloc such as the EU may be more important", "s": "against"}, {"t": "Much depends on the nature of the business and its needs", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 208, "u": "u4", "set": "past", "topic": 2, "sub": ["m2"], "marks": 12, "biz": "Peru", "paper": "June 2023", "qn": "1(d)", "stem": "Assess the importance of the level and growth of disposable income for a business when considering entering a market such as Peru.", "read": "C", "ext": [{"id": "C", "t": "How Peru became one of the biggest markets for Foreign Direct Investment (FDI) in", "p": ["South America", "Peru has a stable economy with strong growth. In the first quarter of 2021, Peru attracted $3.47bn of FDI, more than all of Peru’s FDI in 2020. The World Bank predicts its GDP will grow by 3.9% in 2022 and that it will be the second-fastest growing economy in South America.", "Peru has 21 Free Trade Agreements (FTAs) in force. In addition, it has 28 investment agreements with countries including Canada, Brazil, Chile, Japan and Switzerland. Peru has a low public debt to GDP ratio and is predicted to have the second-lowest inflation rate in South America. It has a good infrastructure and a supportive government with a stable legal framework.", "All this has made Peru a prime location for FDI, particularly in renewable energy, manufacturing, food, tourism, retail and technology. The average salary for an employee in Peru increases by 9% every 17 months. The global average is 3%."]}], "ms": "Question Assess the importance of the level and growth of disposable income for a\nbusiness when considering entering a market such as Peru. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Disposable income is the amount of money that households have\navailable for spending and saving after taxes have been paid\n• The level of disposable income is likely to be very important if a global\nbusiness is to be successful in establishing a market in a country such as\nPeru\n• If incomes are low then competition for that income is likely to be strong\nand it may not be worthwhile entering the market\n• The growth of incomes is important if demand is to be sustained and\nsales increased\n• Peru is predicted to be the second fastest growing economy in South\nAmerica and salaries are growing faster than the global average, 9%\ncompared to 3%\n• This will be an important pull factor for a global business wishing to\nincrease sales and/or enter a new market, particularly if its goods or\nservices are income elastic\n• A rapidly growing economy is likely to have a growing demand for\nconsumer and luxury goods and there may be gaps in the market for a\nnew entrant\n• However, the level and growth of disposable income is just one factor\nthat will be taken into account when considering entering a new market\n• Others factors such as infrastructure are important because a business\nmust be able to maintain supply/distribution networks to retail outlets\n• Government policies which increase the ease of doing business may be\nimportant, Peru has a supportive government and a stable legal structure\n• Trading agreements may be a factor, for example Peru has 21 FTAs\nwhich will make cross-border trading easier\n• Much will depend on the nature of the business wanting to enter the\nmarket. Those businesses dependent on consumer sales with income\nelastic products will consider the level and growth of disposable income\nto be an important factor\n• Businesses that supply capital goods to other businesses may be more\ninfluenced by the high level of FDI into Peru\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["disposable income", "income", "spend", "demand"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Disposable income is the income people have left to spend after taxes and other deductions. [K]", "Key term"], ["Point 1", "Rising disposable income increases demand for goods and services. [K] Peru has a stable economy, and the World Bank predicts its GDP will grow by 3.9% in 2022. [A] A business entering Peru can expect growing sales, especially for products customers buy more of as incomes rise. [An] However, income may be unequally distributed, so many consumers may still have low spending power. [Ev]", "(4)"], ["Point 2", "The level of disposable income affects what consumers can afford. [K] The average salary in Peru increases by 9% every 17 months, compared with a global average of 3%. [A] Higher incomes allow businesses to sell premium products and earn higher margins. [An] However, other factors such as ease of doing business, infrastructure, political stability and exchange rates may be more important. [Ev]", "(4)"], ["Conclusion", "The level and growth of disposable income is important for most businesses entering Peru, but its importance depends on the type of product and the other market factors. [Ev]", "(2)"]]}, "pts": [{"t": "Disposable income is the amount of money that households have available for spending and saving after taxes have been paid", "s": "know"}, {"t": "The level of disposable income is likely to be very important if a global business is to be successful in establishing a market in a country such as Peru", "s": "for"}, {"t": "If incomes are low then competition for that income is likely to be strong and it may not be worthwhile entering the market", "s": "for"}, {"t": "The growth of incomes is important if demand is to be sustained and sales increased", "s": "for"}, {"t": "Peru is predicted to be the second fastest growing economy in South America and salaries are growing faster than the global average, 9% compared to 3%", "s": "for"}, {"t": "This will be an important pull factor for a global business wishing to increase sales and/or enter a new market, particularly if its goods or services are income elastic", "s": "for"}, {"t": "A rapidly growing economy is likely to have a growing demand for consumer and luxury goods and there may be gaps in the market for a new entrant", "s": "for"}, {"t": "However, the level and growth of disposable income is just one factor that will be taken into account when considering entering a new market", "s": "against"}, {"t": "Others factors such as infrastructure are important because a business must be able to maintain supply/distribution networks to retail outlets", "s": "against"}, {"t": "Government policies which increase the ease of doing business may be important, Peru has a supportive government and a stable legal structure", "s": "against"}, {"t": "Trading agreements may be a factor, for example Peru has 21 FTAs which will make cross-border trading easier", "s": "against"}, {"t": "Much will depend on the nature of the business wanting to enter the market. Those businesses dependent on consumer sales with income elastic products will consider the level and growth of disposable income to be an important factor", "s": "against"}, {"t": "Businesses that supply capital goods to other businesses may be more influenced by the high level of FDI into Peru", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 209, "u": "u4", "set": "past", "topic": 2, "sub": ["m2"], "marks": 12, "biz": "Kenya", "paper": "January 2024", "qn": "1(d)", "stem": "Assess the importance of exchange rates for a global business when considering entering a market such as Kenya.", "read": "C", "ext": [{"id": "C", "t": "Kenyan shilling (KES) drops to a new historic low of 120 against the US dollar", "p": ["The Kenyan shilling dropped to a new low in August 2022, at 120 shillings to the US dollar amid the controversies surrounding President-elect William Ruto’s victory in the keenly contested Kenyan presidential elections.", "This was the 16th month in a row that the shilling had depreciated against the US dollar. As one financial analyst puts it, a depreciating shilling means imports, such as petrol, food and raw materials, will become more expensive. This will further increase the household cost of living as importers pass on the higher costs to consumers."]}], "ms": "Question Assess the importance of exchange rates for a global business when considering\nentering a market such as Kenya. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• An exchange rate is the price of one currency expressed in terms of\nanother\n• Changes in exchange rates can be important for businesses when\nentering a market in another country because currencies need changing\nfor trade to take place\n• Depreciation of a currency is usually seen as being bad for importers\n• Goods and services entering the country from somewhere with a\nstronger currency will appear to be more expensive\n• This would not be good for a business wishing to sell its products in\nsomewhere like Kenya as Kenyans will have to give up more shillings\nthan they previously did for the same product\n• Not only that but consumers’ ability to buy will be reduced as they have\nto give up more of their currency to buy petrol and food meaning they\nhave less to spend on products from new entrants\n• The opposite will happen if the exchange rate in the market has\nappreciated relative to the one the global business is based in, then the\nimported goods will seem cheaper and be more attractive to consumers\n• Other things being equal a business entering a new market would\nprefer that market’s currency to be stable and not depreciating\n• However, it depends by how much the currency is depreciating and\nhow long the depreciation lasts.\n• PED is important, some businesses may not be too badly affected as\nmost customers will still want to buy even as prices in their currency\nrise\n• Businesses such as Apple have products that are likely to be price\ninelastic and many of its customers will continue to purchase\n• Other considerations may be more important than movements in\nexchange rates such as ease of doing business, infrastructure, political\nstability, supply chain constraints, level of competition\n• These factors may be more important than those caused by exchange\nrate fluctuation depending on the nature of the product or business\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["exchange rate", "currency", "depreciat", "appreciat", "shilling"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "An exchange rate is the price of one currency expressed in terms of another. [K]", "Key term"], ["Point 1", "Depreciation of a currency is usually bad for businesses selling imports into that country. [K] The Kenyan shilling dropped to a ne logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 210, "u": "u4", "set": "past", "topic": 2, "sub": ["m1"], "marks": 12, "biz": "Australia", "paper": "October 2023", "qn": "1(d)", "stem": "Assess the advantages of outsourcing for a business wanting to improve cost competitiveness.", "read": "B", "ext": [{"id": "B", "t": "Outsourcing can be a solution to Australia’s skills crisis", "p": ["Australia has a skills shortage problem that is the worst ever seen. There is a shortage of people as well as skills. This is where outsourcing can help, it provides people to fill the gaps.", "In Australia, more than 30,000 businesses have outsourced work to different countries. In Australia the outsourcing industry is worth $35bn and growing at 3.3%. This shows that there is a huge demand for it and not just in the traditional areas of finance, telecommunications and banking but now other areas of the service industry.", "In 2022 we work in a global world where work teams are connected by technology and leadership. Smart businesses will use this to their advantage. Outsourcing is one solution to the current skills crisis – but only if it is done well.", ""]}], "ms": "Question Assess the advantages of outsourcing for a business wanting to improve cost\ncompetitiveness. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Outsourcing means moving a business function or department to a\nspecialist external provider which may or may not be overseas\n• By reducing costs, profitability can be increased which may enable prices\nto be reduced and improve competitiveness\n• Increased profitability can lead to greater investment for future growth\n• Skilled workers can be found that may not be available at home, this is\nthe case with Australia in Extract B\n• Such workers may be specialists and offer a more skilled and efficient\nservice than might be case within the business itself\n• By outsourcing some support functions, the business can then\nconcentrate on its core competences\n• Outsourcing can improve speed, flexibility and quality of the product or\nservice\n• Modern technology has made it much easier for a business to be run\nfrom different countries\n• However, problems may arise\n• There may be communication problems arising as a result of language or\ncultural differences\n• It can be difficult to oversee events or guarantee quality of output from a\ndistance\n• There may be a risk of loss of intellectual property\n• A business may risk losing its own identity and corporate culture if it\nrelies too much on others\n• Nevertheless, the extract suggests outsourcing will work if done well\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["outsourc", "external provider", "specialist", "cost competitive"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Outsourcing means moving a business function or department to a specialist external provider, which may or may not be overseas. [K]", "Key term"], ["Point 1", "Outsourcing reduces costs. [K] In Australia, more than 30,000 businesses have outsourced work to different countries. [A] Lower costs increase profitability, which may allow prices to be reduced and improve competitiveness. [An] However, there may be communication problems as a result of language or cultural differences. [Ev]", "(4)"], ["Point 2", "Skilled workers can be found who may not be available at home. [K] Australia has its worst ever skills shortage. [A] Specialist workers may offer a more skilled and efficient service, so the business can concentrate on its core competences. [An] However, it can be difficult to guarantee quality from a distance, and there is a risk of losing intellectual property and corporate identity. [Ev]", "(4)"], ["Conclusion", "Overall, outsourcing can improve cost competitiveness if it is done well, but the business must manage quality and communication carefully. [Ev]", "(2)"]]}, "pts": [{"t": "Outsourcing means moving a business function or department to a specialist external provider which may or may not be overseas", "s": "kno
