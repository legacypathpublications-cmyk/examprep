ts such as developing cutting-edge vacuum cleaners or hair stylers, is arguably more critical than legal issues", "s": "against"}, {"t": "Dyson's success may be more influenced by its ability to create environmentally friendly products and adapt to changing environmental regulations than by legal factors", "s": "against"}, {"t": "Overall, Dyson’s success will be influenced by a wide range of external influences and all will contribute to its success in the future 13", "s": "judge"}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "set": "past", "sub": ["pe"]}, {"case": "unilever", "topic": 1, "sub": ["co"], "marks": 4, "type": "pt", "read": "A", "stem": "Explain one benefit to Unilever of setting corporate objectives.", "K": [["focus", "direction", "target", "measure", "benchmark", "motivat", "coordinat", "decision"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["objective"], "ms": "1(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a benefit, e.g.\n• Gives focus and direction / a target to measure performance against (1)\nApplication\nUp to 2 marks for context, e.g.\n• Unilever wants to grow sales faster and improve profit margins (1)\n• It is focusing on 30 Power Brands (1)\nAnalysis\n1 mark for developing the benefit, e.g.\n• Managers across a large global business can make decisions that work towards the same goals, so resources go to the brands most likely to grow (1)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. No evaluation.", "top": "One benefit, two pieces of Unilever context, one developed consequence.", "plan": ["Identify one benefit (K1).", "Two points of Unilever context (A2).", "Develop it (An1)."], "parts": [["Knowledge", "Corporate objectives give a business focus and a target to measure performance against. [K]", "1 mark"], ["Application", "Unilever aims to grow sales faster and improve profit margins [A] by focusing on its 30 Power Brands. [A]", "3 marks"], ["Analysis", "This means managers across the whole business work towards the same goals, so resources go to the brands most likely to grow. [An]", "4 marks"]]}, "n": 101, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "About Unilever", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day.", "In 2024, Unilever launched a plan to focus on its 30 biggest brands, which it calls Power Brands. It set objectives to grow sales faster and to improve profit margins. It also announced plans to separate its ice cream business from the rest of the group."]}, {"id": "B", "t": "Selected Unilever products in Country Y, 2024", "p": ["Dove soap: market share 28%, market growth 2%", "Knorr stock cubes: market share 35%, market growth 1%", "Dove men care: market share 6%, market growth 12%", "Plant-based meat (new brand): market share 2%, market growth 15%", "Low-fat spread: market share 4%, market growth -3%"]}, {"id": "C", "t": "Dove and growth in emerging markets", "p": ["Dove has used its 'Real Beauty' campaign since 2004 to show real women in its advertising. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Unilever's Indian business, Hindustan Unilever, is one of the largest consumer goods businesses in India. Many consumers in emerging markets have rising incomes and are buying branded products for the first time. Unilever is considering launching new premium products in India and also entering new countries in Africa."]}]}, {"case": "unilever", "topic": 2, "sub": ["pf"], "marks": 8, "type": "lev", "read": "B", "stem": "Using the Boston Matrix and the data in Extract B, discuss how Unilever could manage its product portfolio.", "kw": ["boston", "cash cow", "star", "question mark", "problem child", "dog", "portfolio", "market growth", "market share"], "pts": [{"s": "know", "t": "The Boston Matrix classifies products by market share and market growth into stars, cash cows, question marks and dogs"}, {"s": "for", "t": "Dove soap (28% share, 2% growth) and Knorr (35% share, 1% growth) are cash cows that generate cash with little investment"}, {"s": "for", "t": "Cash from cash cows can fund question marks such as plant-based meat (2% share, 15% growth)"}, {"s": "for", "t": "Dove men care (6% share, 12% growth) is a question mark that could become a star with more promotion"}, {"s": "for", "t": "Low-fat spread (4% share, -3% growth) is a dog and could be sold or withdrawn to free up resources"}, {"s": "against", "t": "However, the Boston Matrix only uses two measures and ignores profit, so a dog could still be profitable"}, {"s": "against", "t": "The data is for one country, Country Y, so products may be in different positions elsewhere"}, {"s": "against", "t": "Investing in question marks is risky because they may never gain enough market share"}], "n": 102, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "About Unilever", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day.", "In 2024, Unilever launched a plan to focus on its 30 biggest brands, which it calls Power Brands. It set objectives to grow sales faster and to improve profit margins. It also announced plans to separate its ice cream business from the rest of the group."]}, {"id": "B", "t": "Selected Unilever products in Country Y, 2024", "p": ["Dove soap: market share 28%, market growth 2%", "Knorr stock cubes: market share 35%, market growth 1%", "Dove men care: market share 6%, market growth 12%", "Plant-based meat (new brand): market share 2%, market growth 15%", "Low-fat spread: market share 4%, market growth -3%"]}, {"id": "C", "t": "Dove and growth in emerging markets", "p": ["Dove has used its 'Real Beauty' campaign since 2004 to show real women in its advertising. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Unilever's Indian business, Hindustan Unilever, is one of the largest consumer goods businesses in India. Many consumers in emerging markets have rising incomes and are buying branded products for the first time. Unilever is considering launching new premium products in India and also entering new countries in Africa."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• The Boston Matrix classifies products by market share and market growth into stars, cash cows, question marks and dogs\n• Dove soap (28% share, 2% growth) and Knorr (35% share, 1% growth) are cash cows that generate cash with little investment\n• Cash from cash cows can fund question marks such as plant-based meat (2% share, 15% growth)\n• Dove men care (6% share, 12% growth) is a question mark that could become a star with more promotion\n• Low-fat spread (4% share, -3% growth) is a dog and could be sold or withdrawn to free up resources\n• However, the Boston Matrix only uses two measures and ignores profit, so a dog could still be profitable\n• The data is for one country, Country Y, so products may be in different positions elsewhere\n• Investing in question marks is risky because they may never gain enough market share\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 3 (6 to 8): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation)."], "parts": [["Knowledge", "The Boston Matrix classifies products by market share and market growth into stars, cash cows, question marks and dogs. [K]", "Level 1"], ["Main points", "Dove soap (28% share, 2% growth) and Knorr (35% share, 1% growth) are cash cows that generate cash with little investment. [A] [An] Cash from cash cows can fund question marks such as plant-based meat (2% share, 15% growth). [An] Dove men care (6% share, 12% growth) is a question mark that could become a star with more promotion. [A] [An] Low-fat spread (4% share, -3% growth) is a dog and could be sold or withdrawn to free up resources. [An]", "Level 2/2"], ["Other side", "However, the Boston Matrix only uses two measures and ignores profit, so a dog could still be profitable. [Ev] The data is for one country, Country Y, so products may be in different positions elsewhere. [Ev] Investing in question marks is risky because they may never gain enough market share. [Ev]", "Level 3"]]}}, {"case": "unilever", "topic": 2, "sub": ["ps"], "marks": 12, "type": "lev", "read": "C", "stem": "Using Porter's Strategic Matrix, assess whether a differentiation strategy is the best way for Dove to compete.", "kw": ["porter", "differentiation", "cost leadership", "focus", "strategic matrix", "generic"], "pts": [{"s": "know", "t": "Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market"}, {"s": "for", "t": "Dove's 'Real Beauty' campaign since 2004 gives it a clear identity that makes it different from rivals"}, {"s": "for", "t": "Differentiation allows Dove to charge higher prices than supermarket own-label products, increasing profit margins"}, {"s": "for", "t": "A strong brand builds customer loyalty, making demand less price sensitive"}, {"s": "for", "t": "Rising incomes in emerging markets mean more consumers can afford branded products"}, {"s": "against", "t": "However, cheaper own-label soaps and shampoos may attract price-sensitive customers"}, {"s": "against", "t": "Differentiation needs continuous spending on advertising and product development, which raises costs"}, {"s": "against", "t": "In some emerging markets a cost leadership approach with smaller, cheaper packs may reach more consumers"}, {"s": "judge", "t": "Overall, differentiation is likely to suit Dove because of its strong brand, but it depends on whether customers keep paying higher prices when incomes are squeezed"}], "n": 103, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "About Unilever", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day.", "In 2024, Unilever launched a plan to focus on its 30 biggest brands, which it calls Power Brands. It set objectives to grow sales faster and to improve profit margins. It also announced plans to separate its ice cream business from the rest of the group."]}, {"id": "B", "t": "Selected Unilever products in Country Y, 2024", "p": ["Dove soap: market share 28%, market growth 2%", "Knorr stock cubes: market share 35%, market growth 1%", "Dove men care: market share 6%, market growth 12%", "Plant-based meat (new brand): market share 2%, market growth 15%", "Low-fat spread: market share 4%, market growth -3%"]}, {"id": "C", "t": "Dove and growth in emerging markets", "p": ["Dove has used its 'Real Beauty' campaign since 2004 to show real women in its advertising. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Unilever's Indian business, Hindustan Unilever, is one of the largest consumer goods businesses in India. Many consumers in emerging markets have rising incomes and are buying branded products for the first time. Unilever is considering launching new premium products in India and also entering new countries in Africa."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "ms": "Indicative content\n• Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market\n• Dove's 'Real Beauty' campaign since 2004 gives it a clear identity that makes it different from rivals\n• Differentiation allows Dove to charge higher prices than supermarket own-label products, increasing profit margins\n• A strong brand builds customer loyalty, making demand less price sensitive\n• Rising incomes in emerging markets mean more consumers can afford branded products\n• However, cheaper own-label soaps and shampoos may attract price-sensitive customers\n• Differentiation needs continuous spending on advertising and product development, which raises costs\n• In some emerging markets a cost leadership approach with smaller, cheaper packs may reach more consumers\n• Overall, differentiation is likely to suit Dove because of its strong brand, but it depends on whether customers keep paying higher prices when incomes are squeezed\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (9 to 12): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement."], "parts": [["Knowledge", "Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market. [K]", "Level 1"], ["Main points", "Dove's 'Real Beauty' campaign since 2004 gives it a clear identity that makes it different from rivals. [A] [An] Differentiation allows Dove to charge higher prices than supermarket own-label products, increasing profit margins. [An] A strong brand builds customer loyalty, making demand less price sensitive. [A] [An] Rising incomes in emerging markets mean more consumers can afford branded products. [An]", "Level 2/3"], ["Other side", "However, cheaper own-label soaps and shampoos may attract price-sensitive customers. [Ev] Differentiation needs continuous spending on advertising and product development, which raises costs. [Ev] In some emerging markets a cost leadership approach with smaller, cheaper packs may reach more consumers. [Ev]", "Level 3/4"], ["Judgement", "Overall, differentiation is likely to suit Dove because of its strong brand, but it depends on whether customers keep paying higher prices when incomes are squeezed. [Ev]", "Level 4"]]}}, {"case": "unilever", "topic": 2, "sub": ["an"], "marks": 20, "type": "lev", "read": "A and C", "stem": "Using Ansoff's Matrix, evaluate whether Unilever should grow by launching new premium products in India or by entering new countries in Africa.", "kw": ["ansoff", "product development", "market development", "market penetration", "diversification", "risk"], "pts": [{"s": "know", "t": "Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk"}, {"s": "for", "t": "Launching new premium products in India is product development: new products in an existing market"}, {"s": "for", "t": "Hindustan Unilever is already one of the largest consumer goods businesses in India, so it has distribution, brand awareness and market knowledge"}, {"s": "for", "t": "Rising incomes mean more Indian consumers are buying branded products, creating demand for premium products"}, {"s": "for", "t": "Entering new countries in Africa is market development: existing products in new markets, which offers a large long-term opportunity"}, {"s": "against", "t": "However, product development needs investment in research and development and the new products may fail"}, {"s": "against", "t": "Market development in Africa is risky because Unilever may lack knowledge of local tastes, laws and distribution"}, {"s": "against", "t": "Political and economic instability in some countries may reduce returns"}, {"s": "against", "t": "Unilever is focusing on its 30 Power Brands, so it may prefer to use existing brands rather than create new ones"}, {"s": "judge", "t": "Overall, product development in India is likely to be lower risk because Unilever already knows the market; it depends on how quickly incomes rise and the cost of developing new products"}, {"s": "judge", "t": "Unilever should prioritise premium versions of its Power Brands in India, and enter African markets gradually, starting with countries where it already has distribution"}], "n": 104, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "About Unilever", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day.", "In 2024, Unilever launched a plan to focus on its 30 biggest brands, which it calls Power Brands. It set objectives to grow sales faster and to improve profit margins. It also announced plans to separate its ice cream business from the rest of the group."]}, {"id": "B", "t": "Selected Unilever products in Country Y, 2024", "p": ["Dove soap: market share 28%, market growth 2%", "Knorr stock cubes: market share 35%, market growth 1%", "Dove men care: market share 6%, market growth 12%", "Plant-based meat (new brand): market share 2%, market growth 15%", "Low-fat spread: market share 4%, market growth -3%"]}, {"id": "C", "t": "Dove and growth in emerging markets", "p": ["Dove has used its 'Real Beauty' campaign since 2004 to show real women in its advertising. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Unilever's Indian business, Hindustan Unilever, is one of the largest consumer goods businesses in India. Many consumers in emerging markets have rising incomes and are buying branded products for the first time. Unilever is considering launching new premium products in India and also entering new countries in Africa."]}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "ms": "Indicative content\n• Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk\n• Launching new premium products in India is product development: new products in an existing market\n• Hindustan Unilever is already one of the largest consumer goods businesses in India, so it has distribution, brand awareness and market knowledge\n• Rising incomes mean more Indian consumers are buying branded products, creating demand for premium products\n• Entering new countries in Africa is market development: existing products in new markets, which offers a large long-term opportunity\n• However, product development needs investment in research and development and the new products may fail\n• Market development in Africa is risky because Unilever may lack knowledge of local tastes, laws and distribution\n• Political and economic instability in some countries may reduce returns\n• Unilever is focusing on its 30 Power Brands, so it may prefer to use existing brands rather than create new ones\n• Overall, product development in India is likely to be lower risk because Unilever already knows the market; it depends on how quickly incomes rise and the cost of developing new products\n• Unilever should prioritise premium versions of its Power Brands in India, and enter African markets gradually, starting with countries where it already has distribution\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (15 to 20): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement and a recommendation."], "parts": [["Knowledge", "Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk. [K]", "Level 1"], ["Main points", "Launching new premium products in India is product development: new products in an existing market. [A] [An] Hindustan Unilever is already one of the largest consumer goods businesses in India, so it has distribution, brand awareness and market knowledge. [An] Rising incomes mean more Indian consumers are buying branded products, creating demand for premium products. [A] [An] Entering new countries in Africa is market development: existing products in new markets, which offers a large long-term opportunity. [An]", "Level 2/3"], ["Other side", "However, product development needs investment in research and development and the new products may fail. [Ev] Market development in Africa is risky because Unilever may lack knowledge of local tastes, laws and distribution. [Ev] Political and economic instability in some countries may reduce returns. [Ev] Unilever is focusing on its 30 Power Brands, so it may prefer to use existing brands rather than create new ones. [Ev]", "Level 3/4"], ["Judgement", "Overall, product development in India is likely to be lower risk because Unilever already knows the market; it depends on how quickly incomes rise and the cost of developing new products. [Ev] Unilever should prioritise premium versions of its Power Brands in India, and enter African markets gradually, starting with countries where it already has distribution. [Ev]", "Level 4"]]}}, {"case": "airbus", "topic": 2, "sub": ["sd"], "marks": 4, "type": "pt", "read": "D", "stem": "Explain one difference between a strategic decision and a tactical decision for Airbus.", "K": [["long-term", "long term", "short-term", "short term", "senior", "risk", "whole business", "day-to-day", "reversible", "large investment"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["strategic", "tactical"], "ms": "2(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a difference, e.g.\n• Strategic decisions are long-term and made by senior managers, tactical decisions are short-term (1)\nApplication\nUp to 2 marks for context, e.g.\n• Building a second assembly line in Mobile, Alabama (1)\n• Changing delivery schedules or prices offered to airlines (1)\nAnalysis\n1 mark for developing the difference, e.g.\n• The new assembly line commits large resources and is hard to reverse, so it carries more risk than a change to a delivery schedule (1)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. No evaluation.", "top": "One difference, two pieces of Airbus context, one developed consequence.", "plan": ["Identify one difference (K1).", "Airbus examples of each (A2).", "Develop the difference (An1)."], "parts": [["Knowledge", "Strategic decisions are long-term decisions made by senior managers, while tactical decisions are short-term. [K]", "1 mark"], ["Application", "Building a second assembly line in Mobile, Alabama is strategic [A], while changing delivery schedules for airlines is tactical. [A]", "3 marks"], ["Analysis", "The assembly line commits large resources and is hard to reverse, so it carries far more risk than a change to a delivery schedule. [An]", "4 marks"]]}, "n": 105, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "D", "t": "About Airbus", "p": ["Airbus is a European aircraft manufacturer with its headquarters in France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It has opened assembly lines in Toulouse, Hamburg, Tianjin in China and Mobile in the USA.", "In 2023, Airbus announced a second A320 family assembly line in Mobile, Alabama. The project requires a large investment in new buildings and equipment and hundreds of extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "E", "t": "Selected information about Airbus", "p": ["Strength: largest order book in the industry and a strong reputation for fuel-efficient aircraft.", "Weakness: delays from suppliers of engines and parts have slowed deliveries.", "Opportunity: airlines want new fuel-efficient aircraft to reduce costs and carbon emissions; air travel in Asia is growing.", "Threat: Boeing and new Chinese manufacturer COMAC; trade disputes between the EU, USA and China."]}]}, {"case": "airbus", "topic": 2, "sub": ["sd"], "marks": 8, "type": "lev", "read": "D", "stem": "Discuss the likely impact on Airbus's resources of opening a second assembly line in Mobile, Alabama.", "kw": ["resource", "human", "physical", "financial", "employee", "equipment", "finance"], "pts": [{"s": "know", "t": "Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees)"}, {"s": "for", "t": "Airbus needs a large investment in new buildings and equipment, which uses financial resources and may require borrowing"}, {"s": "for", "t": "Hundreds of extra skilled employees must be recruited and trained, increasing labour costs"}, {"s": "for", "t": "The extra physical capacity helps Airbus deliver its order book of more than 8,000 aircraft faster"}, {"s": "for", "t": "Building aircraft in the USA may reduce transport costs and the impact of trade disputes for American customers"}, {"s": "against", "t": "However, supply delays for engines and parts mean the new line may not be fully used"}, {"s": "against", "t": "Skilled aircraft workers may be scarce, so Airbus may need to pay higher wages"}, {"s": "against", "t": "Airbus already runs a line in Mobile, so it can use existing knowledge and managers, reducing the impact"}], "n": 106, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "D", "t": "About Airbus", "p": ["Airbus is a European aircraft manufacturer with its headquarters in France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It has opened assembly lines in Toulouse, Hamburg, Tianjin in China and Mobile in the USA.", "In 2023, Airbus announced a second A320 family assembly line in Mobile, Alabama. The project requires a large investment in new buildings and equipment and hundreds of extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "E", "t": "Selected information about Airbus", "p": ["Strength: largest order book in the industry and a strong reputation for fuel-efficient aircraft.", "Weakness: delays from suppliers of engines and parts have slowed deliveries.", "Opportunity: airlines want new fuel-efficient aircraft to reduce costs and carbon emissions; air travel in Asia is growing.", "Threat: Boeing and new Chinese manufacturer COMAC; trade disputes between the EU, USA and China."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees)\n• Airbus needs a large investment in new buildings and equipment, which uses financial resources and may require borrowing\n• Hundreds of extra skilled employees must be recruited and trained, increasing labour costs\n• The extra physical capacity helps Airbus deliver its order book of more than 8,000 aircraft faster\n• Building aircraft in the USA may reduce transport costs and the impact of trade disputes for American customers\n• However, supply delays for engines and parts mean the new line may not be fully used\n• Skilled aircraft workers may be scarce, so Airbus may need to pay higher wages\n• Airbus already runs a line in Mobile, so it can use existing knowledge and managers, reducing the impact\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 3 (6 to 8): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation)."], "parts": [["Knowledge", "Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees). [K]", "Level 1"], ["Main points", "Airbus needs a large investment in new buildings and equipment, which uses financial resources and may require borrowing. [A] [An] Hundreds of extra skilled employees must be recruited and trained, increasing labour costs. [An] The extra physical capacity helps Airbus deliver its order book of more than 8,000 aircraft faster. [A] [An] Building aircraft in the USA may reduce transport costs and the impact of trade disputes for American customers. [An]", "Level 2/2"], ["Other side", "However, supply delays for engines and parts mean the new line may not be fully used. [Ev] Skilled aircraft workers may be scarce, so Airbus may need to pay higher wages. [Ev] Airbus already runs a line in Mobile, so it can use existing knowledge and managers, reducing the impact. [Ev]", "Level 3"]]}}, {"case": "airbus", "topic": 3, "sub": ["sw"], "marks": 12, "type": "lev", "read": "D and E", "stem": "Assess the usefulness to Airbus of SWOT analysis when deciding its future strategy.", "kw": ["swot", "strength", "weakness", "opportunit", "threat", "internal", "external"], "pts": [{"s": "know", "t": "SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats"}, {"s": "for", "t": "Airbus can build on its strength of the largest order book and fuel-efficient aircraft"}, {"s": "for", "t": "Identifying the weakness of supplier delays shows Airbus needs to work with suppliers or find new ones"}, {"s": "for", "t": "The opportunity of growing air travel in Asia supports investment in assembly lines such as Tianjin"}, {"s": "for", "t": "Recognising threats from Boeing, COMAC and trade disputes helps Airbus plan to reduce risk"}, {"s": "against", "t": "However, SWOT is a snapshot and the aircraft market and trade relations can change quickly"}, {"s": "against", "t": "SWOT can be subjective, and it does not tell Airbus which strategy to choose"}, {"s": "against", "t": "SWOT should be used with other tools such as PESTLE and Porter's five forces"}, {"s": "judge", "t": "Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools"}], "n": 107, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "D", "t": "About Airbus", "p": ["Airbus is a European aircraft manufacturer with its headquarters in France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It has opened assembly lines in Toulouse, Hamburg, Tianjin in China and Mobile in the USA.", "In 2023, Airbus announced a second A320 family assembly line in Mobile, Alabama. The project requires a large investment in new buildings and equipment and hundreds of extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "E", "t": "Selected information about Airbus", "p": ["Strength: largest order book in the industry and a strong reputation for fuel-efficient aircraft.", "Weakness: delays from suppliers of engines and parts have slowed deliveries.", "Opportunity: airlines want new fuel-efficient aircraft to reduce costs and carbon emissions; air travel in Asia is growing.", "Threat: Boeing and new Chinese manufacturer COMAC; trade disputes between the EU, USA and China."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "ms": "Indicative content\n• SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats\n• Airbus can build on its strength of the largest order book and fuel-efficient aircraft\n• Identifying the weakness of supplier delays shows Airbus needs to work with suppliers or find new ones\n• The opportunity of growing air travel in Asia supports investment in assembly lines such as Tianjin\n• Recognising threats from Boeing, COMAC and trade disputes helps Airbus plan to reduce risk\n• However, SWOT is a snapshot and the aircraft market and trade relations can change quickly\n• SWOT can be subjective, and it does not tell Airbus which strategy to choose\n• SWOT should be used with other tools such as PESTLE and Porter's five forces\n• Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (9 to 12): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement."], "parts": [["Knowledge", "SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats. [K]", "Level 1"], ["Main points", "Airbus can build on its strength of the largest order book and fuel-efficient aircraft. [A] [An] Identifying the weakness of supplier delays shows Airbus needs to work with suppliers or find new ones. [An] The opportunity of growing air travel in Asia supports investment in assembly lines such as Tianjin. [A] [An] Recognising threats from Boeing, COMAC and trade disputes helps Airbus plan to reduce risk. [An]", "Level 2/3"], ["Other side", "However, SWOT is a snapshot and the aircraft market and trade relations can change quickly. [Ev] SWOT can be subjective, and it does not tell Airbus which strategy to choose. [Ev] SWOT should be used with other tools such as PESTLE and Porter's five forces. [Ev]", "Level 3/4"], ["Judgement", "Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools. [Ev]", "Level 4"]]}}, {"case": "lime", "topic": 4, "sub": ["ff"], "marks": 8, "type": "lev", "read": "F", "stem": "Using Porter's five forces, discuss the threat to Lime from the bargaining power of buyers and the threat of substitutes.", "kw": ["porter", "five forces", "buyer power", "bargaining power", "substitute", "switch"], "pts": [{"s": "know", "t": "Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need"}, {"s": "for", "t": "Customers can easily compare prices on different apps and switch to a rival at any time, so buyer power is high"}, {"s": "for", "t": "High buyer power limits how much Lime can raise its unlock fee and per-minute charge, reducing profit margins"}, {"s": "for", "t": "Buses, trains, bicycles and walking are substitutes, so customers can travel without using Lime at all"}, {"s": "for", "t": "City councils choosing one or two operators also act as powerful buyers of licences"}, {"s": "against", "t": "However, as rivals merge or leave the market, such as Bird, customers have fewer apps to switch to, reducing buyer power"}, {"s": "against", "t": "Scooters are convenient for short trips, so some customers will still prefer them to substitutes"}, {"s": "against", "t": "Lime operates in more than 250 cities, so its brand is well known and customers may stay loyal"}], "n": 108, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "F", "t": "About Lime", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 250 cities around the world, including many in Europe.", "Customers unlock a scooter with the app and pay a fee to unlock it plus a charge per minute. They can easily compare prices with other apps and switch to a rival at any time.", "Customers can also choose other ways to travel, such as buses, trains, their own bicycles or walking."]}, {"id": "G", "t": "A changing market for shared scooters", "p": ["In 2023, voters in Paris chose to ban rented electric scooters from the city. Other cities have reduced the number of scooter licences or set lower speed limits.", "In 2024, two European rivals, Tier and Dott, merged. Another rival, Bird, filed for bankruptcy in the USA in 2023. Some cities now give licences to only one or two operators after a tender process.", "Higher interest rates have made it more expensive for scooter businesses to borrow. Consumers are increasingly interested in green transport, and new battery   const skip = new Set('The This That These It In A An As At By For From If Its On Or So To We With He She They Our Their Extract Source Sources Section Many Most Some Since Today When While After Before Although Over Under Each Every One Two Three Four Five Riders There However Also Globally Currently'.split(' '));
  (txt.match(/\b[A-Z][a-zA-Z&’']{2,}(?:\s[A-Z][a-zA-Z&’']{2,})*/g) || []).forEach(w => { const f = w.split(' ')[0]; if (!skip.has(f)) terms.set(lc(w), w); });

const CHAIN = /\b(because|so that|so |therefore|this means|which means|meaning|this leads?|leads? to|leading to|as a result|resulting in|results? in|which could|this could|this may|this will|this would|consequently|thus|hence|due to|causing|allowing|enabling|so it)\b/;

    R.crit.push({ c: K ? 'ok' : 'no', t: `${tag('K')} Formula ${K ? '(1 mark)' : '(0 marks)'}`, d: K ? 'You showed the formula or method.' : `Write the formula first: ${q.fhint}.` });
    R.crit.push({ c: Ap === 2 ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Correct data selected (${Ap}/2)`, d: wk.length ? `Figures used from the data: ${wk.join(', ')}.` : 'Show the figures you took from the question and the extract.' });
    R.crit.push({ c: correct ? 'ok' : 'no', t: `${tag('An')} Correct answer ${correct ? '(1 mark)' : '(0 marks)'}`, d: correct ? `Correct: ${q.ansText}.` : 'Check your working and round to two decimal places where asked.' });
    if (q.unit || q.pre) R.crit.push({ c: unitOk ? 'ok' : correct ? 'part' : 'no', t: 'Units', d: unitOk ? 'Units shown correctly.' : `Write the answer with its units: ${q.ansText}. Without units, a correct answer with no working gets 3 marks.` });
    return { mark: m, max: 4, label: `${m}/4 (point marked)`, ...R };
  }
  const ctx = findContext(q, ans), kh = kwHits(q.kw || [], ans);
  if (q.type === 'pt') {
    const kg = q.K.filter(g => kwHits(g, ans).length).length;
    const K = Math.min(q.Kmax, Math.max(kg, kh.length ? 1 : 0)), Ap = Math.min(q.Amax, ctx.length), An = K ? Math.min(q.Anmax, A0.chains.length) : 0, m = K + Ap + An;
    R.crit.push({ c: K === q.Kmax ? 'ok' : K ? 'part' : 'no', t: `${tag('K')} Knowledge ${K}/${q.Kmax}`, d: K ? 'You identified relevant business knowledge.' : 'Start by stating the business idea clearly (e.g. the benefit or definition).' });
    R.crit.push({ c: Ap === q.Amax ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Application ${Ap}/${q.Amax}`, d: ctx.length ? `Context found: ${ctx.slice(0, 6).join(', ')}.` : `Use evidence about ${q.biz} from the extract (names, figures, facts).` });
    R.crit.push({ c: An === q.Anmax ? 'ok' : An ? 'part' : 'no', t: `${tag('An')} Analysis ${An}/${q.Anmax}`, d: An ? `${A0.chains.length} developed chain(s) of reasoning found (because / so / this means).` : 'Develop each point: say what it leads to, using "so", "this means" or "as a result".' });
    if (q.marks >= 4) R.tips.push('No evaluation is needed for this question. Spend the time on context and development.');
    return { mark: m, max: q.marks, label: `${m}/${q.marks} (point marked)`, ...R };
  }
  // levels marked
  const cov = coverPts(q, ans), hit = cov.filter(p => p.hit), against = hit.some(p => p.s === 'against');
  const K = kh.length > 0 || hit.some(p => p.s === 'know'), Ap = ctx.length, An = A0.chains.length;
  const bal = A0.bal.length > 0 && (against || A0.bal.length >= 2), judge = A0.judge.length > 0, rec = A0.rec.length > 0;
  const top = q.lv.length; let lv = 1, need = {};
  if (K && Ap >= 1 && An >= 1) lv = 2;
  if (q.marks <= 8) { if (lv === 2 && Ap >= 2 && An >= 2 && bal) lv = 3; }
  else if (q.marks <= 12) { if (lv === 2 && Ap >= 2 && An >= 2 && A0.w >= 100) lv = 3; if (lv === 3 && bal && judge && A0.w >= 160) lv = 4; }
  else { if (lv === 2 && Ap >= 3 && An >= 3 && bal && A0.w >= 170) lv = 3; if (lv === 3 && judge && rec && Ap >= 4 && An >= 4 && A0.w >= 220) lv = 4; }
  const [, lo, hi, desc] = bandOf(q, lv);
  const tgtA = lv >= 3 ? 5 : 3, tgtAn = lv >= 3 ? 5 : 3;
  const strength = Math.min(1, 0.4 * Math.min(1, hit.length / Math.max(3, q.pts.length * 0.45)) + 0.3 * Math.min(1, Ap / tgtA) + 0.3 * Math.min(1, An / tgtAn));
  const m = lo + Math.round((hi - lo) * strength);
  R.crit.push({ c: K ? 'ok' : 'no', t: `${tag('K')} Knowledge`, d: K ? `You used key terms: ${kh.slice(0, 4).join(', ') || 'from the mark scheme'}.` : 'Define the key term in the question at the start of your answer.' });
  R.crit.push({ c: Ap >= (q.marks >= 20 ? 4 : 2) ? 'ok' : Ap ? 'part' : 'no', t: `${tag('A')} Application: ${Ap} piece(s) of context`, d: Ap ? `Evidence used: ${ctx.slice(0, 8).join(', ')}.` : `Use evidence from Extract ${q.read}: names, figures and facts about ${q.biz}.` });
  R.crit.push({ c: An >= (q.marks >= 20 ? 4 : 2) ? 'ok' : An ? 'part' : 'no', t: `${tag('An')} Analysis: ${An} developed chain(s)`, d: An ? 'Chains found, e.g. "' + esc(A0.chains[0].slice(0, 110)) + (A0.chains[0].length > 110 ? '…' : '') + '"' : 'Link causes to consequences: point, because, this means.' });
  R.crit.push({ c: bal ? 'ok' : A0.bal.length ? 'part' : 'no', t: `${tag('Ev')} Balance: the other side`, d: bal ? 'You considered competing arguments (however / on the other hand).' : 'Add a "however" paragraph with a counter-argument. The top band needs a balanced assessment.' });
  if (q.marks >= 10) R.crit.push({ c: judge ? 'ok' : 'no', t: `${tag('Ev')} Supported judgement`, d: judge ? 'You reached a judgement (overall / it depends on).' : 'Finish with "Overall… because… it depends on…". The top band needs a supported judgement.' });
  if (q.marks >= 20) R.crit.push({ c: rec ? 'ok' : 'no', t: `${tag('Ev')} Recommendation`, d: rec ? 'You proposed a solution or recommendation.' : 'Level 4 needs a conclusion that proposes a solution or recommendation ("it should…").' });
  if (q.marks <= 8) R.tips.push('This 8-mark question needs balance, but no conclusion is required.');
  if (lv < top) { const nb = bandOf(q, lv + 1); R.tips.push(`To reach Level ${nb[0]} (${nb[1]} to ${nb[2]} marks): ${nb[3]}`); }
  return { mark: m, max: q.marks, level: lv, label: `Level ${lv} (${lo} to ${hi} marks)`, desc, cov, ...R };
}

  const x = D.exams.find(e => e.id === xid); if (!x) return home();
  const saved = store.get('exam-' + xid, null);
  if (!EXAM || EXAM.id !== xid) EXAM = saved && !saved.finished ? saved : { id: xid, i: 0, ans: {}, end: Date.now() + Math.round(x.qs.reduce((a, n) => a + Q.find(q => q.n === n).marks, 0) * M.mins * 60000), finished: false, self: {} };
  if (EXAM.finished) return examResults(x);
  renderExamQ(x);
}
function renderExamQ(x) {
  const q = Q.find(qq => qq.n === x.qs[EXAM.i]), id = 'ex' + q.n;
  $('#app').innerHTML = `<div class="exambar"><b>${esc(x.name)}</b><span class="timer" id="timer"></span><div class="qnav">${x.qs.map((n, i) => `<button class="${i === EXAM.i ? 'cur' : ''} ${(EXAM.ans[n] || '').trim() ? 'done' : ''}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div><span style="margin-left:auto"></span><button class="btn" id="finish">Finish and mark</button></div>
  <div id="confirm"></div>
  <div class="qview"><aside class="sheet booklet">${extractsHTML(q)}</aside><section class="sheet qpaper">
  <div class="qhead"><span class="qnum" style="color:${col(q)}">Question ${EXAM.i + 1} of ${x.qs.length}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:4px 0 0">${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) + '  |  ' : 'Exam style  |  '}${esc(q.biz)}</p><p class="qstem">${esc(q.stem)}</p>
  <label for="${id}" class="eyebrow">Your answer</label><textarea class="answer" id="${id}" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="counter" id="wc"></span><div class="row"><button class="btn ghost" id="prev" ${EXAM.i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${EXAM.i < x.qs.length - 1 ? '' : 'disabled'}>Next →</button></div></div></section></div>`;
  const ta = $('#' + id), save = () => { EXAM.ans[q.n] = ta.value; store.set('exam-' + x.id, EXAM); $('#wc').textContent = `${words(ta.value).length} words`; };
  ta.value = EXAM.ans[q.n] || ''; save(); ta.addEventListener('input', save);
  const go = i => { EXAM.i = i; store.set('exam-' + x.id, EXAM); renderExamQ(x); window.scrollTo(0, 0); };
  document.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#prev').addEventListener('click', () => go(EXAM.i - 1)); $('#next').addEventListener('click', () => go(EXAM.i + 1));
  $('#finish').addEventListener('click', () => { const blank = x.qs.filter(n => !(EXAM.ans[n] || '').trim()).length;
    $('#confirm').innerHTML = `<div class="confirm"><b>Finish the paper and mark it?</b> ${blank ? `You have ${blank} unanswered question(s).` : 'All questions have an answer.'} You cannot change answers after marking.<div class="row" style="margin-top:10px"><button class="btn" id="yes">Yes, mark my paper</button><button class="btn ghost" id="no">Keep writing</button></div></div>`;
    $('#yes').addEventListener('click', () => finish(x)); $('#no').addEventListener('click', () => $('#confirm').innerHTML = ''); });
  clearInterval(tick); const t = () => { const s = Math.max(0, Math.round((EXAM.end - Date.now()) / 1000)), el = $('#timer'); if (!el) return clearInterval(tick);
    el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left` : 'Time is up'; el.classList.toggle('low', s < 300); };
  t(); tick = setInterval(t, 1000);
}
function finish(x) { clearInterval(tick); EXAM.finished = true; store.set('exam-' + x.id, EXAM); examResults(x); window.scrollTo(0, 0); }
function examResults(x) {
  const qs = x.qs.map(n => Q.find(q => q.n === n)), max = qs.reduce((a, q) => a + q.marks, 0);
  const comp = qs.reduce((a, q) => a + mark(q, EXAM.ans[q.n] || '').mark, 0), selfTot = () => qs.reduce((a, q) => a + (EXAM.self[q.n] ?? 0), 0), selfN = () => qs.filter(q => EXAM.self[q.n] != null).length;
  $('#app').innerHTML = `<div class="eyebrow">${SETS[x.set].name}  |  ${esc(x.name)}  |  Results</div><h1>Your paper is marked</h1>
  <div class="cmp" style="max-width:640px"><div><span class="eyebrow">Computer mark</span><b>${comp}/${max}</b><span class="muted">${Math.round(100 * comp / max)}%</span></div><div><span class="eyebrow">Your self-mark</span><b id="selftot">${selfTot()}/${max}</b><span class="muted" id="selfn">${selfN()} of ${qs.length} questions self-marked</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="again">Start this paper again</button><a class="btn ghost" href="#${x.set}-papers">Choose another paper</a></div>
  ${qs.map((q, i) => { const r = mark(q, EXAM.ans[q.n] || ''), id = 'r' + q.n;
    return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Question ${i + 1}: ${esc(q.biz)}  <span class="muted">(${q.marks} marks)</span></span><span class="mk">${r.mark}/${r.max}  ·  ${esc(r.label)}</span></summary>
    <p class="qstem">${esc(q.stem)}</p><h3>Your answer</h3><pre class="ms" style="font-family:var(--body)">${esc(EXAM.ans[q.n] || '(no answer)')}</pre>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const q = h.startsWith('q-') ? Q.find(x => x.n === +h.slice(2)) : null;
  const ex = h.startsWith('paper-') ? D.exams.find(e => e.id === h.slice(6)) : null;
  const v = q ? q.set : ex ? ex.set : h.split('-')[0];
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (q) questionView(q.n);
  else if (ex) examStart(ex.id);
  else if (h === 'past' || h === 'style') section(h);
  else if (h === 'past-papers' || h === 'style-papers') examPick(h.split('-')[0]);
  else if (h === 'past-topics' || h === 'style-topics') topicsView(h.split('-')[0]);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
