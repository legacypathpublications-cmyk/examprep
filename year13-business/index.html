ng cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (9 to 12): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement."], "parts": [["Knowledge", "Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market. [K]", "Level 1"], ["Main points", "Dove's 'Real Beauty' campaign since 2004 gives it a clear identity that makes it different from rivals. [A] [An] Differentiation allows Dove to charge higher prices than supermarket own-label products, increasing profit margins. [An] A strong brand builds customer loyalty, making demand less price sensitive. [A] [An] Rising incomes in emerging markets mean more consumers can afford branded products. [An]", "Level 2/3"], ["Other side", "However, cheaper own-label soaps and shampoos may attract price-sensitive customers. [Ev] Differentiation needs continuous spending on advertising and product development, which raises costs. [Ev] In some emerging markets a cost leadership approach with smaller, cheaper packs may reach more consumers. [Ev]", "Level 3/4"], ["Judgement", "Overall, differentiation is likely to suit Dove because of its strong brand, but it depends on whether customers keep paying higher prices when incomes are squeezed. [Ev]", "Level 4"]]}, "u": "u3"}, {"case": "unilever", "topic": 2, "sub": ["an"], "marks": 20, "type": "lev", "read": "A and C", "stem": "Using Ansoff's Matrix, evaluate whether Unilever should grow by launching new premium products in India or by entering new countries in Africa.", "kw": ["ansoff", "product development", "market development", "market penetration", "diversification", "risk"], "pts": [{"s": "know", "t": "Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk"}, {"s": "for", "t": "Launching new premium products in India is product development: new products in an existing market"}, {"s": "for", "t": "Hindustan Unilever is already one of the largest consumer goods businesses in India, so it has distribution, brand awareness and market knowledge"}, {"s": "for", "t": "Rising incomes mean more Indian consumers are buying branded products, creating demand for premium products"}, {"s": "for", "t": "Entering new countries in Africa is market development: existing products in new markets, which offers a large long-term opportunity"}, {"s": "against", "t": "However, product development needs investment in research and development and the new products may fail"}, {"s": "against", "t": "Market development in Africa is risky because Unilever may lack knowledge of local tastes, laws and distribution"}, {"s": "against", "t": "Political and economic instability in some countries may reduce returns"}, {"s": "against", "t": "Unilever is focusing on its 30 Power Brands, so it may prefer to use existing brands rather than create new ones"}, {"s": "judge", "t": "Overall, product development in India is likely to be lower risk because Unilever already knows the market; it depends on how quickly incomes rise and the cost of developing new products"}, {"s": "judge", "t": "Unilever should prioritise premium versions of its Power Brands in India, and enter African markets gradually, starting with countries where it already has distribution"}], "n": 104, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "About Unilever", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day.", "In 2024, Unilever launched a plan to focus on its 30 biggest brands, which it calls Power Brands. It set objectives to grow sales faster and to improve profit margins. It also announced plans to separate its ice cream business from the rest of the group."]}, {"id": "B", "t": "Selected Unilever products in Country Y, 2024", "p": ["Dove soap: market share 28%, market growth 2%", "Knorr stock cubes: market share 35%, market growth 1%", "Dove men care: market share 6%, market growth 12%", "Plant-based meat (new brand): market share 2%, market growth 15%", "Low-fat spread: market share 4%, market growth -3%"]}, {"id": "C", "t": "Dove and growth in emerging markets", "p": ["Dove has used its 'Real Beauty' campaign since 2004 to show real women in its advertising. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Unilever's Indian business, Hindustan Unilever, is one of the largest consumer goods businesses in India. Many consumers in emerging markets have rising incomes and are buying branded products for the first time. Unilever is considering launching new premium products in India and also entering new countries in Africa."]}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "ms": "Indicative content\n• Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk\n• Launching new premium products in India is product development: new products in an existing market\n• Hindustan Unilever is already one of the largest consumer goods businesses in India, so it has distribution, brand awareness and market knowledge\n• Rising incomes mean more Indian consumers are buying branded products, creating demand for premium products\n• Entering new countries in Africa is market development: existing products in new markets, which offers a large long-term opportunity\n• However, product development needs investment in research and development and the new products may fail\n• Market development in Africa is risky because Unilever may lack knowledge of local tastes, laws and distribution\n• Political and economic instability in some countries may reduce returns\n• Unilever is focusing on its 30 Power Brands, so it may prefer to use existing brands rather than create new ones\n• Overall, product development in India is likely to be lower risk because Unilever already knows the market; it depends on how quickly incomes rise and the cost of developing new products\n• Unilever should prioritise premium versions of its Power Brands in India, and enter African markets gradually, starting with countries where it already has distribution\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (15 to 20): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement and a recommendation."], "parts": [["Knowledge", "Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk. [K]", "Level 1"], ["Main points", "Launching new premium products in India is product development: new products in an existing market. [A] [An] Hindustan Unilever is already one of the largest consumer goods businesses in India, so it has distribution, brand awareness and market knowledge. [An] Rising incomes mean more Indian consumers are buying branded products, creating demand for premium products. [A] [An] Entering new countries in Africa is market development: existing products in new markets, which offers a large long-term opportunity. [An]", "Level 2/3"], ["Other side", "However, product development needs investment in research and development and the new products may fail. [Ev] Market development in Africa is risky because Unilever may lack knowledge of local tastes, laws and distribution. [Ev] Political and economic instability in some countries may reduce returns. [Ev] Unilever is focusing on its 30 Power Brands, so it may prefer to use existing brands rather than create new ones. [Ev]", "Level 3/4"], ["Judgement", "Overall, product development in India is likely to be lower risk because Unilever already knows the market; it depends on how quickly incomes rise and the cost of developing new products. [Ev] Unilever should prioritise premium versions of its Power Brands in India, and enter African markets gradually, starting with countries where it already has distribution. [Ev]", "Level 4"]]}, "u": "u3"}, {"case": "airbus", "topic": 2, "sub": ["sd"], "marks": 4, "type": "pt", "read": "D", "stem": "Explain one difference between a strategic decision and a tactical decision for Airbus.", "K": [["long-term", "long term", "short-term", "short term", "senior", "risk", "whole business", "day-to-day", "reversible", "large investment"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["strategic", "tactical"], "ms": "2(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a difference, e.g.\n• Strategic decisions are long-term and made by senior managers, tactical decisions are short-term (1)\nApplication\nUp to 2 marks for context, e.g.\n• Building a second assembly line in Mobile, Alabama (1)\n• Changing delivery schedules or prices offered to airlines (1)\nAnalysis\n1 mark for developing the difference, e.g.\n• The new assembly line commits large resources and is hard to reverse, so it carries more risk than a change to a delivery schedule (1)", "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. No evaluation.", "top": "One difference, two pieces of Airbus context, one developed consequence.", "plan": ["Identify one difference (K1).", "Airbus examples of each (A2).", "Develop the difference (An1)."], "parts": [["Knowledge", "Strategic decisions are long-term decisions made by senior managers, while tactical decisions are short-term. [K]", "1 mark"], ["Application", "Building a second assembly line in Mobile, Alabama is strategic [A], while changing delivery schedules for airlines is tactical. [A]", "3 marks"], ["Analysis", "The assembly line commits large resources and is hard to reverse, so it carries far more risk than a change to a delivery schedule. [An]", "4 marks"]]}, "n": 105, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "D", "t": "About Airbus", "p": ["Airbus is a European aircraft manufacturer with its headquarters in France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It has opened assembly lines in Toulouse, Hamburg, Tianjin in China and Mobile in the USA.", "In 2023, Airbus announced a second A320 family assembly line in Mobile, Alabama. The project requires a large investment in new buildings and equipment and hundreds of extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "E", "t": "Selected information about Airbus", "p": ["Strength: largest order book in the industry and a strong reputation for fuel-efficient aircraft.", "Weakness: delays from suppliers of engines and parts have slowed deliveries.", "Opportunity: airlines want new fuel-efficient aircraft to reduce costs and carbon emissions; air travel in Asia is growing.", "Threat: Boeing and new Chinese manufacturer COMAC; trade disputes between the EU, USA and China."]}], "u": "u3"}, {"case": "airbus", "topic": 2, "sub": ["sd"], "marks": 8, "type": "lev", "read": "D", "stem": "Discuss the likely impact on Airbus's resources of opening a second assembly line in Mobile, Alabama.", "kw": ["resource", "human", "physical", "financial", "employee", "equipment", "finance"], "pts": [{"s": "know", "t": "Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees)"}, {"s": "for", "t": "Airbus needs a large investment in new buildings and equipment, which uses financial resources and may require borrowing"}, {"s": "for", "t": "Hundreds of extra skilled employees must be recruited and trained, increasing labour costs"}, {"s": "for", "t": "The extra physical capacity helps Airbus deliver its order book of more than 8,000 aircraft faster"}, {"s": "for", "t": "Building aircraft in the USA may reduce transport costs and the impact of trade disputes for American customers"}, {"s": "against", "t": "However, supply delays for engines and parts mean the new line may not be fully used"}, {"s": "against", "t": "Skilled aircraft workers may be scarce, so Airbus may need to pay higher wages"}, {"s": "against", "t": "Airbus already runs a line in Mobile, so it can use existing knowledge and managers, reducing the impact"}], "n": 106, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "D", "t": "About Airbus", "p": ["Airbus is a European aircraft manufacturer with its headquarters in France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It has opened assembly lines in Toulouse, Hamburg, Tianjin in China and Mobile in the USA.", "In 2023, Airbus announced a second A320 family assembly line in Mobile, Alabama. The project requires a large investment in new buildings and equipment and hundreds of extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "E", "t": "Selected information about Airbus", "p": ["Strength: largest order book in the industry and a strong reputation for fuel-efficient aircraft.", "Weakness: delays from suppliers of engines and parts have slowed deliveries.", "Opportunity: airlines want new fuel-efficient aircraft to reduce costs and carbon emissions; air travel in Asia is growing.", "Threat: Boeing and new Chinese manufacturer COMAC; trade disputes between the EU, USA and China."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees)\n• Airbus needs a large investment in new buildings and equipment, which uses financial resources and may require borrowing\n• Hundreds of extra skilled employees must be recruited and trained, increasing labour costs\n• The extra physical capacity helps Airbus deliver its order book of more than 8,000 aircraft faster\n• Building aircraft in the USA may reduce transport costs and the impact of trade disputes for American customers\n• However, supply delays for engines and parts mean the new line may not be fully used\n• Skilled aircraft workers may be scarce, so Airbus may need to pay higher wages\n• Airbus already runs a line in Mobile, so it can use existing knowledge and managers, reducing the impact\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 3 (6 to 8): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation)."], "parts": [["Knowledge", "Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees). [K]", "Level 1"], ["Main points", "Airbus needs a large investment in new buildings and equipment, which uses financial resources and may require borrowing. [A] [An] Hundreds of extra skilled employees must be recruited and trained, increasing labour costs. [An] The extra physical capacity helps Airbus deliver its order book of more than 8,000 aircraft faster. [A] [An] Building aircraft in the USA may reduce transport costs and the impact of trade disputes for American customers. [An]", "Level 2/2"], ["Other side", "However, supply delays for engines and parts mean the new line may not be fully used. [Ev] Skilled aircraft workers may be scarce, so Airbus may need to pay higher wages. [Ev] Airbus already runs a line in Mobile, so it can use existing knowledge and managers, reducing the impact. [Ev]", "Level 3"]]}, "u": "u3"}, {"case": "airbus", "topic": 3, "sub": ["sw"], "marks": 12, "type": "lev", "read": "D and E", "stem": "Assess the usefulness to Airbus of SWOT analysis when deciding its future strategy.", "kw": ["swot", "strength", "weakness", "opportunit", "threat", "internal", "external"], "pts": [{"s": "know", "t": "SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats"}, {"s": "for", "t": "Airbus can build on its strength of the largest order book and fuel-efficient aircraft"}, {"s": "for", "t": "Identifying the weakness of supplier delays shows Airbus needs to work with suppliers or find new ones"}, {"s": "for", "t": "The opportunity of growing air travel in Asia supports investment in assembly lines such as Tianjin"}, {"s": "for", "t": "Recognising threats from Boeing, COMAC and trade disputes helps Airbus plan to reduce risk"}, {"s": "against", "t": "However, SWOT is a snapshot and the aircraft market and trade relations can change quickly"}, {"s": "against", "t": "SWOT can be subjective, and it does not tell Airbus which strategy to choose"}, {"s": "against", "t": "SWOT should be used with other tools such as PESTLE and Porter's five forces"}, {"s": "judge", "t": "Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools"}], "n": 107, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "D", "t": "About Airbus", "p": ["Airbus is a European aircraft manufacturer with its headquarters in France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It has opened assembly lines in Toulouse, Hamburg, Tianjin in China and Mobile in the USA.", "In 2023, Airbus announced a second A320 family assembly line in Mobile, Alabama. The project requires a large investment in new buildings and equipment and hundreds of extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "E", "t": "Selected information about Airbus", "p": ["Strength: largest order book in the industry and a strong reputation for fuel-efficient aircraft.", "Weakness: delays from suppliers of engines and parts have slowed deliveries.", "Opportunity: airlines want new fuel-efficient aircraft to reduce costs and carbon emissions; air travel in Asia is growing.", "Threat: Boeing and new Chinese manufacturer COMAC; trade disputes between the EU, USA and China."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "ms": "Indicative content\n• SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats\n• Airbus can build on its strength of the largest order book and fuel-efficient aircraft\n• Identifying the weakness of supplier delays shows Airbus needs to work with suppliers or find new ones\n• The opportunity of growing air travel in Asia supports investment in assembly lines such as Tianjin\n• Recognising threats from Boeing, COMAC and trade disputes helps Airbus plan to reduce risk\n• However, SWOT is a snapshot and the aircraft market and trade relations can change quickly\n• SWOT can be subjective, and it does not tell Airbus which strategy to choose\n• SWOT should be used with other tools such as PESTLE and Porter's five forces\n• Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (9 to 12): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement."], "parts": [["Knowledge", "SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats. [K]", "Level 1"], ["Main points", "Airbus can build on its strength of the largest order book and fuel-efficient aircraft. [A] [An] Identifying the weakness of supplier delays shows Airbus needs to work with suppliers or find new ones. [An] The opportunity of growing air travel in Asia supports investment in assembly lines such as Tianjin. [A] [An] Recognising threats from Boeing, COMAC and trade disputes helps Airbus plan to reduce risk. [An]", "Level 2/3"], ["Other side", "However, SWOT is a snapshot and the aircraft market and trade relations can change quickly. [Ev] SWOT can be subjective, and it does not tell Airbus which strategy to choose. [Ev] SWOT should be used with other tools such as PESTLE and Porter's five forces. [Ev]", "Level 3/4"], ["Judgement", "Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools. [Ev]", "Level 4"]]}, "u": "u3"}, {"case": "lime", "topic": 4, "sub": ["ff"], "marks": 8, "type": "lev", "read": "F", "stem": "Using Porter's five forces, discuss the threat to Lime from the bargaining power of buyers and the threat of substitutes.", "kw": ["porter", "five forces", "buyer power", "bargaining power", "substitute", "switch"], "pts": [{"s": "know", "t": "Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need"}, {"s": "for", "t": "Customers can easily compare prices on different apps and switch to a rival at any time, so buyer power is high"}, {"s": "for", "t": "High buyer power limits how much Lime can raise its unlock fee and per-minute charge, reducing profit margins"}, {"s": "for", "t": "Buses, trains, bicycles and walking are substitutes, so customers can travel without using Lime at all"}, {"s": "for", "t": "City councils choosing one or two operators also act as powerful buyers of licences"}, {"s": "against", "t": "However, as rivals merge or leave the market, such as Bird, customers have fewer apps to switch to, reducing buyer power"}, {"s": "against", "t": "Scooters are convenient for short trips, so some customers will still prefer them to substitutes"}, {"s": "against", "t": "Lime operates in more than 250 cities, so its brand is well known and customers may stay loyal"}], "n": 108, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "F", "t": "About Lime", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 250 cities around the world, including many in Europe.", "Customers unlock a scooter with the app and pay a fee to unlock it plus a charge per minute. They can easily compare prices with other apps and switch to a rival at any time.", "Customers can also choose other ways to travel, such as buses, trains, their own bicycles or walking."]}, {"id": "G", "t": "A changing market for shared scooters", "p": ["In 2023, voters in Paris chose to ban rented electric scooters from the city. Other cities have reduced the number of scooter licences or set lower speed limits.", "In 2024, two European rivals, Tier and Dott, merged. Another rival, Bird, filed for bankruptcy in the USA in 2023. Some cities now give licences to only one or two operators after a tender process.", "Higher interest rates have made it more expensive for scooter businesses to borrow. Consumers are increasingly interested in green transport, and new battery technology allows batteries to be swapped without moving the scooter."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need\n• Customers can easily compare prices on different apps and switch to a rival at any time, so buyer power is high\n• High buyer power limits how much Lime can raise its unlock fee and per-minute charge, reducing profit margins\n• Buses, trains, bicycles and walking are substitutes, so customers can travel without using Lime at all\n• City councils choosing one or two operators also act as powerful buyers of licences\n• However, as rivals merge or leave the market, such as Bird, customers have fewer apps to switch to, reducing buyer power\n• Scooters are convenient for short trips, so some customers will still prefer them to substitutes\n• Lime operates in more than 250 cities, so its brand is well known and customers may stay loyal\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 3 (6 to 8): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation)."], "parts": [["Knowledge", "Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need. [K]", "Level 1"], ["Main points", "Customers can easily compare prices on different apps and switch to a rival at any time, so buyer power is high. [A] [An] High buyer power limits how much Lime can raise its unlock fee and per-minute charge, reducing profit margins. [An] Buses, trains, bicycles and walking are substitutes, so customers can travel without using Lime at all. [A] [An] City councils choosing one or two operators also act as powerful buyers of licences. [An]", "Level 2/2"], ["Other side", "However, as rivals merge or leave the market, such as Bird, customers have fewer apps to switch to, reducing buyer power. [Ev] Scooters are convenient for short trips, so some customers will still prefer them to substitutes. [Ev] Lime operates in more than 250 cities, so its brand is well known and customers may stay loyal. [Ev]", "Level 3"]]}, "u": "u3"}, {"case": "lime", "topic": 4, "sub": ["ce"], "marks": 12, "type": "lev", "read": "G", "stem": "Assess how changes in the competitive environment may affect Lime.", "kw": ["competitive environment", "competition", "rival", "merge", "market share", "licence"], "pts": [{"s": "know", "t": "The competitive environment describes the number and strength of rivals and how this changes over time"}, {"s": "for", "t": "The merger of Tier and Dott creates a larger rival that can compete with Lime for city licences"}, {"s": "for", "t": "Cities giving licences to only one or two operators means Lime could lose access to whole cities if it loses a tender"}, {"s": "for", "t": "The Paris ban removed a major market, which reduces revenue and shows how quickly the environment can change"}, {"s": "against", "t": "However, Bird's bankruptcy means fewer rivals, so Lime may gain market share"}, {"s": "against", "t": "If Lime wins tenders, it may face little competition in those cities and can charge higher prices"}, {"s": "against", "t": "Its size, operating in more than 250 cities, helps it offer lower costs and better service than smaller rivals"}, {"s": "judge", "t": "Overall, the changes are both a threat and an opportunity; it depends on whether Lime can win city tenders against the merged Tier and Dott"}], "n": 109, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "F", "t": "About Lime", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 250 cities around the world, including many in Europe.", "Customers unlock a scooter with the app and pay a fee to unlock it plus a charge per minute. They can easily compare prices with other apps and switch to a rival at any time.", "Customers can also choose other ways to travel, such as buses, trains, their own bicycles or walking."]}, {"id": "G", "t": "A changing market for shared scooters", "p": ["In 2023, voters in Paris chose to ban rented electric scooters from the city. Other cities have reduced the number of scooter licences or set lower speed limits.", "In 2024, two European rivals, Tier and Dott, merged. Another rival, Bird, filed for bankruptcy in the USA in 2023. Some cities now give licences to only one or two operators after a tender process.", "Higher interest rates have made it more expensive for scooter businesses to borrow. Consumers are increasingly interested in green transport, and new battery technology allows batteries to be swapped without moving the scooter."]}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "ms": "Indicative content\n• The competitive environment describes the number and strength of rivals and how this changes over time\n• The merger of Tier and Dott creates a larger rival that can compete with Lime for city licences\n• Cities giving licences to only one or two operators means Lime could lose access to whole cities if it loses a tender\n• The Paris ban removed a major market, which reduces revenue and shows how quickly the environment can change\n• However, Bird's bankruptcy means fewer rivals, so Lime may gain market share\n• If Lime wins tenders, it may face little competition in those cities and can charge higher prices\n• Its size, operating in more than 250 cities, helps it offer lower costs and better service than smaller rivals\n• Overall, the changes are both a threat and an opportunity; it depends on whether Lime can win city tenders against the merged Tier and Dott\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (9 to 12): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement."], "parts": [["Knowledge", "The competitive environment describes the number and strength of rivals and how this changes over time. [K]", "Level 1"], ["Main points", "The merger of Tier and Dott creates a larger rival that can compete with Lime for city licences. [A] [An] Cities giving licences to only one or two operators means Lime could lose access to whole cities if it loses a tender. [An] The Paris ban removed a major market, which reduces revenue and shows how quickly the environment can change. [A] [An]", "Level 2/3"], ["Other side", "However, Bird's bankruptcy means fewer rivals, so Lime may gain market share. [Ev] If Lime wins tenders, it may face little competition in those cities and can charge higher prices. [Ev] Its size, operating in more than 250 cities, helps it offer lower costs and better service than smaller rivals. [Ev]", "Level 3/4"], ["Judgement", "Overall, the changes are both a threat and an opportunity; it depends on whether Lime can win city tenders against the merged Tier and Dott. [Ev]", "Level 4"]]}, "u": "u3"}, {"case": "lime", "topic": 4, "sub": ["pe"], "marks": 20, "type": "lev", "read": "F and G", "stem": "Using PESTLE analysis, evaluate whether political and legal factors are the most important external influences on the success of Lime.", "kw": ["pestle", "political", "legal", "economic", "social", "technological", "environmental"], "pts": [{"s": "know", "t": "PESTLE analyses political, economic, social, technological, legal and environmental factors that affect a business"}, {"s": "for", "t": "Political decisions such as the Paris ban can remove a whole city market from Lime overnight"}, {"s": "for", "t": "Laws on speed limits and the number of licences restrict how Lime operates and increase its costs"}, {"s": "for", "t": "Cities using tenders to choose one or two operators mean political decisions decide whether Lime can operate at all"}, {"s": "against", "t": "However, economic factors matter: higher interest rates make it more expensive for Lime to borrow to buy scooters and expand"}, {"s": "against", "t": "Social trends towards green transport increase demand for shared scooters and bikes"}, {"s": "against", "t": "Technological change such as swappable batteries can cut operating costs and give Lime a competitive advantage"}, {"s": "against", "t": "Environmental concerns about scooter lifespan and waste may influence city decisions and customer attitudes"}, {"s": "judge", "t": "Overall, political and legal factors are likely to be the most important because they decide whether Lime can operate in a city, but this depends on each city"}, {"s": "judge", "t": "Lime should work closely with city councils, invest in safety and longer-lasting scooters, and spread its operations across many cities to reduce the risk of bans"}], "n": 110, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "F", "t": "About Lime", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 250 cities around the world, including many in Europe.", "Customers unlock a scooter with the app and pay a fee to unlock it plus a charge per minute. They can easily compare prices with other apps and switch to a rival at any time.", "Customers can also choose other ways to travel, such as buses, trains, their own bicycles or walking."]}, {"id": "G", "t": "A changing market for shared scooters", "p": ["In 2023, voters in Paris chose to ban rented electric scooters from the city. Other cities have reduced the number of scooter licences or set lower speed limits.", "In 2024, two European rivals, Tier and Dott, merged. Another rival, Bird, filed for bankruptcy in the USA in 2023. Some cities now give licences to only one or two operators after a tender process.", "Higher interest rates have made it more expensive for scooter businesses to borrow. Consumers are increasingly interested in green transport, and new battery technology allows batteries to be swapped without moving the scooter."]}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "ms": "Indicative content\n• PESTLE analyses political, economic, social, technological, legal and environmental factors that affect a business\n• Political decisions such as the Paris ban can remove a whole city market from Lime overnight\n• Laws on speed limits and the number of licences restrict how Lime operates and increase its costs\n• Cities using tenders to choose one or two operators mean political decisions decide whether Lime can operate at all\n• However, economic factors matter: higher interest rates make it more expensive for Lime to borrow to buy scooters and expand\n• Social trends towards green transport increase demand for shared scooters and bikes\n• Technological change such as swappable batteries can cut operating costs and give Lime a competitive advantage\n• Environmental concerns about scooter lifespan and waste may influence city decisions and customer attitudes\n• Overall, political and legal factors are likely to be the most important because they decide whether Lime can operate in a city, but this depends on each city\n• Lime should work closely with city councils, invest in safety and longer-lasting scooters, and spread its operations across many cities to reduce the risk of bans\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Level 4 (15 to 20): Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "plan": ["Define the key term (Knowledge).", "Develop the main points using evidence from the extracts (Application and Analysis).", "Give the other side with \"however\" (Evaluation).", "Finish with a supported judgement and a recommendation."], "parts": [["Knowledge", "PESTLE analyses political, economic, social, technological, legal and environmental factors that affect a business. [K]", "Level 1"], ["Main points", "Political decisions such as the Paris ban can remove a whole city market from Lime overnight. [A] [An] Laws on speed limits and the number of licences restrict how Lime operates and increase its costs. [An] Cities using tenders to choose one or two operators mean political decisions decide whether Lime can operate at all. [A] [An]", "Level 2/3"], ["Other side", "However, economic factors matter: higher interest rates make it more expensive for Lime to borrow to buy scooters and expand. [Ev] Social trends towards green transport increase demand for shared scooters and bikes. [Ev] Technological change such as swappable batteries can cut operating costs and give Lime a competitive advantage. [Ev] Environmental concerns about scooter lifespan and waste may influence city decisions and customer attitudes. [Ev]", "Level 3/4"], ["Judgement", "Overall, political and legal factors are likely to be the most important because they decide whether Lime can operate in a city, but this depends on each city. [Ev] Lime should work closely with city councils, invest in safety and longer-lasting scooters, and spread its operations across many cities to reduce the risk of bans. [Ev]", "Level 4"]]}, "u": "u3"}, {"n": 201, "u": "u4", "set": "past", "topic": 1, "sub": ["g1"], "marks": 4, "biz": "Senegal", "paper": "January 2023", "qn": "1(a)", "stem": "Using Extract A, calculate to two decimal places the GDP per capita of Senegal in 2021. You are advised to show your working.", "read": "A", "ext": [{"id": "A", "t": "Senegal – Selected indicators", "p": ["• Population of Senegal in 2021 was 17.2 million", "• GDP of Senegal in 2021 was $25.5bn", "Gross Domestic Product (GDP) growth rates", "Change in GDP", "Year", "(growth rates)", "2020 1.5%", "2021 3.7%", "2022 5.5%*", "2023 10.8%*", "* estimate"]}], "ms": "Question Using Extract A, calculate to two decimal places the GDP per capita Mark\nof Senegal in 2021. (4)\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nQS2 Calculate, use and ratios, averages and fractions\nKnowledge\n1 mark for identifying any suitable formula eg:\n• GDP\nPopulation (1)\nApplication\nUp to 2 marks for selecting the correct data:\n• $25.5bn (1)\n17.2 million (1)\nAnalysis\n1 mark for calculating GDP per capita\n• = $1 482.56 (1)\nNB: If no working is shown, award marks as follows:\nIf the answer given is $1 482.56 award 4 marks.\nIf the answer given is 1 482.56 award 3 marks.\n(4)", "type": "calc", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: GDP ÷ population [A] $25.5bn ÷ 17.2 million [A]", "(2)"], ["Calculate", "25,500,000,000 ÷ 17,200,000 [An] = $1,482.56 (include the $ sign) [An]", "(2)"]]}, "ans": 1482.56, "pre": "$", "unit": "", "ansText": "$1,482.56", "fhint": "GDP per capita = GDP ÷ population", "fk": ["÷", "/", "divide", "per capita", "population"], "data": ["25.5", "17.2"]}, {"n": 202, "u": "u4", "set": "past", "topic": 1, "sub": ["g5"], "marks": 4, "biz": "Senegal", "paper": "January 2023", "qn": "1(b)", "stem": "Explain one advantage for an African country, such as Senegal, of being a member of the African Continental Free Trade Area (AfCFTA).", "read": "B", "ext": [{"id": "B", "t": "Africa’s Free Trade Area", "p": ["The African Continental Free Trade Area (AfCFTA) started in 2021. All African countries have signed the agreement, apart from Eritrea. It is hoped that these 54 countries will grow together to form a single market.", "They have pledged to eliminate import tariffs on 97% of goods traded between African countries over a period of time. It is hoped that this will increase trade between African countries, which will in turn boost economic growth, bringing more prosperity and social equality to those on the continent.", "According to the World Economic Forum, African nations currently trade more internationally than with each other. Only 17% of African exports go to other African countries, whereas in Asia 59% of its exports go to other Asian countries and in Europe it is 68%.", ""]}], "ms": "Question Explain one advantage for an African country, such as Senegal, Mark\nof being a member of the African Continental Free Trade Area\n(AfCFTA). (4)\nAnswer\n1(b) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying an advantage, e.g.:\n• There will be fewer trade barriers (1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• It is hoped that 97% of all tariffs will go (1)\n• Intra-African trade only accounts for 17% of African exports\n(1)\nAnalysis\n1 mark for developing the advantage, e.g.:\n• Fewer trade barriers such as tariffs will make a country such\nas Senegal’s exports more competitive and will lead to more\neconomic growth (1)\n(4)", "type": "pt", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "There will be fewer trade barriers. [K]", "(1)"], ["Application", "It is hoped that 97% of all tariffs will go. [A]", "(1)"], ["Application", "Intra-African trade only accounts for 17% of African exports. [A]", "(1)"], ["Analysis", "Fewer trade barriers such as tariffs will make Senegal's exports more competitive, which will lead to more economic growth. [An]", "(1)"]]}, "K": [["fewer trade barrier", "trade barrier", "tariff", "free trade", "access", "export"]], "Kmax": 1, "Amax": 2, "Anmax": 1}, {"n": 203, "u": "u4", "set": "past", "topic": 1, "sub": ["g4"], "marks": 4, "biz": "Peru", "paper": "June 2023", "qn": "1(a)", "stem": "Explain one advantage of using tariffs for a country such as Peru.", "read": "A", "ext": [{"id": "A", "t": "Peru clothing industry welcomes tariff barrier to block large increase in", "p": ["clothing imports", "A report by the Peruvian competition authority said that imports of clothing into Peru rose by 254% between 2016 and 2020. As a result, imports have increased their share of the Peruvian clothing market to 13.4%. The report warns that there is a danger of damage to the domestic clothing industry and urges the government to increase tariffs on imports. The clothing industry employs over 420,000 people and is 8% of Peru’s manufacturing output."]}], "ms": "Question Explain one advantage of using tariffs for a country such as Mark\nPeru. (4)\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying an advantage, e.g.:\n• Preventing unemployment in the Peruvian clothing industry\n(1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• Over 420,000 people are employed in the clothing industry\n(1)\n• Clothing imports have increased their market share in Peru\nto 13.4% (1)\nAnalysis\n1 mark for developing the advantage, e.g.:\n• Tariffs increase the price of imports making domestic\nproducts more attractive which keeps people employed and\nmaintains market share (1) (4)", "type": "pt", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "Tariffs help prevent unemployment in the Peruvian clothing industry. [K]", "(1)"], ["Application", "Over 420,000 people are employed in the clothing industry. [A]", "(1)"], ["Application", "Clothing imports have increased their market share in Peru to 13.4%. [A]", "(1)"], ["Analysis", "Tariffs increase the price of imports, making domestic products more attractive, which keeps people employed and maintains market share. [An]", "(1)"]]}, "K": [["unemploy", "employ", "job", "protect", "domestic"]], "Kmax": 1, "Amax": 2, "Anmax": 1}, {"n": 204, "u": "u4", "set": "past", "topic": 2, "sub": ["m1"], "marks": 4, "biz": "Netflix", "paper": "October 2023", "qn": "1(a)", "stem": "Explain one disadvantage for a business of operating in a saturated market.", "read": "A", "ext": [{"id": "A", "t": "Among signs of market saturation, streaming platforms seek new growth", "p": ["The global market for on-demand streaming platforms has shown signs of saturation for some time, forcing businesses to devise new strategies to stop the loss of subscribers and boost revenue and growth.", "At the start of 2022, Netflix, the market leader, had 221.6 million subscribers. However, by September 2022 it had lost 1.2 million subscribers.", "Nearly a dozen major streaming platforms, with Netflix and Disney+ in the lead, are locked in a fierce battle for subscribers. Experts predict that some platforms will have to merge or launch cheaper subscriptions with advertising if growth is to happen.", "One merger has already taken place, with HBO Max merging with Discovery+. It will start operating in the summer of 2023 as a single streaming service with around 100 million subscribers worldwide."]}], "ms": "Question Explain one disadvantage for a business of operating in a Mark\nsaturated market. (4)\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a disadvantage, e.g.:\n• High level of competition (1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• Over a dozen companies are competing for streaming\nbusiness (1)\n• Netflix has lost 1.2 million subscribers in the first nine\nmonths of 2022 (1)\nAnalysis\n1 mark for developing the disadvantage, e.g.:\n• In order to increase sales or prevent loss of existing\ncustomers price may have to be reduced and/or increased\nspending on promotion. Both reduce profitability (1) (4)", "type": "pt", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "A saturated market has a high level of competition. [K]", "(1)"], ["Application", "Over a dozen companies are competing for streaming business. [A]", "(1)"], ["Application", "Netflix lost 1.2 million subscribers in the first nine months of 2022. [A]", "(1)"], ["Analysis", "To increase sales or keep existing customers, prices may have to be reduced or promotion spending increased, and both reduce profitability. [An]", "(1)"]]}, "K": [["competition", "competitive", "rival", "competitor"]], "Kmax": 1, "Amax": 2, "Anmax": 1}, {"n": 205, "u": "u4", "set": "past", "topic": 1, "sub": ["g1"], "marks": 8, "biz": "Turkey", "paper": "October 2024", "qn": "1(c)", "stem": "Discuss the usefulness of HDI as an indicator of growth.", "read": "B", "ext": [{"id": "B", "t": "Turkey ranked 48th among 191 countries in UN Human Development Index (HDI)", "p": ["The Human Development Index (HDI) attempts to measure and compare levels of human development between countries. Created by the United Nations in 1990 it is now an important indicator for international organisations, governments, and non-governmental organisations (NGOs) in determining global welfare and economic growth.", "Between 1990 and 2021, Turkey’s HDI value changed from 0.600 to 0.838. Although there has been an improvement in Turkey’s HDI rating, Turks have found it difficult over recent years to afford basic needs. The country is experiencing a record level of inflation, which is the highest in the past 24 years, and a record drop in purchasing power due to the depreciation of the Turkish lira against foreign currencies.", ""]}], "ms": "Question Discuss the usefulness of HDI as an indicator of growth. (8)\nIndicative content\n1(c)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• HDI is a composite index focusing on three basic measures of human\ndevelopment\n• Life expectancy at birth, mean years of schooling and expected years of\nschooling, standard of living as measured by gross national income per\ncapita.\n• The higher the index the more developed the economy is said to be\n• It takes a wider view of development than one based on purely\neconomic criteria such as GDP which has drawbacks\n• An increase in Turkey’s ranking from 0.600 to 0.838 shows that the\neconomy must have grown in order to provide higher levels of health,\neducation and standard of living\n• However, it is still not totally reliable, it does not indicate how wealth is\ndistributed or show that everyone has benefited equally e.g. Saudi\nArabia\n• It does not indicate the ‘quality’ of life or the degree of civil liberties\n• It does not indicate other economic factors which can either indicate\ncurrent problems affecting growth or factors that will influence future\ngrowth such as the inflation rate in Turkey and its currency problems\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s)\nbut may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative information, and shows an awareness of competing\narguments/factors.", "type": "lev", "kw": ["hdi", "human development", "life expectancy", "schooling", "education", "income per capita"], "tip": "Examiner report (October 2024): many candidates did not know what HDI was or only partly understood its components, and responses that tried to bluff scored low. Some wrote about the benefits of growth for Turkey instead of answering the question. Strong answers explained HDI's three components, then showed why it is useful and what its weaknesses are.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "HDI is a composite index of three basic measures of human development: life expectancy at birth, years of schooling, and standard of living measured by gross national income per capita. [K]", "Key term"], ["Point 1", "HDI takes a wider view of development than purely economic measures such as GDP. [K] Turkey's HDI value changed from 0.600 to 0.838 between 1990 and 2021. [A] This shows the economy must have grown to provide higher levels of health, education and standard of living. [An] However, HDI does not show how wealth is distributed or that everyone has benefited equally. [Ev]", "(4)"], ["Point 2", "The higher the index, the more developed the economy is said to be. [K] Turkey is ranked 48th among 191 countries. [A] Businesses and governments can compare development between countries when assessing growth. [An] However, HDI does not show the quality of life, civil liberties or economic problems that affect future growth, such as Turkey's inflation and currency problems. [Ev]", "(4)"]]}, "pts": [{"t": "HDI is a composite index focusing on three basic measures of human development", "s": "know"}, {"t": "Life expectancy at birth, mean years of schooling and expected years of schooling, standard of living as measured by gross national income per capita.", "s": "for"}, {"t": "The higher the index the more developed the economy is said to be", "s": "for"}, {"t": "It takes a wider view of development than one based on purely economic criteria such as GDP which has drawbacks", "s": "for"}, {"t": "An increase in Turkey’s ranking from 0.600 to 0.838 shows that the economy must have grown in order to provide higher levels of health, education and standard of living", "s": "for"}, {"t": "However, it is still not totally reliable, it does not indicate how wealth is distributed or show that everyone has benefited equally e.g. Saudi Arabia", "s": "against"}, {"t": "It does not indicate the ‘quality’ of life or the degree of civil liberties", "s": "against"}, {"t": "It does not indicate other economic factors which can either indicate current problems affecting growth or factors that will influence future growth such as the inflation rate in Turkey and its currency problems", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]]}, {"n": 206, "u": "u4", "set": "past", "topic": 2, "sub": ["m1"], "marks": 8, "biz": "Global business", "paper": "January 2024", "qn": "1(c)", "stem": "Discuss the benefits for a global business that come from extending the product life cycle of its products by entering a new overseas market.", "read": "B", "ext": [{"id": "B", "t": "How to extend the product life cycle", "p": ["Identifying new markets for your product is a great way to potentially extend its life cycle. Perhaps the market you are currently operating in has become saturated or an unexpected economic downturn has affected sales.", "Expanding by launching your product in different countries, for example, can be a good way of boosting sales and can be a good extension strategy. Globalisation has made this possible in the 21st century, and the internet has made reaching all parts of the world easier.", ""]}], "ms": "Question Discuss the benefits for a global business that come from extending the product\nlife cycle of its products by entering a new overseas market. (8)\nIndicative content\n1(c)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Extending the product life cycle means preventing the decline stage\nfrom being reached and so continuing to sell the product successfully\n• One way this can happen is by entering a new market where the\nproduct is not yet known\n• This enables the product life cycle to start again\n• The business is already familiar with the product and will be able to use\nexisting production facilities and supply chains thus saving time and\nmoney in creating new ones\n• The business does not need to go through the development stage\nwhich can be costly and/or lengthy, all the initial work has been done\n• By finding new customers in new markets the extra sales revenue will\nincrease the return on the initial investment in the product\n• However, a new market will need promotion as the product will be in\nthe introductory stage if it is to grow\n• Some changes may need to be made to the product to comply with the\nnew market’s rules and regulations\n• Cultural adaptations may be needed and not all products will transfer\neasily between markets\n• Some products such as fashion items or rapidly changing technologies\nhave very short life cycles and may not be worth the effort\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s)\nbut may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative information, and shows an awareness of competing\narguments/factors.", "type": "lev", "kw": ["product life cycle", "life cycle", "decline", "extension", "new market"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Extending the product life cycle means preventing the decline stage from being reached, so the product continues to sell successfully. [K]", "Key term"], ["Point 1", "Entering a new market where the product is not yet known lets the product life cycle start again. [K] The business can launch its product in different countries where it is new to customers. [A] Extra sales revenue from new customers increases the return on the initial investment in the product. [An] However, the product will be in the introductory stage in the new market, so it will need promotion if it is to grow. [Ev]", "(4)"], ["Point 2", "The business does not need to go through the costly and lengthy development stage. [K] It can use its existing production facilities and supply chains. [A] This saves time and money compared with creating new products. [An] However, changes may be needed to meet the new market's rules, regulations and culture, and products with very short life cycles may not be worth the effort. [Ev]", "(4)"]]}, "pts": [{"t": "Extending the product life cycle means preventing the decline stage from being reached and so continuing to sell the product successfully", "s": "know"}, {"t": "One way this can happen is by entering a new market where the product is not yet known", "s": "for"}, {"t": "This enables the product life cycle to start again", "s": "for"}, {"t": "The business is already familiar with the product and will be able to use existing production facilities and supply chains thus saving time and money in creating new ones", "s": "for"}, {"t": "The business does not need to go through the development stage which can be costly and/or lengthy, all the initial work has been done", "s": "for"}, {"t": "By finding new customers in new markets the extra sales revenue will increase the return on the initial investment in the product", "s": "for"}, {"t": "However, a new market will need promotion as the product will be in the introductory stage if it is to grow", "s": "against"}, {"t": "Some changes may need to be made to the product to comply with the new market’s rules and regulations", "s": "against"}, {"t": "Cultural adaptations may be needed and not all products will transfer easily between markets", "s": "against"}, {"t": "Some products such as fashion items or rapidly changing technologies have very short life cycles and may not be worth the effort", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment
