ge such as deforestation and loss of biodiversity and greenhouse gas emissions and other forms of pollution caused by increased transportation of goods", "s": "against"}, {"t": "This has a cost that affects everyone as well as individual businesses", "s": "against"}, {"t": "Globalisation is here to stay but at the moment its impact on businesses and the wider economy are mixed. Regulation and government intervention that will affect businesses may be the way forward", "s": "against"}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]]}, {"n": 301, "u": "u4", "set": "style", "case": "byd", "topic": 1, "sub": ["g4"], "marks": 4, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Explain one reason why the EU introduced tariffs on electric vehicles imported from China.", "read": "C", "ext": [{"id": "A", "t": "BYD overtakes Tesla", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries, based in Shenzhen. In the last three months of 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. More than 100 Chinese brands sell EVs, and many have cut prices to win customers. Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and to use its huge production capacity."]}, {"id": "B", "t": "Figure 1: BYD vehicle sales", "p": ["Year | Total sales (vehicles) | Sales outside China (vehicles)", "2021 | 730,000 | 30,000", "2022 | 1,860,000 | 55,000", "2023 | 3,020,000 | 243,000"]}, {"id": "C", "t": "EU puts the brakes on Chinese electric cars", "p": ["In 2024 the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices, threatening around 13 million jobs linked to the European car industry.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary, which will produce up to 150,000 cars a year. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers. Labour costs in Hungary are higher than in China but lower than in Western Europe."]}], "type": "pt", "kw": [], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "One reason for protectionism is to protect domestic industries from unfair competition. [K]", "(1)"], ["Application", "The EU said Chinese manufacturers received unfair government subsidies, allowing very low prices. [A]", "(1)"], ["Application", "Around 13 million jobs are linked to the European car industry. [A]", "(1)"], ["Analysis", "Tariffs raise the price of Chinese EVs, so European car makers can compete and jobs in the EU car industry are protected. [An]", "(1)"]]}, "K": [["protect", "unfair", "subsid", "domestic", "jobs", "dumping"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "ms": "Knowledge 1, Application 2, Analysis 1\nKnowledge: One reason for protectionism is to protect domestic industries from unfair competition. (1)\nApplication: The EU said Chinese manufacturers received unfair government subsidies, allowing very low prices. (1)\nApplication: Around 13 million jobs are linked to the European car industry. (1)\nAnalysis: Tariffs raise the price of Chinese EVs, so European car makers can compete and jobs in the EU car industry are protected. (1)"}, {"n": 302, "u": "u4", "set": "style", "case": "byd", "topic": 1, "sub": ["g4"], "marks": 8, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Discuss the impact on BYD of the tariffs introduced by the EU.", "read": "A, B and C", "ext": [{"id": "A", "t": "BYD overtakes Tesla", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries, based in Shenzhen. In the last three months of 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. More than 100 Chinese brands sell EVs, and many have cut prices to win customers. Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and to use its huge production capacity."]}, {"id": "B", "t": "Figure 1: BYD vehicle sales", "p": ["Year | Total sales (vehicles) | Sales outside China (vehicles)", "2021 | 730,000 | 30,000", "2022 | 1,860,000 | 55,000", "2023 | 3,020,000 | 243,000"]}, {"id": "C", "t": "EU puts the brakes on Chinese electric cars", "p": ["In 2024 the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices, threatening around 13 million jobs linked to the European car industry.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary, which will produce up to 150,000 cars a year. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers. Labour costs in Hungary are higher than in China but lower than in Western Europe."]}], "type": "lev", "kw": ["tariff", "protectionism", "price", "trade barrier"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "A tariff is a tax on imported goods, which raises their price in the importing country. [K]", "Key term"], ["Point 1", "Tariffs raise the price of imported goods. [K] BYD faces an extra 17% tariff on top of the standard 10% EU tariff. [A] BYD must either raise its prices, reducing demand in Europe, or absorb the tariff, reducing its profit margin. [An] However, some Chinese rivals face extra tariffs of more than 35%, so BYD may still be relatively competitive. [Ev]", "(4)"], ["Point 2", "Tariffs make it harder to grow in overseas markets. [K] BYD sold 243,000 vehicles outside China in 2023, only around 8% of its 3,020,000 total sales. [A] Higher prices in the EU could slow the growth of its overseas sales. [An] However, BYD sells in more than 70 countries and its Hungary factory will avoid the tariffs. [Ev]", "(4)"]]}, "pts": [{"s": "know", "t": "A tariff is a tax on imported goods, which raises their price in the importing country."}, {"s": "for", "t": "Tariffs raise the price of imported goods."}, {"s": "for", "t": "BYD faces an extra 17% tariff on top of the standard 10% EU tariff."}, {"s": "for", "t": "BYD must either raise its prices, reducing demand in Europe, or absorb the tariff, reducing its profit margin."}, {"s": "against", "t": "However, some Chinese rivals face extra tariffs of more than 35%, so BYD may still be relatively competitive."}, {"s": "for", "t": "Tariffs make it harder to grow in overseas markets."}, {"s": "for", "t": "BYD sold 243,000 vehicles outside China in 2023, only around 8% of its 3,020,000 total sales."}, {"s": "for", "t": "Higher prices in the EU could slow the growth of its overseas sales."}, {"s": "against", "t": "However, BYD sells in more than 70 countries and its Hungary factory will avoid the tariffs."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• A tariff is a tax on imported goods, which raises their price in the importing country.\n• Tariffs raise the price of imported goods.\n• BYD faces an extra 17% tariff on top of the standard 10% EU tariff.\n• BYD must either raise its prices, reducing demand in Europe, or absorb the tariff, reducing its profit margin.\n• However, some Chinese rivals face extra tariffs of more than 35%, so BYD may still be relatively competitive.\n• Tariffs make it harder to grow in overseas markets.\n• BYD sold 243,000 vehicles outside China in 2023, only around 8% of its 3,020,000 total sales.\n• Higher prices in the EU could slow the growth of its overseas sales.\n• However, BYD sells in more than 70 countries and its Hungary factory will avoid the tariffs.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."}, {"n": 303, "u": "u4", "set": "style", "case": "byd", "topic": 2, "sub": ["g5", "m3"], "marks": 12, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Assess the benefits to BYD of building a factory in Hungary, inside the EU.", "read": "C", "ext": [{"id": "A", "t": "BYD overtakes Tesla", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries, based in Shenzhen. In the last three months of 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. More than 100 Chinese brands sell EVs, and many have cut prices to win customers. Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and to use its huge production capacity."]}, {"id": "B", "t": "Figure 1: BYD vehicle sales", "p": ["Year | Total sales (vehicles) | Sales outside China (vehicles)", "2021 | 730,000 | 30,000", "2022 | 1,860,000 | 55,000", "2023 | 3,020,000 | 243,000"]}, {"id": "C", "t": "EU puts the brakes on Chinese electric cars", "p": ["In 2024 the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices, threatening around 13 million jobs linked to the European car industry.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary, which will produce up to 150,000 cars a year. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers. Labour costs in Hungary are higher than in China but lower than in Western Europe."]}], "type": "lev", "kw": ["trading bloc", "single market", "eu", "tariff", "production location"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "The EU single market allows goods to move between its 27 member countries without tariffs or other trade barriers. [K]", "Key term"], ["Point 1", "Producing inside a trading bloc avoids its external tariffs. [K] Cars made in Szeged are not affected by the extra 17% tariff, and the factory can produce up to 150,000 cars a year. [A] BYD can keep its prices low in Europe, increasing sales and market share. [An] However, labour costs in Hungary are higher than in China, increasing unit costs. [Ev]", "(4)"], ["Point 2", "Being inside the single market gives free access to all member countries. [K] Cars made in Hungary can be sold in all 27 EU countries without trade barriers. [A] Shorter delivery distances reduce transport costs and delivery times to European customers. [An] However, building a factory needs a large investment, and the EU could change its rules in future. [Ev]", "(4)"], ["Conclusion", "Overall, the factory benefits BYD because it removes the 17% tariff and gives access to all 27 EU countries, but it depends on how quickly the factory reaches full production. [Ev]", "(2)"]]}, "pts": [{"s": "know", "t": "The EU single market allows goods to move between its 27 member countries without tariffs or other trade barriers."}, {"s": "for", "t": "Producing inside a trading bloc avoids its external tariffs."}, {"s": "for", "t": "Cars made in Szeged are not affected by the extra 17% tariff, and the factory can produce up to 150,000 cars a year."}, {"s": "for", "t": "BYD can keep its prices low in Europe, increasing sales and market share."}, {"s": "against", "t": "However, labour costs in Hungary are higher than in China, increasing unit costs."}, {"s": "for", "t": "Being inside the single market gives free access to all member countries."}, {"s": "for", "t": "Cars made in Hungary can be sold in all 27 EU countries without trade barriers."}, {"s": "for", "t": "Shorter delivery distances reduce transport costs and delivery times to European customers."}, {"s": "against", "t": "However, building a factory needs a large investment, and the EU could change its rules in future."}, {"s": "judge", "t": "Overall, the factory benefits BYD because it removes the 17% tariff and gives access to all 27 EU countries, but it depends on how quickly the factory reaches full production."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "ms": "Indicative content\n• The EU single market allows goods to move between its 27 member countries without tariffs or other trade barriers.\n• Producing inside a trading bloc avoids its external tariffs.\n• Cars made in Szeged are not affected by the extra 17% tariff, and the factory can produce up to 150,000 cars a year.\n• BYD can keep its prices low in Europe, increasing sales and market share.\n• However, labour costs in Hungary are higher than in China, increasing unit costs.\n• Being inside the single market gives free access to all member countries.\n• Cars made in Hungary can be sold in all 27 EU countries without trade barriers.\n• Shorter delivery distances reduce transport costs and delivery times to European customers.\n• However, building a factory needs a large investment, and the EU could change its rules in future.\n• Overall, the factory benefits BYD because it removes the 17% tariff and gives access to all 27 EU countries, but it depends on how quickly the factory reaches full production.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."}, {"n": 304, "u": "u4", "set": "style", "case": "byd", "topic": 2, "sub": ["m1"], "marks": 20, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Evaluate whether push factors or pull factors are more important in BYD's decision to expand overseas.", "read": "A, B and C", "ext": [{"id": "A", "t": "BYD overtakes Tesla", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries, based in Shenzhen. In the last three months of 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. More than 100 Chinese brands sell EVs, and many have cut prices to win customers. Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and to use its huge production capacity."]}, {"id": "B", "t": "Figure 1: BYD vehicle sales", "p": ["Year | Total sales (vehicles) | Sales outside China (vehicles)", "2021 | 730,000 | 30,000", "2022 | 1,860,000 | 55,000", "2023 | 3,020,000 | 243,000"]}, {"id": "C", "t": "EU puts the brakes on Chinese electric cars", "p": ["In 2024 the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices, threatening around 13 million jobs linked to the European car industry.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary, which will produce up to 150,000 cars a year. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers. Labour costs in Hungary are higher than in China but lower than in Western Europe."]}], "type": "lev", "kw": ["push factor", "pull factor", "saturated", "competition", "risk spreading", "economies of scale"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Push factors are conditions in the home market that encourage a business to expand abroad; pull factors are the attractions of overseas markets. [K]", "Key term"], ["Topic 1: push factors, P 1", "Intense competition in the home market is a push factor. [K] More than 100 Chinese brands sell EVs, and many have cut prices. [A] Price cuts reduce profit margins in China, so BYD looks abroad for more profitable sales. [An] However, BYD is already the market leader, so competition alone may not explain its expansion. [Ev]", "(4)"], ["Topic 1: push factors, P 2", "Slowing growth or saturation at home is a push factor. [K] Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024. [A] BYD needs new markets to keep growing and to use its huge production capacity. [An] However, China is still the largest car market in the world, so there is still room to grow at home. [Ev]", "(4)"], ["Topic 2: pull factors, P 1", "Risk spreading is a pull factor. [K] BYD sells in more than 70 countries, and its sales outside China rose from 30,000 in 2021 to 243,000 in 2023. [A] A fall in demand in one country can be balanced by sales in others, so BYD is less dependent on China. [An] However, overseas markets bring new risks, such as the EU tariffs. [Ev]", "(4)"], ["Topic 2: pull factors, P 2", "Economies of scale are a pull factor. [K] BYD sales rose from 730,000 in 2021 to 3,020,000 in 2023. [A] Higher output lowers unit costs, so BYD can sell at competitive prices worldwide. [An] However, tariffs and transport costs reduce the benefit of economies of scale. [Ev]", "(4)"], ["Conclusion", "Overall, push factors such as price cuts by more than 100 rivals and slowing growth in China started BYD's expansion, but pull factors such as risk spreading and economies of scale explain its long-term strategy. BYD should keep producing inside major markets, such as the EU, to protect its overseas growth. [Ev]", "(3)"]]}, "pts": [{"s": "know", "t": "Push factors are conditions in the home market that encourage a business to expand abroad; pull factors are the attractions of overseas markets."}, {"s": "for", "t": "Intense competition in the home market is a push factor."}, {"s": "for", "t": "More than 100 Chinese brands sell EVs, and many have cut prices."}, {"s": "for", "t": "Price cuts reduce profit margins in China, so BYD looks abroad for more profitable sales."}, {"s": "against", "t": "However, BYD is already the market leader, so competition alone may not explain its expansion."}, {"s": "for", "t": "Slowing growth or saturation at home is a push factor."}, {"s": "for", "t": "Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024."}, {"s": "for", "t": "BYD needs new markets to keep growing and to use its huge production capacity."}, {"s": "against", "t": "However, China is still the largest car market in the world, so there is still room to grow at home."}, {"s": "for", "t": "Risk spreading is a pull factor."}, {"s": "for", "t": "BYD sells in more than 70 countries, and its sales outside China rose from 30,000 in 2021 to 243,000 in 2023."}, {"s": "for", "t": "A fall in demand in one country can be balanced by sales in others, so BYD is less dependent on China."}, {"s": "against", "t": "However, overseas markets bring new risks, such as the EU tariffs."}, {"s": "for", "t": "Economies of scale are a pull factor."}, {"s": "for", "t": "BYD sales rose from 730,000 in 2021 to 3,020,000 in 2023."}, {"s": "for", "t": "Higher output lowers unit costs, so BYD can sell at competitive prices worldwide."}, {"s": "against", "t": "However, tariffs and transport costs reduce the benefit of economies of scale."}, {"s": "judge", "t": "Overall, push factors such as price cuts by more than 100 rivals and slowing growth in China started BYD's expansion, but pull factors such as risk spreading and economies of scale explain its long-term strategy. BYD should keep producing inside major markets, such as the EU, to protect its overseas growth."}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations. Pearson Education Limited. Registered company number 872828 with its registered office at 80 Strand, London, WC2R 0RL, United Kingdom"]], "ms": "Indicative content\n• Push factors are conditions in the home market that encourage a business to expand abroad; pull factors are the attractions of overseas markets.\n• Intense competition in the home market is a push factor.\n• More than 100 Chinese brands sell EVs, and many have cut prices.\n• Price cuts reduce profit margins in China, so BYD looks abroad for more profitable sales.\n• However, BYD is already the market leader, so competition alone may not explain its expansion.\n• Slowing growth or saturation at home is a push factor.\n• Growth in China's car sales slowed from 12% in 2023 to around 5% in 2024.\n• BYD needs new markets to keep growing and to use its huge production capacity.\n• However, China is still the largest car market in the world, so there is still room to grow at home.\n• Risk spreading is a pull factor.\n• BYD sells in more than 70 countries, and its sales outside China rose from 30,000 in 2021 to 243,000 in 2023.\n• A fall in demand in one country can be balanced by sales in others, so BYD is less dependent on China.\n• However, overseas markets bring new risks, such as the EU tariffs.\n• Economies of scale are a pull factor.\n• BYD sales rose from 730,000 in 2021 to 3,020,000 in 2023.\n• Higher output lowers unit costs, so BYD can sell at competitive prices worldwide.\n• However, tariffs and transport costs reduce the benefit of economies of scale.\n• Overall, push factors such as price cuts by more than 100 rivals and slowing growth in China started BYD's expansion, but pull factors such as risk spreading and economies of scale explain its long-term strategy. BYD should keep producing inside major markets, such as the EU, to protect its overseas growth.\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations. Pearson Education Limited. Registered company number 872828 with its registered office at 80 Strand, London, WC2R 0RL, United Kingdom"}, {"n": 305, "u": "u4", "set": "style", "case": "apple", "topic": 2, "sub": ["m3", "g2"], "marks": 4, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Using Figure 2, calculate to two decimal places the percentage of iPhones assembled in India in 2024. You are advised to show your working.", "read": "E", "ext": [{"id": "D", "t": "Apple's iPhone moves to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata Electronics.", "The Indian government's Production Linked Incentive scheme pays manufacturers between 4% and 6% of the value of extra sales of electronics made in India. India has a large, young labour force and wages that are lower than in China.", "Foxconn employs around 40,000 workers at its iPhone factory near Chennai, many of them women who previously worked in farming."]}, {"id": "E", "t": "Figure 2: India and the iPhone", "p": ["Item | Value", "iPhones assembled worldwide, 2024 | 220 million", "iPhones assembled in India, 2024 | 30.8 million", "India's GDP growth, 2023 | 8.2%", "India's smartphone exports, 2022 | $11bn", "India's smartphone exports, 2024 | $20bn", "Share of Indian workers in agriculture, 2023 | 46%"]}], "type": "calc", "kw": [], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: iPhones assembled in India ÷ total iPhones assembled × 100 [A] 30.8 million ÷ 220 million × 100 [A]", "(2)"], ["Calculate", "30.8 ÷ 220 = 0.14 [An] 0.14 × 100 = 14.00% (include %) [An]", "(2)"]]}, "ans": 14.0, "pre": "", "unit": "%", "ansText": "14.00%", "fhint": "percentage = iPhones assembled in India ÷ total iPhones assembled × 100", "fk": ["÷", "/", "x 100", "× 100", "*100", "x100", "divide"], "data": ["30.8", "220"], "ms": "Knowledge 1, Application 2, Analysis 1\n• Formula: iPhones assembled in India ÷ total iPhones assembled × 100 (1)\n• 30.8 million ÷ 220 million × 100 (1)\n• 30.8 ÷ 220 = 0.14 (1)\n• 0.14 × 100 = 14.00% (include %) (1)\nNB: If the answer is 14.00% with no working award 4 marks; without units award 3 marks."}, {"n": 306, "u": "u4", "set": "style", "case": "apple", "topic": 1, "sub": ["g3"], "marks": 4, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Explain one way the growth of the global labour force has contributed to increased globalisation.", "read": "D", "ext": [{"id": "D", "t": "Apple's iPhone moves to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata Electronics.", "The Indian government's Production Linked Incentive scheme pays manufacturers between 4% and 6% of the value of extra sales of electronics made in India. India has a large, young labour force and wages that are lower than in China.", "Foxconn employs around 40,000 workers at its iPhone factory near Chennai, many of them women who previously worked in farming."]}, {"id": "E", "t": "Figure 2: India and the iPhone", "p": ["Item | Value", "iPhones assembled worldwide, 2024 | 220 million", "iPhones assembled in India, 2024 | 30.8 million", "India's GDP growth, 2023 | 8.2%", "India's smartphone exports, 2022 | $11bn", "India's smartphone exports, 2024 | $20bn", "Share of Indian workers in agriculture, 2023 | 46%"]}], "type": "pt", "kw": [], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "A growing global labour force gives businesses access to more, lower cost workers. [K]", "(1)"], ["Application", "India has a large, young labour force and wages that are lower than in China. [A]", "(1)"], ["Application", "Foxconn employs around 40,000 workers at its iPhone factory near Chennai. [A]", "(1)"], ["Analysis", "Businesses such as Apple move production to these countries, increasing trade and investment flows between economies. [An]", "(1)"]]}, "K": [["labour force", "workers", "labour", "cheaper labour", "low cost", "offshor"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "ms": "Knowledge 1, Application 2, Analysis 1\nKnowledge: A growing global labour force gives businesses access to more, lower cost workers. (1)\nApplication: India has a large, young labour force and wages that are lower than in China. (1)\nApplication: Foxconn employs around 40,000 workers at its iPhone factory near Chennai. (1)\nAnalysis: Businesses such as Apple move production to these countries, increasing trade and investment flows between economies. (1)"}, {"n": 307, "u": "u4", "set": "style", "case": "apple", "topic": 1, "sub": ["g1", "g2"], "marks": 8, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Discuss the implications for India of increasing specialisation in smartphone manufacturing for export.", "read": "D and E", "ext": [{"id": "D", "t": "Apple's iPhone moves to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata Electronics.", "The Indian government's Production Linked Incentive scheme pays manufacturers between 4% and 6% of the value of extra sales of electronics made in India. India has a large, young labour force and wages that are lower than in China.", "Foxconn employs around 40,000 workers at its iPhone factory near Chennai, many of them women who previously worked in farming."]}, {"id": "E", "t": "Figure 2: India and the iPhone", "p": ["Item | Value", "iPhones assembled worldwide, 2024 | 220 million", "iPhones assembled in India, 2024 | 30.8 million", "India's GDP growth, 2023 | 8.2%", "India's smartphone exports, 2022 | $11bn", "India's smartphone exports, 2024 | $20bn", "Share of Indian workers in agriculture, 2023 | 46%"]}], "type": "lev", "kw": ["specialisation", "specialise", "export", "employment", "emerging economy"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Specialisation is when a country concentrates on producing the goods or services it is best at, and trades for other products. [K]", "Key term"], ["Point 1", "Specialisation increases exports. [K] India's smartphone exports rose from $11bn in 2022 to $20bn in 2024. [A] Export earnings increase GDP and bring in foreign currency, supporting growth of 8.2%. [An] However, depending on one industry is risky if demand for smartphones falls or Apple moves production elsewhere. [Ev]", "(4)"], ["Point 2", "Specialisation changes employment patterns. [K] 46% of Indian workers are still in agriculture, and many Foxconn workers previously worked in farming. [A] Moving into manufacturing raises incomes and living standards. [An] However, much of the work is assembly, so high value activities such as design may stay in other countries. [Ev]", "(4)"]]}, "pts": [{"s": "know", "t": "Specialisation is when a country concentrates on producing the goods or services it is best at, and trades for other products."}, {"s": "for", "t": "Specialisation increases exports."}, {"s": "for", "t": "India's smartphone exports rose from $11bn in 2022 to $20bn in 2024."}, {"s": "for", "t": "Export earnings increase GDP and bring in foreign currency, supporting growth of 8.2%."}, {"s": "against", "t": "However, depending on one industry is risky if demand for smartphones falls or Apple moves production elsewhere."}, {"s": "for", "t": "Specialisation changes employment patterns."}, {"s": "for", "t": "46% of Indian workers are still in agriculture, and many Foxconn workers previously worked in farming."}, {"s": "for", "t": "Moving into manufacturing raises incomes and living standards."}, {"s": "against", "t": "However, much of the work is assembly, so high value activities such as design may stay in other countries."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• Specialisation is when a country concentrates on producing the goods or services it is best at, and trades for other products.\n• Specialisation increases exports.\n• India's smartphone exports rose from $11bn in 2022 to $20bn in 2024.\n• Export earnings increase GDP and bring in foreign currency, supporting growth of 8.2%.\n• However, depending on one industry is risky if demand for smartphones falls or Apple moves production elsewhere.\n• Specialisation changes employment patterns.\n• 46% of Indian workers are still in agriculture, and many Foxconn workers previously worked in farming.\n• Moving into manufacturing raises incomes and living standards.\n• However, much of the work is assembly, so high value activities such as design may stay in other countries.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."}, {"n": 308, "u": "u4", "set": "style", "case": "apple", "topic": 1, "sub": ["g2"], "marks": 12, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Assess the importance of foreign direct investment (FDI) by businesses such as Apple for business growth in India.", "read": "D and E", "ext": [{"id": "D", "t": "Apple's iPhone moves to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata Electronics.", "The Indian government's Production Linked Incentive scheme pays manufacturers between 4% and 6% of the value of extra sales of electronics made in India. India has a large, young labour force and wages that are lower than in China.", "Foxconn employs around 40,000 workers at its iPhone factory near Chennai, many of them women who previously worked in farming."]}, {"id": "E", "t": "Figure 2: India and the iPhone", "p": ["Item | Value", "iPhones assembled worldwide, 2024 | 220 million", "iPhones assembled in India, 2024 | 30.8 million", "India's GDP growth, 2023 | 8.2%", "India's smartphone exports, 2022 | $11bn", "India's smartphone exports, 2024 | $20bn", "Share of Indian workers in agriculture, 2023 | 46%"]}], "type": "lev", "kw": ["foreign direct investment", "fdi", "invest", "multinational", "mnc"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Foreign direct investment (FDI) is investment by a business in productive assets in another country, such as building or expanding factories. [K]", "Key term"], ["Point 1", "FDI creates business for local suppliers. [K] Apple works with manufacturers such as Foxconn and Tata Electronics, and 30.8 million iPhones were assembled in India in 2024. [A] Local suppliers of parts, transport and services gain orders, so Indian businesses grow. [An] However, many high value components may still be imported, limiting the benefit to Indian suppliers. [Ev]", "(4)"], ["Point 2", "FDI creates jobs and income. [K] Foxconn employs around 40,000 workers near Chennai. [A] Higher incomes increase demand for goods and services from local businesses. [An] However, India's growth of 8.2% also depends on government policy, such as incentives of 4% to 6%, infrastructure and its service sector. [Ev]", "(4)"], ["Conclusion", "Overall, FDI by businesses such as Apple is important for business growth in India, especially in manufacturing, but it depends on how much production and technology is shared with Indian businesses. [Ev]", "(2)"]]}, "pts": [{"s": "know", "t": "Foreign direct investment (FDI) is investment by a business in productive assets in another country, such as building or expanding factories."}, {"s": "for", "t": "FDI creates business for local suppliers."}, {"s": "for", "t": "Apple works with manufacturers such as Foxconn and Tata Electronics, and 30.8 million iPhones were assembled in India in 2024."}, {"s": "for", "t": "Local suppliers of parts, transport and services gain orders, so Indian businesses grow."}, {"s": "against", "t": "However, many high value components may still be imported, limiting the benefit to Indian suppliers."}, {"s": "for", "t": "FDI creates jobs and income."}, {"s": "for", "t": "Foxconn employs around 40,000 workers near Chennai."}, {"s": "for", "t": "Higher incomes increase demand for goods and services from local businesses."}, {"s": "against", "t": "However, India's growth of 8.2% also depends on government policy, such as incentives of 4% to 6%, infrastructure and its service sector."}, {"s": "judge", "t": "Overall, FDI by businesses such as Apple is important for business growth in India, especially in manufacturing, but it depends on how much production and technology is shared with Indian businesses."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "ms": "Indicative content\n• Foreign direct investment (FDI) is investment by a business in productive assets in another country, such as building or expanding factories.\n• FDI creates business for local suppliers.\n• Apple works with manufacturers such as Foxconn and Tata Electronics, and 30.8 million iPhones were assembled in India in 2024.\n• Local suppliers of parts, transport and services gain orders, so Indian businesses grow.\n• However, many high value components may still be imported, limiting the benefit to Indian suppliers.\n• FDI creates jobs and income.\n• Foxconn employs around 40,000 workers near Chennai.\n• Higher incomes increase demand for goods and services from local businesses.\n• However, India's growth of 8.2% also depends on government policy, such as incentives of 4% to 6%, infrastructure and its service sector.\n• Overall, FDI by businesses such as Apple is important for business growth in India, especially in manufacturing, but it depends on how much production and technology is shared with Indian businesses.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements o     onSave(m); root.querySelector(`#${id}-out`).textContent = `Saved: ${m}/${q.marks}.`;
  });
}

/* ---------------- views ---------------- */
const SETNAME = { past: 'Past papers', style: 'Exam style' };
const SETBLURB = { past: 'Real Pearson exam questions with the original extracts and mark schemes.', style: 'New questions in the Pearson exam style, using case studies on international businesses, covering every topic.' };
const PAL = ['#1F4FA8', '#7C3AED', '#0E7490', '#B45309'];
const SECTIONS = U.flatMap(u => ['past', 'style'].map(s => ({ id: u.id + '-' + s, u, set: s })));
SECTIONS.forEach((s, i) => s.color = PAL[(U.length === 1 ? [0, 1] : [0, 1, 2, 3])[i]]);
const secOf = q => SECTIONS.find(s => s.u.id === q.u && s.set === q.set);
const secName = s => `${s.u.name.split(':')[0]} ${SETNAME[s.set]}`;
const qsOf = s => Q.filter(q => q.u === s.u.id && q.set === s.set);
const qLabel = q => { const qs = qsOf(secOf(q)); return (q.set === 'past' ? 'Q' : 'ES') + (qs.indexOf(q) + 1); };
const subName = (u, k) => u.subs[k] || k;
$('#mainnav').innerHTML = `<a href="#home" data-v="home">Home</a>` + SECTIONS.map(s => `<a href="#${s.id}" data-v="${s.id}"><i class="dot" style="background:${s.color}"></i>${esc(secName(s))}</a>`).join('');

function stats(qs) {
  const answered = qs.filter(q => (store.get('a' + q.n, '') || '').trim()).length;
  const scored = qs.map(q => { const s = store.get('s' + q.n, null), m = store.get('m' + q.n, null); const v = s ?? m; return v == null ? null : v / q.marks; }).filter(v => v != null);
  return { n: qs.length, answered, marked: scored.length, avg: scored.length ? Math.round(100 * scored.reduce((a, b) => a + b, 0) / scored.length) : null };
}
function home() {
  const all = stats(Q), papers = D.exams.filter(x => (store.get('exam-' + x.id, null) || {}).finished).length;
  $('#app').innerHTML = `<section class="hero1"><div class="eyebrow">${M.year} Business  |  Pearson Edexcel ${M.spec}</div><h1>${esc(M.title)}: ${esc(M.sub)}</h1>
    <p>Practise real past paper questions and exam style questions. Write your answer, then choose how to check it: the model build-up, a self-mark with the mark scheme, or a computer mark with reasons.</p></section>
    <section class="sheet dash" aria-label="Your progress"><div class="row" style="justify-content:space-between"><div><h2>Your progress</h2><span class="muted">Saved on this device</span></div><button class="btn danger" id="reset">Reset the whole website</button></div><div id="resetc"></div>
    <div class="tiles"><div><span class="eyebrow">Questions answered</span><b>${all.answered}/${all.n}</b></div><div><span class="eyebrow">Questions marked</span><b>${all.marked}/${all.n}</b></div>
    <div><span class="eyebrow">Average score</span><b>${all.avg == null ? '–' : all.avg + '%'}</b></div><div><span class="eyebrow">Timed papers finished</span><b>${papers}</b></div></div>
    <div class="secbars">${SECTIONS.map(s => { const st = stats(qsOf(s)); return `<a class="secbar" href="#${s.id}"><span class="lab"><i class="dot" style="background:${s.color}"></i>${esc(secName(s))}</span><span class="bar"><i style="width:${100 * st.marked / st.n}%;background:${s.color}"></i></span><span class="num">${st.marked}/${st.n} marked${st.avg == null ? '' : ' · ' + st.avg + '%'}</span></a>`; }).join('')}</div></section>
    <h2 style="margin-top:28px">Choose a section</h2>
    <div class="bigbtns">${SECTIONS.map(s => { const qs = qsOf(s), mk = qs.reduce((a, q) => a + q.marks, 0), subs = new Set(qs.flatMap(q => q.sub || []));
      return `<a class="bigbtn" href="#${s.id}" style="--c:${s.color}"><span class="eyebrow">${esc(s.u.name)}</span><b>${esc(secName(s))}</b><span>${qs.length} questions  ·  ${mk} marks  ·  ${subs.size} of ${Object.keys(s.u.subs).length} topics</span><span class="go">Open →</span></a>`; }).join('')}</div>
    <h2 style="margin-top:28px">How it works</h2><div class="how">
    <div class="sheet"><b>1. Answer</b>Read the extract beside the question and type your answer. It saves on this device as you type. You can clear it and start again, or print the question.</div>
    <div class="sheet"><b>2. Check</b>Choose the model build-up, a self-mark using the mark scheme, or a computer mark with reasons and what to add next.</div>
    <div class="sheet"><b>3. Timed papers</b>Each section has timed papers. Answers are marked when you finish, and you can self-mark each one.</div></div>
    `;
  $('#reset').addEventListener('click', () => { $('#resetc').innerHTML = `<div class="confirm"><b>Reset everything?</b> All your answers, marks and timed papers on this device will be deleted. This cannot be undone.<div class="row" style="margin-top:10px"><button class="btn danger" id="ry">Yes, reset everything</button><button class="btn ghost" id="rn">Cancel</button></div></div>`;
    $('#ry').addEventListener('click', () => { store.clearAll(); EXAM = null; home(); window.scrollTo(0, 0); }); $('#rn').addEventListener('click', () => $('#resetc').innerHTML = ''); });
}
function secHead(s, tab) {
  return `<div class="sechead" style="--c:${s.color}"><div class="eyebrow">${esc(s.u.name)}  |  ${esc(s.u.code)}</div><h1>${esc(secName(s))}</h1><p>${SETBLURB[s.set]}${s.set === 'style' ? ' ' + esc(s.u.note) : ''}</p></div>
   <nav class="subnav"><a href="#${s.id}" ${tab === 'q' ? 'aria-current="page"' : ''}>Questions</a><a href="#${s.id}-papers" ${tab === 'p' ? 'aria-current="page"' : ''}>Timed papers</a><a href="#${s.id}-topics" ${tab === 't' ? 'aria-current="page"' : ''}>Topics covered</a></nav>`;
}
function section(s) {
  const qs = qsOf(s); let list;
  if (s.set === 'past') list = s.u.topics.map((t, i) => { const g = qs.filter(q => q.topic === i + 1); return g.length ? `<section class="topic"><h3 class="gh"><i style="background:#${s.u.cols[i]}"></i>${esc(t)}</h3><div class="qlist">${g.map(qCard).join('')}</div></section>` : ''; }).join('');
  else list = s.u.cases.map(c => `<section class="topic"><h3 class="gh"><i style="background:${s.color}"></i>Case study: ${esc(c.name)} <span class="muted" style="font:500 .85rem var(--body)">(${esc(c.where)})</span></h3><div class="qlist">${qs.filter(q => q.case === c.id).map(qCard).join('')}</div></section>`).join('');
  $('#app').innerHTML = secHead(s, 'q') + list;
}
function topicsView(s) {
  const qs = qsOf(s), u = s.u;
  $('#app').innerHTML = secHead(s, 't') + `<p class="muted" style="max-width:70ch">Every ${esc(u.name)} topic and the questions in this section that test it.</p><div class="tblwrap"><table class="build cover"><tr><td>Topic</td><td>Questions</td></tr>${Object.keys(u.subs).map(k => { const hit = qs.filter(q => (q.sub || []).includes(k));
    return `<tr class="${hit.length ? '' : 'none'}"><td>${esc(subName(u, k))}${u.subdetail ? `<div class="muted" style="font-weight:400;font-size:.82rem">${esc(u.subdetail[k].split(': ').slice(1).join(': '))}</div>` : ''}</td><td>${hit.length ? hit.map(q => `<a href="#q-${q.n}">${qLabel(q)} (${q.marks})</a>`).join(' ') : `<span class="muted">${s.set === 'past' ? 'Not in these past papers: see the exam style section' : 'Not covered'}</span>`}</td></tr>`; }).join('')}</table></div>`;
}
function qCard(q) {
  const sm = store.get('s' + q.n, null) ?? store.get('m' + q.n, null);
  return `<a class="sheet qcard" style="--tc:${col(q)}" href="#q-${q.n}"><div class="meta"><span>${qLabel(q)}  |  ${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) : 'Exam style'}</span><span>${q.marks} marks</span></div><b>${esc(q.biz)}</b><span class="stem">${esc(q.stem.length > 150 ? q.stem.slice(0, 150) + '…' : q.stem)}</span><div class="meta"><span>${cmd(q)}  |  ${esc((q.sub || []).map(k => subName(unitOf(q), k))[0] || '')}</span>${sm != null ? `<span class="state">Mark ${sm}/${q.marks}</span>` : (store.get('a' + q.n, '') || '').trim() ? '<span class="state">Answered</span>' : ''}</div></a>`;
}
function tipHTML(q) { return q.tip ? `<div class="tip"><b>Examiner tip</b>${esc(q.tip)}</div>` : ''; }
function printQ(q) {
  $('#printarea').innerHTML = `<h1>${esc(unitOf(q).name)}  |  ${qLabel(q)} ${esc(q.biz)}</h1><p class="pm">${q.set === 'past' ? esc(q.paper) + ' paper, Q' + esc(q.qn) : 'Exam style question'}  |  ${q.marks} marks  |  Suggested time: ${Math.round(q.marks * M.mins)} minutes</p>
    <div class="pext">${extractsHTML(q)}</div><div class="pq"><b>${esc(q.stem)}</b> <span>(${q.marks})</span></div><div class="plines">${'<div></div>'.repeat(Math.min(40, 8 + q.marks * 2))}</div>`;
  document.body.classList.add('printing'); window.print();
}
window.addEventListener('afterprint', () => document.body.classList.remove('printing'));
function questionView(n) {
  const q = Q.find(x => x.n === n); if (!q) return home();
  const s = secOf(q), id = 'q' + n;
  $('#app').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px"><a href="#${s.id}">← ${esc(secName(s))}</a><span class="eyebrow">${esc((q.sub || []).map(k => subName(unitOf(q), k)).join(', '))}</span></div>
  <div class="qview"><aside class="sheet booklet" aria-label="Extracts">${q.set === 'style' ? `<p class="note" style="margin-top:0">${esc(unitOf(q).note)}</p>` : ''}${extractsHTML(q)}</aside>
  <section class="sheet qpaper"><div class="qhead"><span class="qnum" style="color:${col(q)}">${qLabel(q)}  ${esc(q.biz)}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:2px 0 0">${esc(unitOf(q).name)}  |  ${q.set === 'past' ? esc(q.paper) + ' paper, Q' + esc(q.qn) : 'Exam style question'}</p>
  <p class="qstem">${esc(q.stem)}</p><p class="muted" style="margin:0 0 10px">Suggested time: ${Math.round(q.marks * M.mins)} minutes.</p>
  <label for="${id}-ans" class="eyebrow">Your answer</label><textarea class="answer" id="${id}-ans" spellcheck="true" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:8px"><span class="counter" id="${id}-wc">0 words  ·  saved</span><div class="row"><button class="btn ghost" id="${id}-clear">Clear answer</button><button class="btn ghost" id="${id}-print">Print question</button></div></div>
  <div id="${id}-cc"></div>
  <h3 style="margin-top:18px">Check your answer</h3>
  <div class="tabs" role="tablist"><button role="tab" aria-selected="false" data-tab="model">Model build-up</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="comp">Computer mark</button></div>
  <div class="panel" data-p="none"><p class="muted">Choose an option above. The computer mark updates as you edit your answer.</p></div>
  <div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div>
  <div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div>
  <div class="panel" data-p="comp" hidden></div>
  </section></div>
  <div class="row" style="justify-content:space-between;margin-top:16px">${navBtn(q, -1)}${navBtn(q, 1)}</div>`;
  const ta = $(`#${id}-ans`), wc = () => $(`#${id}-wc`).textContent = `${words(ta.value).length} words  ·  saved`;
  let cur = 'none';
  const markNow = () => { const r = mark(q, ta.value); if (words(ta.value).length) store.set('m' + n, r.mark); document.querySelector('[data-p="comp"]').innerHTML = (q.tip ? tipHTML(q) : '') + resultHTML(q, r); };
  const tabs = document.querySelectorAll('.tabs button'), show = k => { cur = k; tabs.forEach(b => b.setAttribute('aria-selected', b.dataset.tab === k)); document.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== k); if (k === 'comp') markNow(); };
  tabs.forEach(b => b.addEventListener('click', () => show(b.dataset.tab)));
  ta.value = store.get('a' + n, ''); wc();
  let deb; ta.addEventListener('input', () => { store.set('a' + n, ta.value); wc(); if (cur === 'comp') { clearTimeout(deb); deb = setTimeout(markNow, 600); } });
  $(`#${id}-print`).addEventListener('click', () => printQ(q));
  $(`#${id}-clear`).addEventListener('click', () => { $(`#${id}-cc`).innerHTML = `<div class="confirm"><b>Clear your answer and marks for this question?</b> This cannot be undone.<div class="row" style="margin-top:10px"><button class="btn danger" id="${id}-cy">Yes, clear and start again</button><button class="btn ghost" id="${id}-cn">Cancel</button></div></div>`;
    $(`#${id}-cy`).addEventListener('click', () => { ['a', 'm', 's'].forEach(k => store.set(k + n, null)); questionView(n); });
    $(`#${id}-cn`).addEventListener('click', () => $(`#${id}-cc`).innerHTML = ''); });
  wireSelf(document.querySelector('[data-p="self"]'), q, id, m => store.set('s' + n, m));
}
function navBtn(q, d) { const qs = qsOf(secOf(q)), i = qs.indexOf(q) + d; if (i < 0 || i >= qs.length) return '<span></span>'; const o = qs[i]; return `<a class="btn ghost" href="#q-${o.n}">${d < 0 ? '← ' : ''}${qLabel(o)} ${esc(o.biz)}${d > 0 ? ' →' : ''}</a>`; }

/* exam */
let EXAM = null, tick = null;
function examPick(s) {
  $('#app').innerHTML = secHead(s, 'p') + `<p class="muted" style="max-width:65ch">Questions appear one at a time with their extracts, like the real exam. The timer allows ${M.mins} minutes per mark. Nothing is marked until you finish, then every answer is marked with reasons and you can self-mark each one.</p>
  <div class="paper-pick">${D.exams.filter(x => x.unit === s.u.id && x.set === s.set).map(x => { const qs = x.qs.map(n => Q.find(q => q.n === n)), mk = qs.reduce((a, q) => a + q.marks, 0), st = store.get('exam-' + x.id, null);
    return `<div class="sheet"><div class="eyebrow">${qs.length} questions  |  ${mk} marks  |  ${Math.round(mk * M.mins)} minutes</div><h2>${esc(x.name)}</h2><p class="muted" style="margin:0">${esc(x.note)}</p><div class="marks-strip">${qs.map(q => `<span class="chip">${qLabel(q)} (${q.marks})</span>`).join('')}</div><div><a class="btn" href="#paper-${x.id}" style="background:${s.color};border-color:${s.color}">${st ? (st.finished ? 'See results' : 'Continue this paper') : 'Start this paper'}</a></div></div>`; }).join('')}</div>`;
}
function examStart(xid) {
  const x = D.exams.find(e => e.id === xid); if (!x) return home();
  const sec = SECTIONS.find(s => s.u.id === x.unit && s.set === x.set);
  const saved = store.get('exam-' + xid, null);
  if (!EXAM || EXAM.id !== xid) EXAM = saved && !saved.finished ? saved : { id: xid, i: 0, ans: {}, end: Date.now() + Math.round(x.qs.reduce((a, n) => a + Q.find(q => q.n === n).marks, 0) * M.mins * 60000), finished: false, self: {} };
  if (EXAM.finished) return examResults(x);
  renderExamQ(x);
}
function renderExamQ(x) {
  const q = Q.find(qq => qq.n === x.qs[EXAM.i]), id = 'ex' + q.n;
  $('#app').innerHTML = `<div class="exambar"><b>${esc(x.name)}</b><span class="timer" id="timer"></span><div class="qnav">${x.qs.map((n, i) => `<button class="${i === EXAM.i ? 'cur' : ''} ${(EXAM.ans[n] || '').trim() ? 'done' : ''}" data-i="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join('')}</div><span style="margin-left:auto"></span><button class="btn" id="finish">Finish and mark</button></div>
  <div id="confirm"></div>
  <div class="qview"><aside class="sheet booklet">${extractsHTML(q)}</aside><section class="sheet qpaper">
  <div class="qhead"><span class="qnum" style="color:${col(q)}">Question ${EXAM.i + 1} of ${x.qs.length}</span><span class="mk">(${q.marks})</span></div>
  <p class="muted" style="margin:4px 0 0">${q.set === 'past' ? esc(q.paper) + ' Q' + esc(q.qn) + '  |  ' : 'Exam style  |  '}${esc(q.biz)}</p><p class="qstem">${esc(q.stem)}</p>
  <label for="${id}" class="eyebrow">Your answer</label><textarea class="answer" id="${id}" placeholder="Type your answer here…"></textarea>
  <div class="row" style="justify-content:space-between;margin-top:10px"><span class="counter" id="wc"></span><div class="row"><button class="btn ghost" id="prev" ${EXAM.i ? '' : 'disabled'}>← Previous</button><button class="btn ghost" id="next" ${EXAM.i < x.qs.length - 1 ? '' : 'disabled'}>Next →</button></div></div></section></div>`;
  const ta = $('#' + id), save = () => { EXAM.ans[q.n] = ta.value; store.set('exam-' + x.id, EXAM); $('#wc').textContent = `${words(ta.value).length} words`; };
  ta.value = EXAM.ans[q.n] || ''; save(); ta.addEventListener('input', save);
  const go = i => { EXAM.i = i; store.set('exam-' + x.id, EXAM); renderExamQ(x); window.scrollTo(0, 0); };
  document.querySelectorAll('.qnav button').forEach(b => b.addEventListener('click', () => go(+b.dataset.i)));
  $('#prev').addEventListener('click', () => go(EXAM.i - 1)); $('#next').addEventListener('click', () => go(EXAM.i + 1));
  $('#finish').addEventListener('click', () => { const blank = x.qs.filter(n => !(EXAM.ans[n] || '').trim()).length;
    $('#confirm').innerHTML = `<div class="confirm"><b>Finish the paper and mark it?</b> ${blank ? `You have ${blank} unanswered question(s).` : 'All questions have an answer.'} You cannot change answers after marking.<div class="row" style="margin-top:10px"><button class="btn" id="yes">Yes, mark my paper</button><button class="btn ghost" id="no">Keep writing</button></div></div>`;
    $('#yes').addEventListener('click', () => finish(x)); $('#no').addEventListener('click', () => $('#confirm').innerHTML = ''); });
  clearInterval(tick); const t = () => { const s = Math.max(0, Math.round((EXAM.end - Date.now()) / 1000)), el = $('#timer'); if (!el) return clearInterval(tick);
    el.textContent = s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left` : 'Time is up'; el.classList.toggle('low', s < 300); };
  t(); tick = setInterval(t, 1000);
}
function finish(x) { clearInterval(tick); EXAM.finished = true; store.set('exam-' + x.id, EXAM); examResults(x); window.scrollTo(0, 0); }
function examResults(x) {
  const qs = x.qs.map(n => Q.find(q => q.n === n)), max = qs.reduce((a, q) => a + q.marks, 0);
  const comp = qs.reduce((a, q) => a + mark(q, EXAM.ans[q.n] || '').mark, 0), selfTot = () => qs.reduce((a, q) => a + (EXAM.self[q.n] ?? 0), 0), selfN = () => qs.filter(q => EXAM.self[q.n] != null).length;
  $('#app').innerHTML = `<div class="eyebrow">${esc(secName(SECTIONS.find(s => s.u.id === x.unit && s.set === x.set)))}  |  ${esc(x.name)}  |  Results</div><h1>Your paper is marked</h1>
  <div class="cmp" style="max-width:640px"><div><span class="eyebrow">Computer mark</span><b>${comp}/${max}</b><span class="muted">${Math.round(100 * comp / max)}%</span></div><div><span class="eyebrow">Your self-mark</span><b id="selftot">${selfTot()}/${max}</b><span class="muted" id="selfn">${selfN()} of ${qs.length} questions self-marked</span></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="again">Start this paper again</button><a class="btn ghost" href="#${x.unit}-${x.set}-papers">Choose another paper</a></div>
  ${qs.map((q, i) => { const r = mark(q, EXAM.ans[q.n] || ''), id = 'r' + q.n;
    return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Question ${i + 1}: ${esc(q.biz)}  <span class="muted">(${q.marks} marks)</span></span><span class="mk">${r.mark}/${r.max}  ·  ${esc(r.label)}</span></summary>
    <p class="qstem">${esc(q.stem)}</p><h3>Your answer</h3><pre class="ms" style="font-family:var(--body)">${esc(EXAM.ans[q.n] || '(no answer)')}</pre>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const q = h.startsWith('q-') ? Q.find(x => x.n === +h.slice(2)) : null;
  const ex = h.startsWith('paper-') ? D.exams.find(e => e.id === h.slice(6)) : null;
  const sec = SECTIONS.find(s => h === s.id || h === s.id + '-papers' || h === s.id + '-topics');
  const v = q ? secOf(q).id : ex ? ex.unit + '-' + ex.set : sec ? sec.id : 'home';
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (q) questionView(q.n);
  else if (ex) examStart(ex.id);
  else if (sec && h.endsWith('-papers')) examPick(sec);
  else if (sec && h.endsWith('-topics')) topicsView(sec);
  else if (sec) section(sec);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
