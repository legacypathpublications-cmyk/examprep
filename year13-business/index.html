 is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]]}, {"n": 207, "u": "u4", "set": "past", "topic": 2, "sub": ["m3"], "marks": 12, "biz": "Senegal", "paper": "January 2023", "qn": "1(d)", "stem": "Assess the importance of political stability in a country when choosing a production location.", "read": "C", "ext": [{"id": "C", "t": "Senegal attracts investors", "p": ["The largest wind farm in West Africa is in Senegal, 70 km northeast of Dakar. Stretching across 41 hectares, the Taiba N’Diaye wind power project has attracted over $400m of Foreign Direct Investment (FDI). When operating at full capacity, it will provide two million people with electricity and supply nearly a sixth of Senegal’s power needs. It is not the only large energy project that looks set to transform Senegal’s economy. Reserves of more than 1 billion barrels of oil and 40,000 billion cubic feet of gas have been found just offshore. Another major find by British oil company BP and US operator Kosmos Energy has led to the development of the $4.8bn Greater Tortue Ahmeyim (GTA) project, which has 15 trillion cubic feet of recoverable gas reserves.", "As a result of the oil and gas discoveries investor interest has increased, encouraged by the appealing nature of the broader Senegalese market. In a relatively unstable region, with recent coups in Guinea and Mali and turbulence in Côte d’Ivoire, Senegal stands out for its political stability."]}], "ms": "Question Assess the importance of political stability when choosing a production\nlocation. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Political stability is important because it means that the business is\nless likely to be disturbed by political events beyond its control\n• Economic policy is less likely to suddenly change\n• Political instability can be very disruptive to business activity such as\ncivil unrest\n• The ‘gilets jaunes’ in France have caused delays and problems for\nsome businesses\n• In extreme form, political instability such as armed insurrection or\neven war can be a catastrophic problem\n• Political stability means that corruption is likely to be lower which\nreduces the costs and problems for a business\n• Politically stable countries such as Senegal may be more attractive to\ninvestors than its close neighbours such as Guinea and Mali that have\nhad coups and terrorist attacks\n• However, other factors may be more important such as the cost and\navailability of labour, - JLR’s decision to increase production in Slovakia\nand Europe\n• Access to raw materials - Senegal may be a stable country but its\nreserves of gas and oil are the main reasons for its recent increase in\nFDI\n• Infrastructure may be an important factor – such as Nissan’s need for a\ndeep water port at Sunderland\n• These may outweigh or override political stability as a deciding factor\n• Being able to manufacture from within a trade bloc such as the EU\nmay be more important\n• Much depends on the nature of the business and its needs\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["political stability", "stable", "instability", "corruption", "government"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Political stability means a country is unlikely to face sudden changes of government, unrest or policy that disrupt business. [K]", "Key term"], ["Point 1", "A stable country means the business is less likely to be disturbed by political events beyond its control, and economic policy is less likely to change suddenly. [K] Politically stable Senegal may be more attractive to investors than close neighbours such as Guinea and Mali, which have had coups and terrorist attacks. [A] This reduces the risk to the investment, so production is less likely to be interrupted. [An] However, other factors may be more important, such as the cost and availability of labour. [Ev]", "(4)"], ["Point 2", "Political stability usually means lower corruption. [K] Political instability such as civil unrest can be very disruptive to business activity. [A] Lower corruption reduces the costs and problems a business faces. [An] However, access to raw materials may matter more: Senegal's gas and oil reserves are the main reason for its recent increase in FDI. [Ev]", "(4)"], ["Conclusion", "Political stability is important, but infrastructure, access to resources and being inside a trade bloc may outweigh it; much depends on the nature of the business and its needs. [Ev]", "(2)"]]}, "pts": [{"t": "Political stability is important because it means that the business is less likely to be disturbed by political events beyond its control", "s": "know"}, {"t": "Economic policy is less likely to suddenly change", "s": "for"}, {"t": "Political instability can be very disruptive to business activity such as civil unrest", "s": "for"}, {"t": "The ‘gilets jaunes’ in France have caused delays and problems for some businesses", "s": "for"}, {"t": "In extreme form, political instability such as armed insurrection or even war can be a catastrophic problem", "s": "for"}, {"t": "Political stability means that corruption is likely to be lower which reduces the costs and problems for a business", "s": "for"}, {"t": "Politically stable countries such as Senegal may be more attractive to investors than its close neighbours such as Guinea and Mali that have had coups and terrorist attacks", "s": "for"}, {"t": "However, other factors may be more important such as the cost and availability of labour, - JLR’s decision to increase production in Slovakia and Europe", "s": "against"}, {"t": "Access to raw materials - Senegal may be a stable country but its reserves of gas and oil are the main reasons for its recent increase in FDI", "s": "against"}, {"t": "Infrastructure may be an important factor – such as Nissan’s need for a deep water port at Sunderland", "s": "against"}, {"t": "These may outweigh or override political stability as a deciding factor", "s": "against"}, {"t": "Being able to manufacture from within a trade bloc such as the EU may be more important", "s": "against"}, {"t": "Much depends on the nature of the business and its needs", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 208, "u": "u4", "set": "past", "topic": 2, "sub": ["m2"], "marks": 12, "biz": "Peru", "paper": "June 2023", "qn": "1(d)", "stem": "Assess the importance of the level and growth of disposable income for a business when considering entering a market such as Peru.", "read": "C", "ext": [{"id": "C", "t": "How Peru became one of the biggest markets for Foreign Direct Investment (FDI) in", "p": ["South America", "Peru has a stable economy with strong growth. In the first quarter of 2021, Peru attracted $3.47bn of FDI, more than all of Peru’s FDI in 2020. The World Bank predicts its GDP will grow by 3.9% in 2022 and that it will be the second-fastest growing economy in South America.", "Peru has 21 Free Trade Agreements (FTAs) in force. In addition, it has 28 investment agreements with countries including Canada, Brazil, Chile, Japan and Switzerland. Peru has a low public debt to GDP ratio and is predicted to have the second-lowest inflation rate in South America. It has a good infrastructure and a supportive government with a stable legal framework.", "All this has made Peru a prime location for FDI, particularly in renewable energy, manufacturing, food, tourism, retail and technology. The average salary for an employee in Peru increases by 9% every 17 months. The global average is 3%."]}], "ms": "Question Assess the importance of the level and growth of disposable income for a\nbusiness when considering entering a market such as Peru. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Disposable income is the amount of money that households have\navailable for spending and saving after taxes have been paid\n• The level of disposable income is likely to be very important if a global\nbusiness is to be successful in establishing a market in a country such as\nPeru\n• If incomes are low then competition for that income is likely to be strong\nand it may not be worthwhile entering the market\n• The growth of incomes is important if demand is to be sustained and\nsales increased\n• Peru is predicted to be the second fastest growing economy in South\nAmerica and salaries are growing faster than the global average, 9%\ncompared to 3%\n• This will be an important pull factor for a global business wishing to\nincrease sales and/or enter a new market, particularly if its goods or\nservices are income elastic\n• A rapidly growing economy is likely to have a growing demand for\nconsumer and luxury goods and there may be gaps in the market for a\nnew entrant\n• However, the level and growth of disposable income is just one factor\nthat will be taken into account when considering entering a new market\n• Others factors such as infrastructure are important because a business\nmust be able to maintain supply/distribution networks to retail outlets\n• Government policies which increase the ease of doing business may be\nimportant, Peru has a supportive government and a stable legal structure\n• Trading agreements may be a factor, for example Peru has 21 FTAs\nwhich will make cross-border trading easier\n• Much will depend on the nature of the business wanting to enter the\nmarket. Those businesses dependent on consumer sales with income\nelastic products will consider the level and growth of disposable income\nto be an important factor\n• Businesses that supply capital goods to other businesses may be more\ninfluenced by the high level of FDI into Peru\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["disposable income", "income", "spend", "demand"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Disposable income is the income people have left to spend after taxes and other deductions. [K]", "Key term"], ["Point 1", "Rising disposable income increases demand for goods and services. [K] Peru has a stable economy with strong growth. [A] A business entering Peru can expect growing sales, especially for products customers buy more of as incomes rise. [An] However, income may be unequally distributed, so many consumers may still have low spending power. [Ev]", "(4)"], ["Point 2", "The level of disposable income affects what consumers can afford. [K] Peru has 21 free trade agreements and is a prime location for FDI. [A] Higher incomes allow businesses to sell premium products and earn higher margins. [An] However, other factors such as ease of doing business, infrastructure, political stability and exchange rates may be more important. [Ev]", "(4)"], ["Conclusion", "The level and growth of disposable income is important for most businesses entering Peru, but its importance depends on the type of product and the other market factors. [Ev]", "(2)"]]}, "pts": [{"t": "Disposable income is the amount of money that households have available for spending and saving after taxes have been paid", "s": "know"}, {"t": "The level of disposable income is likely to be very important if a global business is to be successful in establishing a market in a country such as Peru", "s": "for"}, {"t": "If incomes are low then competition for that income is likely to be strong and it may not be worthwhile entering the market", "s": "for"}, {"t": "The growth of incomes is important if demand is to be sustained and sales increased", "s": "for"}, {"t": "Peru is predicted to be the second fastest growing economy in South America and salaries are growing faster than the global average, 9% compared to 3%", "s": "for"}, {"t": "This will be an important pull factor for a global business wishing to increase sales and/or enter a new market, particularly if its goods or services are income elastic", "s": "for"}, {"t": "A rapidly growing economy is likely to have a growing demand for consumer and luxury goods and there may be gaps in the market for a new entrant", "s": "for"}, {"t": "However, the level and growth of disposable income is just one factor that will be taken into account when considering entering a new market", "s": "against"}, {"t": "Others factors such as infrastructure are important because a business must be able to maintain supply/distribution networks to retail outlets", "s": "against"}, {"t": "Government policies which increase the ease of doing business may be important, Peru has a supportive government and a stable legal structure", "s": "against"}, {"t": "Trading agreements may be a factor, for example Peru has 21 FTAs which will make cross-border trading easier", "s": "against"}, {"t": "Much will depend on the nature of the business wanting to enter the market. Those businesses dependent on consumer sales with income elastic products will consider the level and growth of disposable income to be an important factor", "s": "against"}, {"t": "Businesses that supply capital goods to other businesses may be more influenced by the high level of FDI into Peru", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 209, "u": "u4", "set": "past", "topic": 2, "sub": ["m2"], "marks": 12, "biz": "Kenya", "paper": "January 2024", "qn": "1(d)", "stem": "Assess the importance of exchange rates for a global business when considering entering a market such as Kenya.", "read": "C", "ext": [{"id": "C", "t": "Kenyan shilling (KES) drops to a new historic low of 120 against the US dollar", "p": ["The Kenyan shilling dropped to a new low in August 2022, at 120 shillings to the US dollar amid the controversies surrounding President-elect William Ruto’s victory in the keenly contested Kenyan presidential elections.", "This was the 16th month in a row that the shilling had depreciated against the US dollar. As one financial analyst puts it, a depreciating shilling means imports, such as petrol, food and raw materials, will become more expensive. This will further increase the household cost of living as importers pass on the higher costs to consumers."]}], "ms": "Question Assess the importance of exchange rates for a global business when considering\nentering a market such as Kenya. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• An exchange rate is the price of one currency expressed in terms of\nanother\n• Changes in exchange rates can be important for businesses when\nentering a market in another country because currencies need changing\nfor trade to take place\n• Depreciation of a currency is usually seen as being bad for importers\n• Goods and services entering the country from somewhere with a\nstronger currency will appear to be more expensive\n• This would not be good for a business wishing to sell its products in\nsomewhere like Kenya as Kenyans will have to give up more shillings\nthan they previously did for the same product\n• Not only that but consumers’ ability to buy will be reduced as they have\nto give up more of their currency to buy petrol and food meaning they\nhave less to spend on products from new entrants\n• The opposite will happen if the exchange rate in the market has\nappreciated relative to the one the global business is based in, then the\nimported goods will seem cheaper and be more attractive to consumers\n• Other things being equal a business entering a new market would\nprefer that market’s currency to be stable and not depreciating\n• However, it depends by how much the currency is depreciating and\nhow long the depreciation lasts.\n• PED is important, some businesses may not be too badly affected as\nmost customers will still want to buy even as prices in their currency\nrise\n• Businesses such as Apple have products that are likely to be price\ninelastic and many of its customers will continue to purchase\n• Other considerations may be more important than movements in\nexchange rates such as ease of doing business, infrastructure, political\nstability, supply chain constraints, level of competition\n• These factors may be more important than those caused by exchange\nrate fluctuation depending on the nature of the product or business\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["exchange rate", "currency", "depreciat", "appreciat", "shilling"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "An exchange rate is the price of one currency expressed in terms of another. [K]", "Key term"], ["Point 1", "Depreciation of a currency is usually bad for businesses selling imports into that country. [K] The Kenyan shilling dropped to a new low of 120 shillings to the US dollar in August 2022. [A] Imported products appear more expensive because Kenyans have to give up more shillings for the same product, which reduces demand. [An] However, it depends by how much the currency depreciates and how long the depreciation lasts. [Ev]", "(4)"], ["Point 2", "Depreciation reduces consumers' ability to buy. [K] Kenyans have to give up more of their currency to buy petrol and food. [A] They have less to spend on products from new entrants, so sales may be lower than planned. [An] However, businesses with price inelastic products, such as Apple, may not be badly affected because customers will still buy. [Ev]", "(4)"], ["Conclusion", "Exchange rates matter, but ease of doing business, infrastructure, political stability and competition may be more important, depending on the nature of the product. [Ev]", "(2)"]]}, "pts": [{"t": "An exchange rate is the price of one currency expressed in terms of another", "s": "know"}, {"t": "Changes in exchange rates can be important for businesses when entering a market in another country because currencies need changing for trade to take place", "s": "for"}, {"t": "Depreciation of a currency is usually seen as being bad for importers", "s": "for"}, {"t": "Goods and services entering the country from somewhere with a stronger currency will appear to be more expensive", "s": "for"}, {"t": "This would not be good for a business wishing to sell its products in somewhere like Kenya as Kenyans will have to give up more shillings than they previously did for the same product", "s": "for"}, {"t": "Not only that but consumers’ ability to buy will be reduced as they have to give up more of their currency to buy petrol and food meaning they have less to spend on products from new entrants", "s": "for"}, {"t": "The opposite will happen if the exchange rate in the market has appreciated relative to the one the global business is based in, then the imported goods will seem cheaper and be more attractive to consumers", "s": "for"}, {"t": "Other things being equal a business entering a new market would prefer that market’s currency to be stable and not depreciating", "s": "for"}, {"t": "However, it depends by how much the currency is depreciating and how long the depreciation lasts.", "s": "against"}, {"t": "PED is important, some businesses may not be too badly affected as most customers will still want to buy even as prices in their currency rise", "s": "against"}, {"t": "Businesses such as Apple have products that are likely to be price inelastic and many of its customers will continue to purchase", "s": "against"}, {"t": "Other considerations may be more important than movements in exchange rates such as ease of doing business, infrastructure, political stability, supply chain constraints, level of competition", "s": "against"}, {"t": "These factors may be more important than those caused by exchange rate fluctuation depending on the nature of the product or business", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 210, "u": "u4", "set": "past", "topic": 2, "sub": ["m1"], "marks": 12, "biz": "Australia", "paper": "October 2023", "qn": "1(d)", "stem": "Assess the advantages of outsourcing for a business wanting to improve cost competitiveness.", "read": "B", "ext": [{"id": "B", "t": "Outsourcing can be a solution to Australia’s skills crisis", "p": ["Australia has a skills shortage problem that is the worst ever seen. There is a shortage of people as well as skills. This is where outsourcing can help, it provides people to fill the gaps.", "In Australia, more than 30,000 businesses have outsourced work to different countries. In Australia the outsourcing industry is worth $35bn and growing at 3.3%. This shows that there is a huge demand for it and not just in the traditional areas of finance, telecommunications and banking but now other areas of the service industry.", "In 2022 we work in a global world where work teams are connected by technology and leadership. Smart businesses will use this to their advantage. Outsourcing is one solution to the current skills crisis – but only if it is done well.", ""]}], "ms": "Question Assess the advantages of outsourcing for a business wanting to improve cost\ncompetitiveness. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Outsourcing means moving a business function or department to a\nspecialist external provider which may or may not be overseas\n• By reducing costs, profitability can be increased which may enable prices\nto be reduced and improve competitiveness\n• Increased profitability can lead to greater investment for future growth\n• Skilled workers can be found that may not be available at home, this is\nthe case with Australia in Extract B\n• Such workers may be specialists and offer a more skilled and efficient\nservice than might be case within the business itself\n• By outsourcing some support functions, the business can then\nconcentrate on its core competences\n• Outsourcing can improve speed, flexibility and quality of the product or\nservice\n• Modern technology has made it much easier for a business to be run\nfrom different countries\n• However, problems may arise\n• There may be communication problems arising as a result of language or\ncultural differences\n• It can be difficult to oversee events or guarantee quality of output from a\ndistance\n• There may be a risk of loss of intellectual property\n• A business may risk losing its own identity and corporate culture if it\nrelies too much on others\n• Nevertheless, the extract suggests outsourcing will work if done well\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["outsourc", "external provider", "specialist", "cost competitive"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Outsourcing means moving a business function or department to a specialist external provider, which may or may not be overseas. [K]", "Key term"], ["Point 1", "Outsourcing reduces costs. [K] In Australia, more than 30,000 businesses have outsourced work to different countries. [A] Lower costs increase profitability, which may allow prices to be reduced and improve competitiveness. [An] However, there may be communication problems as a result of language or cultural differences. [Ev]", "(4)"], ["Point 2", "Skilled workers can be found who may not be available at home. [K] Australia has its worst ever skills shortage. [A] Specialist workers may offer a more skilled and efficient service, so the business can concentrate on its core competences. [An] However, it can be difficult to guarantee quality from a distance, and there is a risk of losing intellectual property and corporate identity. [Ev]", "(4)"], ["Conclusion", "Outsourcing can improve cost competitiveness if it is done well, but the business must manage quality and communication carefully. [Ev]", "(2)"]]}, "pts": [{"t": "Outsourcing means moving a business function or department to a specialist external provider which may or may not be overseas", "s": "know"}, {"t": "By reducing costs, profitability can be increased which may enable prices to be reduced and improve competitiveness", "s": "for"}, {"t": "Increased profitability can lead to greater investment for future growth", "s": "for"}, {"t": "Skilled workers can be found that may not be available at home, this is the case with Australia in Extract B", "s": "for"}, {"t": "Such workers may be specialists and offer a more skilled and efficient service than might be case within the business itself", "s": "for"}, {"t": "By outsourcing some support functions, the business can then concentrate on its core competences", "s": "for"}, {"t": "Outsourcing can improve speed, flexibility and quality of the product or service", "s": "for"}, {"t": "Modern technology has made it much easier for a business to be run from different countries", "s": "for"}, {"t": "However, problems may arise", "s": "against"}, {"t": "There may be communication problems arising as a result of language or cultural differences", "s": "against"}, {"t": "It can be difficult to oversee events or guarantee quality of output from a distance", "s": "against"}, {"t": "There may be a risk of loss of intellectual property", "s": "against"}, {"t": "A business may risk losing its own identity and corporate culture if it relies too much on others", "s": "against"}, {"t": "Nevertheless, the extract suggests outsourcing will work if done well", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 211, "u": "u4", "set": "past", "topic": 1, "sub": ["g5"], "marks": 12, "biz": "Valio", "paper": "June 2024", "qn": "1(d)", "stem": "Assess the benefits for Valio of being in the EU trading bloc.", "read": "A", "ext": [{"id": "A", "t": "Finnish dairy business Valio is feeding the future", "p": ["Valio is a dairy and food business based in Finland. It has been producing milk since 1905, when it was founded by a small group of family-owned Finnish dairy farms.", "Today, Valio produces a wide range of food and dairy products. It is Finland’s biggest food exporter, selling products in 60 countries around the world including the EU, the US and China. The business employs about 4,200 people in its factories and laboratories. Indirectly, it employs thousands more people at farms and small enterprises related to agriculture and food.", "In 2021, Valio’s revenue was €1.92bn, 40% of which came from exports. Valio recognises that if it wants to continue to grow it will need to export more. One reason is that the 5.5 million population in Finland is declining."]}], "ms": "Question Assess the benefits for Valio of being in the EU trading bloc. (12)\nIndicative content\n1(d)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A trading bloc is a group of countries with a trading agreement between\nthemselves\n• Members of the EU have free trade and full access to each other’s\nmarkets\n• Finland is in the EU and therefore Valio will be able to freely access the\nmarkets of all the EU countries\n• There will be no tariffs or restrictions on the sale of its products and it\nwill be easier to expand its sales and revenue beyond its saturated home\nmarket\n• If Valio uses inputs from other EU countries they will not carry tariffs and\nwill be cheaper than might otherwise be the case\n• Valio sells to other countries outside of the EU including the potentially\nhuge markets in the US and China\n• The size and power of the EU means that it is able to negotiate with\ncountries such as the US and China and secure trade deals that benefit\nits members\n• This is of great help to a small country like Finland and businesses such\nas Valio\n• However, Finland will not have any protective tariffs and barriers,\nmeaning businesses such as Valio are open to competition from other\nbusinesses anywhere in the EU\n• Low cost manufacturing bases in other EU countries such as Greece,\nmay make it easier for their businesses to penetrate the Finnish market\nand provide competition for Valio\n• Increased competition for Valio may mean a drop in sales causing a\ndrop in profits\n• Despite this, it would seem that Valio is a successful business and has\nbenefited from being in the EU trading bloc\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented but may be assertions or incomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate knowledge and understanding, supported by relevant and\neffective use of the business behaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["trading bloc", "eu", "single market", "free trade", "tariff"], "tip": "Examiner report (June 2024): the question was specifically about the EU, which is a requirement of the specification, so generic answers about trading blocs were not focused enough. Many candidates wrongly thought a tariff was a cost of production for the firm. Good responses added balance by looking at trade diversion, possible retaliation against EU external tariffs affecting exports to the US and China, and the risk of other EU businesses having free access to Valio's home market.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "A trading bloc is a group of countries with a trading agreement between themselves; EU members have free trade and full access to each other's markets. [K]", "Key term"], ["Point 1", "There are no tariffs or restrictions on sales within the EU. [K] Finland is in the EU, so Valio can freely access the markets of all EU countries. [A] It is easier for Valio to expand its sales and revenue beyond its saturated home market. [An] However, Finland has no protective tariffs against other EU countries, so Valio is open to competition from businesses anywhere in the EU. [Ev]", "(4)"], ["Point 2", "The size and power of the EU helps it negotiate trade deals. [K] Valio sells to countries outside the EU, including the potentially huge markets in the US and China. [A] Trade deals negotiated by the EU help a small country like Finland and businesses such as Valio sell abroad. [An] However, low cost producers in other EU countries such as Greece may find it easier to enter the Finnish market, reducing Valio's sales and profits. [Ev]", "(4)"], ["Conclusion", "Despite more competition, Valio appears to be a successful business that has benefited from being in the EU trading bloc. [Ev]", "(2)"]]}, "pts": [{"t": "A trading bloc is a group of countries with a trading agreement between themselves", "s": "know"}, {"t": "Members of the EU have free trade and full access to each other’s markets", "s": "for"}, {"t": "Finland is in the EU and therefore Valio will be able to freely access the markets of all the EU countries", "s": "for"}, {"t": "There will be no tariffs or restrictions on the sale of its products and it will be easier to expand its sales and revenue beyond its saturated home market", "s": "for"}, {"t": "If Valio uses inputs from other EU countries they will not carry tariffs and will be cheaper than might otherwise be the case", "s": "for"}, {"t": "Valio sells to other countries outside of the EU including the potentially huge markets in the US and China", "s": "for"}, {"t": "The size and power of the EU means that it is able to negotiate with countries such as the US and China and secure trade deals tha nt."]]}, {"n": 212, "u": "u4", "set": "past", "topic": 1, "sub": ["g3"], "marks": 12, "biz": "Globalisation", "paper": "January 2023", "qn": "1(e)", "stem": "Assess the role of reduced costs of transport and communication in increasing globalisation.", "read": "D", "ext": [{"id": "D", "t": "The second wave of globalisation was enabled by technology", "p": ["The worldwide expansion of trade after the Second World War was largely possible because of reductions in costs. This was due to technological advances, such as the development of commercial aviation, the increase in productivity in shipping and the improvements in communication. 5", "The reductions in costs had an impact, not only on the volumes of trade, but also on the types of exchanges that were possible and profitable.", "By the end of the 20th century…", "• Passenger air transport costs were 10.74% of the costs in 1930", "• Sea freight costs were 22.32% of the costs in 1930", "• International calling costs were 0.03% of the costs in 1930"]}], "ms": "Question Assess the role of reduced costs of transport and communication in increasing\nglobalisation. (12)\nIndicative content\n1(e) QS9 Interpret, apply and analyse information in written, graphical and numerical\nforms.\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Transport and communication costs have reduced significantly since\n1945\n• Shipping, with the advent of containerisation, has made it much easier\nand cheaper to move goods around the world\n• By the end of the 20th century it was just over 20% of its former cost\n• What would have been uneconomic previously now became viable, thus\nincreasing the amount and type of goods traded\n• Cheaper air travel made face-to-face interaction more common,\nincreasing integration and understanding as well as benefiting trading\narrangements\n• Communication has improved, satellites and technological advances\nhave reduced the cost of communicating to a fraction previously\nexperienced\n• All of these have increased globalisation by making it easier and cheaper\nfor economies to integrate\n• However, there are other factors that have played an important part in\nincreasing globalisation\n• The World Trade Organisation (WTO) organises rounds of negotiations\nto increase and liberalise trade such as the Doha round\n• Through such rounds, reductions in trade barriers are negotiated\n• The WTO supervises world trading arrangements and trade negotiations\nand promotes the benefits of free trade\n• It helps to resolve disputes between governments such as the\nagreement on harmful fishing subsidies\n• The expansion of trading blocs has done much to liberalise trade such\nas the EU and more recently in Extract B, the AfCFTA\n• Political change such as the opening up of previously closed economies\nhas increased integration\n• Labour has become more mobile, migration of people spread ideas and\nculture leading to further globalisation\n• Transport and communication costs is just one of several factors but it is\nan important contributor to trade liberalisation\nLevel Mark Descriptor\n0 A completely inaccurate response.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information, though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9 –12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors, leading to a supported judgement.", "type": "lev", "kw": ["globalisation", "transport", "communication", "containerisation", "shipping"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Globalisation is the increasing integration of economies through trade, investment, people and ideas. [K]", "Key term"], ["Point 1", "Shipping has become much cheaper since containerisation. [K] By the end of the 20th century sea freight cost just over 20% of its 1930 cost. [A] Trade that was previously uneconomic became viable, increasing the amount and type of goods traded. [An] However, the WTO has also played an important part by negotiating reductions in trade barriers. [Ev]", "(4)"], ["Point 2", "Communication costs have fallen to a fraction of what they were. [K] International calling costs fell to 0.03% of their 1930 cost. [A] This makes it easier and cheaper for economies to integrate. [An] However, trading blocs such as the EU and AfCFTA, political change and migration have also increased globalisation. [Ev]", "(4)"], ["Conclusion", "Reduced transport and communication costs are just one of several factors, but an important contributor to increasing globalisation. [Ev]", "(2)"]]}, "pts": [{"t": "Transport and communication costs have reduced significantly since 1945", "s": "know"}, {"t": "Shipping, with the advent of containerisation, has made it much easier and cheaper to move goods around the world", "s": "for"}, {"t": "By the end of the 20th century it was just over 20% of its former cost", "s": "for"}, {"t": "What would have been uneconomic previously now became viable, thus increasing the amount and type of goods traded", "s": "for"}, {"t": "Cheaper air travel made face-to-face interaction more common, increasing integration and understanding as well as benefiting trading arrangements", "s": "for"}, {"t": "Communication has improved, satellites and technological advances have reduced the cost of communicating to a fraction previously experienced", "s": "for"}, {"t": "All of these have increased globalisation by making it easier and cheaper for economies to integrate", "s": "for"}, {"t": "However, there are other factors that have played an important part in increasing globalisation", "s": "against"}, {"t": "The World Trade Organisation (WTO) organises rounds of negotiations to increase and liberalise trade such as the Doha round", "s": "against"}, {"t": "Through such rounds, reductions in trade barriers are negotiated", "s": "against"}, {"t": "The WTO supervises world trading arrangements and trade negotiations and promotes the benefits of free trade", "s": "against"}, {"t": "It helps to resolve disputes between governments such as the agreement on harmful fishing subsidies", "s": "against"}, {"t": "The expansion of trading blocs has done much to liberalise trade such as the EU and more recently in Extract B, the AfCFTA", "s": "against"}, {"t": "Political change such as the opening up of previously closed economies has increased integration", "s": "against"}, {"t": "Labour has become more mobile, migration of people spread ideas and culture leading to further globalisation", "s": "against"}, {"t": "Transport and communication costs is just one of several factors but it is an important contributor to trade liberalisation", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]]}, {"n": 213, "u": "u4", "set": "past", "topic": 1, "sub": ["g1"], "marks": 20, "biz": "Asia", "paper": "January 2023", "qn": "3", "stem": "Evaluate the implications for non-Asian businesses of the growing economic power of Asia.", "read": "G", "ext": [{"id": "G", "t": "The future of Asia", "p": ["Asia is increasingly the centre of the world economy. By 2040, the region could account for more than half of global GDP and about 40% of global consumption.", "2000 2017 2040", "(estimate)", "Asia’s share of", "32% 42% 52%", "global GDP", "Asia’s share of", "23% 28% 39%", "global consumption", "Asia’s share of", "global middle 23% 40% 54%", "classes", "• Growth has taken an estimated 646,000,000 people out of poverty since 2000.", "• The mortality rate has fallen and is now comparable with or even better than rates in North America (defined as Canada, Mexico, and the United States) and Europe.", "• The level of education has improved significantly.", "• Average life expectancy at birth increased from 68 years in 1997 to 73 years in 2017. • The literacy rate rose from 77% in 2007 to 84% in 2017, thus quickly catching up with rates in North America and Europe.", "", ""]}], "ms": "Question Evaluate the implications for non-Asian businesses of the growing economic\npower of Asia. (20)\nIndicative content\n3 QS9 Interpret, apply and analyse information in written, graphical and\nnumerical forms.\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Asia is expected to grow rapidly, reaching a 52% share of global GDP by\n2040\n• As economic growth rises, disposable incomes rise, thus increasing the\ndemand for goods and services\n• The middle classes are expanding rapidly which means a huge and\ngrowing potential consumer market for many non-Asian firms and this\nis likely to lead to increased sales and profitability\n• Asia’s share of global consumption is increasing and is estimated to be\n39% by 2040\n• As Asia grows it is likely to need not just consumer goods but services as\nwell\n• Infrastructure will need input from engineering and transport\nbusinesses. Communications systems and equipment will be needed.\nEstablished non-Asian firms have an opportunity here\n• Non-Asian businesses may be able to move away from saturated home\nmarkets where growth may be limited, or difficult and move to the\nexpanding markets in Asia\n• Product life cycles can be extended as models developed elsewhere can\nbe introduced to the Asian markets\n• However, Asia’s growth and increasing dominance can mean that Asian\nindustries are more than capable of fulfilling domestic demand\n• Some Chinese (Haier, Lenovo) and Indian (Tata, Infosys) companies are\namongst the biggest in the world and more than capable of innovation\nand competing with European businesses on a global level\n• They also have the power to expand into non-Asian markets and take\ndomestic market share\n• Asian economies such as Vietnam are rapidly industrialising and are\nnow capable of high-tech and high-quality manufacturing\n• Their competitiveness is increasing their share of global trade and GDP\n• Many of these exports may be cheaper than their non-Asian\ncompetitors\n• This increases pressure on non-Asian businesses and they may lose\nmarket share\n• Non-Asian businesses that are innovative, or compete on quality, or\nhave strong brands should continue to thrive as the expanding Asian\neconomies become more consumer orientated\n• Those that perhaps just compete on price, or do not adapt and change,\nmay not\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–4 Isolated elements of knowledge and understanding.\nWeak or no relevant application of business examples.\nAn argument may be attempted, but will be generic and fail to connect\ncauses and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business\nexample.\nArguments and chains of reasoning are presented but connections between\ncauses and/or consequences are incomplete. Attempts to address the\nquestion.\nA comparison or judgement may be attempted but it will not successfully\nshow an awareness of the key features of business behaviour or business\nsituation.\nLevel 3 9–14 Accurate and thorough knowledge and understanding, supported throughout\nby relevant and effective use of the business behaviour/context.\nUses developed chains of reasoning, so that causes and/or consequences are\ncomplete, showing an understanding of the question.\nArguments are well developed.\nQuantitative and/or qualitative information is introduced in an attempt to\nsupport judgements, a partial awareness of the validity and/or significance of\ncompeting arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout\nby relevant and effective use of the business behaviour/context.\nUses well-developed and logical, coherent chains of reasoning, showing a\nrange of causes and/or effect(s).\nArguments are fully developed.\nQuantitative and/or qualitative information is/are used well to support\njudgements. A full awareness of the validity and significance of competing\narguments/factors, leading to balanced comparisons, judgements and an\neffective conclusion that proposes a solution and/or recommendations.\nPearson Education Limited. Registered company number 872828\nwith its registered office at 80 Strand, London, WC2R 0RL, United Kingdom", "type": "lev", "kw": ["economic power", "asia", "growth", "middle class", "disposable income"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Economic power refers to a region's share of global output and spending; Asia is expected to reach a 52% share of global GDP by 2040. [K]", "Key term"], ["Topic 1: opportunities, P 1", "As economic growth rises, disposable incomes rise, increasing demand for goods and services. [K] Asia's share of global consumption is estimated to be 39% by 2040. [A] The expanding middle classes create a huge potential market, likely to increase sales and profitability for non-Asian firms. [An] However, Asian industries are more than capable of meeting domestic demand themselves. [Ev]", "(4)"], ["Topic 1: opportunities, P 2", "Non-Asian businesses can move away from saturated home markets. [K] Asia will need infrastructure, engineering, transport and communications systems as it grows. [A] Established non-Asian firms can extend product life cycles by introducing existing models to Asian markets. [An] However, entering these markets successfully may need adaptation and investment. [Ev]", "(4)"], ["Topic 2: threats, P 1", "Asian businesses are becoming global competitors. [K] Chinese firms such as Haier and Lenovo and Indian firms such as Tata and Infosys are amongst the biggest in the world. [A] They can expand into non-Asian markets and take domestic market share from non-Asian businesses. [An] However, non-Asian businesses that are innovative or have strong brands should continue to thrive. [Ev]", "(4)"], ["Topic 2: threats, P 2", "Asian economies are rapidly industrialising. [K] Vietnam is now capable of high-tech and high-quality manufacturing. [A] Cheaper Asian exports increase pressure on non-Asian businesses, which may lose market share. [An] However, this mainly affects businesses that compete only on price or do not adapt and change. [Ev]", "(4)"], ["Conclusion", "Overall, Asia's growth is both an opportunity and a threat: non-Asian businesses that compete on quality, innovation or brand are likely to benefit from the growing consumer market, while those competing on price alone may lose out. [Ev]", "(3)"]]}, "pts": [{"t": "Asia is expected to grow rapidly, reaching a 52% share of global GDP by 2040", "s": "know"}, {"t": "As economic growth rises, disposable incomes rise, thus increasing the demand for goods and services", "s": "for"}, {"t": "The middle classes are expanding rapidly which means a huge and growing potential consumer market for many non-Asian firms and this is likely to lead to increased sales and profitability", "s": "for"}, {"t": "Asia’s share of global consumption is increasing and is estimated to be 39% by 2040", "s": "for"}, {"t": "As Asia grows it is likely to need not just consumer goods but services as well", "s": "for"}, {"t": "Infrastructure will need input from engineering and transport businesses. Communications systems and equipment will be needed. Established non-Asian firms have an opportunity here", "s": "for"}, {"t": "Non-Asian businesses may be able to move away from saturated home markets where growth may be limited, or difficult and move to the expanding markets in Asia", "s": "for"}, {"t": "Product life cycles can be extended as models developed elsewhere can be introduced to the Asian markets", "s": "for"}, {"t": "However, Asia’s growth and increasing dominance can mean that Asian industries are more than capable of fulfilling domestic demand", "s": "against"}, {"t": "Some Chinese (Haier, Lenovo) and Indian (Tata, Infosys) companies are amongst the biggest in the world and more than capable of innovation and competing with European businesses on a global level", "s": "against"}, {"t": "They also have the power to expand into non-Asian markets and take domestic market share", "s": "against"}, {"t": "Asian economies such as Vietnam are rapidly industrialising and are now capable of high-tech and high-quality manufacturing", "s": "against"}, {"t": "Their competitiveness is increasing their share of global trade and GDP", "s": "against"}, {"t": "Many of these exports may be cheaper than their non-Asian competitors", "s": "against"}, {"t": "This increases pressure on non-Asian businesses and they may lose market share", "s": "against"}, {"t": "Non-Asian businesses that are innovative, or compete on quality, or have strong brands should continue to thrive as the expanding Asian economies become more consumer orientated", "s": "against"}, {"t": "Those that perhaps just compete on price, or do not adapt and change, may not", "s": "against"}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations. Pearson Education Limited. Registered company number 872828 with its registered office at 80 Strand, London, WC2R 0RL, United Kingdom"]]}, {"n": 214, "u": "u4", "set": "past", "topic": 1, "sub": ["g4"], "marks": 20, "biz": "Protectionism", "paper": "June 2023", "qn": "3", "stem": "Evaluate the impact of protectionism on global businesses.", "read": "F and G", "ext": [{"id": "F", "t": "European Union (EU) steps up pressure to remove trade barriers", "p": ["According to a report by the European Commission, 66 countries, including many having trade deals with the EU, have introduced unjustified trade barriers. These barriers include health controls, customs administration fees and limits on the foreign ownership of companies. Most countries have steadily reduced import tariffs but often replaced them with non-tariff barriers that exclude foreign goods and services.", "The EU found 462 barriers among 66 countries at the end of 2020. China had the largest number with 40, followed by Indonesia and the US. But there are problems even with longstanding partners. Norway, which is in the EU single market for goods, maintains high tariffs on processed foods. 10"]}, {"id": "G", "t": "United States (US) Has Passed Far More Trade Restrictions Than Its Peers", "p": ["The number of US trade barriers has surged past those of other advanced economies. Since 2008, the US has passed almost 800 protectionist measures, compared to 357 passed in the United Kingdom and 390 passed in Germany. Other advanced economies, like Canada (199) and Australia (174) passed fewer of these restrictions.", "Number of protectionist measures passed in selected countries between 2008 and 2019 United States 790", "India 566", "Germany 390", "UK 357", "Brazil 302", "France 262", "China 256", "Mexico 103", "Saudi Arabia 44", "", "", ""]}], "ms": "Question Evaluate the impact of protectionism on global businesses. (20)\nIndicative content\nQS9 Interpret, apply and analyse information in written, graphical and\nnumerical forms.\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Protectionism means the use of trade barriers which are anything that\nslows or halts free trade. Examples include tariffs, quotas, subsidies\nand regulation\n• Tariffs increase the price of an imported good reducing sales and\nmaking it less competitive against domestic products\n• Quotas and other barriers have a similar impact in decreasing supply\nwhich pushes the price up and lowers sales\n• Protectionism means global businesses find it harder to successfully\npenetrate overseas markets\n• Extract F shows that the European Commission has reported a\nsignificant increase in the amount of trade barriers in 2020 even\namongst those with EU trade deals\n• Extract G shows that this is part of a longer-term trend between 2008\nand 2019, with the US passing 790 trade restrictions in this time\n• This would suggest that trade barriers are becoming more widespread\nand damaging to global businesses\n• Trade barriers have a disproportionate effect on smaller businesses that\nlack the economies of scale or lobbying power of larger ones\n• Protectionism can lead to retaliatory measures which have a damaging\neffect on all businesses, not just those trying to export but on the costs\nand availability of raw materials and resources that are imported by a\nglobal business and used for production\n• However, domestic businesses can flourish if protected by trade\nbarriers. Infant industries can grow and established ones can expand\n• The impact of trade barriers may not be too great on exporters if PED is\ninelastic. BMW and Jaguar cars sell well in the USA despite trade\nbarriers increasing\n• Any loss of foreign sales may be compensated by increased domestic\nsales if they are protected by trade barriers erected in retaliation\n• The impact on a business depends on the size and severity of the trade\nbarriers and the length of time they remain in place\n• The impact may be reduced if negotiations by the WTO or the EU\nsucceed in reducing or removing the barriers\n• A business can benefit from a domestic subsidy enabling it to be more\ncompetitive in global markets\n• China is often accused of using excessive subsidies to promote its\nindustries and agricultural output. Chinese businesses gain at the\nexpense of others\n• Protectionism is usually considered to be detrimental. Most economists\nargue that countries, businesses and consumers would be better off\nwith free trade. However, as shown by Extracts F and G making that\nhappen is not easy\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–4 Isolated elements of knowledge and understanding.\nWeak or no relevant application of business examples.\nAn argument may be attempted, but will be generic and fail to connect\ncauses and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nArguments and chains of reasoning are presented but connections\nbetween causes and/or consequences are incomplete. Attempts to\naddress the question.\nA comparison or judgement may be attempted but it will not\nsuccessfully show an awareness of the key features of business\nbehaviour or business situation.\nLevel 3 9–14 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nUses developed chains of reasoning, so that causes and/or\nconsequences are complete, showing an understanding of the question.\nArguments are well developed.\nQuantitative and/or qualitative information is introduced in an attempt\nto support judgements, a partial awareness of the validity and/or\nsignificance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nUses well-developed and logical, coherent chains of reasoning, showing\na range of causes and/or effect(s).\nArguments are fully developed.\nQuantitative and/or qualitative information is/are used well to support\njudgements. A full awareness of the validity and significance of\ncompeting arguments/factors, leading to balanced comparisons,\njudgements and an effective conclusion that proposes a solution and/or\nrecommendations.", "type": "lev", "kw": ["protectionism", "tariff", "quota", "trade barrier", "subsid"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Protectionism is the use of trade barriers that slow or halt free trade, such as tariffs, quotas, subsidies and regulation. [K]", "Key term"], ["Topic 1: negative impact, P 1", "Tariffs increase the price of imported goods. [K] The EU found 462 trade barriers among 66 countries at the end of 2020. [A] Imports become less competitive against domestic products, so global businesses find it harder to penetrate overseas markets. [An] However, the impact may be small if PED is inelastic: BMW and Jaguar cars sell well in the USA despite trade barriers. [Ev]", "(4)"], ["Topic 1: negative impact, P 2", "Protectionism can lead to retaliatory measures. [K] The US passed 790 trade restrictions between 2008 and 2019. [A] Retaliation raises the cost and reduces the availability of imported raw materials, damaging all businesses, not only exporters. [An] However, negotiations by the WTO or the EU may reduce or remove the barriers. [Ev]", "(4)"], ["Topic 2: positive impact, P 1", "Domestic businesses can flourish if protected by trade barriers. [K] Infant industries can grow and established ones can expand. [A] Any loss of foreign sales may be compensated by increased domestic sales. [An] However, trade barriers have a bigger effect on smaller businesses that lack economies of scale or lobbying power. [Ev]", "(4)"], ["Topic 2: positive impact, P 2", "A business can benefit from domestic subsidies. [K] China is often accused of using excessive subsidies to promote its industries. [A] Subsidised businesses can be more competitive in global markets. [An] However, subsidised businesses gain at the expense of others. [Ev]", "(4)"], ["Conclusion", "Overall, protectionism is usually considered harmful to global businesses; the impact depends on the size and severity of the barriers and how long they remain in place. [Ev]", "(3)"]]}, "pts": [{"t": "Protectionism means the use of trade barriers which are anything that slows or halts free trade. Examples include tariffs, quotas, subsidies and regulation", "s": "know"}, {"t": "Tariffs increase the price of an imported good reducing sales and making it less competitive against domestic products", "s": "for"}, {"t": "Quotas and other barriers have a similar impact in decreasing supply which pushes the price up and lowers sales", "s": "for"}, {"t": "Protectionism means global businesses find it harder to successfully penetrate overseas markets", "s": "for"}, {"t": "Extract F shows that the European Commission has reported a significant increase in the amount of trade barriers in 2020 even amongst those with EU trade deals", "s": "for"}, {"t": "Extract G shows that this is part of a longer-term trend between 2008 and 2019, with the US passing 790 trade restrictions in this time", "s": "for"}, {"t": "This would suggest that trade barriers are becoming more widespread and damaging to global businesses", "s": "for"}, {"t": "Trade barriers have a disproportionate effect on smaller businesses that lack the economies of scale or lobbying power of larger ones", "s": "for"}, {"t": "Protectionism can lead to retaliatory measures which have a damaging effect on all businesses, not just those trying to export but on the costs and availability of raw materials and resources that are imported by a global business and used for production", "s": "for"}, {"t": "However, domestic businesses can flourish if protected by trade barriers. Infant industries can grow and established ones can expand", "s": "against"}, {"t": "The impact of trade barriers may not be too great on exporters if PED is inelastic. BMW and Jaguar cars sell well in the USA despite trade barriers increasing", "s": "against"}, {"t": "Any loss of foreign sales may be compensated by increased domestic sales if they are protected by trade barriers erected in retaliation", "s": "against"}, {"t": "The impact on a business depends on the size and severity of the trade barriers and the length of time they remain in place", "s": "against"}, {"t": "The impact may be reduced if negotiations by the WTO or the EU succeed in reducing or removing the barriers", "s": "against"}, {"t": "A business can benefit from a domestic subsidy enabling it to be more competitive in global markets", "s": "against"}, {"t": "China is often accused of using excessive subsidies to promote its industries and agricultural output. Chinese businesses gain at the expense of others", "s": "against"}, {"t": "Protectionism is usually considered to be detrimental. Most economists argue that countries, businesses and consumers would be better off with free trade. However, as shown by Extracts F and G making that happen is not easy", "s": "against"}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]]}, {"n": 215, "u": "u4", "set": "past", "topic": 1, "sub": ["g3"], "marks": 20, "biz": "Globalisation", "paper": "January 2024", "qn": "2", "stem": "Evaluate the impact on businesses of increased globalisation.", "read": "E", "ext": [{"id": "E", "t": "Globalisation: a new way of interaction", "p": ["Globalisation is a term used to describe the growing interdependence of the world’s economic, social and technological exchanges within the framework of capitalism. It also refers to the integration of markets in the global economy, leading to increased co-operation between national economies.", "Countries have built economic partnerships to facilitate these movements over many centuries. The term globalisation gained popularity after the Cold War* in the early 1990s, as these co-operative arrangements shaped modern everyday life. Thomas Friedman, an American political writer, stated that “Globalisation is a system that replaced the Cold War.” The wide-ranging effects of globalisation are complex. As with major technological advances and development, it benefits society as a whol
