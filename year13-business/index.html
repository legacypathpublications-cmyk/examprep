e, while harming certain groups. Cold War* – the name given to the state of hostility and lack of trade and co-operation that existed between the Soviet bloc and the Western powers from 1945 to 1991.", ""]}], "ms": "Question Evaluate the impact on businesses of increased globalisation. (20)\nIndicative content\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Globalisation is the increase in the flow of goods, services, capital,\npeople, and ideas across international boundaries\n• For businesses this means both opportunities and threats\n• It means an increase in trade between countries which creates new\nmarkets and the chance for businesses to expand their sales\n• A wider and usually cheaper range of inputs and raw materials can be\nsourced and imported leading to reduced costs\n• Production and part-production can be offshored more easily to take\nadvantage of reduced costs. Apple’s iPhone uses components from 43\ndifferent countries and is assembled in China\n• Joint ventures become easier and more available, leading to mutually\nbeneficial outcomes\n• Labour can move more easily between nations and migration can help\nto solve skills shortages for businesses in countries with a declining\nlabour force such as Japan or Germany\n• Global cooperation allows nations to follow their economic strengths,\nknowing they can trade products for other resources\n• FDI increases, which benefits the business making the investment and\nthe businesses in the receiving country that can supply materials and\nservices\n• FDI can lead to a rise in income for the receiving country as\nemployment is created leading to increased demand for local\nbusinesses\n• Technology transfer can lead to local businesses benefiting and growing\n• However, whilst global free trade is beneficial to the entire system,\nindividual businesses can be disadvantaged as they face more global\ncompetition\n• In response, some countries may resort to protectionism with\ndetrimental impacts on business growth\n• The benefits of globalisation are unequally distributed and while some\nbusinesses and economies prosper others see either a decline or slower\ngrowth\n• FDI can have a negative impact on local businesses if they cannot\ncompete with the more efficient foreign ones\n• Increased specialisation can mean that while the richer countries\ndevelop high tech and more profitable businesses, the developing\nnations are often reliant on the primary sector where individual\nbusinesses have little opportunity to add value and are at the mercy of\nfluctuating global prices\n• Increased globalisation seems to be directly linked to environmental\ndamage such as deforestation and loss of biodiversity and greenhouse\ngas emissions and other forms of pollution caused by increased\ntransportation of goods\n• This has a cost that affects everyone as well as individual businesses\n• Globalisation is here to stay but at the moment its impact on\nbusinesses and the wider economy are mixed. Regulation and\ngovernment intervention that will affect businesses may be the way\nforward\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–4 Isolated elements of knowledge and understanding.\nWeak or no relevant application of business examples.\nAn argument may be attempted, but will be generic and fail to connect\ncauses and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nArguments and chains of reasoning are presented but connections\nbetween causes and/or consequences are incomplete. Attempts to\naddress the question.\nA comparison or judgement may be attempted but it will not\nsuccessfully show an awareness of the key features of business\nbehaviour or business situation.\nLevel 3 9–14 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nUses developed chains of reasoning, so that causes and/or\nconsequences are complete, showing an understanding of the question.\nArguments are well developed.\nQuantitative and/or qualitative information is introduced in an attempt\nto support judgements, a partial awareness of the validity and/or\nsignificance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nUses well-developed and logical, coherent chains of reasoning, showing\na range of causes and/or effect(s).\nArguments are fully developed.\nQuantitative and/or qualitative information is/are used well to support\njudgements. A full awareness of the validity and significance of\ncompeting arguments/factors, leading to balanced comparisons,\njudgements and an effective conclusion that proposes a solution and/or\nrecommendations.", "type": "lev", "kw": ["globalisation", "trade", "fdi", "offshor", "migration"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Globalisation is the increase in the flow of goods, services, capital, people and ideas across international boundaries. [K]", "Key term"], ["Topic 1: opportunities, P 1", "Increased trade creates new markets. [K] Countries have built economic partnerships to make these movements easier. [A] Businesses have the chance to expand their sales. [An] However, businesses also face more global competition. [Ev]", "(4)"], ["Topic 1: opportunities, P 2", "Production can be offshored more easily. [K] Apple's iPhone uses components from 43 countries and is assembled in China. [A] Cheaper inputs and labour reduce costs, increasing profitability. [An] However, increased transportation of goods is linked to environmental damage and pollution. [Ev]", "(4)"], ["Topic 2: threats, P 1", "The benefits of globalisation are unequally distributed. [K] Developing nations are often reliant on the primary sector. [A] Their businesses have little opportunity to add value and are exposed to fluctuating global prices. [An] However, FDI and technology transfer can help local businesses grow. [Ev]", "(4)"], ["Topic 2: threats, P 2", "FDI can harm local businesses. [K] More efficient foreign businesses enter local markets. [A] Local businesses that cannot compete may lose sales or close. [An] However, FDI also creates jobs and income, increasing demand for local businesses. [Ev]", "(4)"], ["Conclusion", "Overall, globalisation is here to stay; it creates opportunities for businesses that can compete globally, but its impacts on businesses and the wider economy are mixed. [Ev]", "(3)"]]}, "pts": [{"t": "Globalisation is the increase in the flow of goods, services, capital, people, and ideas across international boundaries", "s": "know"}, {"t": "For businesses this means both opportunities and threats", "s": "for"}, {"t": "It means an increase in trade between countries which creates new markets and the chance for businesses to expand their sales", "s": "for"}, {"t": "A wider and usually cheaper range of inputs and raw materials can be sourced and imported leading to reduced costs", "s": "for"}, {"t": "Production and part-production can be offshored more easily to take advantage of reduced costs. Apple’s iPhone uses components from 43 different countries and is assembled in China", "s": "for"}, {"t": "Joint ventures become easier and more available, leading to mutually beneficial outcomes", "s": "for"}, {"t": "Labour can move more easily between nations and migration can help to solve skills shortages for businesses in countries with a declining labour force such as Japan or Germany", "s": "for"}, {"t": "Global cooperation allows nations to follow their economic strengths, knowing they can trade products for other resources", "s": "for"}, {"t": "FDI increases, which benefits the business making the investment and the businesses in the receiving country that can supply materials and services", "s": "for"}, {"t": "FDI can lead to a rise in income for the receiving country as employment is created leading to increased demand for local businesses", "s": "for"}, {"t": "Technology transfer can lead to local businesses benefiting and growing", "s": "for"}, {"t": "However, whilst global free trade is beneficial to the entire system, individual businesses can be disadvantaged as they face more global competition", "s": "against"}, {"t": "In response, some countries may resort to protectionism with detrimental impacts on business growth", "s": "against"}, {"t": "The benefits of globalisation are unequally distributed and while some businesses and economies prosper others see either a decline or slower growth", "s": "against"}, {"t": "FDI can have a negative impact on local businesses if they cannot compete with the more efficient foreign ones", "s": "against"}, {"t": "Increased specialisation can mean that while the richer countries develop high tech and more profitable businesses, the developing nations are often reliant on the primary sector where individual businesses have little opportunity to add value and are at the mercy of fluctuating global prices", "s": "against"}, {"t": "Increased globalisation seems to be directly linked to environmental damage such as deforestation and loss of biodiversity and greenhouse gas emissions and other forms of pollution caused by increased transportation of goods", "s": "against"}, {"t": "This has a cost that affects everyone as well as individual businesses", "s": "against"}, {"t": "Globalisation is here to stay but at the moment its impact on businesses and the wider economy are mixed. Regulation and government intervention that will affect businesses may be the way forward", "s": "against"}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]]}, {"n": 301, "u": "u4", "set": "style", "case": "byd", "topic": 1, "sub": ["g4"], "marks": 4, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Explain one reason why the EU introduced tariffs on electric vehicles imported from China.", "read": "B", "ext": [{"id": "A", "t": "BYD expands overseas", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries. In late 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. Dozens of Chinese brands are cutting prices to win customers, and sales growth in China is slowing.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and use its huge production capacity."]}, {"id": "B", "t": "EU tariffs on Chinese electric vehicles", "p": ["In 2024, the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers."]}], "type": "pt", "kw": [], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "One reason for protectionism is to protect domestic industries from unfair competition. [K]", "(1)"], ["Application", "The EU said Chinese manufacturers received unfair government subsidies. [A]", "(1)"], ["Application", "This allowed them to sell electric cars at very low prices. [A]", "(1)"], ["Analysis", "Tariffs raise the price of Chinese EVs, so European car makers can compete and protect jobs in the EU car industry. [An]", "(1)"]]}, "K": [["protect", "unfair", "subsid", "domestic", "jobs", "dumping"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "ms": "Knowledge 1, Application 2, Analysis 1\nKnowledge: One reason for protectionism is to protect domestic industries from unfair competition. (1)\nApplication: The EU said Chinese manufacturers received unfair government subsidies. (1)\nApplication: This allowed them to sell electric cars at very low prices. (1)\nAnalysis: Tariffs raise the price of Chinese EVs, so European car makers can compete and protect jobs in the EU car industry. (1)"}, {"n": 302, "u": "u4", "set": "style", "case": "byd", "topic": 1, "sub": ["g4"], "marks": 8, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Discuss the impact on BYD of the tariffs introduced by the EU.", "read": "A and B", "ext": [{"id": "A", "t": "BYD expands overseas", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries. In late 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. Dozens of Chinese brands are cutting prices to win customers, and sales growth in China is slowing.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and use its huge production capacity."]}, {"id": "B", "t": "EU tariffs on Chinese electric vehicles", "p": ["In 2024, the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers."]}], "type": "lev", "kw": ["tariff", "protectionism", "price", "trade barrier"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "A tariff is a tax on imported goods, which raises their price in the importing country. [K]", "Key term"], ["Point 1", "Tariffs raise the price of imported goods. [K] BYD faces an extra 17% tariff on top of the standard 10% EU tariff. [A] BYD must either raise its prices, reducing demand, or absorb the tariff, reducing its profit margin. [An] However, BYD faces lower extra tariffs than some Chinese rivals, which face more than 35%, so it may still be relatively competitive. [Ev]", "(4)"], ["Point 2", "Tariffs make it harder to enter overseas markets. [K] The EU is a large market of 27 countries. [A] BYD may sell fewer cars in Europe, slowing its overseas growth. [An] However, BYD sells in more than 70 countries and is building a factory in Hungary, which will avoid the tariffs. [Ev]", "(4)"]]}, "pts": [{"s": "know", "t": "A tariff is a tax on imported goods, which raises their price in the importing country."}, {"s": "for", "t": "Tariffs raise the price of imported goods."}, {"s": "for", "t": "BYD faces an extra 17% tariff on top of the standard 10% EU tariff."}, {"s": "for", "t": "BYD must either raise its prices, reducing demand, or absorb the tariff, reducing its profit margin."}, {"s": "against", "t": "However, BYD faces lower extra tariffs than some Chinese rivals, which face more than 35%, so it may still be relatively competitive."}, {"s": "for", "t": "Tariffs make it harder to enter overseas markets."}, {"s": "for", "t": "The EU is a large market of 27 countries."}, {"s": "for", "t": "BYD may sell fewer cars in Europe, slowing its overseas growth."}, {"s": "against", "t": "However, BYD sells in more than 70 countries and is building a factory in Hungary, which will avoid the tariffs."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• A tariff is a tax on imported goods, which raises their price in the importing country.\n• Tariffs raise the price of imported goods.\n• BYD faces an extra 17% tariff on top of the standard 10% EU tariff.\n• BYD must either raise its prices, reducing demand, or absorb the tariff, reducing its profit margin.\n• However, BYD faces lower extra tariffs than some Chinese rivals, which face more than 35%, so it may still be relatively competitive.\n• Tariffs make it harder to enter overseas markets.\n• The EU is a large market of 27 countries.\n• BYD may sell fewer cars in Europe, slowing its overseas growth.\n• However, BYD sells in more than 70 countries and is building a factory in Hungary, which will avoid the tariffs.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."}, {"n": 303, "u": "u4", "set": "style", "case": "byd", "topic": 2, "sub": ["g5", "m3"], "marks": 12, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Assess the benefits to BYD of building a factory inside the EU.", "read": "B", "ext": [{"id": "A", "t": "BYD expands overseas", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries. In late 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. Dozens of Chinese brands are cutting prices to win customers, and sales growth in China is slowing.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and use its huge production capacity."]}, {"id": "B", "t": "EU tariffs on Chinese electric vehicles", "p": ["In 2024, the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers."]}], "type": "lev", "kw": ["trading bloc", "single market", "eu", "tariff", "production location"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "The EU single market allows goods to move between its 27 member countries without tariffs or other trade barriers. [K]", "Key term"], ["Point 1", "Producing inside a trading bloc avoids its external tariffs. [K] Cars made in the Hungary factory are not affected by the 17% extra tariff. [A] BYD can keep its prices low in Europe, increasing sales and market share. [An] However, building a factory requires a large investment, and labour costs in Hungary are higher than in China. [Ev]", "(4)"], ["Point 2", "Being inside the single market gives free access to all member countries. [K] Cars made in Hungary can be sold in all 27 EU countries without trade barriers. [A] Shorter delivery distances reduce transport costs and delivery times to European customers. [An] However, the EU could change its rules, and European car makers may respond with lower prices. [Ev]", "(4)"], ["Conclusion", "Overall, the factory is likely to benefit BYD because it removes the tariff problem and gives full access to the EU market, but this depends on how quickly the factory reaches full production. [Ev]", "(2)"]]}, "pts": [{"s": "know", "t": "The EU single market allows goods to move between its 27 member countries without tariffs or other trade barriers."}, {"s": "for", "t": "Producing inside a trading bloc avoids its external tariffs."}, {"s": "for", "t": "Cars made in the Hungary factory are not affected by the 17% extra tariff."}, {"s": "for", "t": "BYD can keep its prices low in Europe, increasing sales and market share."}, {"s": "against", "t": "However, building a factory requires a large investment, and labour costs in Hungary are higher than in China."}, {"s": "for", "t": "Being inside the single market gives free access to all member countries."}, {"s": "for", "t": "Cars made in Hungary can be sold in all 27 EU countries without trade barriers."}, {"s": "for", "t": "Shorter delivery distances reduce transport costs and delivery times to European customers."}, {"s": "against", "t": "However, the EU could change its rules, and European car makers may respond with lower prices."}, {"s": "judge", "t": "Overall, the factory is likely to benefit BYD because it removes the tariff problem and gives full access to the EU market, but this depends on how quickly the factory reaches full production."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "ms": "Indicative content\n• The EU single market allows goods to move between its 27 member countries without tariffs or other trade barriers.\n• Producing inside a trading bloc avoids its external tariffs.\n• Cars made in the Hungary factory are not affected by the 17% extra tariff.\n• BYD can keep its prices low in Europe, increasing sales and market share.\n• However, building a factory requires a large investment, and labour costs in Hungary are higher than in China.\n• Being inside the single market gives free access to all member countries.\n• Cars made in Hungary can be sold in all 27 EU countries without trade barriers.\n• Shorter delivery distances reduce transport costs and delivery times to European customers.\n• However, the EU could change its rules, and European car makers may respond with lower prices.\n• Overall, the factory is likely to benefit BYD because it removes the tariff problem and gives full access to the EU market, but this depends on how quickly the factory reaches full production.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."}, {"n": 304, "u": "u4", "set": "style", "case": "byd", "topic": 2, "sub": ["m1"], "marks": 20, "biz": "BYD", "paper": "Exam style", "qn": "BYD", "stem": "Evaluate whether push factors or pull factors are more important in BYD's decision to expand overseas.", "read": "A and B", "ext": [{"id": "A", "t": "BYD expands overseas", "p": ["BYD is a Chinese manufacturer of electric vehicles (EVs) and batteries. In late 2023 it sold more battery electric cars than Tesla for the first time.", "China's car market is very competitive. Dozens of Chinese brands are cutting prices to win customers, and sales growth in China is slowing.", "BYD now sells cars in more than 70 countries. Exports allow it to spread risk across many markets and use its huge production capacity."]}, {"id": "B", "t": "EU tariffs on Chinese electric vehicles", "p": ["In 2024, the European Union (EU) introduced extra tariffs on electric cars imported from China. The EU said Chinese manufacturers received unfair government subsidies that allowed them to sell at very low prices.", "BYD faces an extra tariff of 17% on top of the standard 10% EU tariff on imported cars. Some Chinese manufacturers face extra tariffs of more than 35%.", "BYD is building a factory in Szeged, Hungary. Cars made inside the EU are not affected by the tariffs and can be sold in all 27 EU countries without trade barriers."]}], "type": "lev", "kw": ["push factor", "pull factor", "saturated", "competition", "risk spreading", "economies of scale"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Push factors are conditions in the home market that encourage a business to expand abroad; pull factors are attractions of overseas markets. [K]", "Key term"], ["Topic 1: push factors, P 1", "Intense competition in the home market is a push factor. [K] Dozens of Chinese brands are cutting prices in China's car market. [A] Price cuts reduce profit margins in China, so BYD looks abroad for more profitable sales. [An] However, BYD is already the market leader, so competition alone may not explain its expansion. [Ev]", "(4)"], ["Topic 1: push factors, P 2", "Slowing growth or saturation in the home market is a push factor. [K] Sales growth in China is slowing. [A] BYD needs new markets to keep growing and use its huge production capacity. [An] However, China is still the largest car market in the world, so there is still room to grow at home. [Ev]", "(4)"], ["Topic 2: pull factors, P 1", "Risk spreading is a pull factor. [K] BYD sells in more than 70 countries. [A] A fall in demand in one country can be balanced by sales in others, making BYD less dependent on China. [An] However, overseas markets bring new risks, such as the EU tariffs. [Ev]", "(4)"], ["Topic 2: pull factors, P 2", "Economies of scale are a pull factor. [K] BYD sold more battery electric cars than Tesla in late 2023. [A] Higher output lowers unit costs, so BYD can sell at competitive prices worldwide. [An] However, economies of scale can be reduced by tariffs and transport costs. [Ev]", "(4)"], ["Conclusion", "Overall, push factors such as price competition and slowing growth in China started BYD's expansion, but pull factors such as risk spreading and economies of scale explain its long-term strategy. BYD should keep producing inside major markets, such as the EU, to protect its overseas growth. [Ev]", "(3)"]]}, "pts": [{"s": "know", "t": "Push factors are conditions in the home market that encourage a business to expand abroad; pull factors are attractions of overseas markets."}, {"s": "for", "t": "Intense competition in the home market is a push factor."}, {"s": "for", "t": "Dozens of Chinese brands are cutting prices in China's car market."}, {"s": "for", "t": "Price cuts reduce profit margins in China, so BYD looks abroad for more profitable sales."}, {"s": "against", "t": "However, BYD is already the market leader, so competition alone may not explain its expansion."}, {"s": "for", "t": "Slowing growth or saturation in the home market is a push factor."}, {"s": "for", "t": "Sales growth in China is slowing."}, {"s": "for", "t": "BYD needs new markets to keep growing and use its huge production capacity."}, {"s": "against", "t": "However, China is still the largest car market in the world, so there is still room to grow at home."}, {"s": "for", "t": "Risk spreading is a pull factor."}, {"s": "for", "t": "BYD sells in more than 70 countries."}, {"s": "for", "t": "A fall in demand in one country can be balanced by sales in others, making BYD less dependent on China."}, {"s": "against", "t": "However, overseas markets bring new risks, such as the EU tariffs."}, {"s": "for", "t": "Economies of scale are a pull factor."}, {"s": "for", "t": "BYD sold more battery electric cars than Tesla in late 2023."}, {"s": "for", "t": "Higher output lowers unit costs, so BYD can sell at competitive prices worldwide."}, {"s": "against", "t": "However, economies of scale can be reduced by tariffs and transport costs."}, {"s": "judge", "t": "Overall, push factors such as price competition and slowing growth in China started BYD's expansion, but pull factors such as risk spreading and economies of scale explain its long-term strategy. BYD should keep producing inside major markets, such as the EU, to protect its overseas growth."}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations. Pearson Education Limited. Registered company number 872828 with its registered office at 80 Strand, London, WC2R 0RL, United Kingdom"]], "ms": "Indicative content\n• Push factors are conditions in the home market that encourage a business to expand abroad; pull factors are attractions of overseas markets.\n• Intense competition in the home market is a push factor.\n• Dozens of Chinese brands are cutting prices in China's car market.\n• Price cuts reduce profit margins in China, so BYD looks abroad for more profitable sales.\n• However, BYD is already the market leader, so competition alone may not explain its expansion.\n• Slowing growth or saturation in the home market is a push factor.\n• Sales growth in China is slowing.\n• BYD needs new markets to keep growing and use its huge production capacity.\n• However, China is still the largest car market in the world, so there is still room to grow at home.\n• Risk spreading is a pull factor.\n• BYD sells in more than 70 countries.\n• A fall in demand in one country can be balanced by sales in others, making BYD less dependent on China.\n• However, overseas markets bring new risks, such as the EU tariffs.\n• Economies of scale are a pull factor.\n• BYD sold more battery electric cars than Tesla in late 2023.\n• Higher output lowers unit costs, so BYD can sell at competitive prices worldwide.\n• However, economies of scale can be reduced by tariffs and transport costs.\n• Overall, push factors such as price competition and slowing growth in China started BYD's expansion, but pull factors such as risk spreading and economies of scale explain its long-term strategy. BYD should keep producing inside major markets, such as the EU, to protect its overseas growth.\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of causes and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations. Pearson Education Limited. Registered company number 872828 with its registered office at 80 Strand, London, WC2R 0RL, United Kingdom"}, {"n": 305, "u": "u4", "set": "style", "case": "apple", "topic": 2, "sub": ["m3", "g2"], "marks": 4, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Using Extract C, calculate to two decimal places the percentage of iPhones assembled in India in 2024. You are advised to show your working.", "read": "C", "ext": [{"id": "C", "t": "Apple moves production to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata.", "The Indian government offers incentives to businesses that make electronics in India. India has a large, young labour force and labour costs that are lower than in China.", "In 2024, Apple assembled around 220 million iPhones worldwide. About 30.8 million of these were assembled in India.", "India's economy is one of the fastest growing in the world. Millions of workers are moving from farming into manufacturing and services, and India's exports of smartphones have risen sharply."]}], "type": "calc", "kw": [], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: iPhones assembled in India ÷ total iPhones assembled × 100 [A] 30.8 million ÷ 220 million × 100 [A]", "(2)"], ["Calculate", "30.8 ÷ 220 = 0.14 [An] 0.14 × 100 = 14.00% (include %) [An]", "(2)"]]}, "ans": 14.0, "pre": "", "unit": "%", "ansText": "14.00%", "fhint": "percentage = iPhones assembled in India ÷ total iPhones assembled × 100", "fk": ["÷", "/", "x 100", "× 100", "*100", "x100", "divide", "total"], "data": ["30.8", "220"], "ms": "Knowledge 1, Application 2, Analysis 1\n• Formula: iPhones assembled in India ÷ total iPhones assembled × 100 (1)\n• 30.8 million ÷ 220 million × 100 (1)\n• 30.8 ÷ 220 = 0.14 (1)\n• 0.14 × 100 = 14.00% (include %) (1)\nNB: If the answer is 14.00% with no working award 4 marks; without units award 3 marks."}, {"n": 306, "u": "u4", "set": "style", "case": "apple", "topic": 1, "sub": ["g3"], "marks": 4, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Explain one way the growth of the global labour force has contributed to increased globalisation.", "read": "C", "ext": [{"id": "C", "t": "Apple moves production to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata.", "The Indian government offers incentives to businesses that make electronics in India. India has a large, young labour force and labour costs that are lower than in China.", "In 2024, Apple assembled around 220 million iPhones worldwide. About 30.8 million of these were assembled in India.", "India's economy is one of the fastest growing in the world. Millions of workers are moving from farming into manufacturing and services, and India's exports of smartphones have risen sharply."]}], "type": "pt", "kw": [], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "A growing global labour force gives businesses access to more, lower cost workers. [K]", "(1)"], ["Application", "India has a large, young labour force. [A]", "(1)"], ["Application", "Labour costs in India are lower than in China. [A]", "(1)"], ["Analysis", "Businesses such as Apple move production to these countries, increasing trade and investment flows between economies. [An]", "(1)"]]}, "K": [["labour force", "workers", "labour", "cheaper labour", "low cost", "offshor"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "ms": "Knowledge 1, Application 2, Analysis 1\nKnowledge: A growing global labour force gives businesses access to more, lower cost workers. (1)\nApplication: India has a large, young labour force. (1)\nApplication: Labour costs in India are lower than in China. (1)\nAnalysis: Businesses such as Apple move production to these countries, increasing trade and investment flows between economies. (1)"}, {"n": 307, "u": "u4", "set": "style", "case": "apple", "topic": 1, "sub": ["g1", "g2"], "marks": 8, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Discuss the implications for India of increasing specialisation in smartphone manufacturing for export.", "read": "C", "ext": [{"id": "C", "t": "Apple moves production to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata.", "The Indian government offers incentives to businesses that make electronics in India. India has a large, young labour force and labour costs that are lower than in China.", "In 2024, Apple assembled around 220 million iPhones worldwide. About 30.8 million of these were assembled in India.", "India's economy is one of the fastest growing in the world. Millions of workers are moving from farming into manufacturing and services, and India's exports of smartphones have risen sharply."]}], "type": "lev", "kw": ["specialisation", "specialise", "export", "employment", "emerging economy"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Specialisation is when a country concentrates on producing the goods or services it is best at, and trades for other products. [K]", "Key term"], ["Point 1", "Specialisation increases exports. [K] India's exports of smartphones have risen sharply. [A] Export earnings increase GDP and bring in foreign currency, supporting economic growth. [An] However, depending on one industry is risky if demand for smartphones falls or Apple moves production elsewhere. [Ev]", "(4)"], ["Point 2", "Specialisation changes employment patterns. [K] Millions of workers are moving from farming into manufacturing and services. [A] Manufacturing jobs usually pay more, raising incomes and living standards. [An] However, much of the work is assembly, so the high value parts of the product, such as design, may stay in other countries. [Ev]", "(4)"]]}, "pts": [{"s": "know", "t": "Specialisation is when a country concentrates on producing the goods or services it is best at, and trades for other products."}, {"s": "for", "t": "Specialisation increases exports."}, {"s": "for", "t": "India's exports of smartphones have risen sharply."}, {"s": "for", "t": "Export earnings increase GDP and bring in foreign currency, supporting economic growth."}, {"s": "against", "t": "However, depending on one industry is risky if demand for smartphones falls or Apple moves production elsewhere."}, {"s": "for", "t": "Specialisation changes employment patterns."}, {"s": "for", "t": "Millions of workers are moving from farming into manufacturing and services."}, {"s": "for", "t": "Manufacturing jobs usually pay more, raising incomes and living standards."}, {"s": "against", "t": "However, much of the work is assembly, so the high value parts of the product, such as design, may stay in other countries."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "ms": "Indicative content\n• Specialisation is when a country concentrates on producing the goods or services it is best at, and trades for other products.\n• Specialisation increases exports.\n• India's exports of smartphones have risen sharply.\n• Export earnings increase GDP and bring in foreign currency, supporting economic growth.\n• However, depending on one industry is risky if demand for smartphones falls or Apple moves production elsewhere.\n• Specialisation changes employment patterns.\n• Millions of workers are moving from farming into manufacturing and services.\n• Manufacturing jobs usually pay more, raising incomes and living standards.\n• However, much of the work is assembly, so the high value parts of the product, such as design, may stay in other countries.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."}, {"n": 308, "u": "u4", "set": "style", "case": "apple", "topic": 1, "sub": ["g2"], "marks": 12, "biz": "Apple", "paper": "Exam style", "qn": "Apple", "stem": "Assess the importance of foreign direct investment (FDI) by businesses such as Apple for business growth in India.", "read": "C", "ext": [{"id": "C", "t": "Apple moves production to India", "p": ["Apple has traditionally assembled most of its iPhones in China. It is now moving more production to India, working with manufacturers such as Foxconn and Tata.", "The Indian government offers incentives to businesses that make electronics in India. India has a large, young labour force and labour costs that are lower than in China.", "In 2024, Apple assembled around 220 million iPhones worldwide. About 30.8 million of these were assembled in India.", "India's economy is one of the fastest growing in the world. Millions of workers are moving from farming into manufacturing and services, and India's exports of smartphones have risen sharply."]}], "type": "lev", "kw": ["foreign direct investment", "fdi", "invest", "multinational", "mnc"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Foreign direct investment (FDI) is investment by a business in productive assets in another country, such as building or expanding factories. [K]", "Key term"], ["Point 1", "FDI creates business for local suppliers. [K] Apple works with manufacturers such as Foxconn and Tata in India. [A] Local suppliers of parts, transport and services gain orders, so Indian businesses grow. [An] However, many high value components may still be imported, limiting the benefit to Indian suppliers. [Ev]", "(4)"], ["Point 2", "FDI creates jobs and income. [K] Workers are moving from farming into manufacturing. [A] Higher incomes increase demand for goods and services from local businesses. [An] However, India's growth also depends on other factors, such as government policy, infrastructure and its fast growing service sector. [Ev]", "(4)"], ["Conclusion", "Overall, FDI by businesses such as Apple is important for business growth in India, especially in manufacturing, but it depends on how much production and technology is shared with Indian businesses. [Ev]", "(2)"]]}, "pts": [{"s": "know", "t": "Foreign direct investment (FDI) is investment by a business in productive assets in another country, such as building or expanding factories."}, {"s": "for", "t": "FDI creates business for local suppliers."}, {"s": "for", "t": "Apple works with manufacturers such as Foxconn and Tata in India."}, {"s": "for", "t": "Local suppliers of parts, transport and services gain orders, so Indian businesses grow."}, {"s": "against", "t": "However, many high value components may still be imported, limiting the benefit to Indian suppliers."}, {"s": "for", "t": "FDI creates jobs and income."}, {"s": "for", "t": "Workers are moving from farming into manufacturing."}, {"s": "for", "t": "Higher incomes increase demand for goods and services from local businesses."}, {"s": "against", "t": "However, India's growth also depends on other factors, such as government policy, infrastructure and its fast growing service sector."}, {"s": "judge", "t": "Overall, FDI by businesses such as Apple is important for business growth in India, especially in manufacturing, but it depends on how much production and technology is shared with Indian businesses."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "ms": "Indicative content\n• Foreign direct investment (FDI) is investment by a business in productive assets in another country, such as building or expanding factories.\n• FDI creates business for local suppliers.\n• Apple works with manufacturers such as Foxconn and Tata in India.\n• Local suppliers of parts, transport and services gain orders, so Indian businesses grow.\n• However, many high value components may still be imported, limiting the benefit to Indian suppliers.\n• FDI creates jobs and income.\n• Workers are moving from farming into manufacturing.\n• Higher incomes increase demand for goods and services from local businesses.\n• However, India's growth also depends on other factors, such as government policy, infrastructure and its fast growing service sector.\n• Overall, FDI by businesses such as Apple is important for business growth in India, especially in manufacturing, but it depends on how much production and technology is shared with Indian businesses.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."}, {"n": 309, "u": "u4", "set": "style", "case": "ikea", "topic": 2, "sub": ["m2"], "marks": 12, "biz": "IKEA", "paper": "Exam style", "qn": "IKEA", "stem": "Assess the importance of the level of disposable income and the ease of doing business for IKEA when deciding to enter the Indian market.", "read": "D", "ext": [{"id": "D", "t": "IKEA in India", "p": ["IKEA, the Swedish furniture retailer, opened its first Indian store in Hyderabad in 2018, followed by stores in Navi Mumbai and Bengaluru, and online sales in several cities.", "India's middle class is growing quickly and disposable incomes are rising, but average incomes are still much lower than in Europe. IKEA sells some products in India at very low prices and adapts its range to Indian homes.", "Foreign single-brand retailers in India must source a share of their products locally. IKEA also had to work with complex rules on land, permits and food sales.", "IKEA competes with online furniture retailers, other large retailers and many local carpenters and small shops, who make furniture to order. Customers can easily compare prices online."]}], "type": "lev", "kw": ["disposable income", "ease of doing business", "regulation", "income", "market"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Disposable income is the income people have left to spend after taxes; ease of doing business describes how simple a country's rules and processes are for businesses. [K]", "Key term"], ["Point 1", "Rising disposable income increases demand. [K] India's middle class is growing quickly and disposable incomes are rising. [A] More households can afford to buy furniture and home products, increasing IKEA's potential sales. [An] However, average incomes are still much lower than in Europe, so IKEA must sell some products at very low prices, reducing margins. [Ev]", "(4)"], ["Point 2", "Difficult rules increase the cost and time of entering a market. [K] Foreign single-brand retailers must source a share of products locally, and IKEA faced complex rules on land, permits and food sales. [A] This delays store openings and raises set-up costs. [An] However, local sourcing can lower costs and help IKEA adapt products to Indian homes. [Ev]", "(4)"], ["Conclusion", "Overall, disposable income is the more important factor because the size of the growing middle class decides IKEA's long-term sales, while rules mainly affect the speed and cost of entry. [Ev]", "(2)"]]}, "pts": [{"s": "know", "t": "Disposable income is the income people have left to spend after taxes; ease of doing business describes how simple a country's rules and processes are for businesses."}, {"s": "for", "t": "Rising disposable income increases demand."}, {"s": "for", "t": "India's middle class is growing quickly and disposable incomes are rising."}, {"s": "for", "t": "More households can afford to buy furniture and home products, increasing IKEA's potential sales."}, {"s": "against", "t": "However, average incomes are still much lower than in Europe, so IKEA must sell some products at very low prices, reducing margins."}, {"s": "for", "t": "Difficult rules increase the cost and time of entering a market."}, {"s": "for", "t": "Foreign single-brand retailers must source a share of products locally, and IKEA faced complex rules on land, permits and food sales."}, {"s": "for", "t": "This delays store openings and raises set-up costs."}, {"s": "against", "t": "However, local sourcing can lower costs and help IKEA adapt products to Indian homes."}, {"s": "judge", "t": "Overall, disposable income is the more important factor because the size of the growing middle class decides IKEA's long-term sales, while rules mainly affect the speed and cost of entry."}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."]], "ms": "Indicative content\n• Disposable income is the income people have left to spend after taxes; ease of doing business describes how simple a country's rules and processes are for businesses.\n• Rising disposable income increases demand.\n• India's middle class is growing quickly and disposable incomes are rising.\n• More households can afford to buy furniture and home products, increasing IKEA's potential sales.\n• However, average incomes are still much lower than in Europe, so IKEA must sell some products at very low prices, reducing margins.\n• Difficult rules increase the cost and time of entering a market.\n• Foreign single-brand retailers must source a share of products locally, and IKEA faced complex rules on land, permits and food sales.\n• This delays store openings and raises set-up costs.\n• However, local sourcing can lower costs and help IKEA adapt products to Indian homes.\n• Overall, disposable income is the more important factor because the size of the growing middle class decides IKEA's long-term sales, while rules mainly affect the speed and cost of entry.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information, though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors, leading to a supported judgement."}, {"n": 310, "u": "u4", "set": "style", "case": "ikea", "topic": 2, "sub": ["m2"], "marks": 20, "biz": "IKEA", "paper": "Exam style", "qn": "IKEA", "stem": "Using Porter's five forces, evaluate whether India is an attractive market for IKEA.", "read": "D", "ext": [{"id": "D", "t": "IKEA in India", "p": ["IKEA, the Swedish furniture retailer, opened its first Indian store in Hyderabad in 2018, followed by stores in Navi Mumbai and Bengaluru, and online sales in several cities.", "India's middle class is growing quickly and disposable incomes are rising, but average incomes are still much lower than in Europe. IKEA sells some products in India at very low prices and adapts its range to Indian homes.", "Foreign single-brand retailers in India must source a share of their products locally. IKEA also had to work with complex rules on land, permits and food sales.", "IKEA competes with online furniture retailers, other large retailers and many local carpenters and small shops, who make furniture to order. Customers can easily compare prices online."]}], "type": "lev", "kw": ["porter", "five forces", "rivalry", "buyer power", "substitute", "new entrant", "supplier power"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Porter's five forces analyses how attractive a market is through rivalry, the threat of new entrants, buyer power, supplier power and the threat of substitutes. [K]", "Key term"], ["Topic 1: forces that make India attractive, P 1", "Barriers to entry protect established businesses. [K] Foreign retailers must meet local sourcing rules and complex permit requirements. [A] Now that IKEA has entered, these barriers make it harder for other foreign retailers to follow. [An] However, online furniture retailers can enter with lower set-up costs. [Ev]", "(4)"], ["Topic 1: forces that make India attractive, P 2", "Supplier power is likely to be low for a large buyer. [K] IKEA sources a share of its products locally. [A] Its huge buying power lets it negotiate low prices with many small Indian suppliers. [An] However, it may take time to find local suppliers that meet IKEA's quality standards. [Ev]", "(4)"], ["Topic 2: forces that make India less attractive, P 1", "Buyer power is high when customers can compare prices easily. [K] Customers can easily compare prices online. [A] IKEA must keep prices low, reducing profit margins. [An] However, IKEA's brand and store experience may make some customers less price sensitive. [Ev]", "(4)"], ["Topic 2: forces that make India less attractive, P 2", "Rivalry and substitutes are strong. [K] IKEA competes with online retailers, other large retailers and many local carpenters who make furniture to order. [A] Strong competition limits IKEA's market share and pricing power. [An] However, the fast growing middle class means the market is growing for all businesses. [Ev]", "(4)"], ["Conclusion", "Overall, India is an attractive long-term market for IKEA because of its growing middle class and IKEA's buying power, even though high buyer power and strong rivalry keep margins low. IKEA should keep adapting its range and prices to Indian customers and expand online to reach more cities. [Ev]", "(3)"]]}, "pts": [{"s": "know", "t": "Porter's five forces analyses how attractive a market is through rivalry, the threat of new entrants, buyer power, supplier power and the threat of substitutes."}, {"s": "for", "t": "Barriers to entry protect established businesses."}, {"s": "for", "t": "Foreign retailers must meet local sourcing rules and complex permit requirements."}, {"s": "for", "t": "Now that IKEA has entered, these barriers make it harder for other foreign retailers to follow."}, {"s": "against", "t": "However, online furniture retailers can enter with lower set-up costs."}, {"s": "for", "t": "Supplier power is likely to be low for a large buyer."}, {"s": "for", "t": "IKEA sources a share of its products locally."}, {"s": "for", "t": "Its huge buying power lets it negotiate low prices with many small Indian suppliers."}, {"s": "against", "t": "However, it may take time to find local suppliers that meet IKEA's quality standards."}, {"s": "for", "t": "Buyer power is high when customers can compare prices easily."}, {"s": "for", "t": "Customers can easily compare prices online."}, {"s": "for", "t": "IKEA must keep prices low, reducing profit margins."}, {"s": "against", "t": "However, IKEA's brand and store experience may make some customers less price sensitive."}, {"s": "for", "t": "Rivalry and substitutes are strong."}, {"s": "for", "t": "IKEA competes with online retailers, other large retailers and many local carpenters who make furniture to order."}, {"s": "for", "t": "Strong competition limits IKEA's market share and pricing power."}, {"s": "against", "t": "However, the fast growing middle class means the market is growing for all businesses."}, {"s": "judge", "t": "Ov     return `<details class="sheet res-q" ${i === 0 ? 'open' : ''}><summary><span>Question ${i + 1}: ${esc(q.biz)}  <span class="muted">(${q.marks} marks)</span></span><span class="mk">${r.mark}/${r.max}  ·  ${esc(r.label)}</span></summary>
    <p class="qstem">${esc(q.stem)}</p><h3>Your answer</h3><pre class="ms" style="font-family:var(--body)">${esc(EXAM.ans[q.n] || '(no answer)')}</pre>
    <div class="tabs" role="tablist"><button role="tab" aria-selected="true" data-tab="comp">Computer marking</button><button role="tab" aria-selected="false" data-tab="self">Self-mark</button><button role="tab" aria-selected="false" data-tab="model">Model build-up</button></div>
    <div class="panel" data-p="comp">${resultHTML(q, r)}</div><div class="panel" data-p="self" hidden>${selfHTML(q, id)}</div><div class="panel" data-p="model" hidden>${tipHTML(q)}${modelHTML(q)}</div></details>`; }).join('')}`;
  document.querySelectorAll('.res-q').forEach((d, i) => { const q = qs[i];
    const tabs = d.querySelectorAll('.tabs button'); tabs.forEach(b => b.addEventListener('click', () => { tabs.forEach(t => t.setAttribute('aria-selected', t === b)); d.querySelectorAll('.panel').forEach(p => p.hidden = p.dataset.p !== b.dataset.tab); }));
    wireSelf(d.querySelector('[data-p="self"]'), q, 'r' + q.n, m => { EXAM.self[q.n] = m; store.set('exam-' + x.id, EXAM); $('#selftot').textContent = `${selfTot()}/${max}`; $('#selfn').textContent = `${selfN()} of ${qs.length} questions self-marked`; }); });
  $('#again').addEventListener('click', () => { EXAM = null; store.set('exam-' + x.id, null); examStart(x.id); });
}

function route() {
  const h = (location.hash || '#home').slice(1); clearInterval(tick);
  const q = h.startsWith('q-') ? Q.find(x => x.n === +h.slice(2)) : null;
  const ex = h.startsWith('paper-') ? D.exams.find(e => e.id === h.slice(6)) : null;
  const sec = SECTIONS.find(s => h === s.id || h === s.id + '-papers' || h === s.id + '-topics');
  const v = q ? secOf(q).id : ex ? ex.unit + '-' + ex.set : sec ? sec.id : 'home';
  document.querySelectorAll('nav.main a').forEach(a => { if (a.dataset.v === v) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if (q) questionView(q.n);
  else if (ex) examStart(ex.id);
  else if (sec && h.endsWith('-papers')) examPick(sec);
  else if (sec && h.endsWith('-topics')) topicsView(sec);
  else if (sec) section(sec);
  else home();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route); route();
</script>
</body>
</html>
