<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Year 13 Business Exam Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: exam hall. A paper-white answer sheet on a cool desk, extracts as a source booklet beside the question. */
:root{
  --desk:#EEF2F7; --paper:#FFFFFF; --ink:#14213D; --muted:#56637A; --rule:#D5DCE6; --line:#C9D6E8;
  --accent:#1F4FA8; --accent-ink:#FFFFFF; --soft:#E7EEFA;
  --good:#11734B; --good-bg:#E6F4EC; --warn:#9A5B00; --warn-bg:#FDF2DE; --bad:#B42318; --bad-bg:#FCE9E7;
  --k:#2563EB; --a:#059669; --an:#D97706; --ev:#7C3AED;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  --mono:"IBM Plex Mono", Consolas, "Courier New", monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#0E1522; --paper:#162033; --ink:#E7ECF5; --muted:#A3AFC4; --rule:#2B3850; --line:#2C3B57;
  --accent:#7FA6F0; --accent-ink:#0E1522; --soft:#1D2B45;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --k:#7AA2FF; --a:#4FD1A5; --an:#F5B248; --ev:#B89BFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#0E1522; --paper:#162033; --ink:#E7ECF5; --muted:#A3AFC4; --rule:#2B3850; --line:#2C3B57;
  --accent:#7FA6F0; --accent-ink:#0E1522; --soft:#1D2B45;
  --good:#5CD39B; --good-bg:#12301F; --warn:#F2B65A; --warn-bg:#352611; --bad:#FF8A7E; --bad-bg:#3A1714;
  --k:#7AA2FF; --a:#4FD1A5; --an:#F5B248; --ev:#B89BFF; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:16px/1.55 var(--body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--desk)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) header.top{background:#0A101B}}
:root[data-theme="dark"] header.top{background:#0A101B}
header.top .wrap{display:flex;align-items:center;gap:18px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff;text-decoration:none;letter-spacing:.2px}
.brand small{display:block;font:500 .72rem var(--mono);letter-spacing:1.2px;text-transform:uppercase;color:#9FB3D9}
nav.main{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.main a{color:#D9E2F2;text-decoration:none;font-weight:600;font-size:.92rem;padding:7px 12px;border-radius:6px}
nav.main a[aria-current="page"],nav.main a:hover{background:rgba(255,255,255,.12);color:#fff}
main{padding-block:28px 60px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.9rem,4vw,2.8rem)} h2{font-size:1.5rem} h3{font-size:1.15rem}
.eyebrow{font:600 .75rem var(--mono);letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.btn{font:600 .95rem var(--body);border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--an);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet{background:var(--paper);border:1px solid var(--rule);border-radius:10px}
/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:end;margin-bottom:28px}
.hero p{max-width:60ch;font-size:1.05rem}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-block:22px 34px}
.how .sheet{padding:18px}
.how b{font-family:var(--display);font-size:1.1rem;display:block;margin-bottom:4px}
.stat{padding:18px 20px}
.stat .big{font:600 2.2rem var(--mono);font-variant-numeric:tabular-nums}
.marks-strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font:600 .78rem var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);color:var(--ink)}
/* question list */
.topic{margin-top:26px}
.topic h2{display:flex;align-items:center;gap:10px}
.topic h2 i{width:12px;height:12px;border-radius:3px;display:inline-block}
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:12px}
.qcard{display:flex;flex-direction:column;gap:6px;padding:16px;text-decoration:none;color:var(--ink);border-left:5px solid var(--tc)}
.qcard:hover{border-color:var(--tc);box-shadow:0 2px 0 var(--rule)}
.qcard .stem{font-size:.95rem;min-width:0}
.qcard .meta{display:flex;justify-content:space-between;gap:8px;font:500 .78rem var(--mono);color:var(--muted)}
.state{font:600 .72rem var(--mono);padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent)}
/* question view */
.qview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.booklet{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding:20px 22px}
.booklet h3{font-size:1rem;margin-top:16px}
.booklet h3:first-of-type{margin-top:6px}
.booklet p{margin:.45em 0;font-size:.95rem;max-width:68ch}
.booklet .tbl p{margin:0;font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.read{font:600 .8rem var(--mono);color:var(--warn);background:var(--warn-bg);padding:6px 10px;border-radius:6px;display:inline-block}
.qpaper{padding:22px}
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.qnum{font:700 1.4rem var(--display)}
.qstem{font-size:1.08rem;margin:10px 0 4px;font-weight:500}
.mk{font:600 1rem var(--mono);white-space:nowrap}
.answer{width:100%;min-height:260px;resize:vertical;border:1px solid var(--rule);border-radius:6px;padding:4px 12px 4px 46px;font:1rem/32px var(--body);color:var(--ink);
  background-color:var(--paper);background-image:linear-gradient(90deg,transparent 34px,var(--bad) 34px,var(--bad) 35px,transparent 35px),repeating-linear-gradient(var(--paper) 0 31px,var(--line) 31px 32px);background-attachment:local}
.counter{font:500 .8rem var(--mono);color:var(--muted)}
.tabs{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.tabs button{font:600 .9rem var(--body);padding:8px 14px;border-radius:8px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.panel{margin-top:14px}
/* results */
.score{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:10px;background:var(--soft);flex-wrap:wrap}
.score .big{font:600 2.1rem var(--mono);font-variant-numeric:tabular-nums}
.score .lvl{font:600 .85rem var(--mono);padding:4px 10px;border-radius:999px;background:var(--paper);border:1px solid var(--rule)}
.crit{list-style:none;padding:0;margin:14px 0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--rule)}
.crit li .ic{font:700 1rem var(--mono);text-align:center}
.crit li.ok{border-color:var(--good);background:var(--good-bg)} .crit li.ok .ic{color:var(--good)}
.crit li.no{border-color:var(--bad);background:var(--bad-bg)} .crit li.no .ic{color:var(--bad)}
.crit li.part{border-color:var(--warn);background:var(--warn-bg)} .crit li.part .ic{color:var(--warn)}
.crit b{display:block}
.tag{font:700 .7rem var(--mono);padding:1px 6px;border-radius:4px;color:#fff;margin-left:3px;vertical-align:1px}
.tK{background:var(--k)}.tA{background:var(--a)}.tAn{background:var(--an)}.tEv{background:var(--ev)}
:root[data-theme="dark"] .tag{color:#0E1522}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#0E1522}}
.pts{display:grid;gap:6px;margin:8px 0;padding:0;list-style:none}
.pts li{padding:8px 10px;border-radius:6px;border:1px solid var(--rule);font-size:.92rem;display:flex;gap:10px;align-items:flex-start}
.pts li.hit{border-color:var(--good);background:var(--good-bg)}
.pts label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;width:100%}
.pts input{margin-top:4px;flex:none;width:18px;height:18px}
.side{font:600 .68rem var(--mono);text-transform:uppercase;letter-spacing:.8px;color:var(--muted);flex:none;width:76px;padding-top:3px}
pre.ms{white-space:pre-wrap;font:.85rem/1.5 var(--mono);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:14px;max-height:420px;overflow:auto}
.lvls{display:grid;gap:8px}
.lvls label{display:grid;grid-template-columns:22px 92px 1fr;gap:10px;padding:10px;border:1.5px solid var(--rule);border-radius:8px;cursor:pointer;font-size:.9rem;background:var(--paper)}
.lvls label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.lvls b{font-family:var(--mono)}
.build{width:100%;border-collapse:collapse;font-size:.92rem}
.build td{border:1px solid var(--rule);padding:8px 10px;vertical-align:top}
.build td:first-child{font-weight:700;width:120px} .build td:last-child{width:90px;font:600 .8rem var(--mono);text-align:center}
.tblwrap{overflow-x:auto}
.cmp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.cmp div{padding:12px;border-radius:8px;border:1px solid var(--rule);background:var(--paper)}
.cmp b{font:600 1.6rem var(--mono);display:block}
.note{font-size:.85rem;color:var(--muted);margin-top:10px;max-width:70ch}
/* sections */
.hero1{margin-bottom:22px}.hero1 p{max-width:66ch;font-size:1.05rem}
.sets{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.setcard{padding:24px;display:flex;flex-direction:column;gap:10px;border-top:6px solid var(--accent)}
.setcard.style{border-top-color:var(--ev)}
.setcard h2{font-size:1.7rem}.setcard p{margin:0;max-width:56ch}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px;border-bottom:1px solid var(--rule)}
.subnav a{padding:8px 12px;font-weight:600;text-decoration:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.subnav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
.gh{display:flex;align-items:center;gap:10px;font-size:1.3rem}.gh i{width:12px;height:12px;border-radius:3px;display:inline-block}
.cover td:first-child{width:auto;font-weight:600}.cover tr:first-child td{font:600 .75rem var(--mono);text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.cover td:last-child{width:auto;text-align:left;font:500 .9rem var(--body)}.cover a{margin-right:10px;font-weight:600}
.cover tr.none td:first-child{color:var(--muted);font-weight:500}
@media (max-width:860px){.sets{grid-template-columns:1fr}}
/* exam */
.paper-pick{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:20px}
.paper-pick .sheet{padding:22px;display:flex;flex-direction:column;gap:10px}
.exambar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.timer{font:600 1.3rem var(--mono);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{font:600 .82rem var(--mono);min-width:44px;padding:6px 8px;border-radius:6px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.qnav button.cur{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.qnav button.done{border-style:solid;border-color:var(--good)}
.confirm{margin-top:12px;padding:14px;border-radius:8px;border:1.5px solid var(--warn);background:var(--warn-bg)}
.res-q{padding:18px;margin-top:14px}
.res-q summary{cursor:pointer;display:flex;justify-content:space-between;gap:10px;font-weight:600;list-style:none;flex-wrap:wrap}
.res-q summary::-webkit-details-marker{display:none}
.bar{height:8px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
@media (max-width:600px){.brand small{display:none}header.top{position:static}nav.main{margin-left:0}nav.main a{padding:6px 9px}.exambar{top:env(safe-area-inset-top,0px)}}
@media (max-width:860px){.qview,.hero{grid-template-columns:1fr}.booklet{position:static;max-height:none}.how,.paper-pick{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* units, dashboard, print */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}
.dash{padding:20px 22px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:12px 0 16px}
.tiles div{padding:12px 14px;border:1px solid var(--rule);border-radius:8px}
.tiles b{display:block;font:600 1.7rem var(--mono);font-variant-numeric:tabular-nums}
.secbars{display:grid;gap:8px}
.secbar{display:grid;grid-template-columns:minmax(0,220px) 1fr auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink);padding:6px 4px;border-radius:6px}
.secbar:hover{background:var(--soft)}
.secbar .bar{margin:0}.secbar .num{font:500 .82rem var(--mono);color:var(--muted);white-space:nowrap}
.bigbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:12px}
.bigbtn{display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:12px;background:var(--c);color:#fff;text-decoration:none;min-height:150px}
.bigbtn .eyebrow{color:rgba(255,255,255,.85)}
.bigbtn b{font:700 1.6rem var(--display)}
.bigbtn .go{margin-top:auto;font-weight:700}
.bigbtn:hover{filter:brightness(1.08)}
.bigbtn:focus-visible{outline:3px solid var(--an);outline-offset:3px}
.sechead{border-left:8px solid var(--c);padding:4px 0 4px 16px}
.sechead p{max-width:68ch;margin:.4em 0 0;color:var(--muted)}
.reset{margin-top:28px;padding:16px 20px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.tip{border:1.5px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:.92rem}
.tip b{display:block;color:var(--warn);font:600 .78rem var(--mono);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
#printarea{display:none}
@media print{
  body.printing > *:not(#printarea){display:none!important}
  body.printing #printarea{display:block;color:#000;font:11pt/1.45 Arial,sans-serif}
  body.printing::before{display:none}
  #printarea h1{font-size:15pt;margin:0 0 4px} #printarea .pm{margin:0 0 10px;color:#333}
  #printarea .pq{border:1.5px solid #000;padding:8px 10px;margin-bottom:8px}
  #printarea .plines div{height:0.85cm;border-bottom:1px solid #777} @page{margin:1.5cm}
  #printarea .read{color:#000;background:none;border:1px solid #000}
  #printarea .pext h3{font-size:11pt;margin:10px 0 2px} #printarea .pext p{margin:3px 0}
}
@media (max-width:700px){.tiles{grid-template-columns:repeat(2,1fr)}.bigbtns{grid-template-columns:1fr}.secbar{grid-template-columns:1fr}}
</style>
</head>

</div></header>
<main class="wrap" id="app"></main>

n transparency. We have implemented fair labour practices throughout our supply chain. This includes paying fair wages to over 75,000 clothing factory employees, providing safe working conditions and ensuring environmental responsibility in 67 factories, farms and mills."]}, {"id": "B", "t": "Patagonia’s use of recycled materials in clothing", "p": ["Patagonia started making fleece jackets from recycled plastic bottles in 1993 and in 1996 was an early adopter of organic cotton.", "Recycled materials are used by Patagonia in a variety of clothing including coats, running tops and yoga leggings. 5", "Percentage (%) of", "Year recycled materials", "used by Patagonia", "2015 24", "2016 26", "2017 29", "2018 35", "2019 31", "2020 65", "2021 66", "2022 72"]}], "ms": "Question Explain one benefit to Patagonia of having a mission Mark\nstatement.\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a benefit e.g.:\n• To attract/retain employees (1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• The mission statement communicates a higher purpose\nbeyond just making profits (1)\n• Patagonia is passionate about sustainability/environment\n(1)\nAnalysis\n1 mark for developing the benefit, e.g.:\n• The mission statement can create a strong sense of\ncommunity and shared purpose that can enhance employee (4)\nengagement, satisfaction and loyalty (1)", "kw": ["attract", "retain", "recruit", "motivat", "loyal", "purpose", "direction", "focus", "engag"], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1. No evaluation.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "One benefit of a mission statement is that it helps a business attract and retain employees. [K]", "(1)"], ["Application", "Patagonia's mission communicates a higher purpose beyond just making profits. [A]", "(1)"], ["Application", "Patagonia is passionate about sustainability and the environment. [A]", "(1)"], ["Analysis", "This creates a strong sense of community and shared purpose that can enhance employee engagement, satisfaction and loyalty. [An]", "(1)"]]}, "type": "pt", "K": [["attract", "retain", "recruit", "motivat", "loyal", "purpose", "direction", "focus", "engag"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "set": "past", "sub": ["co"], "u": "u3"}, {"n": 2, "topic": 2, "paper": "2023 January", "qn": "1(d)", "biz": "Brompton Bikes", "marks": 12, "read": "A, B and D", "stem": "Using Ansoff’s Matrix, assess whether Brompton Bikes was right to launch Brompton Bikes Hire to grow the business.", "ext": [{"id": "A", "t": "UK Government ministers asked to subsidise electric bikes to tackle health and", "p": ["climate crises", "Campaigners have asked UK ministers to consider subsidising electric bikes (e-bikes) as well as electric cars. This comes after research found that the use of e-bikes could create more than £2bn in health benefits and cut a million tonnes of harmful emissions annually.", "E-bikes help riders reach a maximum powered speed of 15 mph (24 kph) when they are being pedalled. While grants of up to £1 500 are available for low-emission cars, vans and motorbikes, there are no grants for e-bikes.", "E-bikes have become increasingly common in the UK, but sales are still well below levels seen in many other European countries. Market research has shown they are particularly popular with older riders and with women."]}, {"id": "B", "t": "New products and markets for Brompton Bikes", "p": ["Brompton Bikes started in 1975 when Andrew Ritchie made the first folding bike. Since then, its popularity has grown year-on-year, making it the UK’s largest bike manufacturer. The folding bike can be folded down to fit under a chair or desk. The basic Brompton bike is priced at £895. 5", "Brompton Bikes has recently entered a new market with its existing folding bikes. Brompton Bikes Hire is a long-term bike rental scheme, aimed at getting more people using its folding bikes through a monthly subscription service. Riders pay a £60 monthly fee for a bike delivered to their door. This fee includes servicing, repairs and insurance covering accidental damage and theft. There is a discount on a future purchase of a bike at any point during the rental period.", "With the increasing popularity of e-bikes, Brompton Bikes now sells an electric folding bike. This offers the same convenience of a folding bike but with the added power of an e-bike. The price of a Brompton e-bike is £2 995."]}, {"id": "D", "t": "Brompton Bikes plans £100m factory", "p": ["Brompton Bikes plans to move out of London because the rent for its factory has nearly doubled in the last six years. It will invest £100m in a new purpose-built factory in Ashford. This is due to open in 2027.", "The new factory is part of an expansion that will increase employee numbers from 850 to 1,500, which will include new specialist roles for marketing, IT and social media. The new factory will enable Brompton Bikes to develop new products and will include a museum, visitor centre and café. The aim for the new factory is to build 200,000 bikes a year to meet the ever-growing demand compared with the 80,000 it built in 2020–2021.", "The new factory will be close to the Channel Tunnel and the port of Dover, for transporting its bikes to Europe. Approximately 75% of its bikes were exported in 2021. Brompton Bikes has grown at an average annual rate of 17% for the past 18 years. It expects sales to increase by 15–20% due to the growth of cycling in cities."]}], "ms": "Question Using Ansoff’s Matrix, assess whether Brompton Bikes was right to launch\nBrompton Bikes Hire to grow the business. (12)\nAnswer\n1(d) Indicative content guidance\n\nQS: QS8, QS9\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Ansoff’s Matrix helps businesses to analyse a range of possible options by\nconsidering their relative risks\n• Brompton Bikes Hire could be considered to be an example of market\ndevelopment for Brompton Bikes\n• This is because Brompton Bikes Hire is using its existing folding bikes to target\nnew market segments in terms of customers who only want to hire a bike\nrather than purchase one\n• This strategy is less risky than diversification and could be seen as a good move\nto encourage more people to try its folding bike without having to spend at\nleast £895 to purchase it upfront\n• Discounts are available on future purchases so customers who hire a bike\nmight want to purchase a folding bike at the end of the rental period if they like\nthe bike\n• Therefore, this strategy could help to tap into the UK market and help to\nincrease demand for its folding bikes in the long-term\n• However, market development can be risky in comparison to market\npenetration or product development because knowledge of the new market\nmight be limited\n• Brompton Bikes has nearly 50 years of knowledge and expertise in making\nfolding bikes but hiring out bikes will require increased investment and\nspecialist knowledge to make it successful\n• The profit margin might not be as great on the hire of a bike compared to a\ncustomer purchasing a new bike therefore reducing profitability for Brompton\nBikes\n• Brompton Bikes has been growing by an average of 17% for the past 18 years\n• This indicates it should perhaps focus on market penetration particularly when\nit moves to the new factory close to transport links and can continue to export\nits folding bikes to continental Europe\n• The benefits will depend on whether Brompton Bikes are able to balance this\nalongside its other business activities and if the market for bikes and e-bikes\ncontinues to grow in the UK\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business\nexample.\nChains of reasoning are presented, but may be assertions or incomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout\nby relevant and effective use of the business behaviour/context.\nAnalytical perspectives are presented, with developed chains of reasoning,\nshowing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information though unlikely to show the significance of competing\narguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout\nby relevant and effective use of the business behaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors leading to a supported judgement.", "kw": ["ansoff", "market development", "risk", "existing product", "new market"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Ansoff's Matrix helps businesses analyse a range of possible options by considering their relative risks. [K]", "Key term"], ["Point 1", "Brompton Bikes Hire is market development, which is less risky than diversification. [K] It uses existing folding bikes to target customers who want to hire rather than spend at least £895 to buy one upfront. [A] Discounts on future purchases may turn hirers into buyers, increasing demand for folding bikes in the long term. [An] However, market development can be risky because knowledge of the new market might be limited. [Ev]", "(4)"], ["Point 2", "Market development helps Brompton tap into a new segment of the UK market. [K] Brompton has nearly 50 years of knowledge and expertise in making folding bikes. [A] Hiring will require increased investment and specialist knowledge, and the profit margin on hire may be lower than on a sale, reducing profitability. [An] However, Brompton has grown by an average of 17% for 18 years, so it could focus on market penetration from its new factory and keep exporting to Europe. [Ev]", "(4)"], ["Conclusion", "Overall, the benefits will depend on whether Brompton can balance hire alongside its other activities and whether the UK bike and e-bike market keeps growing. [Ev]", "(2)"]]}, "type": "lev", "pts": [{"t": "Ansoff’s Matrix helps businesses to analyse a range of possible options by considering their relative risks", "s": "know"}, {"t": "Brompton Bikes Hire could be considered to be an example of market development for Brompton Bikes", "s": "for"}, {"t": "This is because Brompton Bikes Hire is using its existing folding bikes to target new market segments in terms of customers who only want to hire a bike rather than purchase one", "s": "for"}, {"t": "This strategy is less risky than diversification and could be seen as a good move to encourage more people to try its folding bike without having to spend at least £895 to purchase it upfront", "s": "for"}, {"t": "Discounts are available on future purchases so customers who hire a bike might want to purchase a folding bike at the end of the rental period if they like the bike", "s": "for"}, {"t": "Therefore, this strategy could help to tap into the UK market and help to increase demand for its folding bikes in the long-term", "s": "for"}, {"t": "However, market development can be risky in comparison to market penetration or product development because knowledge of the new market might be limited", "s": "against"}, {"t": "Brompton Bikes has nearly 50 years of knowledge and expertise in making folding bikes but hiring out bikes will require increased investment and specialist knowledge to make it successful", "s": "against"}, {"t": "The profit margin might not be as great on the hire of a bike compared to a customer purchasing a new bike therefore reducing profitability for Brompton Bikes", "s": "against"}, {"t": "Brompton Bikes has been growing by an average of 17% for the past 18 years", "s": "against"}, {"t": "This indicates it should perhaps focus on market penetration particularly when it moves to the new factory close to transport links and can continue to export its folding bikes to continental Europe", "s": "against"}, {"t": "The benefits will depend on whether Brompton Bikes are able to balance this alongside its other business activities and if the market for bikes and e-bikes continues to grow in the UK", "s": "judge"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "set": "past", "sub": ["an"], "u": "u3"}, {"n": 3, "topic": 3, "paper": "2024 June", "qn": "1(d)", "biz": "Bosch", "marks": 12, "read": "A to D", "stem": "Assess the likely benefits for Bosch of using a SWOT analysis when developing its business strategy.", "ext": [{"id": "A", "t": "What we do at Bosch", "p": ["Bosch is a German engineering and technology business that has over 420,000 employees worldwide. Its aim is to develop products that are ‘Invented for life’ to improve the quality of living for its customers.", "Bosch has a wide product portfolio. Its consumer goods division manufactures household goods such as refrigerators, dishwashers, coffee makers, vacuum cleaners and garden tools.", "Bosch’s mobility division supplies parts and services to the automotive market. This earns Bosch the majority of its revenue. It is a market leader in the supply of car parts and software systems and has numerous manufacturing and engineering factories located around the world. Bosch is increasing its investment in the design of parts and software systems for electric cars and electric bikes, which are growing markets.", "Bosch has announced that €950m will be invested in an engineering and manufacturing factory in Suzhou, China. The factory will create new jobs to make parts for electric cars."]}, {"id": "B", "t": "Bosch has exceeded its sales forecasts despite many challenges over the last few", "p": ["years such as the global health crisis, supply chain problems and increasing costs of raw materials.", "Selected financial data for Bosch 2021 and 2022", "2021 2022", "(€bn) (€bn)", "Revenue 78.7 88.2", "Operating Profit 2.8 3.4", "Non-Current Liabilities 24.9 24.4", "Total Equity 44.3 46.7"]}, {"id": "C", "t": "Investment in innovation", "p": ["Bosch states that ‘one of its biggest strengths is its employees with their expertise, ideas, creativity and commitment.’ The basis of the future growth of the business is its innovation. In 2022 it employed 76,000 employees worldwide in research and development (R&D) and spent €6bn developing new products."]}, {"id": "D", "t": "Ownership of Bosch", "p": ["Unlike many large businesses, Bosch has remained a private limited company rather than converting to a public limited company. It has a unique form of ownership. Ownership is shared between the Bosch family and a charitable foundation that does not have voting rights in the business. Most of the profits are either invested back into the business to build for future growth or donated to charitable causes."]}], "ms": "Question Assess the likely benefits for Bosch of using a SWOT analysis when\ndeveloping its business strategy. (12)\nAnswer\n1(d) Indicative content guidance\n\nQS: QS8 and QS9\nKnowledge, Application, Analysis, Evaluation – indicative content\n• A SWOT analysis involves analysing the internal strengths and\nweaknesses of a business and the external opportunities and threats\nthat it faces\n• Strengths describe what the business excels at and what separates it\nfrom competition\n• A business strength of Bosch is its innovation which may allow it to\nmake advances in the manufacturing and technology market. This\nmay create a competitive advantage for Bosch\n• Opportunities refer to favourable external factors that can be taken\nadvantage of to generate revenue and profits for a business\n• The growth of the electric car market gives an opportunity to Bosch\nto use its experienced employees and its leading position in the\nmarket to profit from this growth\n• Threats refer to factors that have the potential to harm a business\n• Bosch faces threats from competition in the automotive supplier\nmarket plus other threats from rising costs and supply chain\nproblems. Bosch must keep these threats in mind when making\nstrategic decisions\n• However, categorising aspects as strengths, weaknesses,\nopportunities and threats might be very subjective as there is a great\ndegree of uncertainty in the market especially with the recent global\nhealth crisis\n• SWOT analysis may have limited value to plan strategically. Bosch is\nnot in control of external factors such as material price increases and\nsupply chain delays which can have a significant impact on its\nsuccess\n• Although opportunities of the growing electric car market can be\nidentified, Bosch may not have the necessary capital to take full\nadvantage of the opportunities\n• The process needs to be repeated on a regular basis and is time\nconsuming. As Bosch operates in fast moving and dynamic markets,\nthe pace of the changes may make a SWOT analysis unfeasible\n• A SWOT analysis is useful to provide an overview of a business but\nshould be used in conjunction with other strategic research tools,\nsuch as a PESTLE analysis which looks closer at external influences\non a business\n• There are other methods such as Ansoff and Porter’s Strategic Matrix\nwhich are used to assist with strategic decision making\n• A combination of these models would help Bosch make decisions on\nits future strategy\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nChains of reasoning are presented, but may be assertions or\nincomplete.\nA generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nAnalytical perspectives are presented, with developed chains of\nreasoning, showing cause(s) and/or effect(s).\nAn attempt at an assessment is presented, using quantitative and/or\nqualitative information though unlikely to show the significance of\ncompeting arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nA coherent and logical chain of reasoning, showing cause(s) and/or\neffect(s).\nAssessment is balanced, wide ranging and well contextualised, using\nquantitative and/or qualitative information and shows an awareness of\ncompeting arguments/factors leading to a supported judgement.", "kw": ["swot", "strength", "weakness", "opportunit", "threat", "internal", "external"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "A SWOT analysis analyses the internal strengths and weaknesses of a business and the external opportunities and threats it faces. [K]", "Key term"], ["Point 1", "Strengths describe what a business excels at and what separates it from the competition. [K] Bosch's strength is its innovation in the manufacturing and technology market. [A] This may create a competitive advantage for Bosch. [An] However, categorising factors may be very subjective because of uncertainty in the market after the global health crisis. [Ev]", "(4)"], ["Point 2", "Opportunities and threats are external factors that can help or harm a business. [K] The growing electric car market is an opportunity, while competition, rising costs and supply chain problems are threats. [A] Bosch can use its experienced employees and leading position to profit from growth, and keep threats in mind when making strategic decisions. [An] However, Bosch cannot control material prices or supply delays, may lack the capital to take full advantage, and must repeat SWOT regularly in fast moving markets. [Ev]", "(4)"], ["Conclusion", "Overall, SWOT gives a useful overview, but it should be used with PESTLE, Ansoff and Porter's Strategic Matrix: a combination of these models would help Bosch decide its future strategy. [Ev]", "(2)"]]}, "type": "lev", "pts": [{"t": "A SWOT analysis involves analysing the internal strengths and weaknesses of a business and the external opportunities and threats that it faces", "s": "know"}, {"t": "Strengths describe what the business excels at and what separates it from competition", "s": "for"}, {"t": "A business strength of Bosch is its innovation which may allow it to make advances in the manufacturing and technology market. This may create a competitive advantage for Bosch", "s": "for"}, {"t": "Opportunities refer to favourable external factors that can be taken advantage of to generate revenue and profits for a business", "s": "for"}, {"t": "The growth of the electric car market gives an opportunity to Bosch to use its experienced employees and its leading position in the market to profit from this growth", "s": "for"}, {"t": "Threats refer to factors that have the potential to harm a business", "s": "for"}, {"t": "Bosch faces threats from competition in the automotive supplier market plus other threats from rising costs and supply chain problems. Bosch must keep these threats in mind when making strategic decisions", "s": "for"}, {"t": "However, categorising aspects as strengths, weaknesses, opportunities and threats might be very subjective as there is a great degree of uncertainty in the market especially with the recent global health crisis", "s": "against"}, {"t": "SWOT analysis may have limited value to plan strategically. Bosch is not in control of external factors such as material price increases and supply chain delays which can have a significant impact on its success", "s": "against"}, {"t": "Although opportunities of the growing electric car market can be identified, Bosch may not have the necessary capital to take full advantage of the opportunities", "s": "against"}, {"t": "The process needs to be repeated on a regular basis and is time consuming. As Bosch operates in fast moving and dynamic markets, the pace of the changes may make a SWOT analysis unfeasible", "s": "against"}, {"t": "A SWOT analysis is useful to provide an overview of a business but should be used in conjunction with other strategic research tools, such as a PESTLE analysis which looks closer at external influences on a business", "s": "against"}, {"t": "There are other methods such as Ansoff and Porter’s Strategic Matrix which are used to assist with strategic decision making", "s": "against"}, {"t": "A combination of these models would help Bosch make decisions on its future strategy", "s": "judge"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "set": "past", "sub": ["sw"], "u": "u3"}, {"n": 4, "topic": 4, "paper": "2024 January", "qn": "1(c)", "biz": "Patagonia", "marks": 8, "read": "C", "stem": "Using Extract C, discuss the threat to Patagonia from new entrants into the outdoor clothing market.", "ext": [{"id": "C", "t": "Forecast worldwide value ($bn) for the outdoor clothing market 2022–2027", "p": ["Forecast worldwide value of the outdoor clothing market ($bn): 2022: 34.8 | 2023: 36.7 | 2024: 38.6 | 2025: 40.7 | 2026: 42.9 | 2027: 45.2", "The growth in the number of people participating in physical activities worldwide is acting as a force for growth in this market.", "The outdoor clothing market is highly competitive. The major key global businesses present in the market include Columbia Sportswear, Patagonia, The North Face, Canada Goose, Salomon and Jack Wolfskin."]}], "ms": "Question Using Extract C, discuss the threat to Patagonia from new entrants\ninto the outdoor clothing market.\nAnswer\n1(c) Indicative content guidance\n\nQS: QS8, QS9\nKnowledge, Application, Analysis, Evaluation – indicative content\n• The threat of new entrants is one of Porter’s five forces and it looks at\nhow easy it is for a new business to enter a market\n• The outdoor clothing market is a highly competitive industry with many\nestablished brands such as Patagonia, Columbia Sportswear and The\nNorth Face\n• Patagonia’s commitment to sustainability and ethical business practices\ncould help to differentiate it from new competitors and maintain its\nposition in the market\n• Patagonia has a strong brand reputation and has been in the industry for\nover 50 years with an extensive supply chain\n• This creates some barriers to entry for new companies trying to enter the\noutdoor clothing market\n• However, Extract C shows the outdoor clothing market is still growing\ndue to many more people participating in physical activities\n• The market value is set to increase to $45.2bn by 2027 which could\nattract new entrants to the market in order to seek profits\n• New competitors may enter the outdoor clothing market with innovative\nclothing products or lower prices which could impact Patagonia's market\nshare\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s)\nbut may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative information, and shows an awareness of competing\narguments/factors.", "kw": ["porter", "five forces", "new entrant", "barrier"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "The threat of new entrants is one of Porter's five forces: how easy it is for a new business to enter a market. [K]", "Key term"], ["Point 1", "The market has many established brands. [K] Patagonia competes with Columbia Sportswear and The North Face. [A] This creates some barriers to entry for new companies. [An] However, Extract C shows the market is still growing as more people take part in physical activities, which could attract new entrants. [Ev]", "(4)"], ["Point 2", "A strong brand reputation differentiates a business. [K] Patagonia has over 50 years in the industry, a commitment to sustainability and an extensive supply chain. [A] This helps it maintain its position against new competitors. [An] However, the market value is set to reach $45.2bn by 2027, so new competitors may enter with innovative or cheaper products, reducing Patagonia's market share. [Ev]", "(4)"]]}, "type": "lev", "pts": [{"t": "The threat of new entrants is one of Porter’s five forces and it looks at how easy it is for a new business to enter a market", "s": "know"}, {"t": "The outdoor clothing market is a highly competitive industry with many established brands such as Patagonia, Columbia Sportswear and The North Face", "s": "for"}, {"t": "Patagonia’s commitment to sustainability and ethical business practices could help to differentiate it from new competitors and maintain its position in the market", "s": "for"}, {"t": "Patagonia has a strong brand reputation and has been in the industry for over 50 years with an extensive supply chain", "s": "for"}, {"t": "This creates some barriers to entry for new companies trying to enter the outdoor clothing market", "s": "for"}, {"t": "However, Extract C shows the outdoor clothing market is still growing due to many more people participating in physical activities", "s": "against"}, {"t": "The market value is set to increase to $45.2bn by 2027 which could attract new entrants to the market in order to seek profits", "s": "against"}, {"t": "New competitors may enter the outdoor clothing market with innovative clothing products or lower prices which could impact Patagonia's market share", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "set": "past", "sub": ["ff"], "u": "u3"}, {"n": 5, "topic": 4, "paper": "2025 January", "qn": "2", "biz": "Dyson", "marks": 20, "read": "F", "stem": "Using PESTLE analysis, evaluate the extent to which legal factors are the most important influence on the success of Dyson.", "ext": [{"id": "F", "t": "Dyson alleges American rival copied its hair styler in £10m claim", "p": ["The British business, founded by Sir James Dyson, has accused its American rival SharkNinja of infringing its patents with its £250 Shark FlexStyle hairdryer and styler. Dyson has launched a UK High Court case against SharkNinja, accusing it of copying its hair styler, the Airwrap, in a claim valued at more than £10m.", "In legal papers filed with the UK High Court, Dyson is seeking a judicial order to block sales of all air stylers and their attachments within the Shark FlexStyle range in the UK. It is demanding the destruction of all Shark FlexStyle inventory.", "Dyson, which has moved its corporate headquarters to Singapore, told the UK court: “The estimated value of the claim exceeds £10 million.”", "The rivals are also battling in the US, Germany and France. Dyson told the US courts its development was “not easy, and it took many attempts to perfect the curling barrels featured on the Dyson Airwrap” as well as “years of research and development, engineering, design and substantial monetary and capital investment”.", "The two businesses have a history of legal disputes. In 2014, Dyson sued SharkNinja in a $200m (£163m) lawsuit over claims it had breached its patents for hand-held vacuum cleaners. Four years later, the claim was voluntarily dismissed and a judge said the two designs were clearly different.", "In a separate case, Dyson won $16m in damages against SharkNinja from a Chicago court over false advertising claims after the US business claimed its vacuums were superior to those of the British business.", "The Shark brand was launched in 2007 and since then its parent company has grown to make sales of £3bn in 2022. Dyson, founded in 1991, reported sales of £6.5bn in 2022."]}], "ms": "Question Using PESTLE analysis, evaluate the extent to which legal factors are the most\nimportant influence on the success of Dyson. (20)\nAnswer\n2 Indicative content guidance\n\nQS: QS8, QS9\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Legal factors are part of the PESTLE framework for looking at\nexternal influences on a business\n• Success in legal battles ensures that Dyson can safeguard its\ninnovative products which are key to its success in the market\n• Dyson's legal action aimed at blocking the sales of SharkNinja's\nproducts in the UK shows the importance of legal factors in\nmanaging competition\n• By enforcing its intellectual property rights Dyson can maintain its\ncompetitive edge and market share\n• The fact that Dyson and SharkNinja are involved in legal disputes not\nonly in the UK but also in the US, Germany and France shows the\nglobal scope of legal factors\n• For a company like Dyson which operates internationally, the legal\nframework and outcomes in various countries can significantly\nimpact its global success\n• Dyson is pursuing a claim valued at over £10m indicating that Dyson\nis willing to invest substantial financial resources to protect its\ninterests\n• Legal disputes can affect how consumers perceive a company and\nDyson's commitment to protecting its innovations through legal\nmeans can enhance its brand reputation resulting in consumer trust\nand loyalty\n• This historical context suggests that legal factors have been an\nongoing factor in Dyson's business strategy and are integral to the\ncompany's past and future success in the highly competitive\nconsumer products industry\n• However, engaging in legal disputes can be costly and time-\nconsuming, potentially diverting resources and management focus\naway from core business activities\n• The opportunity cost of legal actions could outweigh the potential\nbenefits of protecting intellectual property for Dyson\n• Political stability and policies related to trade, taxation and business\nregulation can significantly affect Dyson's global operations and\nsupply chain more than legal factors\n• Economic conditions and market demand may have a more\nimmediate and direct impact on Dyson's success\n• Economic downturns, changes in consumer spending or\nfluctuations in currency exchange rates can have a more immediate\neffect on Dyson's financial performance and therefore success\n• Social trends and changes in consumer preferences and lifestyle can\ndrive or inhibit demand for Dyson's products so responding to these\nsocial factors might be as important, if not more so, than legal factors in\nthe consumer goods market\n• Dyson's success is heavily dependent on its ability to innovate\ntechnologically therefore staying at the forefront of technological\nadvancements such as developing cutting-edge vacuum cleaners or\nhair stylers, is arguably more critical than legal issues\n• Dyson's success may be more influenced by its ability to create\nenvironmentally friendly products and adapt to changing\nenvironmental regulations than by legal factors\n• Overall, Dyson’s success will be influenced by a wide range of\nexternal influences and all will contribute to its success in the future\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–4 Isolated elements of knowledge and understanding.\nWeak or no relevant application of business examples.\nAn argument may be attempted, but will be generic and fail to connect\ncauses and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the\nbusiness example.\nArguments and chains of reasoning are presented but connections\nbetween causes and/or consequences are incomplete. Attempts to\naddress the question.\nA comparison or judgement may be attempted but it will not\nsuccessfully show an awareness of the key features of business\nbehaviour or business situation.\nLevel 3 9–14 Accurate knowledge and understanding, supported by relevant and\neffective use of the business behaviour/context.\nUses developed chains of reasoning, so that causes and/or\nconsequences are complete, showing an understanding of the\nquestion.\nArguments are well developed.\nQuantitative and/or qualitative information is introduced in an attempt\nto support judgements, a partial awareness of the validity and/or\nsignificance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nUses well-developed and logical, coherent chains of reasoning,\nshowing a range of cause and/or effect(s).\nArguments are fully developed.\nQuantitative and/or qualitative information is/are used well to support\njudgements. A full awareness of the validity and significance of\ncompeting arguments/factors, leading to balanced comparisons,\njudgements and an effective conclusion that proposes a solution\nand/or recommendations.", "kw": ["pestle", "legal", "patent", "intellectual property", "political", "technological"], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "PESTLE analyses political, economic, social, technological, legal and environmental influences on a business; legal factors include laws protecting intellectual property. [K]", "Key term"], ["Topic 1: legal factors, P 1", "Legal action protects intellectual property. [K] Dyson's legal action aims to block sales of SharkNinja's products in the UK. [A] Enforcing its rights lets Dyson safeguard its innovative products and maintain its competitive edge and market share. [An] However, legal disputes can be costly and time consuming, diverting resources and management focus away from core activities. [Ev]", "(4)"], ["Topic 1: legal factors, P 2", "Legal factors have a global scope. [K] Dyson and SharkNinja are in disputes in the UK, US, Germany and France, and Dyson is pursuing a claim of over £10m. [A] Legal outcomes in many countries affect its global success, and protecting innovation can enhance its brand reputation, consumer trust and loyalty. [An] However, the opportunity cost of legal action could outweigh the benefits of protecting its intellectual property. [Ev]", "(4)"], ["Topic 2: other PESTLE factors, P 1", "Technological factors drive success. [K] Dyson develops cutting-edge vacuum cleaners and hair stylers. [A] Its success depends heavily on its ability to innovate, which is arguably more critical than legal issues. [An] However, innovation is only valuable if it is protected, which shows legal factors have been integral to Dyson's past and future success. [Ev]", "(4)"], ["Topic 2: other PESTLE factors, P 2", "Economic and social factors affect demand. [K] Economic downturns, changes in consumer spending, exchange rates and changing lifestyles affect demand for Dyson products. [A] These may have a more immediate effect on Dyson's financial performance than legal factors. [An] However, political stability and environmental regulations also matter, so no single factor decides success on its own. [Ev]", "(4)"], ["Conclusion", "Overall, Dyson's success will be influenced by a wide range of external factors: legal factors are important for protecting innovation, but technological and economic factors may have a more immediate impact. Dyson should keep protecting its patents, but focus most of its resources on research and development so it stays ahead of rivals such as SharkNinja. [Ev]", "(3)"]]}, "type": "lev", "pts": [{"t": "Legal factors are part of the PESTLE framework for looking at external influences on a business", "s": "know"}, {"t": "Success in legal battles ensures that Dyson can safeguard its innovative products which are key to its success in the market", "s": "for"}, {"t": "Dyson's legal action aimed at blocking the sales of SharkNinja's products in the UK shows the importance of legal factors in managing competition", "s": "for"}, {"t": "By enforcing its intellectual property rights Dyson can maintain its competitive edge and market share", "s": "for"}, {"t": "The fact that Dyson and SharkNinja are involved in legal disputes not only in the UK but also in the US, Germany and France shows the global scope of legal factors", "s": "for"}, {"t": "For a company like Dyson which operates internationally, the legal framework and outcomes in various countries can significantly impact its global success", "s": "for"}, {"t": "Dyson is pursuing a claim valued at over £10m indicating that Dyson is willing to invest substantial financial resources to protect its interests", "s": "for"}, {"t": "Legal disputes can affect how consumers perceive a company and Dyson's commitment to protecting its innovations through legal means can enhance its brand reputation resulting in consumer trust and loyalty", "s": "for"}, {"t": "This historical context suggests that legal factors have been an ongoing factor in Dyson's business strategy and are integral to the company's past and future success in the highly competitive consumer products industry", "s": "for"}, {"t": "However, engaging in legal disputes can be costly and time- consuming, potentially diverting resources and management focus away from core business activities", "s": "against"}, {"t": "The opportunity cost of legal actions could outweigh the potential benefits of protecting intellectual property for Dyson 12", "s": "against"}, {"t": "Political stability and policies related to trade, taxation and business regulation can significantly affect Dyson's global operations and supply chain more than legal factors", "s": "against"}, {"t": "Economic conditions and market demand may have a more immediate and direct impact on Dyson's success", "s": "against"}, {"t": "Economic downturns, changes in consumer spending or fluctuations in currency exchange rates can have a more immediate effect on Dyson's financial performance and therefore success", "s": "against"}, {"t": "Social trends and changes in consumer preferences and lifestyle can drive or inhibit demand for Dyson's products so responding to these social factors might be as important, if not more so, than legal factors in the consumer goods market", "s": "against"}, {"t": "Dyson's success is heavily dependent on its ability to innovate technologically therefore staying at the forefront of technological advancements such as developing cutting-edge vacuum cleaners or hair stylers, is arguably more critical than legal issues", "s": "against"}, {"t": "Dyson's success may be more influenced by its ability to create environmentally friendly products and adapt to changing environmental regulations than by legal factors", "s": "against"}, {"t": "Overall, Dyson’s success will be influenced by a wide range of external influences and all will contribute to its success in the future 13", "s": "judge"}], "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "set": "past", "sub": ["pe"], "u": "u3"}, {"case": "unilever", "topic": 1, "sub": ["co"], "marks": 4, "type": "pt", "read": "A", "stem": "Explain one benefit to Unilever of setting corporate objectives.", "K": [["focus", "direction", "target", "measure", "benchmark", "motivat", "coordinat"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["objective"], "n": 101, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "Unilever's Growth Action Plan", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day. In 2023 its turnover was €59.6bn.", "In 2024 Unilever launched a Growth Action Plan. It will focus on its 30 biggest brands, which it calls Power Brands and which account for about 75% of turnover. Its objectives are to grow sales by 3% to 5% a year and to steadily improve its operating profit margin.", "As part of the plan, Unilever announced it would separate its ice cream business, which includes Magnum and Ben & Jerry's, from the rest of the group."]}, {"id": "B", "t": "Figure 1: Selected Unilever products in Country Y, 2024", "p": ["Product | Market share | Market growth", "Dove soap | 28% | 2%", "Knorr stock cubes | 35% | 1%", "Dove Men+Care | 6% | 12%", "Plant-based meat (new brand) | 2% | 15%", "Low-fat spread | 4% | -3%"]}, {"id": "C", "t": "Dove: real beauty, real growth", "p": ["Dove has used its Real Beauty campaign since 2004 to show real women in its advertising rather than models. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Dove's sales grew by 9% in 2023. Unilever invests around 14% of Dove's sales in marketing each year. Cheaper own-label products have increased their share in many countries as household budgets have been squeezed."]}, {"id": "D", "t": "India: Unilever's next growth market", "p": ["Unilever's Indian business, Hindustan Unilever, sells products in around 9 out of 10 Indian households. India's economy grew by more than 7% in 2023, and many consumers are buying branded and premium products for the first time.", "Unilever is considering two growth options: launching new premium products in India, or entering new countries in East Africa, where it has few sales and limited distribution."]}], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "Corporate objectives give a business focus and a target to measure performance against. [K]", "(1)"], ["Application", "Unilever aims to grow sales by 3% to 5% a year. [A]", "(1)"], ["Application", "It is focusing on its 30 Power Brands, which account for about 75% of turnover. [A]", "(1)"], ["Analysis", "Managers across the whole business can work towards the same targets, so resources go to the brands most likely to grow. [An]", "(1)"]]}, "ms": "Knowledge 1, Application 2, Analysis 1\nKnowledge: Corporate objectives give a business focus and a target to measure performance against. (1)\nApplication: Unilever aims to grow sales by 3% to 5% a year. (1)\nApplication: It is focusing on its 30 Power Brands, which account for about 75% of turnover. (1)\nAnalysis: Managers across the whole business can work towards the same targets, so resources go to the brands most likely to grow. (1)", "u": "u3"}, {"case": "unilever", "topic": 2, "sub": ["pf"], "marks": 8, "type": "lev", "read": "B", "stem": "Using the Boston Matrix and the data in Figure 1, discuss how Unilever could manage its product portfolio in Country Y.", "kw": ["boston", "cash cow", "star", "question mark", "problem child", "dog", "portfolio", "market growth", "ma s few sales and limited distribution."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "The Boston Matrix classifies products by market share and market growth into stars, cash cows, question marks and dogs. [K]", "Key term"], ["Point 1", "Cash cows generate cash with little investment. [K] Dove soap has a 28% share and 2% growth, and Knorr has a 35% share and 1% growth. [A] Cash from these products can fund question marks such as plant-based meat, with 15% market growth, to help them become stars. [An] However, investing in question marks is risky because plant-based meat has only a 2% share and may never become a star. [Ev]", "(4)"], ["Point 2", "Dogs may be withdrawn to free up resources. [K] Low-fat spread has a 4% share in a market shrinking by 3%. [A] Selling or withdrawing it allows Unilever to move money and management time to products with higher growth, such as Dove Men+Care at 12% growth. [An] However, the Boston Matrix ignores profit, so a dog may still be profitable, and the data is only for Country Y. [Ev]", "(4)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "pts": [{"s": "know", "t": "The Boston Matrix classifies products by market share and market growth into stars, cash cows, question marks and dogs."}, {"s": "for", "t": "Cash cows generate cash with little investment."}, {"s": "for", "t": "Dove soap has a 28% share and 2% growth, and Knorr has a 35% share and 1% growth."}, {"s": "for", "t": "Cash from these products can fund question marks such as plant-based meat, with 15% market growth, to help them become stars."}, {"s": "against", "t": "However, investing in question marks is risky because plant-based meat has only a 2% share and may never become a star."}, {"s": "for", "t": "Dogs may be withdrawn to free up resources."}, {"s": "for", "t": "Low-fat spread has a 4% share in a market shrinking by 3%."}, {"s": "for", "t": "Selling or withdrawing it allows Unilever to move money and management time to products with higher growth, such as Dove Men+Care at 12% growth."}, {"s": "against", "t": "However, the Boston Matrix ignores profit, so a dog may still be profitable, and the data is only for Country Y."}], "ms": "Indicative content\n• The Boston Matrix classifies products by market share and market growth into stars, cash cows, question marks and dogs.\n• Cash cows generate cash with little investment.\n• Dove soap has a 28% share and 2% growth, and Knorr has a 35% share and 1% growth.\n• Cash from these products can fund question marks such as plant-based meat, with 15% market growth, to help them become stars.\n• However, investing in question marks is risky because plant-based meat has only a 2% share and may never become a star.\n• Dogs may be withdrawn to free up resources.\n• Low-fat spread has a 4% share in a market shrinking by 3%.\n• Selling or withdrawing it allows Unilever to move money and management time to products with higher growth, such as Dove Men+Care at 12% growth.\n• However, the Boston Matrix ignores profit, so a dog may still be profitable, and the data is only for Country Y.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "u": "u3"}, {"case": "unilever", "topic": 2, "sub": ["ps"], "marks": 12, "type": "lev", "read": "C", "stem": "Using Porter's Strategic Matrix, assess whether differentiation is the best way for Dove to compete.", "kw": ["porter", "differentiation", "cost leadership", "focus", "strategic matrix", "generic"], "n": 103, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "Unilever's Growth Action Plan", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day. In 2023 its turnover was €59.6bn.", "In 2024 Unilever launched a Growth Action Plan. It will focus on its 30 biggest brands, which it calls Power Brands and which account for about 75% of turnover. Its objectives are to grow sales by 3% to 5% a year and to steadily improve its operating profit margin.", "As part of the plan, Unilever announced it would separate its ice cream business, which includes Magnum and Ben & Jerry's, from the rest of the group."]}, {"id": "B", "t": "Figure 1: Selected Unilever products in Country Y, 2024", "p": ["Product | Market share | Market growth", "Dove soap | 28% | 2%", "Knorr stock cubes | 35% | 1%", "Dove Men+Care | 6% | 12%", "Plant-based meat (new brand) | 2% | 15%", "Low-fat spread | 4% | -3%"]}, {"id": "C", "t": "Dove: real beauty, real growth", "p": ["Dove has used its Real Beauty campaign since 2004 to show real women in its advertising rather than models. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Dove's sales grew by 9% in 2023. Unilever invests around 14% of Dove's sales in marketing each year. Cheaper own-label products have increased their share in many countries as household budgets have been squeezed."]}, {"id": "D", "t": "India: Unilever's next growth market", "p": ["Unilever's Indian business, Hindustan Unilever, sells products in around 9 out of 10 Indian households. India's economy grew by more than 7% in 2023, and many consumers are buying branded and premium products for the first time.", "Unilever is considering two growth options: launching new premium products in India, or entering new countries in East Africa, where it has few sales and limited distribution."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market. [K]", "Key term"], ["Point 1", "Differentiation allows a business to charge higher prices. [K] Dove's Real Beauty campaign since 2004 gives it a clear identity, and Dove sells at higher prices than own-label products. [A] Higher prices increase profit margins, and Dove sales grew by 9% in 2023. [An] However, cheaper own-label products have increased their share as household budgets have been squeezed. [Ev]", "(4)"], ["Point 2", "A strong brand builds customer loyalty. [K] Unilever invests around 14% of Dove's sales in marketing each year. [A] Loyal customers are less price sensitive, so Dove can protect its market share. [An] However, this marketing spending is a high cost, and a cost leadership approach might reach more price-sensitive customers. [Ev]", "(4)"], ["Conclusion", "Overall, differentiation is the best strategy for Dove because its 9% sales growth shows customers value the brand, but it depends on whether customers keep paying higher prices when incomes are squeezed. [Ev]", "(2)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "pts": [{"s": "know", "t": "Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market."}, {"s": "for", "t": "Differentiation allows a business to charge higher prices."}, {"s": "for", "t": "Dove's Real Beauty campaign since 2004 gives it a clear identity, and Dove sells at higher prices than own-label products."}, {"s": "for", "t": "Higher prices increase profit margins, and Dove sales grew by 9% in 2023."}, {"s": "against", "t": "However, cheaper own-label products have increased their share as household budgets have been squeezed."}, {"s": "for", "t": "A strong brand builds customer loyalty."}, {"s": "for", "t": "Unilever invests around 14% of Dove's sales in marketing each year."}, {"s": "for", "t": "Loyal customers are less price sensitive, so Dove can protect its market share."}, {"s": "against", "t": "However, this marketing spending is a high cost, and a cost leadership approach might reach more price-sensitive customers."}, {"s": "judge", "t": "Overall, differentiation is the best strategy for Dove because its 9% sales growth shows customers value the brand, but it depends on whether customers keep paying higher prices when incomes are squeezed."}], "ms": "Indicative content\n• Porter's Strategic Matrix shows competitive strategies of cost leadership, differentiation and focus, aimed at a broad or narrow market.\n• Differentiation allows a business to charge higher prices.\n• Dove's Real Beauty campaign since 2004 gives it a clear identity, and Dove sells at higher prices than own-label products.\n• Higher prices increase profit margins, and Dove sales grew by 9% in 2023.\n• However, cheaper own-label products have increase
