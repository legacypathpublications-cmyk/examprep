d their share as household budgets have been squeezed.\n• A strong brand builds customer loyalty.\n• Unilever invests around 14% of Dove's sales in marketing each year.\n• Loyal customers are less price sensitive, so Dove can protect its market share.\n• However, this marketing spending is a high cost, and a cost leadership approach might reach more price-sensitive customers.\n• Overall, differentiation is the best strategy for Dove because its 9% sales growth shows customers value the brand, but it depends on whether customers keep paying higher prices when incomes are squeezed.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "u": "u3"}, {"case": "unilever", "topic": 2, "sub": ["an"], "marks": 20, "type": "lev", "read": "A and D", "stem": "Using Ansoff's Matrix, evaluate whether Unilever should grow by launching new premium products in India or by entering new countries in East Africa.", "kw": ["ansoff", "product development", "market development", "market penetration", "diversification", "risk"], "n": 104, "set": "style", "paper": "Exam style", "qn": "Unilever", "biz": "Unilever", "ext": [{"id": "A", "t": "Unilever's Growth Action Plan", "p": ["Unilever is a British consumer goods business. Its brands include Dove, Hellmann's, Knorr, Magnum and Ben & Jerry's, and it says around 3.4 billion people use its products every day. In 2023 its turnover was €59.6bn.", "In 2024 Unilever launched a Growth Action Plan. It will focus on its 30 biggest brands, which it calls Power Brands and which account for about 75% of turnover. Its objectives are to grow sales by 3% to 5% a year and to steadily improve its operating profit margin.", "As part of the plan, Unilever announced it would separate its ice cream business, which includes Magnum and Ben & Jerry's, from the rest of the group."]}, {"id": "B", "t": "Figure 1: Selected Unilever products in Country Y, 2024", "p": ["Product | Market share | Market growth", "Dove soap | 28% | 2%", "Knorr stock cubes | 35% | 1%", "Dove Men+Care | 6% | 12%", "Plant-based meat (new brand) | 2% | 15%", "Low-fat spread | 4% | -3%"]}, {"id": "C", "t": "Dove: real beauty, real growth", "p": ["Dove has used its Real Beauty campaign since 2004 to show real women in its advertising rather than models. Dove products sell at higher prices than many supermarket own-label soaps and shampoos.", "Dove's sales grew by 9% in 2023. Unilever invests around 14% of Dove's sales in marketing each year. Cheaper own-label products have increased their share in many countries as household budgets have been squeezed."]}, {"id": "D", "t": "India: Unilever's next growth market", "p": ["Unilever's Indian business, Hindustan Unilever, sells products in around 9 out of 10 Indian households. India's economy grew by more than 7% in 2023, and many consumers are buying branded and premium products for the first time.", "Unilever is considering two growth options: launching new premium products in India, or entering new countries in East Africa, where it has few sales and limited distribution."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk. [K]", "Key term"], ["Topic 1: product development in India, P 1", "Product development means new products for an existing market, which is less risky than diversification. [K] Hindustan Unilever sells products in around 9 out of 10 Indian households. [A] Unilever already has distribution, brand awareness and market knowledge, so new premium products have a good chance of success. [An] However, developing new products needs investment in research and development, and they may fail. [Ev]", "(4)"], ["Topic 1: product development in India, P 2", "Rising incomes increase demand for premium products. [K] India's economy grew by more than 7% in 2023, and many consumers are buying premium products for the first time. [A] Premium products earn higher margins, supporting the objective to improve the operating profit margin. [An] However, many Indian consumers are still price sensitive, so demand for premium products may be limited. [Ev]", "(4)"], ["Topic 2: market development in East Africa, P 1", "Market development means existing products in new markets. [K] Unilever has few sales and limited distribution in East Africa. [A] There is a large long-term opportunity, so existing Power Brands could add new revenue. [An] However, it is riskier because Unilever lacks knowledge of local tastes and would need to build distribution. [Ev]", "(4)"], ["Topic 2: market development in East Africa, P 2", "Market development uses existing products, so development costs are low. [K] The 30 Power Brands already account for about 75% of turnover. [A] Unilever can sell proven brands in new countries, spreading risk across more markets. [An] However, political and economic instability in some countries may reduce returns. [Ev]", "(4)"], ["Conclusion", "Overall, launching premium products in India is the better option because Unilever already reaches 9 out of 10 households and incomes are rising fast; it depends on the cost of developing products. Unilever should prioritise premium versions of its Power Brands in India and enter East Africa gradually. [Ev]", "(3)"]]}, "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "pts": [{"s": "know", "t": "Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk."}, {"s": "for", "t": "Product development means new products for an existing market, which is less risky than diversification."}, {"s": "for", "t": "Hindustan Unilever sells products in around 9 out of 10 Indian households."}, {"s": "for", "t": "Unilever already has distribution, brand awareness and market knowledge, so new premium products have a good chance of success."}, {"s": "against", "t": "However, developing new products needs investment in research and development, and they may fail."}, {"s": "for", "t": "Rising incomes increase demand for premium products."}, {"s": "for", "t": "India's economy grew by more than 7% in 2023, and many consumers are buying premium products for the first time."}, {"s": "for", "t": "Premium products earn higher margins, supporting the objective to improve the operating profit margin."}, {"s": "against", "t": "However, many Indian consumers are still price sensitive, so demand for premium products may be limited."}, {"s": "for", "t": "Market development means existing products in new markets."}, {"s": "for", "t": "Unilever has few sales and limited distribution in East Africa."}, {"s": "for", "t": "There is a large long-term opportunity, so existing Power Brands could add new revenue."}, {"s": "against", "t": "However, it is riskier because Unilever lacks knowledge of local tastes and would need to build distribution."}, {"s": "for", "t": "Market development uses existing products, so development costs are low."}, {"s": "for", "t": "The 30 Power Brands already account for about 75% of turnover."}, {"s": "for", "t": "Unilever can sell proven brands in new countries, spreading risk across more markets."}, {"s": "against", "t": "However, political and economic instability in some countries may reduce returns."}, {"s": "judge", "t": "Overall, launching premium products in India is the better option because Unilever already reaches 9 out of 10 households and incomes are rising fast; it depends on the cost of developing products. Unilever should prioritise premium versions of its Power Brands in India and enter East Africa gradually."}], "ms": "Indicative content\n• Ansoff's Matrix shows four growth strategies, market penetration, market development, product development and diversification, and their relative risk.\n• Product development means new products for an existing market, which is less risky than diversification.\n• Hindustan Unilever sells products in around 9 out of 10 Indian households.\n• Unilever already has distribution, brand awareness and market knowledge, so new premium products have a good chance of success.\n• However, developing new products needs investment in research and development, and they may fail.\n• Rising incomes increase demand for premium products.\n• India's economy grew by more than 7% in 2023, and many consumers are buying premium products for the first time.\n• Premium products earn higher margins, supporting the objective to improve the operating profit margin.\n• However, many Indian consumers are still price sensitive, so demand for premium products may be limited.\n• Market development means existing products in new markets.\n• Unilever has few sales and limited distribution in East Africa.\n• There is a large long-term opportunity, so existing Power Brands could add new revenue.\n• However, it is riskier because Unilever lacks knowledge of local tastes and would need to build distribution.\n• Market development uses existing products, so development costs are low.\n• The 30 Power Brands already account for about 75% of turnover.\n• Unilever can sell proven brands in new countries, spreading risk across more markets.\n• However, political and economic instability in some countries may reduce returns.\n• Overall, launching premium products in India is the better option because Unilever already reaches 9 out of 10 households and incomes are rising fast; it depends on the cost of developing products. Unilever should prioritise premium versions of its Power Brands in India and enter East Africa gradually.\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "u": "u3"}, {"case": "airbus", "topic": 2, "sub": ["sd"], "marks": 4, "type": "pt", "read": "E", "stem": "Explain one difference between a strategic decision and a tactical decision for Airbus.", "K": [["long-term", "long term", "short-term", "short term", "senior", "whole business", "day-to-day", "large investment"]], "Kmax": 1, "Amax": 2, "Anmax": 1, "kw": ["strategic", "tactical"], "n": 105, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "E", "t": "Airbus races to meet demand", "p": ["Airbus is a European aircraft manufacturer with its headquarters in Toulouse, France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It delivered 735 aircraft in 2023 and set a target of around 800 for 2024, but shortages of engines and parts from suppliers slowed production.", "In 2023 Airbus announced a second A320 family assembly line in Mobile, Alabama, USA. The project requires an investment of around $1bn in new buildings and equipment and around 1,000 extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "F", "t": "Figure 2: Airbus key data", "p": ["Item | 2022 | 2023", "Aircraft delivered | 661 | 735", "Revenue (€bn) | 58.8 | 65.4", "Employees | 134,000 | 147,000", "Undelivered orders | 7,239 | 8,598"]}, {"id": "G", "t": "Flying into headwinds", "p": ["Airlines want new fuel-efficient aircraft to cut fuel costs and carbon emissions, and air travel in Asia is growing quickly. Airbus already assembles A320 aircraft in Tianjin, China.", "Airbus faces competition from Boeing and from COMAC, a new Chinese manufacturer. Trade disputes between the EU, the USA and China could lead to tariffs on aircraft and parts."]}], "sup": {"grid": "Point marked: Knowledge 1, Application 2, Analysis 1.", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "Strategic decisions are long-term decisions made by senior managers, while tactical decisions are short-term. [K]", "(1)"], ["Application", "Building a second assembly line in Mobile, Alabama needs an investment of around $1bn. [A]", "(1)"], ["Application", "Changing delivery schedules or the prices offered to airlines are tactical decisions. [A]", "(1)"], ["Analysis", "The assembly line commits large resources for many years and is hard to reverse, so it carries far more risk than a tactical decision. [An]", "(1)"]]}, "ms": "Knowledge 1, Application 2, Analysis 1\nKnowledge: Strategic decisions are long-term decisions made by senior managers, while tactical decisions are short-term. (1)\nApplication: Building a second assembly line in Mobile, Alabama needs an investment of around $1bn. (1)\nApplication: Changing delivery schedules or the prices offered to airlines are tactical decisions. (1)\nAnalysis: The assembly line commits large resources for many years and is hard to reverse, so it carries far more risk than a tactical decision. (1)", "u": "u3"}, {"case": "airbus", "topic": 2, "sub": ["sd"], "marks": 8, "type": "lev", "read": "E and F", "stem": "Discuss the likely impact on Airbus's resources of opening a second assembly line in Mobile, Alabama.", "kw": ["resource", "human", "physical", "financial", "employee", "equipment", "finance"], "n": 106, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "E", "t": "Airbus races to meet demand", "p": ["Airbus is a European aircraft manufacturer with its headquarters in Toulouse, France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It delivered 735 aircraft in 2023 and set a target of around 800 for 2024, but shortages of engines and parts from suppliers slowed production.", "In 2023 Airbus announced a second A320 family assembly line in Mobile, Alabama, USA. The project requires an investment of around $1bn in new buildings and equipment and around 1,000 extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "F", "t": "Figure 2: Airbus key data", "p": ["Item | 2022 | 2023", "Aircraft delivered | 661 | 735", "Revenue (€bn) | 58.8 | 65.4", "Employees | 134,000 | 147,000", "Undelivered orders | 7,239 | 8,598"]}, {"id": "G", "t": "Flying into headwinds", "p": ["Airlines want new fuel-efficient aircraft to cut fuel costs and carbon emissions, and air travel in Asia is growing quickly. Airbus already assembles A320 aircraft in Tianjin, China.", "Airbus faces competition from Boeing and from COMAC, a new Chinese manufacturer. Trade disputes between the EU, the USA and China could lead to tariffs on aircraft and parts."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees). [K]", "Key term"], ["Point 1", "A new assembly line uses financial and physical resources. [K] The project needs around $1bn of investment in new buildings and equipment. [A] This reduces cash available for other projects, but the extra capacity helps Airbus deliver its 8,598 undelivered orders faster. [An] However, Airbus revenue rose to €65.4bn in 2023, so it can afford the investment. [Ev]", "(4)"], ["Point 2", "A new line needs more human resources. [K] Around 1,000 extra skilled employees are needed, on top of a workforce that grew from 134,000 to 147,000. [A] Recruiting and training skilled workers increases labour costs and takes time. [An] However, supplier shortages of engines and parts mean the new line may not be fully used at first. [Ev]", "(4)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "pts": [{"s": "know", "t": "Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees)."}, {"s": "for", "t": "A new assembly line uses financial and physical resources."}, {"s": "for", "t": "The project needs around $1bn of investment in new buildings and equipment."}, {"s": "for", "t": "This reduces cash available for other projects, but the extra capacity helps Airbus deliver its 8,598 undelivered orders faster."}, {"s": "against", "t": "However, Airbus revenue rose to €65.4bn in 2023, so it can afford the investment."}, {"s": "for", "t": "A new line needs more human resources."}, {"s": "for", "t": "Around 1,000 extra skilled employees are needed, on top of a workforce that grew from 134,000 to 147,000."}, {"s": "for", "t": "Recruiting and training skilled workers increases labour costs and takes time."}, {"s": "against", "t": "However, supplier shortages of engines and parts mean the new line may not be fully used at first."}], "ms": "Indicative content\n• Resources include financial resources (money), physical resources (buildings and equipment) and human resources (employees).\n• A new assembly line uses financial and physical resources.\n• The project needs around $1bn of investment in new buildings and equipment.\n• This reduces cash available for other projects, but the extra capacity helps Airbus deliver its 8,598 undelivered orders faster.\n• However, Airbus revenue rose to €65.4bn in 2023, so it can afford the investment.\n• A new line needs more human resources.\n• Around 1,000 extra skilled employees are needed, on top of a workforce that grew from 134,000 to 147,000.\n• Recruiting and training skilled workers increases labour costs and takes time.\n• However, supplier shortages of engines and parts mean the new line may not be fully used at first.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "u": "u3"}, {"case": "airbus", "topic": 3, "sub": ["sw"], "marks": 12, "type": "lev", "read": "E, F and G", "stem": "Assess the usefulness to Airbus of SWOT analysis when deciding its future strategy.", "kw": ["swot", "strength", "weakness", "opportunit", "threat", "internal", "external"], "n": 107, "set": "style", "paper": "Exam style", "qn": "Airbus", "biz": "Airbus", "ext": [{"id": "E", "t": "Airbus races to meet demand", "p": ["Airbus is a European aircraft manufacturer with its headquarters in Toulouse, France. It competes mainly with Boeing in the market for large passenger aircraft.", "Airbus has orders for more than 8,000 aircraft that it has not yet delivered. It delivered 735 aircraft in 2023 and set a target of around 800 for 2024, but shortages of engines and parts from suppliers slowed production.", "In 2023 Airbus announced a second A320 family assembly line in Mobile, Alabama, USA. The project requires an investment of around $1bn in new buildings and equipment and around 1,000 extra skilled employees.", "Airbus also makes many short-term decisions, such as changing delivery schedules and the prices offered to individual airlines."]}, {"id": "F", "t": "Figure 2: Airbus key data", "p": ["Item | 2022 | 2023", "Aircraft delivered | 661 | 735", "Revenue (€bn) | 58.8 | 65.4", "Employees | 134,000 | 147,000", "Undelivered orders | 7,239 | 8,598"]}, {"id": "G", "t": "Flying into headwinds", "p": ["Airlines want new fuel-efficient aircraft to cut fuel costs and carbon emissions, and air travel in Asia is growing quickly. Airbus already assembles A320 aircraft in Tianjin, China.", "Airbus faces competition from Boeing and from COMAC, a new Chinese manufacturer. Trade disputes between the EU, the USA and China could lead to tariffs on aircraft and parts."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats. [K]", "Key term"], ["Point 1", "SWOT identifies internal strengths and weaknesses. [K] Airbus has 8,598 undelivered orders, a strength, but supplier shortages meant it delivered 735 aircraft in 2023, below demand. [A] This means Airbus must work closely with suppliers, so it can turn its order book into revenue and profit. [An] However, SWOT is only a snapshot, and supplier problems can change quickly. [Ev]", "(4)"], ["Point 2", "SWOT identifies external opportunities and threats. [K] Air travel in Asia is growing, but Airbus faces Boeing, COMAC and possible tariffs from trade disputes. [A] This helps Airbus decide where to invest, such as its Tianjin line in China, and plan for risks. [An] However, SWOT can be subjective and does not tell Airbus which strategy to choose, so it should be used with PESTLE and Porter's five forces. [Ev]", "(4)"], ["Conclusion", "Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools. [Ev]", "(2)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "pts": [{"s": "know", "t": "SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats."}, {"s": "for", "t": "SWOT identifies internal strengths and weaknesses."}, {"s": "for", "t": "Airbus has 8,598 undelivered orders, a strength, but supplier shortages meant it delivered 735 aircraft in 2023, below demand."}, {"s": "for", "t": "This means Airbus must work closely with suppliers, so it can turn its order book into revenue and profit."}, {"s": "against", "t": "However, SWOT is only a snapshot, and supplier problems can change quickly."}, {"s": "for", "t": "SWOT identifies external opportunities and threats."}, {"s": "for", "t": "Air travel in Asia is growing, but Airbus faces Boeing, COMAC and possible tariffs from trade disputes."}, {"s": "for", "t": "This helps Airbus decide where to invest, such as its Tianjin line in China, and plan for risks."}, {"s": "against", "t": "However, SWOT can be subjective and does not tell Airbus which strategy to choose, so it should be used with PESTLE and Porter's five forces."}, {"s": "judge", "t": "Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools."}], "ms": "Indicative content\n• SWOT analysis looks at internal strengths and weaknesses and external opportunities and threats.\n• SWOT identifies internal strengths and weaknesses.\n• Airbus has 8,598 undelivered orders, a strength, but supplier shortages meant it delivered 735 aircraft in 2023, below demand.\n• This means Airbus must work closely with suppliers, so it can turn its order book into revenue and profit.\n• However, SWOT is only a snapshot, and supplier problems can change quickly.\n• SWOT identifies external opportunities and threats.\n• Air travel in Asia is growing, but Airbus faces Boeing, COMAC and possible tariffs from trade disputes.\n• This helps Airbus decide where to invest, such as its Tianjin line in China, and plan for risks.\n• However, SWOT can be subjective and does not tell Airbus which strategy to choose, so it should be used with PESTLE and Porter's five forces.\n• Overall, SWOT is useful as a starting point for Airbus, but its value depends on being updated regularly and used with other strategic tools.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "u": "u3"}, {"case": "lime", "topic": 4, "sub": ["ff"], "marks": 8, "type": "lev", "read": "H and J", "stem": "Using Porter's five forces, discuss the threat to Lime from the bargaining power of buyers and the threat of substitutes.", "kw": ["porter", "five forces", "buyer power", "bargaining power", "substitute", "switch"], "n": 108, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "H", "t": "Lime: the scooter business that survived", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 280 cities in nearly 30 countries.", "Customers pay a fee of around €1 to unlock a scooter plus a charge of around €0.25 per minute. They can easily compare prices with other apps and switch to a rival at any time. They can also travel by bus, train, their own bicycle or on foot.", "In 2023 Lime's revenue rose to $616m, and it reported its first full year of positive operating profit."]}, {"id": "I", "t": "Paris votes no", "p": ["In April 2023, 89% of voters in a Paris referendum chose to ban rented electric scooters. Around 15,000 scooters were removed from the city's streets in September 2023.", "Other cities have reduced the number of scooter licences, set lower speed limits or used tenders to choose only one or two operators."]}, {"id": "J", "t": "A shake-up for scooter firms", "p": ["In 2024 two European rivals, Tier and Dott, merged to create a larger competitor. Another rival, Bird, filed for bankruptcy in the USA in December 2023.", "Interest rates in Europe rose from 0% in 2022 to 4% in 2023, making it more expensive for scooter businesses to borrow to buy new vehicles. Consumers are increasingly interested in green transport, and new swappable batteries allow scooters to be charged without being collected."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need. [K]", "Key term"], ["Point 1", "Buyer power is high when customers can switch easily. [K] Customers can compare prices on different apps and switch to a rival at any time, and Lime charges around €1 to unlock plus €0.25 per minute. [A] Lime cannot easily raise prices without losing customers, which limits its profit margin. [An] However, Bird's bankruptcy in December 2023 means customers have fewer apps to switch to, reducing buyer power. [Ev]", "(4)"], ["Point 2", "The threat of substitutes is high when there are many alternatives. [K] Customers can travel by bus, train, their own bicycle or on foot. [A] Lime must keep its service convenient and competitively priced or customers will use other transport. [An] However, Lime operates in more than 280 cities and made its first full year of positive operating profit in 2023, showing demand remains strong. [Ev]", "(4)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]], "pts": [{"s": "know", "t": "Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need."}, {"s": "for", "t": "Buyer power is high when customers can switch easily."}, {"s": "for", "t": "Customers can compare prices on different apps and switch to a rival at any time, and Lime charges around €1 to unlock plus €0.25 per minute."}, {"s": "for", "t": "Lime cannot easily raise prices without losing customers, which limits its profit margin."}, {"s": "against", "t": "However, Bird's bankruptcy in December 2023 means customers have fewer apps to switch to, reducing buyer power."}, {"s": "for", "t": "The threat of substitutes is high when there are many alternatives."}, {"s": "for", "t": "Customers can travel by bus, train, their own bicycle or on foot."}, {"s": "for", "t": "Lime must keep its service convenient and competitively priced or customers will use other transport."}, {"s": "against", "t": "However, Lime operates in more than 280 cities and made its first full year of positive operating profit in 2023, showing demand remains strong."}], "ms": "Indicative content\n• Porter's five forces analyses the competitiveness of a market; buyer power is the ability of customers to influence price, and substitutes are other ways of meeting the same need.\n• Buyer power is high when customers can switch easily.\n• Customers can compare prices on different apps and switch to a rival at any time, and Lime charges around €1 to unlock plus €0.25 per minute.\n• Lime cannot easily raise prices without losing customers, which limits its profit margin.\n• However, Bird's bankruptcy in December 2023 means customers have fewer apps to switch to, reducing buyer power.\n• The threat of substitutes is high when there are many alternatives.\n• Customers can travel by bus, train, their own bicycle or on foot.\n• Lime must keep its service convenient and competitively priced or customers will use other transport.\n• However, Lime operates in more than 280 cities and made its first full year of positive operating profit in 2023, showing demand remains strong.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors.", "u": "u3"}, {"case": "lime", "topic": 4, "sub": ["ce"], "marks": 12, "type": "lev", "read": "I and J", "stem": "Assess how changes in the competitive environment may affect Lime.", "kw": ["competitive environment", "competition", "rival", "merge", "market share", "licence"], "n": 109, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "H", "t": "Lime: the scooter business that survived", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 280 cities in nearly 30 countries.", "Customers pay a fee of around €1 to unlock a scooter plus a charge of around €0.25 per minute. They can easily compare prices with other apps and switch to a rival at any time. They can also travel by bus, train, their own bicycle or on foot.", "In 2023 Lime's revenue rose to $616m, and it reported its first full year of positive operating profit."]}, {"id": "I", "t": "Paris votes no", "p": ["In April 2023, 89% of voters in a Paris referendum chose to ban rented electric scooters. Around 15,000 scooters were removed from the city's streets in September 2023.", "Other cities have reduced the number of scooter licences, set lower speed limits or used tenders to choose only one or two operators."]}, {"id": "J", "t": "A shake-up for scooter firms", "p": ["In 2024 two European rivals, Tier and Dott, merged to create a larger competitor. Another rival, Bird, filed for bankruptcy in the USA in December 2023.", "Interest rates in Europe rose from 0% in 2022 to 4% in 2023, making it more expensive for scooter businesses to borrow to buy new vehicles. Consumers are increasingly interested in green transport, and new swappable batteries allow scooters to be charged without being collected."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However). EV: overall conclusion (2).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However).", "EV: overall conclusion (2)."], "parts": [["Definition", "The competitive environment describes the number and strength of rivals and how this changes over time. [K]", "Key term"], ["Point 1", "Mergers create larger, stronger rivals. [K] In 2024 Tier and Dott merged to create a larger competitor. [A] The merged business can compete harder for city licences, so Lime could lose access to some cities. [An] However, Bird's bankruptcy in December 2023 means fewer rivals, so Lime may gain market share. [Ev]", "(4)"], ["Point 2", "Cities using tenders reduce the number of operators. [K] Some cities choose only one or two operators, and Paris removed around 15,000 scooters after 89% of voters chose a ban. [A] Losing a tender or a ban removes a whole city market and its revenue. [An] However, if Lime wins tenders it faces little competition in those cities and its revenue of $616m shows it is strong enough to compete. [Ev]", "(4)"], ["Conclusion", "Overall, the changes are both a threat and an opportunity; it depends on whether Lime can win city tenders against the merged Tier and Dott. [Ev]", "(2)"]]}, "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 4, "Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented."], [3, 5, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments."], [4, 9, 12, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement."]], "pts": [{"s": "know", "t": "The competitive environment describes the number and strength of rivals and how this changes over time."}, {"s": "for", "t": "Mergers create larger, stronger rivals."}, {"s": "for", "t": "In 2024 Tier and Dott merged to create a larger competitor."}, {"s": "for", "t": "The merged business can compete harder for city licences, so Lime could lose access to some cities."}, {"s": "against", "t": "However, Bird's bankruptcy in December 2023 means fewer rivals, so Lime may gain market share."}, {"s": "for", "t": "Cities using tenders reduce the number of operators."}, {"s": "for", "t": "Some cities choose only one or two operators, and Paris removed around 15,000 scooters after 89% of voters chose a ban."}, {"s": "for", "t": "Losing a tender or a ban removes a whole city market and its revenue."}, {"s": "against", "t": "However, if Lime wins tenders it faces little competition in those cities and its revenue of $616m shows it is strong enough to compete."}, {"s": "judge", "t": "Overall, the changes are both a threat and an opportunity; it depends on whether Lime can win city tenders against the merged Tier and Dott."}], "ms": "Indicative content\n• The competitive environment describes the number and strength of rivals and how this changes over time.\n• Mergers create larger, stronger rivals.\n• In 2024 Tier and Dott merged to create a larger competitor.\n• The merged business can compete harder for city licences, so Lime could lose access to some cities.\n• However, Bird's bankruptcy in December 2023 means fewer rivals, so Lime may gain market share.\n• Cities using tenders reduce the number of operators.\n• Some cities choose only one or two operators, and Paris removed around 15,000 scooters after 89% of voters chose a ban.\n• Losing a tender or a ban removes a whole city market and its revenue.\n• However, if Lime wins tenders it faces little competition in those cities and its revenue of $616m shows it is strong enough to compete.\n• Overall, the changes are both a threat and an opportunity; it depends on whether Lime can win city tenders against the merged Tier and Dott.\n\nLevel Mark Descriptor\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented.\nLevel 2 3–4 Elements of knowledge and understanding, which are applied to the business example. Chains of reasoning are presented, but may be assertions or incomplete. A generic or superficial assessment is presented.\nLevel 3 5–8 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Analytical perspectives are presented, with developed chains of reasoning, showing cause(s) and/or effect(s). An attempt at an assessment is presented, using quantitative and/or qualitative information though unlikely to show the significance of competing arguments.\nLevel 4 9–12 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. A coherent and logical chain of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, wide ranging and well contextualised, using quantitative and/or qualitative information and shows an awareness of competing arguments/factors leading to a supported judgement.", "u": "u3"}, {"case": "lime", "topic": 4, "sub": ["pe"], "marks": 20, "type": "lev", "read": "H, I and J", "stem": "Using PESTLE analysis, evaluate whether political and legal factors are the most important external influences on the success of Lime.", "kw": ["pestle", "political", "legal", "economic", "social", "technological", "environmental"], "n": 110, "set": "style", "paper": "Exam style", "qn": "Lime", "biz": "Lime", "ext": [{"id": "H", "t": "Lime: the scooter business that survived", "p": ["Lime is an American business that rents electric scooters and electric bikes through a mobile app. It started in 2017 and now operates in more than 280 cities in nearly 30 countries.", "Customers pay a fee of around €1 to unlock a scooter plus a charge of around €0.25 per minute. They can easily compare prices with other apps and switch to a rival at any time. They can also travel by bus, train, their own bicycle or on foot.", "In 2023 Lime's revenue rose to $616m, and it reported its first full year of positive operating profit."]}, {"id": "I", "t": "Paris votes no", "p": ["In April 2023, 89% of voters in a Paris referendum chose to ban rented electric scooters. Around 15,000 scooters were removed from the city's streets in September 2023.", "Other cities have reduced the number of scooter licences, set lower speed limits or used tenders to choose only one or two operators."]}, {"id": "J", "t": "A shake-up for scooter firms", "p": ["In 2024 two European rivals, Tier and Dott, merged to create a larger competitor. Another rival, Bird, filed for bankruptcy in the USA in December 2023.", "Interest rates in Europe rose from 0% in 2022 to 4% in 2023, making it more expensive for scooter businesses to borrow to buy new vehicles. Consumers are increasingly interested in green transport, and new swappable batteries allow scooters to be charged without being collected."]}], "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definitions of key terms. Topic area 1: two K, A, A, EV blocks. Topic area 2: two K, A, A, EV blocks. EV: overall conclusion (3), comparing both topics.", "plan": ["Definitions of key terms.", "Topic area 1: two K, A, A, EV blocks.", "Topic area 2: two K, A, A, EV blocks.", "EV: overall conclusion (3), comparing both topics."], "parts": [["Definition", "PESTLE analyses political, economic, social, technological, legal and environmental factors that affect a business. [K]", "Key term"], ["Topic 1: political and legal factors, P 1", "Political decisions can close whole markets. [K] In April 2023, 89% of Paris voters chose to ban rented scooters, and around 15,000 were removed. [A] Lime lost a major city market overnight, reducing its revenue. [An] However, Lime operates in more than 280 cities, so losing one city has a limited overall effect. [Ev]", "(4)"], ["Topic 1: political and legal factors, P 2", "Laws and licences restrict how a business operates. [K] Cities have reduced licences, set lower speed limits or chosen only one or two operators by tender. [A] Lime may be unable to operate in cities where it loses a tender, and rules raise its costs. [An] However, winning a tender can give Lime a protected position in that city. [Ev]", "(4)"], ["Topic 2: other PESTLE factors, P 1", "Economic factors affect the cost of expansion. [K] Interest rates in Europe rose from 0% in 2022 to 4% in 2023. [A] Borrowing to buy new scooters is more expensive, slowing expansion and reducing profit. [An] However, Lime made its first full year of positive operating profit in 2023, so it relies less on borrowing. [Ev]", "(4)"], ["Topic 2: other PESTLE factors, P 2", "Social and technological factors affect demand and costs. [K] Consumers are increasingly interested in green transport, and swappable batteries allow scooters to be charged without being collected. [A] Demand rises while operating costs fall, helping Lime grow its revenue, which rose to $616m in 2023. [An] However, these benefits only help in cities where Lime is allowed to operate. [Ev]", "(4)"], ["Conclusion", "Overall, political and legal factors are the most important because they decide whether Lime can operate in a city at all, but this depends on each city. Lime should work closely with city councils, invest in safety, and spread its operations across many cities to reduce the risk of bans. [Ev]", "(3)"]]}, "lv": [[1, 1, 4, "Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences."], [2, 5, 8, "Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation."], [3, 9, 14, "Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion."], [4, 15, 20, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations."]], "pts": [{"s": "know", "t": "PESTLE analyses political, economic, social, technological, legal and environmental factors that affect a business."}, {"s": "for", "t": "Political decisions can close whole markets."}, {"s": "for", "t": "In April 2023, 89% of Paris voters chose to ban rented scooters, and around 15,000 were removed."}, {"s": "for", "t": "Lime lost a major city market overnight, reducing its revenue."}, {"s": "against", "t": "However, Lime operates in more than 280 cities, so losing one city has a limited overall effect."}, {"s": "for", "t": "Laws and licences restrict how a business operates."}, {"s": "for", "t": "Cities have reduced licences, set lower speed limits or chosen only one or two operators by tender."}, {"s": "for", "t": "Lime may be unable to operate in cities where it loses a tender, and rules raise its costs."}, {"s": "against", "t": "However, winning a tender can give Lime a protected position in that city."}, {"s": "for", "t": "Economic factors affect the cost of expansion."}, {"s": "for", "t": "Interest rates in Europe rose from 0% in 2022 to 4% in 2023."}, {"s": "for", "t": "Borrowing to buy new scooters is more expensive, slowing expansion and reducing profit."}, {"s": "against", "t": "However, Lime made its first full year of positive operating profit in 2023, so it relies less on borrowing."}, {"s": "for", "t": "Social and technological factors affect demand and costs."}, {"s": "for", "t": "Consumers are increasingly interested in green transport, and swappable batteries allow scooters to be charged without being collected."}, {"s": "for", "t": "Demand rises while operating costs fall, helping Lime grow its revenue, which rose to $616m in 2023."}, {"s": "against", "t": "However, these benefits only help in cities where Lime is allowed to operate."}, {"s": "judge", "t": "Overall, political and legal factors are the most important because they decide whether Lime can operate in a city at all, but this depends on each city. Lime should work closely with city councils, invest in safety, and spread its operations across many cities to reduce the risk of bans."}], "ms": "Indicative content\n• PESTLE analyses political, economic, social, technological, legal and environmental factors that affect a business.\n• Political decisions can close whole markets.\n• In April 2023, 89% of Paris voters chose to ban rented scooters, and around 15,000 were removed.\n• Lime lost a major city market overnight, reducing its revenue.\n• However, Lime operates in more than 280 cities, so losing one city has a limited overall effect.\n• Laws and licences restrict how a business operates.\n• Cities have reduced licences, set lower speed limits or chosen only one or two operators by tender.\n• Lime may be unable to operate in cities where it loses a tender, and rules raise its costs.\n• However, winning a tender can give Lime a protected position in that city.\n• Economic factors affect the cost of expansion.\n• Interest rates in Europe rose from 0% in 2022 to 4% in 2023.\n• Borrowing to buy new scooters is more expensive, slowing expansion and reducing profit.\n• However, Lime made its first full year of positive operating profit in 2023, so it relies less on borrowing.\n• Social and technological factors affect demand and costs.\n• Consumers are increasingly interested in green transport, and swappable batteries allow scooters to be charged without being collected.\n• Demand rises while operating costs fall, helping Lime grow its revenue, which rose to $616m in 2023.\n• However, these benefits only help in cities where Lime is allowed to operate.\n• Overall, political and legal factors are the most important because they decide whether Lime can operate in a city at all, but this depends on each city. Lime should work closely with city councils, invest in safety, and spread its operations across many cities to reduce the risk of bans.\n\nLevel Mark Descriptor\nLevel 1 1–4 Isolated elements of knowledge and understanding. Weak or no relevant application of business examples. An argument may be attempted, but will be generic and fail to connect causes and/or consequences.\nLevel 2 5–8 Elements of knowledge and understanding, which are applied to the business example. Arguments and chains of reasoning are presented but connections between causes and/or consequences are incomplete. Attempts to address the question. A comparison or judgement may be attempted but it will not successfully show an awareness of the key features of business behaviour or business situation.\nLevel 3 9–14 Accurate knowledge and understanding, supported by relevant and effective use of the business behaviour/context. Uses developed chains of reasoning, so that causes and/or consequences are complete, showing an understanding of the question. Arguments are well developed. Quantitative and/or qualitative information is introduced in an attempt to support judgements, a partial awareness of the validity and/or significance of competing arguments and may lead to a conclusion.\nLevel 4 15–20 Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Uses well-developed and logical, coherent chains of reasoning, showing a range of cause and/or effect(s). Arguments are fully developed. Quantitative and/or qualitative information is/are used well to support judgements. A full awareness of the validity and significance of competing arguments/factors, leading to balanced comparisons, judgements and an effective conclusion that proposes a solution and/or recommendations.", "u": "u3"}, {"n": 201, "u": "u4", "set": "past", "topic": 1, "sub": ["g1"], "marks": 4, "biz": "Senegal", "paper": "January 2023", "qn": "1(a)", "stem": "Using Extract A, calculate to two decimal places the GDP per capita of Senegal in 2021. You are advised to show your working.", "read": "A", "ext": [{"id": "A", "t": "Senegal – Selected indicators", "p": ["• Population of Senegal in 2021 was 17.2 million", "• GDP of Senegal in 2021 was $25.5bn", "Gross Domestic Product (GDP) growth rates", "Change in GDP", "Year", "(growth rates)", "2020 1.5%", "2021 3.7%", "2022 5.5%*", "2023 10.8%*", "* estimate"]}], "ms": "Question Using Extract A, calculate to two decimal places the GDP per capita Mark\nof Senegal in 2021. (4)\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nQS2 Calculate, use and ratios, averages and fractions\nKnowledge\n1 mark for identifying any suitable formula eg:\n• GDP\nPopulation (1)\nApplication\nUp to 2 marks for selecting the correct data:\n• $25.5bn (1)\n17.2 million (1)\nAnalysis\n1 mark for calculating GDP per capita\n• = $1 482.56 (1)\nNB: If no working is shown, award marks as follows:\nIf the answer given is $1 482.56 award 4 marks.\nIf the answer given is 1 482.56 award 3 marks.\n(4)", "type": "calc", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: Construct (2): formula and correct data. Calculate (2): answer with units.", "plan": ["Construct (2): formula and correct data.", "Calculate (2): answer with units."], "parts": [["Construct", "Formula: GDP ÷ population [A] $25.5bn ÷ 17.2 million [A]", "(2)"], ["Calculate", "25,500,000,000 ÷ 17,200,000 [An] = $1,482.56 (include the $ sign) [An]", "(2)"]]}, "ans": 1482.56, "pre": "$", "unit": "", "ansText": "$1,482.56", "fhint": "GDP per capita = GDP ÷ population", "fk": ["÷", "/", "divide", "per capita", "population"], "data": ["25.5", "17.2"]}, {"n": 202, "u": "u4", "set": "past", "topic": 1, "sub": ["g5"], "marks": 4, "biz": "Senegal", "paper": "January 2023", "qn": "1(b)", "stem": "Explain one advantage for an African country, such as Senegal, of being a member of the African Continental Free Trade Area (AfCFTA).", "read": "B", "ext": [{"id": "B", "t": "Africa’s Free Trade Area", "p": ["The African Continental Free Trade Area (AfCFTA) started in 2021. All African countries have signed the agreement, apart from Eritrea. It is hoped that these 54 countries will grow together to form a single market.", "They have pledged to eliminate import tariffs on 97% of goods traded between African countries over a period of time. It is hoped that this will increase trade between African countries, which will in turn boost economic growth, bringing more prosperity and social equality to those on the continent.", "According to the World Economic Forum, African nations currently trade more internationally than with each other. Only 17% of African exports go to other African countries, whereas in Asia 59% of its exports go to other Asian countries and in Europe it is 68%.", ""]}], "ms": "Question Explain one advantage for an African country, such as Senegal, Mark\nof being a member of the African Continental Free Trade Area\n(AfCFTA). (4)\nAnswer\n1(b) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying an advantage, e.g.:\n• There will be fewer trade barriers (1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• It is hoped that 97% of all tariffs will go (1)\n• Intra-African trade only accounts for 17% of African exports\n(1)\nAnalysis\n1 mark for developing the advantage, e.g.:\n• Fewer trade barriers such as tariffs will make a country such\nas Senegal’s exports more competitive and will lead to more\neconomic growth (1)\n(4)", "type": "pt", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "There will be fewer trade barriers. [K]", "(1)"], ["Application", "It is hoped that 97% of all tariffs will go. [A]", "(1)"], ["Application", "Intra-African trade only accounts for 17% of African exports. [A]", "(1)"], ["Analysis", "Fewer trade barriers such as tariffs will make Senegal's exports more competitive, which will lead to more economic growth. [An]", "(1)"]]}, "K": [["fewer trade barrier", "trade barrier", "tariff", "free trade", "access", "export"]], "Kmax": 1, "Amax": 2, "Anmax": 1}, {"n": 203, "u": "u4", "set": "past", "topic": 1, "sub": ["g4"], "marks": 4, "biz": "Peru", "paper": "June 2023", "qn": "1(a)", "stem": "Explain one advantage of using tariffs for a country such as Peru.", "read": "A", "ext": [{"id": "A", "t": "Peru clothing industry welcomes tariff barrier to block large increase in", "p": ["clothing imports", "A report by the Peruvian competition authority said that imports of clothing into Peru rose by 254% between 2016 and 2020. As a result, imports have increased their share of the Peruvian clothing market to 13.4%. The report warns that there is a danger of damage to the domestic clothing industry and urges the government to increase tariffs on imports. The clothing industry employs over 420,000 people and is 8% of Peru’s manufacturing output."]}], "ms": "Question Explain one advantage of using tariffs for a country such as Mark\nPeru. (4)\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying an advantage, e.g.:\n• Preventing unemployment in the Peruvian clothing industry\n(1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• Over 420,000 people are employed in the clothing industry\n(1)\n• Clothing imports have increased their market share in Peru\nto 13.4% (1)\nAnalysis\n1 mark for developing the advantage, e.g.:\n• Tariffs increase the price of imports making domestic\nproducts more attractive which keeps people employed and\nmaintains market share (1) (4)", "type": "pt", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "Tariffs help prevent unemployment in the Peruvian clothing industry. [K]", "(1)"], ["Application", "Over 420,000 people are employed in the clothing industry. [A]", "(1)"], ["Application", "Clothing imports have increased their market share in Peru to 13.4%. [A]", "(1)"], ["Analysis", "Tariffs increase the price of imports, making domestic products more attractive, which keeps people employed and maintains market share. [An]", "(1)"]]}, "K": [["unemploy", "employ", "job", "protect", "domestic"]], "Kmax": 1, "Amax": 2, "Anmax": 1}, {"n": 204, "u": "u4", "set": "past", "topic": 2, "sub": ["m1"], "marks": 4, "biz": "Netflix", "paper": "October 2023", "qn": "1(a)", "stem": "Explain one disadvantage for a business of operating in a saturated market.", "read": "A", "ext": [{"id": "A", "t": "Among signs of market saturation, streaming platforms seek new growth", "p": ["The global market for on-demand streaming platforms has shown signs of saturation for some time, forcing businesses to devise new strategies to stop the loss of subscribers and boost revenue and growth.", "At the start of 2022, Netflix, the market leader, had 221.6 million subscribers. However, by September 2022 it had lost 1.2 million subscribers.", "Nearly a dozen major streaming platforms, with Netflix and Disney+ in the lead, are locked in a fierce battle for subscribers. Experts predict that some platforms will have to merge or launch cheaper subscriptions with advertising if growth is to happen.", "One merger has already taken place, with HBO Max merging with Discovery+. It will start operating in the summer of 2023 as a single streaming service with around 100 million subscribers worldwide."]}], "ms": "Question Explain one disadvantage for a business of operating in a Mark\nsaturated market. (4)\nAnswer\n1(a) Knowledge 1, Application 2, Analysis 1\nKnowledge\n1 mark for identifying a disadvantage, e.g.:\n• High level of competition (1)\nApplication\nUp to 2 marks for contextualised answers, e.g.:\n• Over a dozen companies are competing for streaming\nbusiness (1)\n• Netflix has lost 1.2 million subscribers in the first nine\nmonths of 2022 (1)\nAnalysis\n1 mark for developing the disadvantage, e.g.:\n• In order to increase sales or prevent loss of existing\ncustomers price may have to be reduced and/or increased\nspending on promotion. Both reduce profitability (1) (4)", "type": "pt", "kw": [], "sup": {"grid": "Knowledge 1, Application 2, Analysis 1", "top": "Follow the department answer structure: K: point (1). App: context from the case study (1). App: more context data (1). Analysis: long term consequence (1).", "plan": ["K: point (1).", "App: context from the case study (1).", "App: more context data (1).", "Analysis: long term consequence (1)."], "parts": [["Knowledge", "A saturated market has a high level of competition. [K]", "(1)"], ["Application", "Over a dozen companies are competing for streaming business. [A]", "(1)"], ["Application", "Netflix lost 1.2 million subscribers in the first nine months of 2022. [A]", "(1)"], ["Analysis", "To increase sales or keep existing customers, prices may have to be reduced or promotion spending increased, and both reduce profitability. [An]", "(1)"]]}, "K": [["competition", "competitive", "rival", "competitor"]], "Kmax": 1, "Amax": 2, "Anmax": 1}, {"n": 205, "u": "u4", "set": "past", "topic": 1, "sub": ["g1"], "marks": 8, "biz": "Turkey", "paper": "October 2024", "qn": "1(c)", "stem": "Discuss the usefulness of HDI as an indicator of growth.", "read": "B", "ext": [{"id": "B", "t": "Turkey ranked 48th among 191 countries in UN Human Development Index (HDI)", "p": ["The Human Development Index (HDI) attempts to measure and compare levels of human development between countries. Created by the United Nations in 1990 it is now an important indicator for international organisations, governments, and non-governmental organisations (NGOs) in determining global welfare and economic growth.", "Between 1990 and 2021, Turkey’s HDI value changed from 0.600 to 0.838. Although there has been an improvement in Turkey’s HDI rating, Turks have found it difficult over recent years to afford basic needs. The country is experiencing a record level of inflation, which is the highest in the past 24 years, and a record drop in purchasing power due to the depreciation of the Turkish lira against foreign currencies.", ""]}], "ms": "Question Discuss the usefulness of HDI as an indicator of growth. (8)\nIndicative content\n1(c)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• HDI is a composite index focusing on three basic measures of human\ndevelopment\n• Life expectancy at birth, mean years of schooling and expected years of\nschooling, standard of living as measured by gross national income per\ncapita.\n• The higher the index the more developed the economy is said to be\n• It takes a wider view of development than one based on purely\neconomic criteria such as GDP which has drawbacks\n• An increase in Turkey’s ranking from 0.600 to 0.838 shows that the\neconomy must have grown in order to provide higher levels of health,\neducation and standard of living\n• However, it is still not totally reliable, it does not indicate how wealth is\ndistributed or show that everyone has benefited equally e.g. Saudi\nArabia\n• It does not indicate the ‘quality’ of life or the degree of civil liberties\n• It does not indicate other economic factors which can either indicate\ncurrent problems affecting growth or factors that will influence future\ngrowth such as the inflation rate in Turkey and its currency problems\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s)\nbut may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative information, and shows an awareness of competing\narguments/factors.", "type": "lev", "kw": ["hdi", "human development", "life expectancy", "schooling", "education", "income per capita"], "tip": "Examiner report (October 2024): many candidates did not know what HDI was or only partly understood its components, and responses that tried to bluff scored low. Some wrote about the benefits of growth for Turkey instead of answering the question. Strong answers explained HDI's three components, then showed why it is useful and what its weaknesses are.", "sup": {"grid": "Levels marked: Knowledge, Application, Analysis, Evaluation.", "top": "Follow the department answer structure: Definition of the key term. Point 1: K, A, A, EV (However). Point 2: K, A, A, EV (However).", "plan": ["Definition of the key term.", "Point 1: K, A, A, EV (However).", "Point 2: K, A, A, EV (However)."], "parts": [["Definition", "HDI is a composite index of three basic measures of human development: life expectancy at birth, years of schooling, and standard of living measured by gross national income per capita. [K]", "Key term"], ["Point 1", "HDI takes a wider view of development than purely economic measures such as GDP. [K] Turkey's HDI value changed from 0.600 to 0.838 between 1990 and 2021. [A] This shows the economy must have grown to provide higher levels of health, education and standard of living. [An] However, HDI does not show how wealth is distributed or that everyone has benefited equally. [Ev]", "(4)"], ["Point 2", "The higher the index, the more developed the economy is said to be. [K] Turkey is ranked 48th among 191 countries. [A] Businesses and governments can compare development between countries when assessing growth. [An] However, HDI does not show the quality of life, civil liberties or economic problems that affect future growth, such as Turkey's inflation and currency problems. [Ev]", "(4)"]]}, "pts": [{"t": "HDI is a composite index focusing on three basic measures of human development", "s": "know"}, {"t": "Life expectancy at birth, mean years of schooling and expected years of schooling, standard of living as measured by gross national income per capita.", "s": "for"}, {"t": "The higher the index the more developed the economy is said to be", "s": "for"}, {"t": "It takes a wider view of development than one based on purely economic criteria such as GDP which has drawbacks", "s": "for"}, {"t": "An increase in Turkey’s ranking from 0.600 to 0.838 shows that the economy must have grown in order to provide higher levels of health, education and standard of living", "s": "for"}, {"t": "However, it is still not totally reliable, it does not indicate how wealth is distributed or show that everyone has benefited equally e.g. Saudi Arabia", "s": "against"}, {"t": "It does not indicate the ‘quality’ of life or the degree of civil liberties", "s": "against"}, {"t": "It does not indicate other economic factors which can either indicate current problems affecting growth or factors that will influence future growth such as the inflation rate in Turkey and its currency problems", "s": "against"}], "lv": [[1, 1, 2, "Isolated elements of knowledge and understanding – recall based. Weak or no relevant application to business examples. Generic assertions may be presented."], [2, 3, 5, "Accurate knowledge and understanding. Applied accurately to the business and its context. Chains of reasoning are presented, showing cause(s) and/or effect(s) but may be assertions or incomplete. An attempt at an assessment is presented that is unbalanced and unlikely to show the significance of competing arguments."], [3, 6, 8, "Accurate and thorough knowledge and understanding, supported throughout by relevant and effective use of the business behaviour/context. Logical chains of reasoning, showing cause(s) and/or effect(s). Assessment is balanced, well contextualised, using quantitative and/or qualitative information, and shows an awareness of competing arguments/factors."]]}, {"n": 206, "u": "u4", "set": "past", "topic": 2, "sub": ["m1"], "marks": 8, "biz": "Global business", "paper": "January 2024", "qn": "1(c)", "stem": "Discuss the benefits for a global business that come from extending the product life cycle of its products by entering a new overseas market.", "read": "B", "ext": [{"id": "B", "t": "How to extend the product life cycle", "p": ["Identifying new markets for your product is a great way to potentially extend its life cycle. Perhaps the market you are currently operating in has become saturated or an unexpected economic downturn has affected sales.", "Expanding by launching your product in different countries, for example, can be a good way of boosting sales and can be a good extension strategy. Globalisation has made this possible in the 21st century, and the internet has made reaching all parts of the world easier.", ""]}], "ms": "Question Discuss the benefits for a global business that come from extending the product\nlife cycle of its products by entering a new overseas market. (8)\nIndicative content\n1(c)\nIndicative content guidance\n\nKnowledge, Application, Analysis, Evaluation – indicative content\n• Extending the product life cycle means preventing the decline stage\nfrom being reached and so continuing to sell the product successfully\n• One way this can happen is by entering a new market where the\nproduct is not yet known\n• This enables the product life cycle to start again\n• The business is already familiar with the product and will be able to use\nexisting production facilities and supply chains thus saving time and\nmoney in creating new ones\n• The business does not need to go through the development stage\nwhich can be costly and/or lengthy, all the initial work has been done\n• By finding new customers in new markets the extra sales revenue will\nincrease the return on the initial investment in the product\n• However, a new market will need promotion as the product will be in\nthe introductory stage if it is to grow\n• Some changes may need to be made to the product to comply with the\nnew market’s rules and regulations\n• Cultural adaptations may be needed and not all products will transfer\neasily between markets\n• Some products such as fashion items or rapidly changing technologies\nhave very short life cycles and may not be worth the effort\nLevel Mark Descriptor\n0 No rewardable material.\nLevel 1 1–2 Isolated elements of knowledge and understanding – recall based.\nWeak or no relevant application to business examples.\nGeneric assertions may be presented.\nLevel 2 3–5 Accurate knowledge and understanding.\nApplied accurately to the business and its context.\nChains of reasoning are presented, showing cause(s) and/or effect(s)\nbut may be assertions or incomplete.\nAn attempt at an assessment is presented that is unbalanced and\nunlikely to show the significance of competing arguments.\nLevel 3 6–8 Accurate and thorough knowledge and understanding, supported\nthroughout by relevant and effective use of the business\nbehaviour/context.\nLogical chains of reasoning, showing cause(s) and/or effect(s).\nAssessment is balanced, well contextualised, using quantitative and/or\nqualitative inform
